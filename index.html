<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motoreez — Job Cards</title>
<meta name="theme-color" content="#12171C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Motoreez">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="config.js"></script>
<style>
:root{
  /* Canvas is a cool off-white. Pure white everywhere flattens a dense
     screen; a faint grey behind white cards is what gives a list its edges. */
  --canvas:#F4F6FA; --surface:#FFFFFF; --surface-2:#EFF2F7;
  --ink:#0D1420; --ink2:#46546A; --steel:#78849A; --onink:#FFFFFF;
  --rule:#E1E7EF; --rule2:#EEF2F7;

  /* Two separate jobs, kept apart on purpose.
     --solid is "commit this": near-black, unmistakable, never competing
     with a status colour. --brand is "you are here / this is selected":
     blue, used for state rather than for action. Most tools muddle these
     into one colour and every screen ends up shouting. */
  --solid:#121A26; --solid-d:#000000;
  --brand:#2A5BE7; --brand-d:#1C43BE; --brand-lt:#EDF2FE; --brand-rim:#C3D4FB;

  /* Plate yellow is identity, not interface. It appears on the number
     plate and the wordmark, and nowhere else. */
  --hivis:#FFC933; --hivis-d:#D9A400;

  --red:#D42B41; --red-bg:#FEF1F3; --red-rim:#F6C6CD;
  --green:#0A8B5D; --green-bg:#E9F7F1; --green-rim:#B2E1CB;
  --blue:#2A5BE7; --blue-bg:#EDF2FE; --blue-rim:#C3D4FB;
  --amber:#A96500; --amber-bg:#FFF5E4; --amber-rim:#F0D6A4;

  --shadow-xs:0 1px 2px rgba(13,20,32,.05);
  --shadow-sm:0 1px 3px rgba(13,20,32,.07), 0 1px 2px rgba(13,20,32,.04);
  --shadow-md:0 4px 12px rgba(13,20,32,.08), 0 1px 3px rgba(13,20,32,.05);
  --shadow-lg:0 12px 32px rgba(13,20,32,.14);

  --r:14px; --r-sm:10px; --r-lg:18px; --r-pill:999px;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --tap:52px;

  /* the two fixed regions at the foot of a phone screen */
  /* the desktop rail's width, and the dock height the script measures
     and writes back at runtime */
  --sidebar:240px; --dockh:96px;
  /* names a few screens use; kept as aliases so nothing silently loses its border */
  --line:var(--rule); --muted:var(--steel); --bad:var(--red); --ok:var(--green);
  --card:var(--surface); --r-md:var(--r);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--canvas); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink)}
h1,h2,h3{margin:0; font-weight:700; letter-spacing:-.028em; color:var(--ink)}
a{color:var(--blue)}

/* ---------- utility type ---------- */
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}

.muted{color:var(--steel)}
.small{font-size:14px}
.big{font-size:22px; font-weight:800}
.money{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap}
.right{text-align:right}
.hide{display:none !important}

/* ---------- number plate (signature element) ---------- */

.plate.sm{font-size:15px; padding:4px 8px 3px; border-width:2px}
.plate.lg{font-size:26px; padding:8px 14px 7px}

/* ---------- cards / sections ---------- */




.card-b.tight{padding:0}

.grid2{display:grid; grid-template-columns:1fr; gap:12px}
@media(min-width:820px){ .grid2{grid-template-columns:1fr 1fr; gap:16px} .grid2  }

/* ---------- forms ---------- */
.field{margin:0 0 14px}

.req::after{content:"·required"; color:var(--red); font-size:10px; margin-left:6px; letter-spacing:.04em}

textarea{min-height:96px; padding:12px; line-height:1.45; font-weight:500}
input:focus,select:focus,textarea:focus{outline:none}

input.mono{font-family:var(--mono); letter-spacing:.08em; text-transform:uppercase; font-weight:800}
input:disabled,select:disabled{background:#F1F3F4; color:var(--steel)}
select{-webkit-appearance:none; appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 20px) 24px,calc(100% - 14px) 24px; background-size:6px 6px,6px 6px;
  background-repeat:no-repeat; padding-right:40px}
select optgroup{font-weight:800; color:var(--steel)}
select option{font-weight:600; color:var(--ink)}
.hint{font-size:13px; color:var(--steel); margin-top:6px}
.two{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.three{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}

/* segmented + chips: fat targets for gloves */




.chips{display:flex; flex-wrap:wrap; gap:8px}




/* ---------- buttons ---------- */











.btn-row{display:flex; gap:10px; flex-wrap:wrap}
.btn-row 





/* ---------- status ---------- */








/* hazard tape — only for work stopped */
.hazard{height:14px; background:repeating-linear-gradient(45deg,var(--hivis) 0 16px,var(--ink) 16px 32px);
  background-size:45px 45px; animation:tape 1.4s linear infinite}
@keyframes tape{to{background-position:45px 0}}

.stopbox .in{padding:14px}
.stopbox h2{color:var(--red); font-size:20px}
@media (prefers-reduced-motion:reduce){ .hazard{animation:none}  }

/* ---------- job list ---------- */






/* ---------- tables (parts & labour) ---------- */
.lines{width:100%; border-collapse:collapse}


.lines tr:last-child td{border-bottom:0}
.lines .num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
.lines input{min-height:46px; padding:6px 8px}
.lines input.qty{width:76px; text-align:right}
.lines input.rate{width:108px; text-align:right; font-family:var(--mono)}
.linekind{font-size:10px; font-weight:900; letter-spacing:.1em; padding:3px 6px; border-radius:3px; border:1px solid}
.k-part{background:#EDF3F8; color:var(--blue); border-color:var(--blue)}
.k-labour{background:#F4EFE6; color:var(--amber); border-color:var(--amber)}



/* ---------- stepper ---------- */
.steps{display:flex; overflow-x:auto; gap:6px; padding:2px 0 6px; scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}

.step b{font-family:var(--mono); font-size:11px}



/* ---------- log ---------- */
.log{list-style:none; margin:0; padding:0}
.log li{padding:10px 0; border-bottom:1px solid var(--rule2); font-size:15px; display:flex; gap:10px}
.log li:last-child{border-bottom:0}
.log .when{font-family:var(--mono); font-size:12px; color:var(--steel); flex:0 0 116px}

/* ---------- attendance register ---------- */
table.att{border-collapse:collapse; font-size:13px}
table.att th{padding:6px 4px; font-size:11px; color:var(--steel); border-bottom:2px solid var(--rule); text-align:center}
table.att th.wo{background:var(--hivis); color:#000; font-weight:900}
table.att th.nm,table.att td.nm{text-align:left; padding:8px 10px; position:sticky; left:0; background:var(--surface); z-index:2;
  border-right:2px solid var(--rule); min-width:150px}
table.att td{padding:2px; text-align:center; border-bottom:1px solid var(--rule2)}
.att-b{display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px;
  border:2px solid var(--ink); border-radius:5px; font-weight:900; font-size:12px; cursor:pointer; background:var(--surface)}
.att-b.faint{opacity:.42}
.att-b[disabled]{opacity:.15; cursor:not-allowed}
.att-b.s-P{background:var(--green-bg); color:var(--green); border-color:var(--green)}
.att-b.s-H{background:var(--amber-bg); color:var(--amber); border-color:var(--amber)}
.att-b.s-L{background:var(--blue-bg); color:var(--blue); border-color:var(--blue)}
.att-b.s-W{background:#EEF1F3; color:var(--steel); border-color:var(--rule)}
.att-b.s-A{background:var(--red-bg); color:var(--red); border-color:var(--red)}

/* ---------- how the words look ----------
   Headings, labels, buttons and tabs capitalise every word. Applied only
   to the furniture, never to a customer's name or a complaint, which are
   already tidied when they are saved. */
h1, h2, h3,
.card-h h2, .page-head h1,
label, .btn, .chip, .subtab, .navbtn span, .sbtn span, .seg button,
.bigstat .k, .stat .k, .bigstat .s, .stat .s, .kv .k, select.periodsel, .sbtn, .navbtn, .totrow > span:first-child, .lines th, .doc th, .dayb span,
.tile, .eyebrow, .tag, .linekind, summary{ text-transform:capitalize !important; letter-spacing:normal !important }
.mono, .money, .plate, code, input, textarea, select:not(.periodsel),
h1.raw, h2.raw, .noscase, .noscase *{ text-transform:none !important }

/* ---------- section tabs ---------- */
.subtabs{display:flex; gap:2px; margin:8px 0 4px; border-bottom:1px solid var(--line); overflow-x:auto;
  scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtab{flex:0 0 auto; background:none; border:0; border-bottom:2px solid transparent; cursor:pointer;
  padding:10px 14px; font-weight:600; font-size:14px; color:var(--muted); white-space:nowrap}
.subtab b{font-family:var(--mono); font-weight:700; opacity:.65; margin-left:2px}
.subtab[aria-pressed="true"]{color:var(--ink); border-bottom-color:var(--ink)}

/* ---------- forward-looking dates ---------- */
.due{font-size:12px; font-weight:600; color:var(--muted)}
.due.over{color:var(--bad)}

/* ---------- headline numbers ---------- */
.statgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0}
@media(min-width:720px){ .statgrid{grid-template-columns:repeat(4,1fr)} }
.bigstat{background:var(--card); border:1px solid var(--line); border-radius:var(--r-md);
  padding:14px 16px; text-align:left; display:block; width:100%}
button.bigstat{cursor:pointer; transition:border-color .12s, background .12s}
button.bigstat:hover{border-color:var(--ink)}
.bigstat.on{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.bigstat .s{font-size:11px; color:var(--muted); margin-top:3px}
.bigstat .k{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.bigstat .v{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:700;
  font-size:23px; margin-top:4px; letter-spacing:-.02em}
.bigstat.good .v{color:var(--ok)}
.bigstat.bad .v{color:var(--bad)}

/* ---------- period control ---------- */
.periodbar{display:flex; align-items:center; gap:10px; margin:10px 0 12px; flex-wrap:wrap}
.periodsel{min-height:40px; padding:6px 34px 6px 12px; font-weight:700; font-size:15px;
  border-radius:var(--r-sm); flex:0 0 auto; width:auto; min-width:150px}

/* ---------- report hub ---------- */
.star{margin-left:auto; font-size:18px; color:var(--rule); cursor:pointer; padding:0 4px; line-height:1}
.star.on{color:var(--hivis-d)}

/* ---------- desk ---------- */
.linkish{background:none;border:0;padding:0;font:inherit;font-weight:800;color:var(--blue);
  text-decoration:underline;text-underline-offset:2px;cursor:pointer;text-align:left}
.lines td .small{line-height:1.35}
#pcalc 
details summary:hover{color:var(--ink)}

/* ---------- price-list search results ---------- */
.presults{margin-top:10px; max-height:46vh; overflow:auto}
.partrow{display:flex; align-items:center; gap:12px; width:100%; text-align:left; min-height:60px;
  padding:10px 12px; margin-bottom:8px; border:2px solid var(--rule); border-radius:6px; background:var(--surface); cursor:pointer}
.partrow:active{background:var(--hivis); border-color:var(--ink); color:#000}
details summary::-webkit-details-marker{display:none}
details summary{list-style:none; border-top:1px solid var(--rule2)}
details[open] summary{color:var(--ink)}

/* ---------- a field the app is still waiting on ---------- */
.field.bad label{color:var(--red)}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--red); background:var(--red-bg)}
.field.bad .tiles{outline:3px solid var(--red); outline-offset:5px; border-radius:8px}
.field.bad label::after{content:" \2190 needed"; color:var(--red); font-size:10px; letter-spacing:.04em}
.field.bad label.req::after{content:" \2190 needed"}

/* ---------- pick-one and tick-many tiles ---------- */
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:8px}
@media(min-width:640px){ .tiles{grid-template-columns:1fr 1fr 1fr} }

.tile:active{transform:translate(1px,1px)}

.tile .box{flex:0 0 24px; height:24px; border:2px solid var(--ink); border-radius:4px; background:var(--surface);
  display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:900; color:transparent}
.tile[aria-pressed="true"] .box{background:var(--ink); color:var(--hivis)}
.tile.one{justify-content:flex-start; border-left-width:6px}
.tile.one[aria-pressed="true"]{border-left-color:var(--ink)}

/* ---------- voice recorder ---------- */
.voicebox{border:2px dashed var(--rule); border-radius:6px; padding:12px; margin-top:10px; background:#F7F9FA}
.voicebox:empty{display:none}
.voicebox.live{border:3px solid var(--red); border-style:solid; background:var(--red-bg)}
.reclight{width:16px; height:16px; border-radius:50%; background:var(--red); display:inline-block;
  animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}
.vtime{font-family:var(--mono); font-weight:800; font-size:22px; color:var(--red)}
.veq{display:flex; gap:3px; align-items:flex-end; height:30px; margin:12px 0 8px}
.veq i{flex:1; background:var(--red); border-radius:2px; height:25%; transform-origin:bottom;
  animation:eq .85s ease-in-out infinite}
@keyframes eq{0%,100%{height:18%}50%{height:100%}}
.voicebox audio{border-radius:6px}
@media (prefers-reduced-motion:reduce){ .veq i{animation:none;height:55%} .reclight{animation:none} }

/* ---------- login ---------- */
.login{max-width:420px; margin:0 auto; padding:28px 16px 60px}
.userpick{display:grid; gap:10px; margin:18px 0}
.userpick button{display:flex; align-items:center; gap:12px; min-height:64px; padding:10px 14px;
  border:2px solid var(--ink); border-radius:6px; background:var(--surface); cursor:pointer; text-align:left}
.userpick button[aria-pressed="true"]{background:var(--hivis); color:#000; box-shadow:3px 3px 0 var(--ink)}
.userpick .nm{font-weight:800}
.pinpad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px}
.pinpad button{min-height:66px; font-size:24px; font-weight:800; border:2px solid var(--ink);
  border-radius:6px; background:var(--surface); cursor:pointer}
.pinpad button:active{background:var(--hivis); color:#000}
.pindots{display:flex; gap:12px; justify-content:center; margin:16px 0 4px}
.pindots i{width:18px; height:18px; border:2px solid var(--ink); border-radius:50%; background:var(--surface)}
.pindots i.on{background:var(--ink)}

/* ---------- modal / toast ---------- */
.scrim{position:fixed; inset:0; background:rgba(10,12,14,.55); z-index:80; display:flex; align-items:flex-end;
  justify-content:center; padding:0}
@media(min-width:700px){ .scrim{align-items:center; padding:20px} }

@media(min-width:700px){  }
.sheet h2{font-size:19px; margin-bottom:4px}
#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:96px; z-index:99; display:flex;
  flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:calc(100% - 24px); max-width:460px}
.toast{background:var(--ink); color:var(--onink); border-radius:6px; padding:12px 16px; font-weight:700; font-size:15px;
  box-shadow:0 6px 18px rgba(0,0,0,.3); width:100%}
.toast.bad{background:var(--red)}
.toast.good{background:var(--green)}


.searchbar input{min-height:60px; font-size:19px; font-weight:800; border-color:var(--ink)}

.empty b{display:block; color:var(--ink); font-size:19px; margin-bottom:6px}
.kv{display:flex; justify-content:space-between; gap:14px; padding:9px 0; border-bottom:1px solid var(--rule2)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--steel); font-size:14px; font-weight:700}
.kv .v{font-weight:700; text-align:right}





/* ---------- night shift ----------
   The plate stays yellow-on-black in both themes: it is the one thing
   everyone identifies a bike by, so it must never change appearance. */
:root[data-theme="dark"]{
  --canvas:#0B0F14; --surface:#141A21; --surface-2:#1B222B;
  --ink:#EDF1F6; --ink2:#AFBAC6; --steel:#7B8896; --onink:#0B0F14;
  --rule:#242D38; --rule2:#1C242E;
  --solid:#EDF1F6; --solid-d:#FFFFFF;
  --brand:#5C8CFF; --brand-d:#7FA6FF; --brand-lt:#16233C; --brand-rim:#2C4472;
  --red:#FF6B80; --red-bg:#2E1319; --red-rim:#5A2530;
  --green:#3FCB92; --green-bg:#0E2A20; --green-rim:#1F5140;
  --blue:#5C8CFF; --blue-bg:#16233C; --blue-rim:#2C4472;
  --amber:#E9A64D; --amber-bg:#2C2010; --amber-rim:#54401D;
  --shadow-xs:0 1px 2px rgba(0,0,0,.5);
  --shadow-sm:0 1px 3px rgba(0,0,0,.55);
  --shadow-md:0 4px 14px rgba(0,0,0,.55);
  --shadow-lg:0 14px 36px rgba(0,0,0,.65);
}
/* a near-white "solid" button needs dark text on it */
:root[data-theme="dark"] .btn.primary,
:root[data-theme="dark"] .navfab{color:#0B0F14}
:root[data-theme="dark"] .btn.primary:hover{background:#FFFFFF}
:root[data-theme="dark"] .btn.go{color:#06170F}
:root[data-theme="dark"] .topbar{background:rgba(11,15,20,.86)}
:root[data-theme="dark"] .dock{background:rgba(11,15,20,.9)}
:root[data-theme="dark"] .sidebar{background:var(--surface)}
:root[data-theme="dark"] .doc{background:#fff; color:#000}
:root[data-theme="dark"] input:disabled,
:root[data-theme="dark"] select:disabled{background:#1B222A; color:var(--steel)}
:root[data-theme="dark"] .empty b{color:var(--ink)}
:root[data-theme="dark"] .topbar{background:rgba(11,15,20,.85)}
:root[data-theme="dark"] .dock{background:rgba(11,15,20,.9)}
:root[data-theme="dark"] .voicebox{background:#1B222A}
:root[data-theme="dark"] .searchbar{background:var(--canvas)}
:root[data-theme="dark"] .btn:hover{background:#1D252E}
:root[data-theme="dark"] .iconbtn:hover{background:#1D252E}
:root[data-theme="dark"] .sbtn:hover{background:#1D252E}
:root[data-theme="dark"] .seg{background:#10161C}
:root[data-theme="dark"] .sub{background:#10161C}
/* the printed document is always ink on white paper, whatever the screen is */
:root[data-theme="dark"] .doc{background:#fff; color:#000}

/* ---------- a button that is mid-save ----------
   Two taps on a slow connection is the single easiest way to create a
   duplicate job card, so the button locks itself until the write lands. */
.btn[aria-busy="true"],.navfab[aria-busy="true"]{opacity:.62; pointer-events:none; position:relative}
.btn[aria-busy="true"]::after,.navfab[aria-busy="true"]::after{
  content:""; width:15px; height:15px; margin-left:9px; border-radius:50%;
  border:2.5px solid currentColor; border-right-color:transparent; animation:spin .62s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .btn[aria-busy="true"]::after,.navfab[aria-busy="true"]::after{animation:none; border-right-color:currentColor; opacity:.45}
}

/* ---------- desk-width layout ----------
   The owner does the reading on a laptop. Give the tables the room. */

@media(min-width:820px){
  
  
  
  
}

/* ---------- days on site ---------- */
.dwell{display:inline-flex; align-items:center; gap:4px; font-family:var(--mono); font-size:11px; font-weight:700;
  letter-spacing:.02em; padding:3px 8px; border-radius:999px; border:1px solid var(--rule); color:var(--steel);
  background:var(--surface); white-space:nowrap}
.dwell.warn{border-color:var(--amber-rim); color:var(--amber); background:var(--amber-bg)}
.dwell.bad{border-color:var(--red-rim); color:var(--red); background:var(--red-bg)}

/* ---------- job chat ---------- */
.msgs{display:flex; flex-direction:column; gap:6px; padding:6px 0 18px}
.msg{max-width:84%; align-self:flex-start; background:var(--card); border:1px solid var(--rule);
  border-radius:16px 16px 16px 5px; padding:8px 12px; box-shadow:var(--shadow-sm)}
.msg.me{align-self:flex-end; background:var(--brand-lt); border-color:var(--brand-rim); border-radius:16px 16px 5px 16px}
.msg .who{font-size:12px; font-weight:750; color:var(--brand-d); margin-bottom:2px}
.msg .who span{font-weight:600; color:var(--steel)}
.msg .txt{white-space:pre-wrap; overflow-wrap:anywhere; font-size:15.5px; line-height:1.4}
.msg .meta{font-size:11px; color:var(--steel); margin-top:4px; text-align:right}
.msg.gone{font-style:italic; font-size:13px; color:var(--steel); background:transparent; box-shadow:none; border-style:dashed}
.imgbtn{display:block; padding:0; border:0; background:none; cursor:zoom-in; margin:2px 0 4px}
.msg img.thumb{display:block; width:240px; max-width:100%; height:auto; border-radius:10px; background:var(--rule2)}
.voicebtn{display:flex; align-items:center; gap:10px; min-height:44px; padding:6px 14px 6px 8px; border-radius:22px;
  border:1px solid var(--brand-rim); background:var(--surface); color:var(--brand-d); font:inherit; font-weight:700; cursor:pointer}
.voicebtn svg{width:20px; height:20px; fill:currentColor}
.filechip{display:flex; align-items:center; gap:10px; width:240px; max-width:100%; padding:9px 11px; border:1px solid var(--rule);
  border-radius:10px; background:var(--surface); color:var(--ink); font:inherit; cursor:pointer; text-align:left}
.filechip svg{flex:0 0 auto; color:var(--steel)}
.daysep{align-self:center; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--steel);
  background:var(--rule2); padding:4px 11px; border-radius:999px; margin:12px 0 4px}
.composer{display:flex; align-items:flex-end; gap:6px; width:100%}
.composer textarea{flex:1; min-width:0; min-height:48px; max-height:132px; resize:none; padding:12px 15px;
  border-radius:24px; font-weight:500; line-height:1.4}
.ibtn{flex:0 0 48px; width:48px; height:48px; border-radius:50%; border:1px solid var(--rule); background:var(--surface);
  color:var(--ink2); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px; padding:0}
.ibtn:active{transform:translateY(1px)}
.ibtn.send{background:var(--brand); color:#fff; border-color:var(--brand)}
:root[data-theme="dark"] .ibtn.send{color:#08120F}
.recbar{flex:1; min-width:0; display:flex; align-items:center; gap:10px; height:48px; padding:0 14px; border-radius:24px;
  background:var(--red-bg); border:1px solid var(--red-rim); overflow:hidden; white-space:nowrap}
.chatbadge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800; padding:3px 8px;
  border-radius:999px; background:var(--brand); color:#fff; white-space:nowrap}
:root[data-theme="dark"] .chatbadge{color:#08120F}

/* ---------- print ---------- */
#printarea{display:none}
@media print{
  :root{--surface:#fff}
  html[data-theme="dark"]{--ink:#000; --ink2:#000; --steel:#444; --surface:#fff; --card:#fff}
  body{background:#fff; font-size:12px; color:#000}
  .topbar,.actionbar,.navbar,.wrap,#toast,.scrim{display:none !important}
  #printarea{display:block; padding:0; margin:0}
  .doc{width:100%; color:#000}
  .doc 
  @page{size:A4; margin:12mm}
}
/* Most workshops print on an 80mm roll, not A4. Same document, narrower
   plate, no side margins, and the two-column header stacks. */
@media print{
  body.thermal .doc{font-size:11px}
  body.thermal .doc .head{display:block; border-bottom:2px solid #000}
  body.thermal .doc .head>div+div{margin-top:7px}
  body.thermal .doc h1{font-size:16px}
  body.thermal .doc 
  body.thermal .doc th,body.thermal .doc td{padding:3px 4px; font-size:10px}
  body.thermal .doc .sign{display:block; margin-top:22px}
  body.thermal .doc .sign div{width:100%; margin-bottom:16px}
  body.thermal .hidethermal{display:none !important}
}
body.thermal{--tap:44px}
.doc{background:#fff; color:#000; font-size:13px}
.doc h1{font-size:22px}
.doc table{width:100%; border-collapse:collapse; margin-top:10px}
.doc th,.doc td{border:1px solid #000; padding:6px 8px; font-size:12px}
.doc th{background:#eee; text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em}
.doc .num{text-align:right; font-family:var(--mono)}
.doc .head{display:flex; justify-content:space-between; gap:20px; border-bottom:3px solid #000; padding-bottom:10px}
.doc .sign{margin-top:34px; display:flex; justify-content:space-between; gap:30px}
.doc .sign div{border-top:1px solid #000; padding-top:6px; width:44%; font-size:11px}

/* ---------- inspection (DVI) ---------- */
.insp{border:1px solid var(--rule); border-radius:var(--r); margin:10px 0; overflow:hidden; background:var(--surface)}
.insp-h{display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; width:100%; border:0;
  background:none; font-family:inherit; font-size:16px; font-weight:700; text-align:left; color:var(--ink)}
.insp-h .nm{flex:1; min-width:0}
.lamp{width:12px; height:12px; border-radius:50%; flex:0 0 auto; border:1px solid rgba(0,0,0,.15)}
.lamp.ok{background:var(--green)} .lamp.soon{background:var(--amber)}
.lamp.now{background:var(--red)} .lamp.na{background:var(--rule)}
.insp-b{padding:0 14px 14px; border-top:1px solid var(--rule2)}
.rag{display:flex; gap:6px; margin:10px 0}
.rag button{flex:1; min-height:46px; border:1px solid var(--rule); border-radius:var(--r-sm); background:var(--surface);
  font-family:inherit; font-weight:700; font-size:14px; cursor:pointer; color:var(--ink2)}
.rag button[aria-pressed="true"].r-ok{background:var(--green-bg); border-color:var(--green); color:var(--green)}
.rag button[aria-pressed="true"].r-soon{background:var(--amber-bg); border-color:var(--amber); color:var(--amber)}
.rag button[aria-pressed="true"].r-now{background:var(--red-bg); border-color:var(--red); color:var(--red)}
.shots{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.shot{position:relative; width:78px; height:78px; border-radius:var(--r-sm); overflow:hidden; border:1px solid var(--rule)}
.shot img{width:100%; height:100%; object-fit:cover; display:block}
.shot button{position:absolute; top:2px; right:2px; width:22px; height:22px; min-height:22px; padding:0;
  border-radius:50%; border:0; background:rgba(0,0,0,.65); color:#fff; font-size:13px; line-height:1; cursor:pointer}
.addshot{width:78px; height:78px; border:1px dashed var(--rule); border-radius:var(--r-sm); background:var(--surface);
  font-size:22px; color:var(--steel); cursor:pointer; display:flex; align-items:center; justify-content:center}
.ragbar{display:flex; height:8px; border-radius:999px; overflow:hidden; background:var(--rule2); margin:10px 0}
.ragbar i{display:block; height:100%}

.lines .num .btn,.lines .num select{font-family:var(--sans)}
/* ---------- a customer's bikes ---------- */
.bikecards{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px; margin-top:8px}
.bikecard{display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left; padding:12px;
  border:1px solid var(--rule); border-radius:var(--r-sm); background:var(--surface); color:var(--ink); font-family:inherit; cursor:pointer}
.bikecard:hover{border-color:var(--brand-rim)} .bikecard.other{border-style:dashed}
.bikeitem{border-top:1px solid var(--rule); padding:10px 0} .bikeitem:first-child{border-top:0}
.bikeitem summary{display:flex; align-items:center; gap:10px; cursor:pointer; flex-wrap:wrap}
/* ---------- phone with country code ---------- */
.phonebox{display:flex; gap:8px}
.phonebox select.ccsel{flex:0 0 150px; min-width:0}
.phonebox input{flex:1; min-width:0}
@media(max-width:480px){ .phonebox select.ccsel{flex-basis:118px} }
.btn.warn{border-color:var(--amber); background:var(--amber-bg); color:var(--ink)}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
@media(max-width:700px){ .grid4{grid-template-columns:repeat(2,1fr)} }
/* ---------- walk-round photo slots ---------- */
.mgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:10px}
.mslot{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  min-height:112px; border:1.5px dashed var(--rule); border-radius:var(--r-sm); background:var(--surface-2);
  color:var(--ink2); font-family:inherit; font-weight:650; font-size:13px; cursor:pointer; padding:0; overflow:hidden;
  text-decoration:none}
.mslot:hover{border-color:var(--brand-rim)}
.mslot .mplus{font-size:26px; line-height:1; color:var(--steel)}
.mslot.done{border:1px solid var(--green-rim); background:var(--surface)}
.mthumb{display:block; width:100%; height:112px; border:0; padding:0; background:#0B0F14; cursor:pointer; position:relative}
.mthumb img{width:100%; height:100%; object-fit:cover; display:block}
.mthumb .mvid{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:30px}
.mthumb .mlbl, .mslot.done .mlbl{position:absolute; left:0; right:0; bottom:0; padding:4px 8px; font-size:11.5px;
  color:#fff; background:linear-gradient(transparent,rgba(0,0,0,.72)); text-align:left}
.mx{position:absolute; top:5px; right:5px; width:26px; height:26px; border-radius:50%; border:0;
  background:rgba(0,0,0,.66); color:#fff; font-size:15px; cursor:pointer; line-height:1}
.card.bad, #mediaslots.bad{border-color:var(--red); box-shadow:0 0 0 3px var(--red-bg)}

/* ---------- an invoice on screen, as the customer gets it ---------- */
.docpaper{background:#fff; color:#000; border:1px solid var(--rule); border-radius:var(--r); box-shadow:var(--shadow-md);
  padding:28px; margin:12px 0; max-width:860px; overflow-x:auto}
.docpaper .doc{min-width:620px}
@media(max-width:600px){ .docpaper{padding:14px} }

/* ---------- signature ---------- */
.sigpad{width:100%; height:170px; border:1px dashed var(--rule); border-radius:var(--r); background:var(--surface);
  touch-action:none; display:block}

/* ---------- QR ---------- */
.qrbox{display:inline-block; padding:10px; background:#fff; border:1px solid var(--rule); border-radius:var(--r-sm)}
.qrbox svg{display:block; width:150px; height:150px; shape-rendering:crispEdges}

/* ---------- slot picker (appointments) ---------- */
.slots{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px}
.slot{min-height:46px; border:1px solid var(--rule); border-radius:var(--r-sm); background:var(--surface);
  font-family:var(--mono); font-weight:700; font-size:14px; cursor:pointer; color:var(--ink)}
.slot[aria-pressed="true"]{background:var(--brand); color:#fff; border-color:var(--brand)}
.slot[disabled]{opacity:.34; cursor:not-allowed}
.daystrip{display:flex; gap:8px; overflow-x:auto; padding:4px 0 8px; -webkit-overflow-scrolling:touch}
.dayb{flex:0 0 auto; min-width:62px; min-height:62px; border:1px solid var(--rule); border-radius:var(--r);
  background:var(--surface); cursor:pointer; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:2px; font-family:inherit; color:var(--ink)}
.dayb b{font-size:19px; font-weight:750}
.dayb span{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--steel)}
.dayb[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:#fff}
.dayb[aria-pressed="true"] span{color:rgba(255,255,255,.8)}
.dayb i{font-style:normal; font-size:10px; font-weight:700; color:var(--brand)}
.dayb[aria-pressed="true"] i{color:#fff}

/* =====================================================================
   SHELL
   One rule governs the bottom of the screen: everything fixed there lives
   inside .dock, stacked, and the dock reports its own height back to the
   page as --navh. Two separately-positioned fixed bars is how content
   ends up hidden underneath a navigation ribbon, so there is now exactly
   one of them.
   ===================================================================== */
.app{min-height:100vh}
.wrap{max-width:1080px; margin:0 auto; padding:0 16px calc(var(--dockh,96px) + 28px)}

/* ---------- top bar ---------- */
.topbar{position:sticky; top:0; z-index:40; background:rgba(245,247,250,.86);
  backdrop-filter:blur(16px) saturate(1.6); border-bottom:1px solid var(--rule);
  padding:calc(9px + env(safe-area-inset-top)) 16px 9px}
.topbar-in{max-width:1080px; margin:0 auto; display:flex; align-items:center; gap:10px; min-height:40px}
.brand{font-weight:800; letter-spacing:-.035em; font-size:19px; color:var(--ink)}
.brand span{color:var(--brand)}
img.logo{display:block; width:auto; max-width:100%; object-fit:contain}
.brand img.logo, .sb-brand img.logo{display:inline-block; vertical-align:middle}
.whoami{margin-left:auto; display:flex; align-items:center; gap:8px; font-size:13px; color:var(--steel)}
.whoami b{color:var(--ink); font-weight:650}
.role-pill{background:var(--brand-lt); color:var(--brand-d); font-weight:650; font-size:11px;
  letter-spacing:.03em; padding:4px 9px; border-radius:var(--r-pill)}
.bell{position:relative}
.belldot{position:absolute; top:-4px; right:-4px; min-width:18px; height:18px; padding:0 5px; border-radius:9px;
  background:var(--red); color:#fff; font-size:10px; font-weight:800; line-height:18px; text-align:center}
.noterow{display:flex; align-items:center; gap:12px; width:100%; padding:13px 14px; border:0;
  border-bottom:1px solid var(--rule2); background:none; text-align:left; font:inherit; color:var(--ink); cursor:pointer}
.noterow:last-child{border-bottom:0}
.noterow.new{background:var(--brand-lt)}
.noterow .nt{flex:1; min-width:0; line-height:1.35}
.newdot{flex:0 0 10px; height:10px; border-radius:50%; background:var(--brand)}
.iconbtn{width:38px; height:38px; min-height:38px; padding:0; display:inline-flex; align-items:center;
  justify-content:center; border:1px solid var(--rule); border-radius:var(--r-sm); background:var(--surface);
  color:var(--ink2); cursor:pointer; font-size:15px; box-shadow:none}
.iconbtn:hover{background:var(--rule2); color:var(--ink)}

/* ---------- page heading ---------- */
/* screens that still use a bare heading rather than the shared component */
.wrap>h1{font-size:26px; letter-spacing:-.03em; margin:22px 0 14px}
@media(min-width:1024px){ .wrap>h1{font-size:29px} }
.page-head{display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; margin:22px 0 16px}
.page-head .ttl{flex:1; min-width:200px}
.page-head h1{font-size:26px; letter-spacing:-.03em; font-weight:700; margin:2px 0 0}
.page-head .sub-l{color:var(--steel); font-size:14px; margin-top:4px}
.page-head .acts{display:flex; gap:8px; flex-wrap:wrap}

/* ---------- the dock: the only fixed thing at the bottom ---------- */
.dock{position:fixed; left:0; right:0; bottom:0; z-index:50;
  background:rgba(245,247,250,.9); backdrop-filter:blur(18px) saturate(1.6);
  border-top:1px solid var(--rule); padding-bottom:env(safe-area-inset-bottom)}
.dock-actions{max-width:1080px; margin:0 auto; display:flex; gap:10px; padding:11px 16px}
.dock-actions + .dock-nav{border-top:1px solid var(--rule2)}
.dock-nav{max-width:1080px; margin:0 auto; display:flex; align-items:center; gap:2px; padding:5px 10px 6px}
.navbtn{flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; min-height:50px; padding:5px 2px; border:0; background:none; cursor:pointer; color:var(--steel);
  font-family:inherit; font-weight:600; font-size:11px; border-radius:var(--r-sm); position:relative;
  transition:color .12s ease, background .12s ease}
.navbtn .ico{font-size:18px; line-height:1}
.navbtn .lbl{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.navbtn[aria-current="page"]{color:var(--brand); background:var(--brand-lt)}
.navbtn:active{transform:translateY(1px)}
.navbtn .dot{position:absolute; top:2px; right:calc(50% - 19px); min-width:16px; height:16px; padding:0 4px;
  border-radius:var(--r-pill); background:var(--red); color:#fff; font-size:10px; font-weight:700; line-height:16px}
.navfab{flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:50px; padding:0 16px; margin-left:4px; border:0; border-radius:var(--r-sm);
  background:var(--brand); color:#fff; font-family:inherit; font-weight:650; font-size:14px;
  cursor:pointer; white-space:nowrap; box-shadow:var(--shadow-sm)}
.navfab:active{background:var(--brand-d); transform:translateY(1px)}
@media(max-width:390px){ .navfab{padding:0 12px; font-size:13px} .navbtn{font-size:10px} }

/* ---------- desktop: navigation moves to a rail ---------- */
.sidebar{display:none}
@media(min-width:1024px){
  
  .sidebar{display:flex; flex-direction:column; position:fixed; left:0; top:0; bottom:0; width:var(--sidebar);
    background:var(--surface); border-right:1px solid var(--rule); padding:14px 12px; z-index:60; overflow-y:auto}
  .sidebar .sb-brand{font-weight:800; font-size:20px; letter-spacing:-.035em; padding:6px 10px 16px; color:var(--ink)}
  .sidebar .sb-brand span{color:var(--brand)}
  .sbtn{display:flex; align-items:center; gap:11px; width:100%; min-height:42px; padding:8px 11px; margin-bottom:2px;
    border:0; border-radius:var(--r-sm); background:none; cursor:pointer; font-family:inherit; font-size:14.5px;
    font-weight:600; color:var(--ink2); text-align:left; transition:background .12s ease, color .12s ease}
  .sbtn:hover{background:var(--rule2); color:var(--ink)}
  .sbtn[aria-current="page"]{background:var(--brand-lt); color:var(--brand-d)}
  .sbtn .ico{font-size:16px; width:19px; text-align:center; flex:0 0 auto}
  .sbtn .dot{margin-left:auto; min-width:19px; height:19px; padding:0 5px; border-radius:var(--r-pill);
    background:var(--red); color:#fff; font-size:11px; font-weight:700; line-height:19px; text-align:center}
  .sb-new{margin:4px 0 14px; width:100%; min-height:44px; border:0; border-radius:var(--r-sm);
    background:var(--brand); color:#fff; font-family:inherit; font-weight:650; font-size:14.5px; cursor:pointer}
  .sb-new:hover{background:var(--brand-d)}
  .sb-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--rule2)}

  .topbar{padding-left:calc(var(--sidebar) + 20px)}
  .topbar-in{max-width:1180px; margin:0}
  .wrap{max-width:1180px; margin:0; padding-left:calc(var(--sidebar) + 20px); padding-right:24px;
    padding-bottom:calc(var(--dockh,0px) + 36px)}
  .dock{left:var(--sidebar)}
  .dock-actions{max-width:1180px; margin:0; padding-left:20px; padding-right:24px}
  .dock-nav{display:none}
  .grid2{grid-template-columns:1fr 1fr; gap:18px}
  
  .page-head h1{font-size:29px}
}
@media(min-width:1400px){ .wrap,.topbar-in,.dock-actions{max-width:1320px} }

/* ---------- days on site ---------- */
.dwell{display:inline-flex; align-items:center; gap:4px; font-family:var(--mono); font-size:11px; font-weight:650;
  padding:3px 8px; border-radius:var(--r-pill); border:1px solid var(--rule); color:var(--steel);
  background:var(--surface); white-space:nowrap}
.dwell.warn{border-color:var(--amber-rim); color:var(--amber); background:var(--amber-bg)}
.dwell.bad{border-color:var(--red-rim); color:var(--red); background:var(--red-bg)}
@media(max-width:560px){ .hidesm{display:none !important} }

/* =====================================================================
   COMPONENTS
   ===================================================================== */
.eyebrow{font-size:11.5px; font-weight:650; letter-spacing:.06em; text-transform:uppercase; color:var(--steel)}

/* ---------- card ---------- */
.card{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r); margin:14px 0;
  overflow:hidden; box-shadow:var(--shadow-sm)}
.card-h{display:flex; align-items:center; gap:10px; padding:14px 16px 12px; border-bottom:1px solid var(--rule2)}
.card-h h2{font-size:15px; font-weight:650; letter-spacing:-.01em; text-transform:none; color:var(--ink)}
.card-b{padding:17px}
.card-b.tight{padding:0}
.sub{border-top:1px solid var(--rule2); padding:14px 16px; background:var(--rule2)}

/* ---------- buttons ----------
   One filled button per screen region. Everything else is quiet, so the
   filled one always means "this is the next thing to do". */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:var(--tap);
  padding:11px 17px; border:1px solid var(--rule); border-radius:var(--r-sm); background:var(--surface);
  color:var(--ink); font-weight:600; font-size:15.5px; cursor:pointer; text-decoration:none;
  box-shadow:var(--shadow-sm); transition:background .12s ease, border-color .12s ease, color .12s ease}
.btn:hover{background:var(--rule2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand); color:#fff; border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-d); border-color:var(--brand-d)}
.btn.go{background:var(--green); color:#fff; border-color:var(--green)}
.btn.go:hover{filter:brightness(.94)}
.btn.dark{background:var(--ink); color:var(--onink); border-color:var(--ink)}
.btn.danger{background:var(--surface); color:var(--red); border-color:var(--red-rim)}
.btn.danger:hover{background:var(--red-bg)}
.btn.lg{min-height:52px; font-size:16px; width:100%}
.btn.sm{min-height:38px; padding:7px 13px; font-size:14px; border-radius:8px}
.btn[disabled]{opacity:.45; cursor:not-allowed; box-shadow:none}
.btn[disabled]:hover{background:var(--surface)}

/* ---------- segmented ---------- */
.seg{display:flex; gap:3px; padding:3px; border:1px solid var(--rule); border-radius:var(--r-sm); background:var(--rule2)}
.seg button{flex:1; min-height:42px; border:0; border-radius:7px; background:transparent; color:var(--ink2);
  font-family:inherit; font-weight:600; font-size:14.5px; cursor:pointer; transition:all .12s ease}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); font-weight:650; box-shadow:var(--shadow-xs)}

/* ---------- chips ---------- */
.chip{min-height:38px; padding:8px 14px; border:1px solid var(--rule); border-radius:var(--r-pill);
  background:var(--surface); color:var(--ink2); font-weight:600; font-size:14px; cursor:pointer;
  display:inline-flex; align-items:center; gap:7px; transition:all .12s ease}
.chip:hover{border-color:var(--brand-rim)}
.chip[aria-pressed="true"]{background:var(--brand-lt); border-color:var(--brand-rim); color:var(--brand-d)}
.chip.filter[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:#fff}

/* ---------- status ---------- */
.tag{display:inline-block; font-size:11.5px; font-weight:650; letter-spacing:.01em;
  padding:3px 9px; border-radius:var(--r-pill); border:1px solid; white-space:nowrap}
.t-grey{background:var(--rule2); color:var(--ink2); border-color:var(--rule)}
.t-yellow{background:#FFF6D6; color:#7A5A00; border-color:#F0DFA3}
.t-blue{background:var(--blue-bg); color:var(--blue); border-color:var(--blue-rim)}
.t-green{background:var(--green-bg); color:var(--green); border-color:var(--green-rim)}
.t-red{background:var(--red-bg); color:var(--red); border-color:var(--red-rim)}
.t-amber{background:var(--amber-bg); color:var(--amber); border-color:var(--amber-rim)}

/* ---------- number plate (identity) ---------- */
.plate{display:inline-flex; align-items:center; gap:6px; background:var(--hivis); color:#111;
  border:2px solid #111; border-radius:6px; padding:5px 10px 4px;
  font-family:var(--mono); font-weight:800; font-size:18px; letter-spacing:.05em; line-height:1}

/* ---------- job row ---------- */
.jobrow{display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--rule);
  border-radius:var(--r); padding:15px; margin:9px 0; cursor:pointer; box-shadow:var(--shadow-sm);
  transition:border-color .12s ease, box-shadow .12s ease}
.jobrow:hover{border-color:var(--brand-rim); box-shadow:var(--shadow-md)}
.jobrow:active{transform:translateY(1px)}
.jobrow .l1{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.jobrow .l2{margin-top:9px; display:flex; align-items:center; gap:9px; flex-wrap:wrap; font-size:14.5px; color:var(--ink2)}
.jobrow .jid{font-family:var(--mono); font-size:11.5px; color:var(--steel); font-weight:600}

/* ---------- forms ---------- */
.field label{display:block; font-size:13.5px; font-weight:600; color:var(--ink2); margin-bottom:7px}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%; min-height:var(--tap); padding:11px 13px; border:1px solid var(--rule);
  border-radius:var(--r-sm); background:var(--surface); font-weight:500; font-size:15.5px;
  transition:border-color .12s ease, box-shadow .12s ease;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand); box-shadow:0 0 0 3.5px var(--brand-lt)}
.searchbar{position:sticky; top:58px; z-index:20; background:var(--canvas); padding:10px 0 6px}

/* ---------- tables ---------- */
.lines th{font-size:11.5px; letter-spacing:.03em; text-transform:uppercase; color:var(--steel); text-align:left;
  font-weight:650; padding:9px 10px; border-bottom:1px solid var(--rule)}
.lines td{padding:11px 10px; border-bottom:1px solid var(--rule2); vertical-align:middle}

/* ---------- totals ---------- */
.totrow{display:flex; justify-content:space-between; gap:16px; padding:7px 0; font-size:15px; color:var(--ink2)}
.totrow.grand{border-top:1px solid var(--rule); margin-top:10px; padding-top:13px; font-size:20px;
  font-weight:700; color:var(--ink)}

/* ---------- banners ---------- */
.banner{border:1px solid var(--amber-rim); border-left:3px solid var(--amber); border-radius:var(--r-sm);
  padding:13px 15px; margin:14px 0; background:var(--amber-bg); color:var(--ink)}
.banner.info{background:var(--blue-bg); border-color:var(--blue-rim); border-left-color:var(--blue)}
.banner.ok{background:var(--green-bg); border-color:var(--green-rim); border-left-color:var(--green)}
.banner.warn{background:var(--amber-bg); border-color:var(--amber-rim); border-left-color:var(--amber)}
.stopbox{border:1px solid var(--red-rim); border-left:3px solid var(--red); border-radius:var(--r);
  background:var(--red-bg); margin:14px 0}

/* ---------- sheet ---------- */
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:210; background:var(--surface);
  border-radius:var(--r-lg) var(--r-lg) 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:92vh; overflow-y:auto; box-shadow:var(--shadow-lg)}
@media(min-width:760px){ .sheet{left:50%; right:auto; bottom:auto; top:50%; width:560px;
  transform:translate(-50%,-50%); border-radius:var(--r-lg); max-height:88vh} }

/* ---------- empty ---------- */
.empty{text-align:center; padding:34px 16px; color:var(--steel); font-size:15px}
.empty b{display:block; font-size:16.5px; color:var(--ink); margin-bottom:6px; font-weight:650}

/* ---------- tiles ---------- */
.tile{display:flex; align-items:center; gap:9px; min-height:46px; padding:9px 13px; border:1px solid var(--rule);
  border-radius:var(--r-sm); background:var(--surface); cursor:pointer; font-weight:600; font-size:14.5px;
  color:var(--ink); text-align:left; transition:all .12s ease}
.tile:hover{border-color:var(--brand-rim)}
.tile[aria-pressed="true"]{background:var(--brand-lt); border-color:var(--brand-rim); color:var(--brand-d)}

/* ---------- stage steps ---------- */
.step{flex:0 0 auto; padding:6px 12px; border:1px solid var(--rule); border-radius:var(--r-pill);
  background:var(--surface); font-size:12.5px; font-weight:600; color:var(--steel); white-space:nowrap}
.step.done{background:var(--green-bg); border-color:var(--green-rim); color:var(--green)}
.step.now{background:var(--brand); border-color:var(--brand); color:#fff}

/* ---------- headline figures ----------
   A dashboard opens with the four numbers somebody actually came to see,
   before any table. Tabular figures so the digits line up as they change. */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(146px,1fr)); gap:12px; margin:4px 0 18px}
.stat{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r); padding:15px 16px;
  box-shadow:var(--shadow-xs); text-align:left; font-family:inherit}
button.stat{width:100%; cursor:pointer; transition:border-color .13s ease, box-shadow .13s ease}
button.stat:hover{border-color:var(--brand-rim); box-shadow:var(--shadow-sm)}
button.stat:active{transform:translateY(1px)}
.stat .k{font-size:12.5px; font-weight:600; color:var(--steel)}
.stat .v{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:24px; font-weight:700;
  letter-spacing:-.03em; margin-top:7px; color:var(--ink); line-height:1.1}
.stat .s{font-size:12.5px; color:var(--steel); margin-top:5px}
.stat.accent{background:var(--brand-lt); border-color:var(--brand-rim)}
.stat.accent .v,.stat.accent .k{color:var(--brand-d)}
.stat.warn{background:var(--red-bg); border-color:var(--red-rim)}
.stat.warn .v,.stat.warn .k{color:var(--red)}
.stat.good{background:var(--green-bg); border-color:var(--green-rim)}
.stat.good .v,.stat.good .k{color:var(--green)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalroot"></div>
<div id="toast"></div>
<div id="printarea"></div>
<script>
/* =====================================================================
   MOTOREEZ JOB CARD SYSTEM
   Money is ALWAYS stored as whole paise (integers). Never floats.
   ===================================================================== */


/* ---------- QR code ----------
   Byte mode, error-correction level M, versions 1-14. Written out rather
   than pulled from a CDN because the app has to keep working when the
   workshop's connection does not, and a payment QR that fails to draw is
   worse than no QR at all.
   Returns a square matrix of 0/1. */
function qrEncode(text){
  var data=[],i;
  for(i=0;i<text.length;i++){
    var c=text.charCodeAt(i);
    if(c<128) data.push(c);
    else if(c<2048){ data.push(192|(c>>6)); data.push(128|(c&63)); }
    else { data.push(224|(c>>12)); data.push(128|((c>>6)&63)); data.push(128|(c&63)); }
  }
  /* total codewords, ec codewords per block, block counts — level M */
  var SPEC=[
    null,
    [26,10,1,0],[44,16,1,0],[70,26,1,0],[100,18,2,0],[134,24,2,0],
    [172,16,4,0],[196,18,4,0],[242,22,2,2],[292,22,3,2],[346,26,4,1],
    [404,30,1,4],[466,22,6,2],[532,22,8,1],[581,24,4,5]
  ];
  var ver=0, cap=0;
  for(var v=1;v<=14;v++){
    var s=SPEC[v], nb=s[2]+s[3], total=s[0]-s[1]*nb;
    var lenBits=(v<10)?8:16;
    var avail=total*8-4-lenBits;
    if(data.length*8<=avail){ ver=v; cap=total; break; }
  }
  if(!ver) throw new Error('too much data for a QR of this size');
  var spec=SPEC[ver], ecLen=spec[1], g1=spec[2], g2=spec[3], nBlocks=g1+g2;
  var lenBits=(ver<10)?8:16;

  /* bit stream */
  var bits=[];
  function put(val,n){ for(var k=n-1;k>=0;k--) bits.push((val>>k)&1); }
  put(4,4); put(data.length,lenBits);
  for(i=0;i<data.length;i++) put(data[i],8);
  var totalBits=cap*8;
  var term=Math.min(4,totalBits-bits.length);
  for(i=0;i<term;i++) bits.push(0);
  while(bits.length%8) bits.push(0);
  var pad=[0xEC,0x11],pi=0;
  while(bits.length<totalBits){ put(pad[pi%2],8); pi++; }
  var cw=[];
  for(i=0;i<bits.length;i+=8){
    var byte=0; for(var k2=0;k2<8;k2++) byte=(byte<<1)|bits[i+k2];
    cw.push(byte);
  }

  /* GF(256) */
  var EXP=new Array(512), LOG=new Array(256), x=1;
  for(i=0;i<255;i++){ EXP[i]=x; LOG[x]=i; x<<=1; if(x&256) x^=285; }
  for(i=255;i<512;i++) EXP[i]=EXP[i-255];
  function mul(a,b){ return (a===0||b===0)?0:EXP[LOG[a]+LOG[b]]; }
  function genPoly(n){
    var p=[1];
    for(var d=0;d<n;d++){
      var np=new Array(p.length+1); for(var q=0;q<np.length;q++) np[q]=0;
      for(var a=0;a<p.length;a++){ np[a]^=mul(p[a],1); np[a+1]^=mul(p[a],EXP[d]); }
      p=np;
    }
    return p;
  }
  function ecc(block,n){
    var gp=genPoly(n), res=block.concat(new Array(n).fill(0));
    for(var a=0;a<block.length;a++){
      var f=res[a]; if(!f) continue;
      for(var b=0;b<gp.length;b++) res[a+b]^=mul(gp[b],f);
    }
    return res.slice(block.length);
  }

  /* split into blocks, interleave */
  var short=Math.floor(cap/nBlocks), blocks=[], eccs=[], pos=0;
  for(i=0;i<nBlocks;i++){
    var len=short+(i>=g1?1:0);
    var blk=cw.slice(pos,pos+len); pos+=len;
    blocks.push(blk); eccs.push(ecc(blk,ecLen));
  }
  var out=[], maxLen=0;
  blocks.forEach(function(b){ if(b.length>maxLen) maxLen=b.length; });
  for(i=0;i<maxLen;i++) for(var b2=0;b2<nBlocks;b2++) if(i<blocks[b2].length) out.push(blocks[b2][i]);
  for(i=0;i<ecLen;i++) for(var b3=0;b3<nBlocks;b3++) out.push(eccs[b3][i]);

  /* matrix */
  var size=17+ver*4;
  var m=[], used=[];
  for(i=0;i<size;i++){ m.push(new Array(size).fill(0)); used.push(new Array(size).fill(0)); }
  function set(r,c,v){ if(r<0||c<0||r>=size||c>=size) return; m[r][c]=v?1:0; used[r][c]=1; }
  function finder(r,c){
    for(var a=-1;a<=7;a++) for(var b=-1;b<=7;b++){
      var rr=r+a, cc=c+b;
      if(rr<0||cc<0||rr>=size||cc>=size) continue;
      var on=(a>=0&&a<=6&&(b===0||b===6))||(b>=0&&b<=6&&(a===0||a===6))||(a>=2&&a<=4&&b>=2&&b<=4);
      set(rr,cc,on);
    }
  }
  finder(0,0); finder(0,size-7); finder(size-7,0);
  for(i=8;i<size-8;i++){ set(6,i,i%2===0); set(i,6,i%2===0); }
  /* alignment patterns */
  var AL=[[],[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],
          [6,28,50],[6,30,54],[6,32,58],[6,34,62],[6,26,46,66]];
  var ap=AL[ver]||[];
  for(i=0;i<ap.length;i++) for(var j2=0;j2<ap.length;j2++){
    var r0=ap[i], c0=ap[j2];
    if((r0<9&&c0<9)||(r0<9&&c0>size-10)||(r0>size-10&&c0<9)) continue;
    for(var a2=-2;a2<=2;a2++) for(var b4=-2;b4<=2;b4++)
      set(r0+a2,c0+b4, Math.max(Math.abs(a2),Math.abs(b4))!==1);
  }
  set(size-8,8,1); /* dark module */
  /* reserve format areas */
  for(i=0;i<9;i++){ if(!used[8][i]) used[8][i]=1; if(!used[i][8]) used[i][8]=1; }
  for(i=0;i<8;i++){ used[8][size-1-i]=1; used[size-1-i][8]=1; }
  if(ver>=7) for(i=0;i<6;i++) for(var k3=0;k3<3;k3++){ used[i][size-11+k3]=1; used[size-11+k3][i]=1; }

  /* place data, mask 0 */
  var bi=0, dir=-1, row=size-1;
  for(var col=size-1;col>0;col-=2){
    if(col===6) col--;
    while(true){
      for(var s2=0;s2<2;s2++){
        var cc2=col-s2;
        if(!used[row][cc2]){
          var bit=0;
          if(bi<out.length*8) bit=(out[bi>>3]>>(7-(bi&7)))&1;
          bi++;
          if((row+cc2)%2===0) bit^=1;    /* mask pattern 0 */
          m[row][cc2]=bit; used[row][cc2]=1;
        }
      }
      row+=dir;
      if(row<0||row>=size){ row-=dir; dir=-dir; break; }
    }
  }
  /* format info: level M + mask 0. Bit 14 is the most significant; the
     two copies are laid out in opposite directions, which is the detail
     that is easy to get backwards. */
  var fmt=0x5412;
  function fbit(k){ return (fmt>>k)&1; }
  for(i=0;i<=5;i++){ m[i][8]=fbit(i); m[8][i]=fbit(14-i); }
  m[7][8]=fbit(6); m[8][8]=fbit(7); m[8][7]=fbit(8);
  for(i=0;i<=6;i++) m[size-1-i][8]=fbit(14-i);
  for(i=0;i<=7;i++) m[8][size-8+i]=fbit(7-i);
  m[size-8][8]=1;
  /* version info for 7+ */
  if(ver>=7){
    var VB=[0,0,0,0,0,0,0,0x07C94,0x085BC,0x09A99,0x0A4D3,0x0BBF6,0x0C762,0x0D847,0x0E60D];
    var vb=VB[ver];
    for(i=0;i<18;i++){
      var bt=(vb>>i)&1, r1=Math.floor(i/3), c1=i%3;
      m[r1][size-11+c1]=bt; m[size-11+c1][r1]=bt;
    }
  }
  return m;
}

/* Render a matrix as SVG. Rectangles per run, not per module, so a v10 code
   is a few hundred nodes instead of several thousand. */
function qrSvg(text,px){
  var m; try{ m=qrEncode(text); }catch(e){ return ''; }
  var n=m.length, q=2, size=n+q*2, s=(px||150)/size, r='';
  for(var y=0;y<n;y++){
    var x=0;
    while(x<n){
      if(m[y][x]){ var w=1; while(x+w<n&&m[y][x+w]) w++;
        r+='<rect x="'+((x+q)*s).toFixed(2)+'" y="'+((y+q)*s).toFixed(2)+
           '" width="'+(w*s).toFixed(2)+'" height="'+s.toFixed(2)+'"/>';
        x+=w; }
      else x++;
    }
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+(px||150)+' '+(px||150)+'">'+
    '<rect width="100%" height="100%" fill="#fff"/><g fill="#000">'+r+'</g></svg>';
}
/* ---------- UPI ----------
   A standard UPI intent string. Any Indian payment app reads it, so the
   customer scans from the invoice and the amount is already filled in —
   no typing a VPA wrong at the counter. */
function upiLink(amountPaise,note){
  var W=S.core.workshop;
  if(!W.upi) return '';
  var p=['pa='+encodeURIComponent(W.upi),
         'pn='+encodeURIComponent(W.upiName||W.name),
         'cu=INR'];
  if(amountPaise>0) p.push('am='+(amountPaise/100).toFixed(2));
  if(note) p.push('tn='+encodeURIComponent(String(note).slice(0,50)));
  return 'upi://pay?'+p.join('&');
}
function upiBlock(amountPaise,note,px){
  var l=upiLink(amountPaise,note); if(!l) return '';
  var svg=qrSvg(l,px||150); if(!svg) return '';
  return '<div class="qrbox">'+svg+'</div>';
}

/* =====================================================================
   LANGUAGE  (G8)
   The people who use this all day are technicians and the counter staff.
   English is fine for the owner reading a P&L; it is not fine for a
   mechanic ticking off work. So the technician-facing surfaces are
   translated and the accounting screens are not — a half-translated
   ledger is worse than an English one, because a wrong word about money
   is a real problem while a wrong word about a brake pad is obvious.

   t('key') falls through to English whenever a string is missing, so
   nothing can ever render blank.
   ===================================================================== */
var LANGS=[['en','English'],['hi','\u0939\u093F\u0928\u094D\u0926\u0940'],['pa','\u0a2a\u0a70\u0a1c\u0a3e\u0a2c\u0a40']];
var LANG='en';
var STR={
  hi:{

    'today':'\u0906\u091C',

    'Walk-round':'\u091C\u093E\u0902\u091A', 'Start the walk-round':'\u091C\u093E\u0902\u091A \u0936\u0941\u0930\u0942 \u0915\u0930\u0947\u0902',
    'Open the walk-round':'\u091C\u093E\u0902\u091A \u0916\u094B\u0932\u0947\u0902',

    'good':'\u0920\u0940\u0915', 'watch':'\u0927\u094D\u092F\u093E\u0928 \u0926\u0947\u0902', 'needs work':'\u0915\u093E\u092E \u091A\u093E\u0939\u093F\u090F',
    'not checked':'\u091C\u093E\u0902\u091A\u093E \u0928\u0939\u0940\u0902',
    'What you found':'\u0906\u092A\u0928\u0947 \u0915\u094D\u092F\u093E \u092A\u093E\u092F\u093E',
    'Arrival condition':'\u0906\u0928\u0947 \u0915\u0947 \u0938\u092E\u092F \u0915\u0940 \u0939\u093E\u0932\u0924',
    'Safety':'\u0938\u0941\u0930\u0915\u094D\u0937\u093E', 'Running':'\u091A\u0932\u0928\u093E',
    'Bodywork and panels':'\u092C\u0949\u0921\u0940 \u0914\u0930 \u092A\u0948\u0928\u0932',
    'Seat and grab rail':'\u0938\u0940\u091F \u0914\u0930 \u0917\u094D\u0930\u0948\u092C \u0930\u0947\u0932',
    'Mirrors, indicators, lights':'\u0936\u0940\u0936\u0947, \u0907\u0902\u0921\u093F\u0915\u0947\u091F\u0930, \u0932\u093E\u0907\u091F',

    'Chain and sprockets':'\u091A\u0947\u0928 \u0914\u0930 \u0938\u094D\u092A\u094D\u0930\u0949\u0915\u0947\u091F',

/* ---------- one tap means one save ----------
   Storage writes are awaited but the screen does not move while they run.
   On a weak connection staff tap again, and the second tap used to create a
   second job card. The button now locks itself for the length of the write.
   Keyed by the button's own action so a re-render cannot lose the lock. */
var BUSY={};
function isBusy(a){ return !!BUSY[a]; }
async function guard(act,el,fn){
  if(BUSY[act]) return;
  BUSY[act]=true;
  if(el){ el.setAttribute('aria-busy','true'); el.setAttribute('disabled','disabled'); }
  try{
    /* act on what the server holds now, not on what this phone saw a minute ago */
    if(MODE==='cloud') await syncFromServer();
    await fn();
  }
  catch(err){
    console.error(act,err);
    if(err&&err.auth){ toast('This device has been signed out. Sign in again.','bad'); render(); }
    else toast(err&&err.net?'No connection to the server. Nothing was saved — try again when the signal is back.'
      :'That did not go through. Nothing was lost — try again.','bad');
  }
  finally{
    BUSY[act]=false;
    if(el&&el.isConnected){ el.removeAttribute('aria-busy'); el.removeAttribute('disabled'); }
  }
}

function toPaise(v){
  if(v===null||v===undefined) return 0;
  var s=String(v).trim().replace(/[^0-9.\-]/g,'');
  if(!s||s==='-'||s==='.') return 0;
  var neg = s.charAt(0)==='-'; if(neg) s=s.slice(1);
  var parts=s.split('.');
  var rupees=parseInt(parts[0]||'0',10)||0;
  var frac=(parts[1]||'').slice(0,3);
  var paise;
  if(frac.length===0) paise=0;
  else if(frac.length===1) paise=parseInt(frac,10)*10;
  else if(frac.length===2) paise=parseInt(frac,10);
  else paise=Math.round(parseInt(frac,10)/10);
  var t=rupees*100+paise;
  return neg?-t:t;
}
function paiseToInput(p){ if(!p) return ''; return (Math.abs(p)/100).toFixed(2); }
function inGroup(intStr){
  if(intStr.length<=3) return intStr;
  var last3=intStr.slice(-3), rest=intStr.slice(0,-3);
  rest=rest.replace(/\B(?=(\d{2})+(?!\d))/g,',');
  return rest+','+last3;
}
function money(p,opt){
  opt=opt||{};
  var neg=p<0, v=Math.abs(Math.round(p||0));
  var r=Math.floor(v/100), pa=v%100;
  var s=inGroup(String(r));
  if(!opt.noPaise) s+='.'+String(pa).padStart(2,'0');
  return (neg?'-':'')+(opt.bare?'':'\u20B9')+s;
}

function checkPhone(c,nat){
  if(!nat) return 'empty';
  if(c.iso==='IN') return /^[6-9]\d{9}$/.test(nat)?'':'An Indian mobile number is exactly 10 digits, starting 6, 7, 8 or 9';
  if(nat.length<c.min||nat.length>c.max)
    return 'A '+c.name+' number is '+(c.min===c.max?c.min:c.min+' to '+c.max)+' digits';
  return '';
}
function fmtPhone(e164){
  if(!e164) return '';
  if(String(e164).charAt(0)!=='+') return e164;
  var c=countryOf(e164), n=phoneNational(e164);
  if(c.iso==='IN'&&n.length===10) return '+91 '+n.slice(0,5)+' '+n.slice(5);
  return '+'+c.code+' '+n;
}
function ccOptions(sel){
  var o='<option value="IN"'+(sel==='IN'?' selected':'')+'>India +91</option>';
  return o+COUNTRIES.filter(function(c){ return c.iso!=='IN'; }).slice().sort(function(a,b){ return a.name.localeCompare(b.name); })
    .map(function(c){ return '<option value="'+c.iso+'"'+(c.iso===sel?' selected':'')+'>'+esc(c.name)+' +'+c.code+'</option>'; }).join('');
}
/* the field itself: a country picker and the number, side by side */
function phoneField(name,value,attrs){
  var e=normPhone(value), c=e?countryOf(e):CBYISO.IN;
  return '<div class="phonebox"><select class="ccsel" name="'+name+'_cc" aria-label="Country code">'+ccOptions(c.iso)+'</select>'+
    '<input type="tel" name="'+name+'" class="mono" inputmode="tel" autocomplete="off" value="'+esc(e?phoneNational(e):'')+'" '+
    (attrs||'')+'></div>';
}
function readPhoneEl(inp){
  if(!inp) return {e164:'',ok:false,empty:true,why:''};
  var raw=String(inp.value||'').trim();
  var box=inp.closest('.phonebox'), sel=box?box.querySelector('select.ccsel'):null;
  var c=CBYISO[sel?sel.value:'IN']||CBYISO.IN;
  var d=raw.replace(/\D/g,'');
  if(!d) return {e164:'',ok:false,empty:true,why:''};
  /* a pasted +44 7911 or 0091 98111 is read as typed */
  if(raw.charAt(0)==='+'||raw.slice(0,2)==='00'){ var full=normPhone('+'+d.replace(/^00/,'')); c=countryOf(full); d=phoneNational(full);
    if(sel) sel.value=c.iso;
    inp.value=d;   /* the code now lives in the picker, so changing the country later is not undone */ }
  if(c.iso==='IN'&&d.length===11&&d.charAt(0)==='0') d=d.slice(1);
  if(c.iso!=='IN'&&d.charAt(0)==='0') d=d.replace(/^0+/,'');
  var why=checkPhone(c,d);
  return {e164:'+'+c.code+d, ok:!why, empty:false, why:why, country:c};
}
function readPhone(name,scope){ return readPhoneEl((scope||document).querySelector('[name="'+name+'"]')); }
function setPhone(name,e164,scope){
  var inp=(scope||document).querySelector('[name="'+name+'"]'); if(!inp) return;
  var e=normPhone(e164); var box=inp.closest('.phonebox'), sel=box?box.querySelector('select.ccsel'):null;
  if(sel) sel.value=(e?countryOf(e):CBYISO.IN).iso;
  inp.value=e?phoneNational(e):'';
}
function regKey(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function regShow(s){
  var k=regKey(s);
  if(/^NOPLATE/.test(k)) return 'NO PLATE YET';
  var bh=k.match(/^(\d{2})BH(\d{4})([A-Z]{1,2})$/); if(bh) return bh[1]+' BH '+bh[2]+' '+bh[3];
  var m=k.match(/^([A-Z]{2})(\d{1,2})([A-Z]{0,3})(\d{1,4})$/);
  if(m) return m[1]+' '+m[2]+(m[3]?' '+m[3]:'')+' '+m[4];
  return k;
}
/* =====================================================================
   HOW WORDS ARE WRITTEN
   Staff type in capitals, the way a job card is written by hand. When it
   is saved it is tidied: names become Sandeep Yadav, and a complaint
   becomes a sentence rather than shouting.
   Part numbers, registrations and codes are left exactly as typed.
   ===================================================================== */
var KEEP_CAPS=['RE','KTM','TVS','BMC','RRP','MT','GT','SF','XR','NS','LH','RH','OE','ABS','EFI','CBS',
  'GST','HSN','SAC','UPI','IGST','CGST','SGST','MRP','HP','CC','BS','BSA','MV','KM','UQC',
  'AC','DC','LED','USB','OEM','ID','TT','TL','DOT','XL','XS','SS','GP','JC','CN','DN','NGK','KYB',
  'PPF','DLF','HSR','ECU','OBD','RTO','PUC','GPS','BMW','HD','PAN','IFSC','UAE','UK','USA','EV'];
var SOFT_CAPS={'PVT':'Pvt','LTD':'Ltd','CO':'Co'};
var TWO_WORDS=['OF','TO','IN','ON','AT','BY','IS','IT','AN','AS','OR','NO','UP','MY','WE','SO','DO','GO','BE','HE','ME','IF','AM','OK'];
/* A single run of letters: Interceptor, GT, Newlite. Codes with digits are
   left alone, and anything in the list above keeps its capitals. */
function tcPart(t,first){
  if(!t) return t;
  if(/\d/.test(t)) return t;
  var u=t.toUpperCase();
  if(KEEP_CAPS.indexOf(u)>=0) return u;
  if(SOFT_CAPS[u]) return first?tcPlain(t):SOFT_CAPS[u];
  if(u.length<=2&&TWO_WORDS.indexOf(u)<0) return u;
  return tcPlain(t);
}
function tcPlain(t){
  var lower=t.toLowerCase();
  return lower.charAt(0).toUpperCase()+lower.slice(1);
}
/* Words break on slashes and hyphens too, so RE Interceptor/GT/Bear keeps
   the GT. An apostrophe does not break a word, so H'ness stays H'ness. */
function tcWord(w,first){
  if(!w) return w;
  if(/\d/.test(w)&&/[A-Za-z]/.test(w)&&!/[\/]/.test(w)) return w;
  var out='', buf='', n=0;
  for(var i=0;i<=w.length;i++){
    var ch=w.charAt(i);
    if(i<w.length&&/[A-Za-z'\u2019]/.test(ch)){ buf+=ch; continue; }
    if(buf){ out+=tcPart(buf,first&&n===0); n++; buf=''; }
    if(i<w.length) out+=ch;
  }
  return out;
}

   capitals. Email addresses and the messages sent to customers are the
   only things that are not, and they never pass through here. */

function logoImg(h,extra){ return '<img src="'+LOGO+'" alt="MOTOREEZ" class="logo" style="height:'+h+'px'+(extra?';'+extra:'')+'">'; }
function docLogo(){ return '<div style="margin-bottom:6px">'+logoImg(40)+'</div>'; }
function capsText(str){
  return String(str===undefined||str===null?'':str).trim().toUpperCase();
}
function titleCase(str){
  var t=String(str===undefined||str===null?'':str).trim();
  if(!t) return '';
  var first=true;
  return t.split(/(\s+)/).map(function(w){
    if(/^\s+$/.test(w)) return w;
    var r=tcWord(w,first); first=false; return r;
  }).join('');
}
/* For anything that is a sentence — a complaint, a note, a reason. Title
   case on a paragraph reads like a headline, which is worse than shouting. */
function sentenceCase(str){
  var t=String(str===undefined||str===null?'':str).trim();
  if(!t) return '';
  if(t===t.toUpperCase()) t=t.toLowerCase();
  t=t.replace(/(^|[.!?]\s+)([a-z])/g, function(_,a,b){ return a+b.toUpperCase(); });
  t=t.replace(/\bi\b/g,'I');
  /* codes and known short forms keep their capitals */
  return t.split(/(\s+)/).map(function(w){
    if(/^\s+$/.test(w)) return w;
    var bare=w.replace(/[^A-Za-z]/g,'');
    if(bare&&KEEP_CAPS.indexOf(bare.toUpperCase())>=0) return w.toUpperCase();
    return w;
  }).join('');
}
function esc(s){ return String(s===undefined||s===null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------- where the job cards are kept ----------
   Three places, best first:
   shared  - the workshop's shared store, every phone sees the same job cards
   browser - this browser only, survives closing the app but does not leave the device
   memory  - nothing survives a refresh; only if the other two are blocked
   -------------------------------------------------------------------------------- */
/* =====================================================================
   THE CLOUD
   When config.js names a Supabase project, every phone and laptop reads
   and writes the same database. One workshop login per device keeps
   strangers out; the staff PIN then says which person is using it.

   Three rules this code keeps:
   - It never quietly falls back to saving on the phone. A phone that
     cannot reach the server says so and saves nothing, because two
     copies of the books that disagree are worse than a pause.
   - A read that fails is an error, never "nothing there". Treating a
     dropped connection as an empty job list is how a list gets wiped.
   - Invoice numbers and chat messages are handed out by the database
     itself, so two phones can never get the same number.
   ===================================================================== */
var CFG=window.MZ_CONFIG||{};
var STAMPS={};          /* key -> server time it last changed, as this device last saw it */
var PREFETCH={};        /* filled in one request at start-up, drained by DB.get */
var CloudAuthError=function(msg){ var e=new Error(msg||'Signed out'); e.auth=true; return e; };
var Cloud={
  url:String(CFG.supabaseUrl||'').trim().replace(/\/+$/,''),
  key:String(CFG.supabaseKey||'').trim(),
  session:null, refreshing:null,
  on:function(){ return !!(this.url&&this.key); },
  load:function(){
    try{ this.session=JSON.parse(window.localStorage.getItem('mz:cloud:session')||'null'); }
    catch(e){ this.session=null; }
  },
  keep:function(s){
    this.session=s;
    try{
      if(s) window.localStorage.setItem('mz:cloud:session',JSON.stringify(s));
      else window.localStorage.removeItem('mz:cloud:session');
    }catch(e){}
  },
  pack:function(j){
    return {access:j.access_token, refresh:j.refresh_token,
      exp:Date.now()+((j.expires_in||3600)*1000), email:(j.user&&j.user.email)||(this.session&&this.session.email)||''};
  },
  authPost:async function(grant,body){
    var r;
    try{
      r=await fetch(this.url+'/auth/v1/token?grant_type='+grant,{method:'POST',
        headers:{apikey:this.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
    }catch(e){ throw new Error('No connection to the server. Check the internet and try again.'); }
    var j=await r.json().catch(function(){ return {}; });
    if(!r.ok){
      var m=j.error_description||j.msg||j.message||j.error||('Server said '+r.status);
      if(/invalid login|invalid grant|invalid_grant|invalid credentials/i.test(m)) m='That e-mail and password do not match.';
      var err=new Error(m); err.status=r.status; throw err;
    }
    return j;
  },
  signIn:async function(email,pw){ this.keep(this.pack(await this.authPost('password',{email:email,password:pw}))); },
  /* One refresh at a time: two at once makes Supabase treat the second as
     a stolen token and sign the device out. */
  refresh:async function(){
    if(this.refreshing) return this.refreshing;
    var self=this;
    this.refreshing=(async function(){
      try{
        if(!self.session||!self.session.refresh) throw CloudAuthError();
        self.keep(self.pack(await self.authPost('refresh_token',{refresh_token:self.session.refresh})));
      }catch(e){
        if(e.status===400||e.status===401||e.auth){ self.keep(null); throw CloudAuthError(); }
        throw e;
      }finally{ self.refreshing=null; }
    })();
    return this.refreshing;
  },
  token:async function(){
    if(!this.session) throw CloudAuthError();
    if(Date.now()>this.session.exp-90000) await this.refresh();
    return this.session.access;
  },
  raw:async function(path,opt,retried){
    opt=opt||{};
    var t=await this.token();
    var h=Object.assign({apikey:this.key, Authorization:'Bearer '+t}, opt.headers||{});
    var r;
    try{ r=await fetch(this.url+path,{method:opt.method||'GET',headers:h,body:opt.body}); }
    catch(e){ var ne=new Error('No connection to the server.'); ne.net=true; throw ne; }
    if(r.status===401&&!retried){ await this.refresh(); return this.raw(path,opt,true); }
    return r;
  },
  /* photos and videos: Supabase Storage, bucket "media", members only */
  putFile:async function(path,blob,type){
    var r=await this.raw('/storage/v1/object/media/'+path,{method:'POST',
      headers:{'Content-Type':type||blob.type||'application/octet-stream','x-upsert':'true'},body:blob});
    if(r.ok) return true;
    var tx=await r.text().catch(function(){ return ''; });
    var e=new Error(r.status===413||/too large|maximum allowed size|exceeded/i.test(tx)
      ?'too big':'Server said '+r.status+': '+tx.slice(0,160));
    e.big=(e.message==='too big'); e.status=r.status; throw e;
  },
  getFile:async function(path){
    var r=await this.raw('/storage/v1/object/authenticated/media/'+path);
    if(!r.ok){ var e=new Error('Server said '+r.status); e.status=r.status; throw e; }
    return r.blob();
  },
  req:async function(path,opt,retried){
    var r=await this.raw(path,opt,retried);
    if(!r.ok){
      var tx=await r.text().catch(function(){ return ''; });
      if(/not allowed|permission denied|row-level security/i.test(tx))
      { var me=new Error('That login is not allowed into this workshop. Ask the owner to add it (setup guide, step 2).'); me.notMember=true; throw me; }
      var he=new Error('Server said '+r.status+': '+tx.slice(0,160)); he.status=r.status; throw he;
    }
    var txt=await r.text();
    return txt?JSON.parse(txt):null;
  },
  qk:function(k){ return encodeURIComponent('"'+String(k).replace(/"/g,'')+'"'); },
  get:async function(k){
    var rows=await this.req('/rest/v1/kv?select=value,updated_at&key=eq.'+encodeURIComponent(k));
    if(!rows||!rows.length) return null;
    STAMPS[k]=rows[0].updated_at;
    return rows[0].value;
  },
  getMany:async function(keys){
    if(!keys.length) return [];
    var out=[];
    for(var i=0;i<keys.length;i+=40){
      var part=keys.slice(i,i+40).map(this.qk).join(',');
      out=out.concat(await this.req('/rest/v1/kv?select=key,value,updated_at&key=in.('+part+')')||[]);
    }
    out.forEach(function(r){ STAMPS[r.key]=r.updated_at; });
    return out;
  },
  stamps:async function(keys){
    return await this.req('/rest/v1/kv?select=key,updated_at&key=in.('+keys.map(this.qk).join(',')+')')||[];
  },
  /* every key starting with a prefix, optionally only those changed since a moment */
  prefix:async function(pfx,since){
    var q='/rest/v1/kv?select=key,value,updated_at&key=like.'+encodeURIComponent(pfx+'*')+
      (since?'&updated_at=gt.'+encodeURIComponent(since):'')+'&order=updated_at.asc';

  /* bodies are already JSON text, so they are never stringified twice */
  setRaw:async function(rowsJson){

      headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=representation'},

  },
  row:function(k,body){ return '{"key":'+JSON.stringify(k)+',"value":'+body+'}'; },
  del:async function(k){ await this.req('/rest/v1/kv?key=eq.'+encodeURIComponent(k),{method:'DELETE'}); delete STAMPS[k]; },
  rpc:async function(fn,args){
    return this.req('/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(args)});
  }
};

   Each shared list has one owner variable in memory. Before anything is

var SYNC_KEYS={
  'mz:core':function(v){ if(v){ var b=S.core&&S.core.bikes; S.core=v; S.core.bikes=b||{}; normaliseCore(); } },
  'mz:bikes':function(v){ if(S.core){ S.core.bikes=dropGone(v); bikesSeen(); } },

/* In the cloud each job card, and each counter or online sale, is one row
   of its own list, so two phones saving two different jobs never touch the
   same record. */
var IX_SINCE={job:'',sale:''};   /* newest list change this device has seen */
function ixKey(sale){ return sale?'mz:sx:':'mz:ix:'; }
function ixMerge(rows,sale){
  var list=sale?(S.saleIndex=S.saleIndex||[]):S.index, k=sale?'sale':'job', byId={};
  list.forEach(function(e,i){ byId[e.id]=i; });
  rows.forEach(function(r){
    var e=r.value;
    if(!IX_SINCE[k]||r.updated_at>IX_SINCE[k]) IX_SINCE[k]=r.updated_at;
    if(!e||!e.id) return;
    if(e.gone){ if(byId[e.id]!==undefined){ list.splice(byId[e.id],1); byId={}; list.forEach(function(x,i){ byId[x.id]=i; }); } return; }
    if(byId[e.id]!==undefined) list[byId[e.id]]=e; else { list.unshift(e); byId={}; list.forEach(function(x,i){ byId[x.id]=i; }); }
  });
}
/* the whole of both lists, written after a change that touches every entry */
async function saveIndexes(){
  if(MODE==='cloud') return DB.setMany(S.index.map(function(e){ return [ixKey(false)+e.id,e]; })
    .concat((S.saleIndex||[]).map(function(e){ return [ixKey(true)+e.id,e]; })));
  var a=await DB.set('mz:index',S.index), b=await DB.set('mz:saleidx',S.saleIndex||[]);
  return a&&b;
}
async function syncFromServer(){
  if(MODE!=='cloud'||!Cloud.session) return false;
  var keys=Object.keys(SYNC_KEYS);
  var jobKey=S.job?'mz:job:'+S.job.id:'';
  if(jobKey) keys.push(jobKey);
  var stamps=await Cloud.stamps(keys);
  var changed=stamps.filter(function(r){ return STAMPS[r.key]!==r.updated_at; }).map(function(r){ return r.key; });
  var ix=await Cloud.prefix('mz:ix:',IX_SINCE.job), sx=await Cloud.prefix('mz:sx:',IX_SINCE.sale);
  var mine=ix.concat(sx).filter(function(r){ return STAMPS[r.key]!==r.updated_at; });
  if(ix.length) ixMerge(ix,false);
  if(sx.length) ixMerge(sx,true);
  ix.concat(sx).forEach(function(r){ STAMPS[r.key]=r.updated_at; });
  if(!changed.length) return mine.length>0;
  var rows=await Cloud.getMany(changed);
  rows.forEach(function(r){
    if(r.key===jobKey){ if(S.job&&r.value) S.job=r.value; return; }
    if(SYNC_KEYS[r.key]) SYNC_KEYS[r.key](r.value);
  });
  clearBalCache();
  return true;
}
function normaliseCore(){
  if(!S.core.defaults) S.core.defaults=seedCore().defaults;
  if(!S.core.bikes) S.core.bikes={};
  if(!S.core.counters) S.core.counters={job:{},gst:{},nongst:{},cn:{},dn:{}};
  ['cn','dn'].forEach(function(k){ if(!S.core.counters[k]) S.core.counters[k]={}; });

async function loadCounters(){
  if(MODE!=='cloud') return;

    rows.forEach(function(r){

      S.core.counters[r.series][r.fy]=Math.max(r.n,S.core.counters[r.series][r.fy]||0);
    });
  }catch(e){}
}

var MEM={}, MODE='memory', STORE_OK=true, LS=null, LASTBODY={};
try{
  if(window.localStorage){ window.localStorage.setItem('mz:probe','1'); window.localStorage.removeItem('mz:probe'); LS=window.localStorage; }
}catch(e){ LS=null; }
async function detectStore(){
  if(Cloud.on()){ MODE='cloud'; SIZE_LIMIT=40*1024*1024; Cloud.load(); return; }
  if(window.storage&&window.storage.set){
    try{ var r=await window.storage.set('mz:probe',JSON.stringify(1),true); if(r!==null&&r!==false){ MODE='shared'; return; } }catch(e){}
