function copyText(t){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t); toast('Copied','good'); return; }
  }catch(e){}
  var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); toast('Copied','good'); }catch(e){ toast('Could not copy','bad'); }
  document.body.removeChild(ta);
}

/* =====================================================================
   DIGITAL VEHICLE INSPECTION
   A structured walk-round recorded once per job: every point gets a
   red / amber / green, optional note, optional photos. Two reasons it
   earns its place. First, it is the only proof of what the bike looked
   like when it arrived — the single most common argument in a workshop
   is a scratch nobody can date. Second, an amber finding is an honest
   basis for recommending work, and it can be pushed straight onto the
   estimate rather than re-typed.

   Photos live in their own storage key per job, never inside the job
   record or the index. Putting them in the job would drag the whole
   thing over the size ceiling within weeks and the index is read on
   every single screen.
   ===================================================================== */
var DVI_TEMPLATE=[
  {g:'Arrival condition', items:[
    {k:'body',   n:'Bodywork and panels', hint:'Scratches, dents, cracked fairing'},
    {k:'seat',   n:'Seat and grab rail'},
    {k:'mirror', n:'Mirrors, indicators, lights'},
    {k:'fuel',   n:'Fuel level and locks'}
  ]},
  {g:'Safety', items:[
    {k:'brakeF', n:'Front brake', hint:'Pad thickness, lever travel, disc lip'},
    {k:'brakeR', n:'Rear brake'},
    {k:'tyreF',  n:'Front tyre', hint:'Tread depth, cracking, pressure'},
    {k:'tyreR',  n:'Rear tyre'},
    {k:'susp',   n:'Suspension and forks', hint:'Leaks, play, rebound'}
  ]},
  {g:'Running', items:[
    {k:'chain',  n:'Chain and sprockets', hint:'Slack, lubrication, hooked teeth'},
    {k:'engine', n:'Engine and leaks'},
    {k:'oil',    n:'Engine oil level and colour'},
    {k:'batt',   n:'Battery and charging'},
    {k:'elec',   n:'Wiring, horn, switches'}
  ]}
];
function dviLabel(k){ return tr({ok:'Good',soon:'Watch',now:'Needs work'}[k]); }
var DVI_MAXSHOT=3, DVI_MAXTOTAL=24, DVI_PX=780, DVI_Q=0.55;

var DVICACHE={};
function dviKey(id){ return 'mz:dvi:'+id; }
async function loadDvi(jobId){
  if(DVICACHE[jobId]) return DVICACHE[jobId];
  var d=await DB.get(dviKey(jobId));
  DVICACHE[jobId]=d||{items:{},startedAt:0,byName:'',shots:0};
  return DVICACHE[jobId];
}
async function saveDvi(jobId,d){
  DVICACHE[jobId]=d;
  d.shots=countShots(d);
  return DB.set(dviKey(jobId),d);
}
function countShots(d){
  var n=0; Object.keys(d.items||{}).forEach(function(k){ n+=((d.items[k].shots||[]).length); });
  return n;
}
function dviAll(){
  var out=[]; DVI_TEMPLATE.forEach(function(g){ g.items.forEach(function(i){ out.push(i); }); });
  return out;
}
/* Counts for the traffic-light bar. "Not checked" is deliberately visible:
   a half-done inspection should not be able to look like a clean one. */
function dviTally(d){
  var t={ok:0,soon:0,now:0,na:0}, all=dviAll();
  all.forEach(function(i){
    var v=d.items&&d.items[i.k]&&d.items[i.k].state;
    if(v==='ok') t.ok++; else if(v==='soon') t.soon++; else if(v==='now') t.now++; else t.na++;
  });
  t.total=all.length; t.done=t.total-t.na;
  return t;
}
function dviBar(t){
  if(!t.total) return '';
  function w(n){ return (n/t.total*100).toFixed(1)+'%'; }
  return '<div class="ragbar">'+
    (t.ok?'<i style="width:'+w(t.ok)+';background:var(--green)"></i>':'')+
    (t.soon?'<i style="width:'+w(t.soon)+';background:var(--amber)"></i>':'')+
    (t.now?'<i style="width:'+w(t.now)+';background:var(--red)"></i>':'')+
    '</div>';
}
function shrinkImage(file,maxPx,quality){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var w=img.width, hh=img.height, s=Math.min(1,maxPx/Math.max(w,hh));
        var cv=document.createElement('canvas');
        cv.width=Math.round(w*s); cv.height=Math.round(hh*s);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',quality));
      };
      img.onerror=function(){ rej(new Error('bad image')); };
      img.src=fr.result;
    };
    fr.onerror=function(){ rej(new Error('read failed')); };
    fr.readAsDataURL(file);
  });
}
async function saveExpense(){

/* =====================================================================
   WHAT FITS WHAT
   A Himalayan comes in and nobody remembers there is a \u20B95,699 BMC filter
   for it on the shelf. Map a part to the bikes it fits once, and the job
   card offers it every time.

   Most of the mapping is already sitting in the part names \u2014 "BMC Air
   Filter RE Interceptor/GT/Bear650", "packing kit activa". So the app
   proposes and a person confirms. It never guesses silently.
   ===================================================================== */
function fitKey(make,model){ return pkey(make)+'|'+pkey(model); }
function fitLabel(key){
  var p=String(key).split('|');
  var mk=allMakes().filter(function(m){ return pkey(m)===p[0]; })[0]||p[0];
  var md=modelsFor(mk).filter(function(m){ return pkey(m.n)===p[1]; })[0];
  return mk+' '+(md?md.n:p[1]);
}
function partFitsBike(part,make,model){
  var f=part.fits||[];
  if(!f.length) return false;
  return f.indexOf(fitKey(make,model))>=0;
}
/* everything on the shelf that suits this bike */
function partsForBike(make,model,opts){
  opts=opts||{};
  var k=fitKey(make,model);
  return PARTS.filter(function(p){
    if((p.fits||[]).indexOf(k)<0) return false;
    if(opts.inStock&&stockOf(p.id)<=0) return false;
    return true;
  }).sort(function(a,b){
    var sa=stockOf(a.id)>0?0:1, sb=stockOf(b.id)>0?0:1;
    if(sa!==sb) return sa-sb;
    return String(a.name).localeCompare(String(b.name));
  });
}

/* ---------- reading the bikes out of a part name ---------- */
function longestAlpha(str){
  var toks=String(str).toUpperCase().split(/[^A-Z]+/).filter(Boolean);
  toks.sort(function(a,b){ return b.length-a.length; });
  return toks[0]||'';
}
function digitsOf(str){ return (String(str).match(/\d+/g)||[]); }
/* A Pulsar NS200 gets written "200NS" as often as "NS200". Only tokens that
   mix letters and digits are used this way, so a bare "390" never matches. */
function swapKeys(model){
  var out=[];
  String(model).toUpperCase().split(/\s+/).forEach(function(tok){
    var k=tok.replace(/[^A-Z0-9]/g,'');
    if(k.length<4||!/[A-Z]/.test(k)||!/[0-9]/.test(k)) return;
    out.push(k);
    var m=k.match(/^([A-Z]+)([0-9]+)$/);
    if(m) out.push(m[2]+m[1]);
    var m2=k.match(/^([0-9]+)([A-Z]+)$/);
    if(m2) out.push(m2[2]+m2[1]);
  });
  return out;
}
function suggestFits(part){
  if(!part) return [];
  var name=pkey(part.name+' '+(part.no||''));
  var out=[];
  allMakes().forEach(function(mk){
    modelsFor(mk).forEach(function(md){
      var key=pkey(md.n), strong=false, weak=false;
      if(key.length>=4&&name.indexOf(key)>=0) strong=true;
      else if(swapKeys(md.n).some(function(k){ return name.indexOf(k)>=0; })) strong=true;
      else{
        var la=longestAlpha(md.n), nums=digitsOf(md.n);
        if(la.length>=4&&name.indexOf(la)>=0){
          if(!nums.length) weak=true;
          else if(nums.some(function(n){ return name.indexOf(n)>=0; })) strong=true;
          else if(la.length>=5) weak=true;
        }
      }
      if(strong||weak) out.push({key:fitKey(mk,md.n), make:mk, model:md.n, strong:strong});
    });
  });
  /* if the brand is named too, that settles it */
  var brandHit=allMakes().filter(function(mk){ return pkey(mk).length>=4&&name.indexOf(pkey(mk))>=0; });
  if(brandHit.length){
    var strongOnes=out.filter(function(o){ return brandHit.indexOf(o.make)>=0; });
    if(strongOnes.length) out=strongOnes;
  }
  out.sort(function(a,b){ return (b.strong?1:0)-(a.strong?1:0); });
  return out.slice(0,24);
}
function fitCoverage(){
  var mapped=PARTS.filter(function(p){ return (p.fits||[]).length; }).length;
  return {mapped:mapped, total:PARTS.length,
    pct:PARTS.length?Math.round(mapped*100/PARTS.length):0};
}

/* =====================================================================
   THE OWNER'S DASHBOARD
   Kunal takes few bikes in. This is his screen: what happened today,
   who owes what, what is waiting on him, and what the business made.
   ===================================================================== */
function todayRange(){
  var n=new Date();
  return {from:new Date(n.getFullYear(),n.getMonth(),n.getDate(),0,0,0,0).getTime(),
          to:new Date(n.getFullYear(),n.getMonth(),n.getDate(),23,59,59,999).getTime()};
}
function salesIn(from,to){
  return SALES.filter(function(s){ return s.status==='final'&&s.at>=from&&s.at<=to; });
}
function receiptsIn(from,to){
  var t=0;
  RECEIPTS.forEach(function(r){ if(r.at>=from&&r.at<=to) t+=r.amount; });
  PAYMENTS.forEach(function(v){ if(v.direction==='in'&&!v.reversalOf&&v.at>=from&&v.at<=to) t+=v.amount; });
  return t;
}
/* What the business actually made. Sales, less what those parts cost,
   less everything spent to keep the doors open. */
function pnl(from,to){
  var ss=salesIn(from,to);
  var revenue=0, tax=0, cogs=0;
  ss.forEach(function(s){
    revenue+=s.taxable; tax+=s.tax;
    (s.lines||[]).forEach(function(l){ cogs+=l.cost||0; });
  });
  var jobSpend=sumExp(expensesIn(from,to,{kind:'job'}));
  var overhead=sumExp(expensesIn(from,to,{kind:'overhead'}));
  var wages=0;
  var a=new Date(from), b=new Date(to), seen={};
  for(var d=new Date(a); d<=b; d.setMonth(d.getMonth()+1)){
    var mk=monthKey(d); if(seen[mk]) continue; seen[mk]=1;
    wages+=monthWage(mk);
  }
  var gross=revenue-cogs-jobSpend;
  return { revenue:revenue, tax:tax, cogs:cogs, jobSpend:jobSpend, overhead:overhead, wages:wages,
    gross:gross, net:gross-overhead-wages, bills:ss.length,
    marginPct:revenue?Math.round((gross/revenue)*1000)/10:null };
}
function gstSummary(from,to){
  var outGst=0, outTaxable=0, exempt=0;
  salesIn(from,to).forEach(function(s){
    if(s.type==='gst'){ outTaxable+=s.taxable; outGst+=s.tax; }
    else exempt+=s.grand;
  });
  var inGst=0, inTaxable=0;
  PURCHASES.forEach(function(p){
    var at=new Date(p.invDate+'T10:00:00').getTime();
    if(at<from||at>to||p.supplyType==='composition') return;
    var T=billTotals(p); inTaxable+=T.taxable; inGst+=T.tax;
  });
  var expGst=0;
  expensesIn(from,to).forEach(function(e){ expGst+=e.tax||0; });
  return { outTaxable:outTaxable, outGst:outGst, exempt:exempt,
    inTaxable:inTaxable, inGst:inGst+expGst, payable:outGst-(inGst+expGst) };
}
function owedBothWays(){
  var owed=0, owing=0;
  PARTIES.forEach(function(p){ var b=balanceOf(p.id); if(b>0) owed+=b; else owing-=b; });
  return {owed:owed, owing:owing};
}

/* =====================================================================
   THE BOOKS
   Day book   \u2014 every rupee that moved on one day, and where the cash
                stood at the start and the end of it.
   Job profit \u2014 what each bike actually earned, once the spares it ate
                and the work sent out for it are taken off.
   Both are the owner's alone.
   ===================================================================== */
function dayBounds(iso){
  var p=String(iso||isoDate()).split('-');
  var a=new Date(+p[0], +p[1]-1, +p[2], 0,0,0,0);
  var b=new Date(+p[0], +p[1]-1, +p[2], 23,59,59,999);
  return {from:a.getTime(), to:b.getTime()};
}
function shiftDay(iso,by){
  var p=String(iso).split('-');
  var d=new Date(+p[0], +p[1]-1, +p[2]+by);
  return isoDate(d.getTime());
}
/* what an account held just before a moment */
function heldBefore(accId,ts){
  var m=accountMoves(accId), t=0;
  for(var i=0;i<m.length;i++){ if(m[i].at<ts) t=m[i].running; else break; }
  return t;
}
/* every movement of money in the window, whatever kind */
function dayEntries(from,to){
  var out=[];
  RECEIPTS.forEach(function(r){
    if(r.at<from||r.at>to) return;
    out.push({at:r.at, dir:'in', amount:r.amount, accId:'', by:r.by,
      what:(r.kind==='advance'?'Advance':'Counter payment'),
      who:(partyById(r.partyId)||{name:''}).name, ref:r.billNo||r.ref||'', mode:r.mode});
  });
  PAYMENTS.forEach(function(v){
    if(v.at<from||v.at>to) return;
    out.push({at:v.at, dir:v.direction==='in'?'in':'out', amount:v.amount, accId:v.accountId, by:v.by,
      what:(v.reversalOf?'Reversal':(v.direction==='in'?'Received':'Paid supplier')),
      who:(partyById(v.partyId)||{name:''}).name, ref:v.ref||'', verified:!!v.verified, id:v.id, kind:'pay'});
  });
  EXPENSES.forEach(function(e){
    if(e.at<from||e.at>to) return;
    var c=expCat(e.categoryId)||{name:'Spend'};
    out.push({at:e.at, dir:'out', amount:e.amount, accId:e.accountId, by:e.by,
      what:c.name, who:(partyById(e.partyId)||{name:''}).name, ref:e.billNo||'',
      verified:!!e.verified, id:e.id, kind:'exp'});
  });
  (ADVANCES||[]).forEach(function(a){
    if(a.at<from||a.at>to) return;
    out.push({at:a.at, dir:'out', amount:a.amount, accId:a.accountId, by:a.by,
      what:'Staff advance', who:coreUser(a.userId).name, ref:''});
  });
  TRANSFERS.forEach(function(tr){
    if(tr.at<from||tr.at>to) return;
    out.push({at:tr.at, dir:'move', amount:tr.amount, accId:tr.toId, by:tr.by,
      what:'Moved to float', who:(accountById(tr.toId)||{name:''}).name,
      ref:(accountById(tr.fromId)||{name:''}).name});
  });
  out.sort(function(a,b){ return a.at-b.at; });
  return out;
}
function dayTotals(from,to){
  var t={in:0, out:0, sales:0, bills:0, purch:0};
  dayEntries(from,to).forEach(function(e){
    if(e.dir==='in') t.in+=e.amount;
    else if(e.dir==='out') t.out+=e.amount;
  });
  salesIn(from,to).forEach(function(s){ t.sales+=s.grand; t.bills++; });
  PURCHASES.forEach(function(p){
    var at=new Date(p.invDate+'T10:00:00').getTime();
    if(at>=from&&at<=to) t.purch+=billTotals(p).grand;
  });
  return t;
}

/* ---------- what a bike actually earned ---------- */
function jobProfits(from,to){
  var byJob={};
  salesIn(from,to).forEach(function(s){
    var g=byJob[s.jobId]=byJob[s.jobId]||{jobId:s.jobId, jobNo:s.jobNo, reg:s.reg, cust:s.custName,
      at:s.at, revenue:0, cost:0, partsRev:0, partsCost:0, labourRev:0, labourCost:0, bills:[]};
    g.bills.push(s.number);
    (s.lines||[]).forEach(function(l){
      var rev=exTax(l.amount, l.gst||0), c=l.cost||0;
      g.revenue+=rev; g.cost+=c;
      if(l.kind==='part'){ g.partsRev+=rev; g.partsCost+=c; }
      else { g.labourRev+=rev; g.labourCost+=c; }
    });
  });
  return Object.keys(byJob).map(function(k){
    var g=byJob[k];
    g.profit=g.revenue-g.cost;
    g.pct=g.revenue?Math.round((g.profit/g.revenue)*1000)/10:null;
    return g;
  }).sort(function(a,b){ return b.profit-a.profit; });
}
function categorySplit(from,to){
  var m={};
  salesIn(from,to).forEach(function(s){
    (s.lines||[]).forEach(function(l){
      var key=(l.kind==='labour')?'Labour':(l.cat||'Uncategorised');
      m[key]=m[key]||{name:key, rev:0, cost:0, qty:0};
      m[key].rev+=exTax(l.amount,l.gst||0); m[key].cost+=l.cost||0; m[key].qty+=l.qty||0;
    });
  });
  return Object.keys(m).map(function(k){
    var x=m[k]; x.profit=x.rev-x.cost;
    x.pct=x.rev?Math.round((x.profit/x.rev)*1000)/10:null;
    return x;
  }).sort(function(a,b){ return b.rev-a.rev; });
}

      '</span></div></div></div>';
  if(!js.length) return h+'<div class="empty"><b>No bills were raised in this period.</b>'+

function booksCats(){
  var per=S.bookPeriod||'month', R=periodRange(per);
  var cs=categorySplit(R.from,R.to);
  var tot=cs.reduce(function(a,x){ return a+x.rev; },0);
  var h='<div class="chips" style="margin:8px 0">'+PERIODS.map(function(x){
    return '<button class="chip" data-act="bookPeriod" data-k="'+x[0]+'" aria-pressed="'+(per===x[0])+'">'+x[1]+'</button>';
  }).join('')+'</div>';
  if(!cs.length) return h+'<div class="empty"><b>No bills were raised in this period.</b>'+
    'This splits what you sold by category, so it fills up once bills are finalised.</div>';
  h+='<div class="card"><div class="card-h"><h2>Where the money comes from</h2></div><div class="card-b tight">'+
    '<table class="lines"><thead><tr><th>Kind of work</th><th class="num">Billed</th>'+
    '<th class="num">Earned</th></tr></thead><tbody>';
  cs.forEach(function(x){
    var share=tot?Math.round(x.rev*100/tot):0;
    h+='<tr><td><b>'+esc(x.name)+'</b>'+
      '<div style="height:6px;background:var(--rule2);border-radius:3px;margin-top:6px;max-width:200px">'+
      '<div style="height:6px;width:'+share+'%;background:var(--hivis);border-radius:3px"></div></div>'+
      '<div class="small muted">'+share+'% of the billing</div></td>'+
      '<td class="num money">'+money(x.rev)+'</td>'+
      '<td class="num"><b class="money">'+money(x.profit)+'</b><br>'+pctTag(x.pct,25)+'</td></tr>';
  });
  return h+'</tbody></table></div></div>';
}

function exportBooks(){
  var tab=S.view.tab||'day';
  if(tab==='day'){
    var day=S.dayBookDay||isoDate(), R=dayBounds(day);
    var rows=[['Day book', dOnly(R.from)],[],['Time','What','Who','Account','Reference','In','Out','Entered by','Checked']];
    dayEntries(R.from,R.to).forEach(function(e){
      rows.push([tms(new Date(e.at)), e.what, e.who, (accountById(e.accId)||{name:''}).name, e.ref,
        e.dir==='in'?rup(e.amount):'', e.dir==='out'?rup(e.amount):'', coreUser(e.by).name,
        (e.kind?(e.verified?'yes':'no'):'')]);
    });
    var T=dayTotals(R.from,R.to);
    rows.push([]); rows.push(['','','','','Totals',rup(T.in),rup(T.out)]);
    downloadCsv('daybook-'+day+'.csv',rows);
    return;
  }
  var per=S.bookPeriod||'month', R2=periodRange(per);
  if(tab==='jobs'){
    var r2=[['What each bike earned', periodLabel(per)],[],
      ['Job card','Vehicle','Customer','Date','Bills','Billed ex-tax','Spares cost','Labour cost','Total cost','Earned','Margin %']];
    jobProfits(R2.from,R2.to).forEach(function(g){
      r2.push([g.jobNo,regShow(g.reg),g.cust,dOnly(g.at),g.bills.join(' '),rup(g.revenue),
        rup(g.partsCost),rup(g.labourCost),rup(g.cost),rup(g.profit),g.pct]);
    });
    downloadCsv('job-profit-'+per+'.csv',r2);
    return;
  }
  var r3=[['By category', periodLabel(per)],[],['Kind of work','Quantity','Billed ex-tax','Cost','Earned','Margin %']];
  categorySplit(R2.from,R2.to).forEach(function(x){
    r3.push([x.name,x.qty,rup(x.rev),rup(x.cost),rup(x.profit),x.pct]);
  });
  downloadCsv('category-split-'+per+'.csv',r3);
}

/* A part with no printed number gets one made from its name — but never
   one that is already taken, or two different parts silently become one. */
function autoPartNo(name){
  var base=pkey(name).slice(0,18)||'PART';
  if(!partByNo(base)) return base;
  for(var i=2;i<99;i++){ var c=base.slice(0,16)+'-'+i; if(!partByNo(c)) return c; }
  return base+'-'+Date.now().toString(36).slice(-4);
}
/* Sale price defaults to MRP where the bill printed one. Where it did not,
   the part goes in with no selling price and the owner sets it. */
async function loadRealData(){
  if(PURCHASES.length){ toast('The store already has purchases in it. Clear them first.','bad'); return; }
  REAL_SUPPLIERS.forEach(function(s){
    if(!supplierById(s.id)) SUPPLIERS.push(Object.assign({at:Date.now(), by:S.user.id}, s));
  });
  var n=0, lines=0;
  for(var i=0;i<REAL_BILLS.length;i++){
    var b=REAL_BILLS[i];
    var p={ id:uid('pu'), supplierId:b.sup, invNo:b.no, invDate:b.date,
      supplyType:b.type, taxMode:(b.type==='composition')?'none':taxModeOf(b.sup),
      irn:b.irn||'', ackNo:b.ack||'', charges:toPaise(b.charges||0), chargesTaxed:!!b.chargesTaxed,
      roundOff:toPaise(b.round||0), needsCheck:!!b.needsCheck,
      at:new Date(b.date+'T10:00:00').getTime(), by:'u_for', saved:true,
      lines:b.lines.map(function(l){
        return { no:l.no||autoPartNo(l.name), name:l.name, category:l.cat,
          hsn:l.hsn||'', gst:l.gst||0, incl:!!l.incl, disc:l.disc||0, batchNo:l.batch||'',
          qty:l.qty, buyUnit:l.buyUnit||'piece', unit:l.unit||l.buyUnit||'piece', conv:l.conv||1,
          rate:toPaise(l.rate), mrp:toPaise(l.mrp||0), sale:toPaise(l.mrp||0),
          serials:l.serials||[], partId:'' };
      }) };
    lines+=p.lines.length;
    await receivePurchase(p);
    n++;
  }
  toast(n+' bills loaded \u00b7 '+lines+' lines \u00b7 '+PARTS.length+' parts in stock','good');
  rerender();
}

/* =====================================================================
   PARTIES AND THEIR LEDGERS
   One record per person or firm. Somebody can be a customer and a
   supplier at the same time.

   Sign convention, the same one your CA uses:
     Dr (+)  they owe you        \u2014 a customer's bill
     Cr (\u2212)  you owe them        \u2014 a supplier's bill
   Balance = Dr \u2212 Cr. Positive means money is coming to you.

   The ledger is never stored. It is worked out from the documents every
   time it is shown, so it can never drift out of step with them.
   ===================================================================== */
var PARTIES=[], PAYMENTS=[], ADJUST=[], SALES=[], ACCOUNTS=[], RECEIPTS=[];

function seedAccounts(){
  return [
    {id:'ac_cash', name:'Cash in hand', kind:'cash',  active:true},
    {id:'ac_bank', name:'Current account', kind:'bank', active:true},
    {id:'ac_upi',  name:'UPI', kind:'upi',   settlesTo:'ac_bank', active:true},
    {id:'ac_card', name:'Card machine', kind:'card', settlesTo:'ac_bank', active:true}
  ];
}
function accountById(id){ return ACCOUNTS.filter(function(a){return a.id===id;})[0]||null; }

/* ---------- the party record ---------- */
function blankParty(){
  return { id:uid('py'), name:'', types:[], gstin:'', pan:'', state:'', stateCode:'',
    phone:'', altPhone:'', email:'', address:'', pin:'',
    bank:{name:'',acNo:'',ifsc:'',branch:''},
    creditLimit:0, creditDays:0, opening:{amount:0, side:'cr', asOn:isoDate()},
    note:'', active:true, at:Date.now(), by:S.user?S.user.id:'' };
}
function partyById(id){ for(var i=0;i<PARTIES.length;i++) if(PARTIES[i].id===id) return PARTIES[i]; return null; }
function phoneKey(p){ return String(p||'').replace(/[^0-9]/g,'').slice(-10); }
function partyByPhone(ph){
  var k=phoneKey(ph); if(k.length<10) return null;
  return PARTIES.filter(function(p){ return phoneKey(p.phone)===k||phoneKey(p.altPhone)===k; })[0]||null;
}
function partyByGstin(g){
  var k=pkey(g); if(!k) return null;
  return PARTIES.filter(function(p){ return pkey(p.gstin)===k; })[0]||null;
}
function isCustomer(p){ return (p.types||[]).indexOf('customer')>=0; }
function isSupplier(p){ return (p.types||[]).indexOf('supplier')>=0; }
function addType(p,t){ if((p.types||[]).indexOf(t)<0) p.types=(p.types||[]).concat([t]); }

/* Find the customer behind a job card, or make one. Matched on the phone
   number, because that is the one thing a workshop always gets right. */
function findOrMakeCustomer(name,phone,extra){
  var p=partyByPhone(phone);
  if(!p&&extra&&extra.gstin) p=partyByGstin(extra.gstin);
  if(p){
    addType(p,'customer');
    if(!p.name&&name) p.name=name;
    if(extra){
      if(extra.gstin&&!p.gstin){ var g=gstinCheck(extra.gstin);
        if(g.ok){ p.gstin=g.raw; p.state=g.state; p.stateCode=g.stateCode; p.pan=g.pan; } }
      if(extra.address&&!p.address) p.address=extra.address;
    }
    return p;
  }
  p=blankParty();
  p.name=name||'Walk-in'; p.phone=phone||''; p.types=['customer'];
  if(extra){
    if(extra.gstin){ var g2=gstinCheck(extra.gstin);
      if(g2.ok){ p.gstin=g2.raw; p.state=g2.state; p.stateCode=g2.stateCode; p.pan=g2.pan; } }
    p.address=extra.address||'';
  }
  if(!p.state){ p.state=S.core.workshop.state; p.stateCode=S.core.workshop.stateCode; }
  PARTIES.push(p);
  return p;
}

/* ---------- periods ---------- */
function fyStart(d){ var y=d.getFullYear(); return new Date((d.getMonth()>=3?y:y-1),3,1,0,0,0,0); }
function startOfDay(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,0,0,0); }
function endOfDay(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate(),23,59,59,999); }
var PERIODS=[['week','This week'],['month','This month'],['quarter','This quarter'],
  ['prevquarter','Last quarter'],['fy','This FY'],['prevfy','Last FY'],['d365','Last 365 days'],['all','Everything']];
function periodRange(key){
  var now=new Date(), a, b=endOfDay(now);
  if(key==='week'){ var d=new Date(now); var dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); a=startOfDay(d); }
  else if(key==='month'){ a=new Date(now.getFullYear(),now.getMonth(),1); }
  else if(key==='quarter'){ a=new Date(now.getFullYear(),Math.floor(now.getMonth()/3)*3,1); }
  else if(key==='prevquarter'){
    var qs=new Date(now.getFullYear(),Math.floor(now.getMonth()/3)*3,1);
    a=new Date(qs.getFullYear(),qs.getMonth()-3,1); b=new Date(qs.getTime()-1);
  }
  else if(key==='fy'){ a=fyStart(now); }
  else if(key==='prevfy'){ var f=fyStart(now); a=new Date(f.getFullYear()-1,3,1); b=new Date(f.getTime()-1); }
  else if(key==='d365'){ a=startOfDay(new Date(now.getTime()-364*86400000)); }
  else { a=new Date(2000,0,1); }
  var lab=(PERIODS.filter(function(x){ return x[0]===key; })[0]||['','Everything'])[1];
  return {from:a.getTime(), to:b.getTime(), label:lab};
}
function periodLabel(k){ var p=PERIODS.filter(function(x){return x[0]===k;})[0]; return p?p[1]:'Everything'; }

/* ---------- the sales register ----------
   A short record of every finalised bill, kept alongside the job card so
   the ledger and the registers do not have to open every job to add up. */
function syncSales(job){
  SALES=SALES.filter(function(s){ return s.jobId!==job.id; });
  /* Money handed over at the counter lives on the job card. Pull it out so
     the ledger sees it too, otherwise the balance and the outstanding list
     tell the owner two different things. */
  RECEIPTS=RECEIPTS.filter(function(r){ return r.jobId!==job.id; });
  if(job.advance&&job.advance.paise){
    RECEIPTS.push({ id:'rc_adv_'+job.id, jobId:job.id, partyId:job.partyId||'', kind:'advance',
      at:job.advance.at||job.createdAt, amount:job.advance.paise, mode:job.advance.mode||'cash',
      ref:job.no, by:job.advance.by||job.createdBy });
  }
  (job.bills||[]).forEach(function(b){
    if(b.status==='cancelled') return;
    (b.payments||[]).forEach(function(pm,i){
      RECEIPTS.push({ id:'rc_'+b.id+'_'+i, jobId:job.id, partyId:job.partyId||'', kind:'billpay',
        billId:b.id, billNo:b.number, at:pm.at, amount:pm.paise, mode:pm.mode||'cash',
        ref:pm.ref||'', by:pm.by });
    });
  });
  (job.bills||[]).forEach(function(b){
    if(b.status!=='final'&&b.status!=='cancelled') return;
    var c=billCalc(job,b);
    SALES.push({ id:b.id, jobId:job.id, jobNo:job.no, number:b.number, type:b.type,
      status:b.status, partyId:job.partyId||'', custName:job.cust.name, reg:job.reg,
      at:b.finalAt||job.createdAt, taxable:c.sub, tax:c.tax, grand:c.grand,
      advance:c.advance, paid:c.paid, balance:c.balance,
      /* everything a GST return needs, captured at the same moment as the
         invoice itself so the return can never disagree with the paper */
      gstin:(b.snapshot&&b.snapshot.buyer?b.snapshot.buyer.gstin:job.cust.gstin)||'',
      inter:!!b.inter, roundOff:c.roundOff,
      pos:(b.snapshot&&b.snapshot.placeOfSupply)||'',
      byRate:c.byRate||{}, hsn:(b.snapshot&&b.snapshot.hsnSummary)||[],
      make:job.make||'', model:job.model||'', jobType:job.jobType||'',
      lines:(b.lineIds||[]).map(function(id){ var l=findLine(job,id); return l?{
        desc:l.desc, kind:l.kind, cat:(partById(l.partId)||{}).category||'', qty:qtyNum(l.qty),
        hsn:l.hsn||'', amount:lineAmount(l), cost:Math.round(qtyNum(l.qty)*(l.cost||0)), gst:l.gst||0 }:null; }).filter(Boolean) });
  });
}

/* ---------- documents that touch a party ---------- */
function partyDocs(partyId){
  var out=[], py=partyById(partyId);
  if(py&&py.opening&&py.opening.amount){
    out.push({ kind:'opening', id:'op_'+py.id, no:'Opening', label:'Opening balance',
      at:new Date(py.opening.asOn+'T00:00:00').getTime(), amount:py.opening.amount,
      dr:py.opening.side==='dr'?py.opening.amount:0,
      cr:py.opening.side==='cr'?py.opening.amount:0, taxable:0, tax:0 });
  }
  PURCHASES.forEach(function(p){
    if(p.supplierId!==partyId) return;
    var T=billTotals(p);
    out.push({ kind:'purchase', id:p.id, no:p.invNo, at:new Date(p.invDate+'T10:00:00').getTime(),
      amount:T.grand, cr:T.grand, dr:0, label:'Purchase '+p.invNo, taxable:T.taxable, tax:T.tax });
  });
  SALES.forEach(function(s){
    if(s.partyId!==partyId) return;
    if(s.status==='cancelled'){
      /* kept in the ledger at nil so the number is never a silent gap */
      out.push({ kind:'cancelled', id:s.id, no:s.number, at:s.at, amount:0, dr:0, cr:0,
        label:'CANCELLED \u2014 '+(s.type==='gst'?'tax invoice ':'bill ')+s.number,
        wasFor:s.grand, taxable:0, tax:0 });
      return;
    }
    out.push({ kind:'sale', id:s.id, no:s.number, at:s.at, amount:s.grand, dr:s.grand, cr:0,
      label:(s.type==='gst'?'Tax invoice ':'Bill ')+s.number, taxable:s.taxable, tax:s.tax });
  });
  return out;
}
function partyEntries(partyId){
  var p=partyById(partyId); if(!p) return [];
  var out=partyDocs(partyId).filter(function(d){ return d.kind!=='cancelled'||true; });
  RECEIPTS.forEach(function(r){
    if(r.partyId!==partyId) return;
    out.push({ kind:'receipt', id:r.id, no:r.billNo||r.ref||'', at:r.at, amount:r.amount,
      dr:0, cr:r.amount,
      label:(r.kind==='advance'?'Advance taken \u00B7 ':'Received at the counter \u00B7 ')+String(r.mode||'').toUpperCase() });
  });
  PAYMENTS.forEach(function(v){
    if(v.partyId!==partyId) return;
    out.push({ kind:v.direction==='out'?'payment':'receipt', id:v.id, no:v.ref||'', at:v.at,
      amount:v.amount, dr:v.direction==='out'?v.amount:0, cr:v.direction==='in'?v.amount:0,
      label:(v.reversalOf?'REVERSAL \u00B7 ':'')+(v.direction==='out'?'Paid ':'Received ')+
        (accountById(v.accountId)||{name:''}).name,
      canReverse:!v.reversalOf&&!v.reversedBy, reversed:!!v.reversedBy,
      allocations:v.allocations||[] });
  });
  ADJUST.forEach(function(a){
    if(a.partyId!==partyId) return;
    out.push({ kind:a.kind, id:a.id, no:a.ref||'', at:a.at, amount:a.amount,
      dr:a.side==='dr'?a.amount:0, cr:a.side==='cr'?a.amount:0, label:a.label||a.kind });
  });
  out.sort(function(a,b){ return a.at-b.at||(a.kind==='opening'?-1:1); });
  var run=0;
  out.forEach(function(e){ run+=e.dr-e.cr; e.running=run; });
  return out;
}
/* A wrong payment is undone with an opposite entry, so both stay on the
   record. Nothing is ever quietly removed from a ledger. */
async function reversePayment(id){
  var v=PAYMENTS.filter(function(x){ return x.id===id; })[0];
  if(!v){ toast('Not found','bad'); return; }
  if(v.reversalOf||v.reversedBy){ toast('That one has already been reversed','bad'); return; }
  var r={ id:uid('pv'), partyId:v.partyId, direction:(v.direction==='out'?'in':'out'),
    amount:v.amount, accountId:v.accountId, ref:'Reversal of '+(v.ref||dOnly(v.at)),
    at:Date.now(), allocations:[], reversalOf:v.id, by:S.user.id, byName:S.user.name };
  v.reversedBy=r.id;
  PAYMENTS.push(r);
  if(!await savePartyData()){ PAYMENTS.pop(); delete v.reversedBy; return; }
  closeModal(); rerender(); toast('Reversed '+money(v.amount),'good');
}
/* partyEntries walks every purchase, sale and receipt. Doing that once per
   party per render is fine at fifty parties and hopeless at five thousand,
   so balances are worked out once and kept until something changes. */
var BALCACHE=null;
function clearBalCache(){ BALCACHE=null; }
function buildBalCache(){
  var m={};
  PARTIES.forEach(function(p){ m[p.id]=0; });
  function add(id,v){ if(id!==undefined&&id!==null&&id!=='') m[id]=(m[id]||0)+v; }
  PARTIES.forEach(function(p){
    if(p.opening&&p.opening.amount) add(p.id, p.opening.side==='dr'?p.opening.amount:-p.opening.amount);
  });
  PURCHASES.forEach(function(x){ add(x.supplierId, -billTotals(x).grand); });
  SALES.forEach(function(x){ if(x.status!=='cancelled') add(x.partyId, x.grand); });
  RECEIPTS.forEach(function(r){ add(r.partyId, -r.amount); });
  PAYMENTS.forEach(function(v){ add(v.partyId, v.direction==='out'?v.amount:-v.amount); });
  ADJUST.forEach(function(a){ add(a.partyId, a.side==='dr'?a.amount:-a.amount); });
  BALCACHE=m;
}
function balanceOf(partyId){
  if(!BALCACHE) buildBalCache();
  return BALCACHE[partyId]||0;
}

/* ---------- what is still unpaid, invoice by invoice ---------- */
function allocatedTo(docId){
  var t=0;
  PAYMENTS.forEach(function(v){
    if(v.reversedBy||v.reversalOf) return;
    (v.allocations||[]).forEach(function(a){ if(a.docId===docId) t+=a.amount; });
  });
  return t;
}
function openItems(partyId){
  return partyDocs(partyId).filter(function(d){ return d.kind!=='cancelled'; }).map(function(d){
    var paid=allocatedTo(d.id);
    if(d.kind==='sale'){ var s=SALES.filter(function(x){return x.id===d.id;})[0];
      if(s) paid+=(s.advance||0)+(s.paid||0); }
    return {doc:d, paid:paid, due:d.amount-paid};
  }).filter(function(x){ return x.due>0; })
    .sort(function(a,b){ return a.doc.at-b.doc.at; });
}
var AGE_BUCKETS=[[0,30,'0\u201330 days'],[31,60,'31\u201360'],[61,90,'61\u201390'],[91,99999,'Over 90']];
function ageing(partyId){
  var now=Date.now(), out=AGE_BUCKETS.map(function(b){ return {label:b[2], amount:0}; });
  openItems(partyId).forEach(function(x){
    var days=Math.floor((now-x.doc.at)/86400000);
    for(var i=0;i<AGE_BUCKETS.length;i++){
      if(days>=AGE_BUCKETS[i][0]&&days<=AGE_BUCKETS[i][1]){ out[i].amount+=x.due; break; }
    }
  });
  return out;
}
function creditUsed(partyId){
  var b=balanceOf(partyId); return b>0?b:0;
}
function overLimit(p){
  return p.creditLimit>0 && creditUsed(p.id)>p.creditLimit;
}

/* ---------- money in, money out ---------- */
async function savePartyData(){
  clearBalCache();
  var ok=true;
  ok=await DB.set('mz:parties',PARTIES)&&ok;
  ok=await DB.set('mz:payments',PAYMENTS)&&ok;
  ok=await DB.set('mz:adjust',ADJUST)&&ok;
  ok=await DB.set('mz:sales',SALES)&&ok;
  ok=await DB.set('mz:receipts',RECEIPTS)&&ok;
  ok=await DB.set('mz:accounts',ACCOUNTS)&&ok;
  if(!ok) toast('Could not save. Try again.','bad');
  return ok;
}
async function loadPartyData(){
  clearBalCache();
  PARTIES=await DB.get('mz:parties')||[];
  PAYMENTS=await DB.get('mz:payments')||[];
  ADJUST=await DB.get('mz:adjust')||[];
  SALES=await DB.get('mz:sales')||[];
  RECEIPTS=await DB.get('mz:receipts')||[];
  ACCOUNTS=await DB.get('mz:accounts')||seedAccounts();
}
function accountBalance(accId){
  var t=0;
  PAYMENTS.forEach(function(v){
    if(v.accountId!==accId) return;
    t+=(v.direction==='in')?v.amount:-v.amount;
  });
  return t;
}

/* Suppliers were kept in their own list before parties existed.
   Bring them across once, keeping their ids so purchases still point at them. */
function mergeSuppliers(){
  var moved=0;
  (SUPPLIERS||[]).forEach(function(sp){
    if(partyById(sp.id)) return;
    var p=blankParty();
    p.id=sp.id; p.name=sp.name; p.types=['supplier'];
    p.gstin=sp.gstin||''; p.pan=sp.pan||''; p.state=sp.state||''; p.stateCode=sp.stateCode||'';
    p.phone=sp.phone||''; p.address=sp.address||''; p.note=sp.note||'';
    p.at=sp.at||Date.now(); p.by=sp.by||'';
    PARTIES.push(p); moved++;
  });
  return moved;
}

var PFILTERS=[['all','Everyone'],['customer','Customers'],['supplier','Suppliers'],
  ['owing','They owe me'],['owed','I owe them'],['over','Over limit']];

function partyMatches(p,k){
  if(k==='customer') return isCustomer(p);
  if(k==='supplier') return isSupplier(p);
  if(k==='owing') return balanceOf(p.id)>0;
  if(k==='owed') return balanceOf(p.id)<0;
  if(k==='over') return overLimit(p);
  return true;
}

      '<div class="card" style="margin:0"><div class="card-b" style="padding:12px 14px">'+
      '<div class="eyebrow">I owe suppliers</div>'+

  h+='<div class="searchbar" style="position:static;margin:0;padding:8px 0;border:0">'+

  if(!q){
    h+='<div class="chips" style="margin:4px 0 8px">'+PFILTERS.map(function(x){

/* ---------------- one party ---------------- */
function viewParty(){
  var p=partyById(S.view.id); if(!p) return '<div class="empty"><b>That customer or supplier is not here.</b>'+
    'They may have been removed, or opened on another phone.'+
    '<div style="margin-top:14px"><button class="btn primary" data-act="goParties">Back to everyone</button></div></div>';
  var per=S.pperiod||'fy', R=periodRange(per);
  var all=partyEntries(p.id);
  var inRange=all.filter(function(e){ return e.at>=R.from&&e.at<=R.to; });
  var opening=0;
  all.forEach(function(e){ if(e.at<R.from) opening+=e.dr-e.cr; });
  var dr=0, cr=0;
  inRange.forEach(function(e){ dr+=e.dr; cr+=e.cr; });
  var bal=balanceOf(p.id), ag=ageing(p.id), items=openItems(p.id);

  var h='<div style="margin:16px 0 10px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
    '<h1 style="font-size:26px">'+esc(p.name)+'</h1>'+
    (isCustomer(p)?'<span class="tag t-blue">Customer</span>':'')+
    (isSupplier(p)?'<span class="tag t-amber">Supplier</span>':'')+
    '<button class="btn sm" style="margin-left:auto" data-act="editParty" data-id="'+p.id+'">Edit</button></div>';
  if(seeMoney()) h+='<div class="money" style="font-size:30px;margin-top:6px;color:'+
    (bal>0?'var(--green)':(bal<0?'var(--red)':'var(--ink)'))+'">'+money(Math.abs(bal))+

  h+='</div>';

async function savePartyRec(id){
  var g=function(n){ var e=document.querySelector('.sheet [name="'+n+'"]'); return e?e.value.trim():''; };
  if(!g('yname')){ toast('The party needs a name','bad'); return; }
  var types=[]; document.querySelectorAll('#ptypes [aria-pressed="true"]').forEach(function(b){ types.push(b.dataset.v); });
  if(!types.length){ toast('Tick customer, supplier, or both','bad'); return; }
  var gi=gstinCheck(g('ygstin'));
  if(g('ygstin')&&!gi.ok){ toast(gi.why,'bad'); return; }
  if(gi.ok){ var other=partyByGstin(gi.raw); if(other&&other.id!==id){ toast('That GST number belongs to '+other.name,'bad'); return; } }
  var p=id?partyById(id):blankParty();
  p.name=g('yname'); p.types=types;
  p.gstin=gi.ok?gi.raw:''; p.state=gi.state||p.state; p.stateCode=gi.stateCode||p.stateCode; p.pan=gi.pan||p.pan;
  p.phone=g('yphone'); p.altPhone=g('yalt'); p.email=g('yemail'); p.address=g('yaddr');
  p.creditLimit=toPaise(g('ylimit')); p.creditDays=parseInt(g('ydays')||0,10)||0;
  p.bank={name:g('ybname'), acNo:g('yacno'), ifsc:g('yifsc').toUpperCase(), branch:''};
  if(!id){
    var op=toPaise(g('yopen'));
    if(op>0) p.opening={amount:op, side:g('yside')||'cr', asOn:isoDate()};
    PARTIES.push(p);
  }
  if(!await savePartyData()) return;
  closeModal(); rerender(); toast('Saved','good');
}

async function payPartyDo(partyId,dir){
  var g=function(n){ var e=document.querySelector('.sheet [name="'+n+'"]'); return e?e.value.trim():''; };
  var amt=toPaise(g('vamt'));
  if(amt<=0){ toast('Enter the amount','bad'); return; }
  var allocs=[], t=0;
  document.querySelectorAll('[data-alloc]').forEach(function(i){
    var v=toPaise(i.value); if(v<=0) return;
    if(v>parseInt(i.dataset.due,10)){ v=parseInt(i.dataset.due,10); }
    allocs.push({docId:i.dataset.alloc, docNo:i.dataset.no, amount:v}); t+=v;
  });
  if(t>amt){ toast('You have allocated '+money(t)+' but the amount is '+money(amt),'bad'); return; }
  var when=g('vdate')?new Date(g('vdate')+'T12:00:00').getTime():Date.now();
  PAYMENTS.push({ id:uid('pv'), partyId:partyId, direction:dir, amount:amt,
    accountId:g('vacc')||ACCOUNTS[0].id, ref:g('vref'), at:when,
    allocations:allocs, by:S.user.id, byName:S.user.name, note:'' });
  if(!await savePartyData()) return;
  closeModal(); rerender();
  toast(money(amt)+(dir==='out'?' paid':' received'),'good');
}

/* paise to a plain rupee figure Excel will treat as a number */
function rup(p){ return ((p||0)/100).toFixed(2); }
function csvCell(v){
  var s=String(v===undefined||v===null?'':v);
  return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function downloadCsv(name,rows){
  var csv=rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
  offerFile(name,'\ufeff'+csv,'text/csv');
}
/* =====================================================================
   GST RETURN DATA  (G5)
   This produces the working papers a CA needs to file GSTR-1: the B2B
   table, the consolidated B2C table, the HSN summary and a document
   series statement. It does NOT file anything and does not pretend to —
   filing happens on the GST portal, and a tool that implies otherwise is
   dangerous. Figures come from the frozen invoice snapshots, so what is
   filed matches what the customer was handed.
   ===================================================================== */
function salesInPeriod(per){
  var R=periodRange(per||'month');
  return SALES.filter(function(s){
    return s.status==='final'&&s.type==='gst'&&s.at>=R.from&&s.at<=R.to;
  }).sort(function(a,b){ return a.at-b.at; });
}
function r2(p){ return (p/100).toFixed(2); }

function gstr1Rows(per){
  var rows=[], list=salesInPeriod(per), W=S.core.workshop;
  var b2b=list.filter(function(s){ return /^[0-9]{2}[A-Z0-9]{13}$/.test((s.gstin||'').toUpperCase()); });
  var b2c=list.filter(function(s){ return b2b.indexOf(s)<0; });

  rows.push(['GSTR-1 WORKING PAPERS \u2014 NOT A RETURN']);
  rows.push(['Supplier',W.name,'GSTIN',W.gstin,'Period',periodLabel(per)]);
  rows.push(['Prepared',dts(Date.now()),'By',S.user.name]);
  rows.push([]);

  rows.push(['TABLE 4A \u2014 B2B (registered customers)']);
  rows.push(['GSTIN of recipient','Receiver name','Invoice no','Invoice date','Invoice value',
             'Place of supply','Reverse charge','Rate','Taxable value','IGST','CGST','SGST','Cess']);
  b2b.forEach(function(s){
    Object.keys(s.byRate||{}).sort(function(a,b){return a-b;}).forEach(function(rt){
      var g=s.byRate[rt]; if(!g||!g.base) return;
      var half=Math.floor(g.tax/2);
      rows.push([s.gstin.toUpperCase(), s.custName, s.number, isoDate(s.at), r2(s.grand),
        s.pos||W.stateCode+'-'+W.state, 'N', rt, r2(g.base),
        s.inter?r2(g.tax):'0.00', s.inter?'0.00':r2(half), s.inter?'0.00':r2(g.tax-half), '0.00']);
    });
  });
  if(!b2b.length) rows.push(['(none in this period)']);
  rows.push([]);

  rows.push(['TABLE 7 \u2014 B2C (small, consolidated by rate)']);
  rows.push(['Type','Place of supply','Rate','Taxable value','IGST','CGST','SGST','Cess','Invoices']);
  var agg={};
  b2c.forEach(function(s){
    Object.keys(s.byRate||{}).forEach(function(rt){
      var g=s.byRate[rt]; if(!g||!g.base) return;
      var k=(s.inter?'INTER':'INTRA')+'|'+rt;
      agg[k]=agg[k]||{inter:s.inter,rate:rt,base:0,tax:0,n:0};
      agg[k].base+=g.base; agg[k].tax+=g.tax; agg[k].n++;
    });
  });
  Object.keys(agg).sort().forEach(function(k){
    var a=agg[k], half=Math.floor(a.tax/2);
    rows.push([a.inter?'OE (inter-state)':'OE (intra-state)', W.stateCode+'-'+W.state, a.rate, r2(a.base),
      a.inter?r2(a.tax):'0.00', a.inter?'0.00':r2(half), a.inter?'0.00':r2(a.tax-half), '0.00', a.n]);
  });
  if(!Object.keys(agg).length) rows.push(['(none in this period)']);
  rows.push([]);

  rows.push(['TABLE 12 \u2014 HSN SUMMARY']);
  rows.push(['HSN/SAC','Description','UQC','Total quantity','Total value','Rate','Taxable value','IGST','CGST','SGST']);
  var hs={};
  list.forEach(function(s){
    (s.lines||[]).forEach(function(l){
      var code=l.hsn||(l.kind==='labour'?'998714':'');
      if(!code) code='UNCLASSIFIED';
      var k=code+'|'+l.gst;
      hs[k]=hs[k]||{hsn:code, rate:l.gst, qty:0, value:0, base:0, tax:0,
                    labour:l.kind==='labour', inter:s.inter};
      var base=Math.round(l.amount*100/(100+(l.gst||0)));
      hs[k].qty+=l.qty; hs[k].value+=l.amount; hs[k].base+=base; hs[k].tax+=l.amount-base;
    });
  });
  Object.keys(hs).sort().forEach(function(k){
    var x=hs[k], half=Math.floor(x.tax/2);
    rows.push([x.hsn, x.labour?'Repair and maintenance services':'Motorcycle parts and accessories',
      x.labour?'NA':'NOS', x.qty, r2(x.value), x.rate, r2(x.base),
      x.inter?r2(x.tax):'0.00', x.inter?'0.00':r2(half), x.inter?'0.00':r2(x.tax-half)]);
  });
  if(!Object.keys(hs).length) rows.push(['(none in this period)']);
  rows.push([]);

  rows.push(['TABLE 13 \u2014 DOCUMENTS ISSUED']);
  rows.push(['Nature of document','From','To','Total issued','Cancelled','Net']);
  ['gst','nongst'].forEach(function(t){
    var all=SALES.filter(function(s){ var R=periodRange(per||'month');
      return s.type===t&&s.at>=R.from&&s.at<=R.to; });
    if(!all.length) return;
    var nums=all.map(function(s){ return s.number; }).filter(Boolean).sort();
    var canc=all.filter(function(s){ return s.status==='cancelled'; }).length;
    rows.push([t==='gst'?'Tax invoice':'Bill of supply / cash memo',
      nums[0]||'', nums[nums.length-1]||'', all.length, canc, all.length-canc]);
  });
  rows.push([]);
  rows.push(['CHECKS']);
  var noGstin=list.filter(function(s){ return s.gstin&&!/^[0-9]{2}[A-Z0-9]{13}$/.test(s.gstin.toUpperCase()); });
  rows.push(['Invoices with a GSTIN that fails the format check',noGstin.length]);
  noGstin.forEach(function(s){ rows.push(['',s.number,s.custName,s.gstin]); });
  var mismatch=list.filter(function(s){
    var cs=(s.gstin||'').slice(0,2);
    return cs&&(cs!==String(W.stateCode))!==!!s.inter;
  });
  rows.push(['Invoices where the state code and the CGST/IGST choice disagree',mismatch.length]);

/* =====================================================================
   TALLY  (G6)
   Tally reads its own XML dialect. Sales vouchers with ledger entries for
   the party, the sales account and each tax head. Import through
   Gateway of Tally > Import Data > Vouchers. The ledger names below must
   already exist in the company, which is why they are listed on screen
   before the download.
   ===================================================================== */
function tallyLedgers(){
  return {party:'Sundry Debtors', sales:'Sales - Workshop', salesNon:'Sales - Unregistered',
    cgst:'Output CGST', sgst:'Output SGST', igst:'Output IGST', round:'Round Off'};
}
function xmlEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function tallyDate(ts){ var d=new Date(ts);
  return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }
function tallyXml(per){
  var W=S.core.workshop, L=tallyLedgers(), R=periodRange(per||'month');
  var list=SALES.filter(function(s){ return s.status==='final'&&s.at>=R.from&&s.at<=R.to; })
                .sort(function(a,b){ return a.at-b.at; });
  var x='<?xml version="1.0" encoding="UTF-8"?>\n<ENVELOPE>\n'+
    '<HEADER><TALLYREQUEST>Import Data</TALLYREQUEST></HEADER>\n'+
    '<BODY><IMPORTDATA><REQUESTDESC><REPORTNAME>Vouchers</REPORTNAME>'+
    '<STATICVARIABLES><SVCURRENTCOMPANY>'+xmlEsc(W.name)+'</SVCURRENTCOMPANY></STATICVARIABLES>'+
    '</REQUESTDESC><REQUESTDATA>\n';
  list.forEach(function(s){
    var gst=(s.type==='gst'), tot=s.grand;
    /* In Tally a sales voucher credits the income and tax ledgers and
       debits the party. Debits are positive, credits negative. */
    var ent='';
    ent+='<ALLLEDGERENTRIES.LIST><LEDGERNAME>'+xmlEsc(s.custName||L.party)+'</LEDGERNAME>'+
      '<ISDEEMEDPOSITIVE>Yes</ISDEEMEDPOSITIVE><AMOUNT>-'+r2(tot)+'</AMOUNT></ALLLEDGERENTRIES.LIST>';
    var base=0, cg=0, sg=0, ig=0;
    Object.keys(s.byRate||{}).forEach(function(rt){
      var g=s.byRate[rt]; base+=g.base;
      if(s.inter) ig+=g.tax; else { var h=Math.floor(g.tax/2); cg+=h; sg+=g.tax-h; }
    });
    if(!gst) base=s.taxable;
    ent+='<ALLLEDGERENTRIES.LIST><LEDGERNAME>'+xmlEsc(gst?L.sales:L.salesNon)+'</LEDGERNAME>'+
      '<ISDEEMEDPOSITIVE>No</ISDEEMEDPOSITIVE><AMOUNT>'+r2(base)+'</AMOUNT></ALLLEDGERENTRIES.LIST>';
    [[L.cgst,cg],[L.sgst,sg],[L.igst,ig]].forEach(function(p){
      if(!p[1]) return;
      ent+='<ALLLEDGERENTRIES.LIST><LEDGERNAME>'+xmlEsc(p[0])+'</LEDGERNAME>'+
        '<ISDEEMEDPOSITIVE>No</ISDEEMEDPOSITIVE><AMOUNT>'+r2(p[1])+'</AMOUNT></ALLLEDGERENTRIES.LIST>';
    });
    if(s.roundOff) ent+='<ALLLEDGERENTRIES.LIST><LEDGERNAME>'+xmlEsc(L.round)+'</LEDGERNAME>'+
      '<ISDEEMEDPOSITIVE>'+(s.roundOff<0?'Yes':'No')+'</ISDEEMEDPOSITIVE><AMOUNT>'+r2(s.roundOff)+'</AMOUNT></ALLLEDGERENTRIES.LIST>';
    x+='<TALLYMESSAGE xmlns:UDF="TallyUDF">\n<VOUCHER VCHTYPE="Sales" ACTION="Create" OBJVIEW="Invoice Voucher View">\n'+
      '<DATE>'+tallyDate(s.at)+'</DATE>'+
      '<VOUCHERTYPENAME>Sales</VOUCHERTYPENAME>'+
      '<VOUCHERNUMBER>'+xmlEsc(s.number)+'</VOUCHERNUMBER>'+
      '<PARTYLEDGERNAME>'+xmlEsc(s.custName||L.party)+'</PARTYLEDGERNAME>'+
      '<PARTYNAME>'+xmlEsc(s.custName||'')+'</PARTYNAME>'+
      (s.gstin?'<PARTYGSTIN>'+xmlEsc(s.gstin)+'</PARTYGSTIN>':'')+
      '<PLACEOFSUPPLY>'+xmlEsc(s.pos||W.state)+'</PLACEOFSUPPLY>'+
      '<REFERENCE>'+xmlEsc(s.jobNo+' \u00B7 '+regShow(s.reg))+'</REFERENCE>'+
      '<PERSISTEDVIEW>Invoice Voucher View</PERSISTEDVIEW>'+
      ent+
      '</VOUCHER>\n</TALLYMESSAGE>\n';
  });
  x+='</REQUESTDATA></IMPORTDATA></BODY>\n</ENVELOPE>\n';
  return {xml:x, count:list.length};
}
function exportTally(per){
  var r=tallyXml(per);
  if(!r.count){ toast('No finalised bills in that period','bad'); return; }
  if(MODE==='live'){
    /* the hosted page may only save a short list of file types; xml is not one */
    offerFile('tally-sales-'+periodLabel(per).replace(/[^\w]+/g,'-')+'.xml.txt',r.xml,'text/plain');
    toast('Saved as .xml.txt \u2014 remove the .txt from the name before importing into Tally.');
    return;
  }
  try{
    var blob=new Blob([r.xml],{type:'application/xml'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='tally-sales-'+periodLabel(per).replace(/[^\w]+/g,'-')+'.xml';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
    toast(r.count+' voucher'+(r.count>1?'s':'')+' exported for Tally','good');
  }catch(e){ toast('Could not download here','bad'); }
}

/* Sales register: the plain list, filterable, which is what most people
   actually want when they say "export to Excel". */
function salesRegisterRows(per,filt){
  var R=periodRange(per||'month'), f=filt||{};
  var list=SALES.filter(function(s){
    if(s.at<R.from||s.at>R.to) return false;
    if(f.status&&s.status!==f.status) return false;
    if(f.type&&s.type!==f.type) return false;
    if(f.make&&String(s.make||'').toLowerCase()!==f.make.toLowerCase()) return false;
    if(f.jobType&&s.jobType!==f.jobType) return false;
    return true;
  }).sort(function(a,b){ return a.at-b.at; });
  var rows=[['Date','Invoice no','Type','Status','Job card','Registration','Make','Model','Job type',
    'Customer','GSTIN','Place of supply','Taxable','Tax','Round off','Invoice total','Advance','Paid','Balance']];
  list.forEach(function(s){
    rows.push([dOnly(s.at), s.number, s.type==='gst'?'Tax invoice':'Plain bill', s.status,
      s.jobNo, regShow(s.reg), s.make, s.model, s.jobType, s.custName, s.gstin, s.pos,
      r2(s.taxable), r2(s.tax), r2(s.roundOff||0), r2(s.grand), r2(s.advance||0), r2(s.paid||0), r2(s.balance||0)]);
  });
  var tot=list.reduce(function(a,s){ return {t:a.t+s.taxable,x:a.x+s.tax,g:a.g+s.grand,b:a.b+s.balance}; },{t:0,x:0,g:0,b:0});
  rows.push([]);
  rows.push(['','','','','','','','','','','','TOTAL',r2(tot.t),r2(tot.x),'',r2(tot.g),'','',r2(tot.b)]);
  return rows;
}
function ledgerRows(partyId,per){
  var p=partyById(partyId), R=periodRange(per||'fy');
  var all=partyEntries(partyId), opening=0;
  all.forEach(function(e){ if(e.at<R.from) opening+=e.dr-e.cr; });
  var rows=[[S.core.workshop.name],['Ledger \u2014 '+p.name],[periodLabel(per||'fy')+' ('+dOnly(R.from)+' to '+dOnly(R.to)+')'],[],
    ['Date','Particulars','Reference','Debit','Credit','Balance','Dr/Cr']];
  rows.push([dOnly(R.from),'Opening balance','','','',(Math.abs(opening)/100).toFixed(2),opening<0?'Cr':'Dr']);
  all.filter(function(e){ return e.at>=R.from&&e.at<=R.to; }).forEach(function(e){
    rows.push([dOnly(e.at), e.label, e.no||'',
      e.dr?(e.dr/100).toFixed(2):'', e.cr?(e.cr/100).toFixed(2):'',
      (Math.abs(e.running)/100).toFixed(2), e.running<0?'Cr':'Dr']);
  });
  var b=balanceOf(partyId);
  rows.push([]); rows.push(['','Closing balance','','','',(Math.abs(b)/100).toFixed(2),b<0?'Cr':'Dr']);
  return rows;
}

function unitOpts(sel){ return UNITS.map(function(u){ return '<option'+(u===sel?' selected':'')+'>'+u+'</option>'; }).join(''); }
function catOpts(sel){ return '<option value="">— pick one —</option>'+
  CATEGORIES.map(function(c){ return '<option'+(c===sel?' selected':'')+'>'+esc(c)+'</option>'; }).join(''); }
/* ---------- GST 2.0 ----------
   The Council abolished the 12% and 28% slabs with effect from 22 September
   2025 and added 40% for demerit goods. Auto parts moved to a flat 18%, and
   motorcycles up to 350cc came down from 28% to 18%. The old slabs are kept
   selectable ONLY when a record already carries one, so a bill written under
   the old regime still shows the rate that was law on its date. Nothing new
   can be written at an abolished rate. */
var GST_SLABS=[0,5,18,40];
var GST_DEAD={12:'abolished 22 Sep 2025',28:'abolished 22 Sep 2025'};
function gstOpts(sel){
  var list=GST_SLABS.slice();
  if(sel!==undefined&&sel!==null&&list.indexOf(sel)<0) list.push(sel);
  list.sort(function(a,b){ return a-b; });
  return list.map(function(r){
    var dead=GST_DEAD[r];
    return '<option value="'+r+'"'+(r===sel?' selected':'')+(dead&&r!==sel?' disabled':'')+'>'+
      r+'%'+(dead?' \u2014 '+dead:'')+'</option>';
  }).join('');
}
/* the rate the law expects today, by what is being sold */
function gstDefault(kind){
  var d=S.core.defaults;
  return kind==='part'?(d.gstRateParts||18):(d.gstRateLabour||18);
}

/* the two percentages, worked out live, never typed */
function inclOn(){
  var b=document.querySelector('#inclseg [aria-pressed="true"]');
  return b?b.dataset.v==='1':false;
}
function paintPCalc(){
  var box=document.getElementById('pcalc'); if(!box) return;
  var rate=toPaise(dg('prate')), mrp=toPaise(dg('pmrp')), sale=toPaise(dg('psale'));
  var gst=parseInt(dg('pgst')||0,10), conv=parseFloat(dg('pconv')||1)||1;
  var disc=parseFloat(dg('pdisc')||0)||0, incl=inclOn();
  if(!rate){ box.innerHTML='<div class="hint">The discount and margin appear once you put in the rate.</div>'; return; }
  var net=Math.round(rate*(1-disc/100));
  var netEx=(incl&&gst)?exTax(net,gst):net;
  var costPer=Math.round(netEx/conv);
  var paidIncl=(incl||!gst)?net:Math.round(net*(100+gst)/100);
  var saleEx=exTax(sale,gst);
  var mg=(costPer&&sale)?Math.round(((saleEx-costPer)/costPer)*1000)/10:null;
  var dc=discountPct(mrp,paidIncl);
  var warn='';
  if(sale&&mrp&&sale>mrp) warn='<div class="banner small" style="margin:8px 0 0;background:var(--red-bg);border-color:var(--red);color:var(--red)"><b>The selling price is above MRP.</b> You cannot charge more than MRP.</div>';
  else if(mg!==null&&mg<0) warn='<div class="banner small" style="margin:8px 0 0;background:var(--red-bg);border-color:var(--red);color:var(--red)"><b>You would lose money on this.</b> The selling price is below what it cost.</div>';
  box.innerHTML='<div class="banner info small" style="margin:10px 0 0">'+
    '<div style="display:flex;gap:18px;flex-wrap:wrap">'+
    '<div><div class="eyebrow">Cost per '+esc(dg('punit')||'unit')+'</div><b class="money">'+money(costPer)+'</b> <span class="small">no tax</span></div>'+
    (disc?'<div><div class="eyebrow">Net rate paid</div><b class="money">'+money(paidIncl)+'</b> <span class="small">with tax</span></div>':'')+
    (can('reports')?'<div><div class="eyebrow">Supplier discount off MRP</div>'+pctTag(dc,20)+'</div>'+
      '<div><div class="eyebrow">Your margin</div>'+pctTag(mg,15)+'</div>':'')+'</div></div>'+warn;
}

async function editLineField(lineId,field,value){
  var j=S.job, l=findLine(j,lineId); if(!l) return;
  if(field==='rate'){
    if(!can('price.set')&&!can('price.override')){ toast('You cannot change a price','bad'); return; }
    if(stageIdx(j.stage)<1){ toast('Nothing can be priced at the entry stage','bad'); return; }
    var old=l.unit||0, nu=toPaise(value);
    if(old===nu) return;
    var listed=(l.partId?(partById(l.partId)||{}).sale:0)||0;
    l.unit=nu; l.pricedBy=S.user.id; l.pricedAt=Date.now();
    /* off the price list is worth the owner knowing about */
    if(listed&&nu!==listed){
      l.overridden={from:listed, to:nu, by:S.user.id, byName:S.user.name, at:Date.now()};
      logIt(j,'Price changed off the list',l.desc+': list '+money(listed)+' \u2192 charged '+money(nu));
    } else {
      if(l.overridden&&nu===listed) delete l.overridden;
      logIt(j,'Price changed',l.desc+': '+money(old)+' \u2192 '+money(nu)+' each');
    }
    if(j.stage==='work_listed') j.stage='priced';
  }
  if(field==='qty'){
    var oq=qtyNum(l.qty), nq=qtyNum(value); if(oq===nq) return;
    l.qty=nq;
    if(l.partId&&l.kind==='part'){
      moveIn({partId:l.partId, batchId:l.batchId||'', qty:oq-nq, kind:(nq>oq?'issue':'return'),
        ref:j.no, note:'quantity changed on the job card'});

    logIt(j,'Quantity changed',l.desc+': '+oq+' → '+nq);
  }
  if(field==='gst'){
    var og=l.gst||0, ng=parseInt(value,10)||0; if(og===ng) return;
    l.gst=ng; logIt(j,'GST rate changed',l.desc+': '+og+'% → '+ng+'%');

/* ---------- signature pad ----------
   Drawn at device pixel ratio so it is not a blurry smear on a phone, and
   stored as a small mono PNG. Pointer events cover finger, stylus and the
   occasional mouse without three separate code paths. */
var SIGDIRTY=false;
function mountSigPad(){
  var cv=document.getElementById('sigpad'); if(!cv) return;
  SIGDIRTY=false;
  var r=window.devicePixelRatio||1, rect=cv.getBoundingClientRect();
  cv.width=Math.round(rect.width*r); cv.height=Math.round(rect.height*r);
  var x=cv.getContext('2d');
  x.scale(r,r); x.lineWidth=2.2; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#12171C';
  var down=false, last=null;
  function pt(e){ var b=cv.getBoundingClientRect(); return {x:e.clientX-b.left, y:e.clientY-b.top}; }
  cv.addEventListener('pointerdown',function(e){ down=true; last=pt(e); SIGDIRTY=true;
    try{ cv.setPointerCapture(e.pointerId); }catch(err){} e.preventDefault(); });
  cv.addEventListener('pointermove',function(e){ if(!down) return; var p=pt(e);
    x.beginPath(); x.moveTo(last.x,last.y); x.lineTo(p.x,p.y); x.stroke(); last=p; e.preventDefault(); });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    cv.addEventListener(ev,function(){ down=false; }); });
}
function sigClear(){
  var cv=document.getElementById('sigpad'); if(!cv) return;
  cv.getContext('2d').clearRect(0,0,cv.width,cv.height); SIGDIRTY=false;
}
function sigData(){
  var cv=document.getElementById('sigpad');
  if(!cv||!SIGDIRTY) return '';
  try{
    /* shrink to a sane width before storing — a full-res signature is
       tens of kilobytes for no benefit */
    var out=document.createElement('canvas');
    out.width=420; out.height=Math.round(420*cv.height/cv.width);
    out.getContext('2d').drawImage(cv,0,0,out.width,out.height);
    return out.toDataURL('image/png');
  }catch(e){ return ''; }
}

async function newBill(type){
  var j=S.job;

  var b={id:uid('bl'),type:type,status:'draft',number:'',lineIds:elig.map(function(l){return l.id;}),
    incl:S.core.defaults.pricesIncludeGst,inter:false,roundOff:S.core.defaults.roundOff,
    advance:0,payments:[],createdBy:S.user.id,createdAt:Date.now()};
  j.bills.push(b);
  if(j.advance&&j.advance.paise){ var c0=billCalc(j,b); b.advance=Math.max(0,Math.min(advanceLeft(j,b.id),c0.grand)); }
  logIt(j,'Bill started',type==='gst'?'Tax invoice':'Plain bill (no GST)');

}
async function toggleBillLine(billId,lineId){
  var j=S.job, b=j.bills.filter(function(x){return x.id===billId;})[0]; if(!b||b.status!=='draft') return;
  var l=findLine(j,lineId);
  if(b.type==='gst'&&l&&l.noGst){
    toast('That came from a composition dealer \u2014 it goes on the plain bill, not the tax invoice','bad'); return;
  }
  var i=b.lineIds.indexOf(lineId);
  if(i>=0) b.lineIds.splice(i,1); else b.lineIds.push(lineId);

async function billOpt(billId,k,v){
  var j=S.job, b=j.bills.filter(function(x){return x.id===billId;})[0]; if(!b||b.status!=='draft') return;
  if(k==='incl') b.incl=(v==='1');
  if(k==='inter') b.inter=(v==='1');
  if(k==='round') b.roundOff=(v==='1');
  await saveJob(j); rerender();
}
async function setBillAdvance(billId,val){
  var j=S.job, b=j.bills.filter(function(x){return x.id===billId;})[0]; if(!b||b.status!=='draft') return;
  var want=toPaise(val), max=advanceLeft(j,b.id), c=billCalc(j,b);
  if(want>max){ want=max; toast('Only '+money(max)+' of advance is left','bad'); }
  if(want>c.grand){ want=c.grand; }
  b.advance=Math.max(0,want);
  await saveJob(j); rerender();
}
function finalBill(billId){
  var j=S.job, b=j.bills.filter(function(x){return x.id===billId;})[0]; var c=billCalc(j,b);
  confirmBox('Finalise this bill?','It gets the next number in the '+(b.type==='gst'?'tax invoice':'plain bill')+
    ' series and can never be edited again. Total '+money(c.grand)+'.','Finalise','finalBillDo|'+billId);
}
async function finalBillDo(billId){
  var j=S.job, b=j.bills.filter(function(x){return x.id===billId;})[0];
  if(!b||b.status!=='draft') return;
  closeModal();
  try{
    b.number=await allocNumber(b.type==='gst'?'gst':'nongst');
  }catch(e){ toast(e.message,'bad'); return; }
  b.status='final'; b.finalAt=Date.now(); b.finalBy=S.user.id; b.finalByName=S.user.name;
  var c=billCalc(j,b);
  /* Freeze the invoice. Until now a finalised bill was recomputed from the
     live job every time it was opened or printed, so any later edit to a
     line — or a change to the workshop's default tax rate — would silently
     rewrite an invoice that had already gone to a customer and into a GST
     return. A tax invoice must say the same thing forever, so the figures,
     the rates and the seller's own details are copied in here and read from
     the copy from this moment on. */
  b.snapshot=freezeBill(j,b,c);
  if(j.stage==='work_done'||j.stage==='billed') j.stage='billed';
  logIt(j,'Bill finalised',b.number+' · '+money(c.grand)+(b.type==='gst'?' (tax invoice)':' (no GST)'));
  await saveJob(j); rerender(); toast('Bill '+b.number+' made','good');
}

var ONES=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen',
'Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
var TENS=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function w2(n){ return n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:''); }
function w3(n){ return (n>99?ONES[Math.floor(n/100)]+' Hundred'+(n%100?' ':''):'')+(n%100?w2(n%100):''); }
function inWords(paise){
  var r=Math.floor(paise/100), p=paise%100, out='';
  if(r===0) out='Zero';
  else{
    var cr=Math.floor(r/10000000); r%=10000000;
    var lk=Math.floor(r/100000);   r%=100000;
    var th=Math.floor(r/1000);     r%=1000;
    if(cr) out+=w3(cr)+' Crore ';
    if(lk) out+=w2(lk)+' Lakh ';
    if(th) out+=w3(th)+' Thousand ';
    if(r)  out+=w3(r);
  }
  out='Rupees '+out.trim().replace(/\s+/g,' ');
  if(p) out+=' and '+w2(p)+' Paise';
  return out+' only';
}

   A workshop prints on whatever is bolted to the counter. Most have an 80mm
   thermal roll; some have an A4 laser for tax invoices. Same document, two

var PRINTMODE='a4';

var PRINTNAME='motoreez-document';
function printDoc(html){
  if(MODE==='live'){ savePrintable(html,PRINTNAME+'-'+isoDate()); toast('Open the saved file in your browser and print it from there.'); return; }
  document.getElementById('printarea').innerHTML='<div class="doc">'+html+'</div>';
  document.body.classList.toggle('thermal',PRINTMODE==='thermal');
  /* A named @page is ignored unless something opts into it, so the page
     size is written fresh for every print instead. */
  var ps=document.getElementById('pagesize');
  if(!ps){ ps=document.createElement('style'); ps.id='pagesize'; document.head.appendChild(ps); }
  ps.textContent=PRINTMODE==='thermal'
    ? '@page{size:80mm auto;margin:3mm}'
    : '@page{size:A4;margin:12mm}';
  setTimeout(function(){ window.print(); },60);
}

/* Bulk-load the parts master. Prices and units only — stock comes from
   purchase bills, or from a stock correction. */
async function loadPartsCsv(){
  var ta=document.querySelector('[name="partscsv"]');
  if(!ta||!ta.value.trim()){ toast('Paste the list in first','bad'); return; }
  var added=0, updated=0, bad=0;
  ta.value.split(/\r?\n/).forEach(function(line){
    if(!line.trim()) return;
    var c=line.split(',').map(function(x){ return x.trim(); });
    if(c.length<2||!c[0]||!c[1]){ bad++; return; }
    var cat=c[2]||'';
    if(cat&&CATEGORIES.indexOf(cat)<0) cat='';
    var ex=partByNo(c[0]);
    var rec={ no:c[0], name:c[1], category:cat||(/^99/.test(c[3]||'')?'Labour':'Hardware'),
      hsn:c[3]||'', gst:c[4]!==''&&c[4]!==undefined?(parseInt(c[4],10)||0):18,
      sale:toPaise(c[5]||'0'), mrp:toPaise(c[6]||'0'),
      unit:UNITS.indexOf(c[7])>=0?c[7]:'piece', buyUnit:UNITS.indexOf(c[8])>=0?c[8]:(UNITS.indexOf(c[7])>=0?c[7]:'piece'),
      conv:parseFloat(c[9]||1)||1, minQty:parseFloat(c[10]||0)||0 };
    if(ex){ Object.keys(rec).forEach(function(k){ ex[k]=rec[k]; }); ex.updatedAt=Date.now(); updated++; }
    else{ rec.id=uid('pt'); rec.aliases=[]; rec.createdAt=Date.now(); rec.updatedAt=Date.now(); PARTS.push(rec); added++; }
  });
  if(!added&&!updated){ toast('Could not read any lines. Check the order of the columns.','bad'); return; }
  if(!await saveStore('parts')) return;
  toast(added+' added, '+updated+' updated'+(bad?', '+bad+' skipped':''),'good');
  rerender();
}
async function clearParts(){
  if(MOVES.length){ toast('Parts with stock movements cannot be wiped. Correct the stock instead.','bad'); return; }
  PARTS=[]; await saveStore('parts'); toast('Parts cleared'); rerender();
}

var BACKUP_KEYS=['mz:core','mz:index','mz:parts','mz:batches','mz:moves','mz:purchases','mz:suppliers',
  'mz:parties','mz:payments','mz:adjust','mz:sales','mz:receipts','mz:accounts',
  'mz:expenses','mz:transfers','mz:attend','mz:advances','mz:appts','mz:reminded','mz:chatmeta','mz:bikes','mz:issued'];
/* Version 2 keeps every key under its own name, including what hangs off
   each job card: its walk-round photos, the customer's voice, and the
   chat with everything attached to it. Version 1 left those out. */
async function backupAll(){
  var out={ made:new Date().toISOString(), app:'Motoreez', version:2, data:{} };
  async function put(k){ var v=await DB.get(k); if(v!==null&&v!==undefined) out.data[k]=v; return v; }
  for(var i=0;i<BACKUP_KEYS.length;i++) await put(BACKUP_KEYS[i]);
  for(var k=0;k<S.index.length;k++){
    var id=S.index[k].id;
    await put('mz:job:'+id); await put('mz:dvi:'+id); await put('mz:audio:'+id);
    var msgs=await put('mz:chat:'+id)||[];
    for(var m=0;m<msgs.length;m++) if(msgs[m].att&&!msgs[m].att.asset) await put('mz:att:'+msgs[m].att.id);
  }
  for(var x=0;x<EXPENSES.length;x++) if(EXPENSES[x].photo) await put('mz:exphoto:'+EXPENSES[x].id);
  out.data['mz:index']=S.index;                      /* the live list, however it is stored */
  out.data['mz:bikes']=S.core.bikes;
  downloadFileRaw('motoreez-backup-'+isoDate()+'.json', JSON.stringify(out), 'application/json');
  toast('Backed up '+S.index.length+' job cards and everything else','good');
}
function downloadFileRaw(name,text,mime){
  if(MODE==='live'){ offerFile(name,text,mime); return; }
  try{
    var blob=new Blob([text],{type:mime||'text/plain'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },300);
  }catch(e){ toast('Could not download here. Open the app in its own browser tab.','bad'); }
}
function restoreModal(){
  openModal('<h2>Put a backup back</h2>'+
    '<div class="banner small" style="background:var(--red-bg);border-color:var(--red);color:var(--red);margin:12px 0">'+
    '<b>This wipes what is here now</b> and replaces it with the file.</div>'+
    '<div class="field"><label>Backup file</label>'+
    '<input type="file" accept="application/json,.json" id="restorefile" style="min-height:52px;padding:12px"></div>'+
    '<div class="btn-row"><button class="btn" data-act="closeModal">Cancel</button>'+
    '<button class="btn danger" data-act="restoreDo">Restore</button></div>');
}
async function restoreDo(){
  var f=document.getElementById('restorefile');
  if(!f||!f.files||!f.files[0]){ toast('Choose the file first','bad'); return; }
  var txt=await f.files[0].text();
  var obj;
  try{ obj=JSON.parse(txt); }catch(e){ toast('That is not a backup file','bad'); return; }
  if(!obj||!obj.data||!obj.data['mz:core']){ toast('That backup looks wrong','bad'); return; }
  /* the job list goes back as one row per job on the server */
  if(MODE==='live'&&Array.isArray(obj.data['mz:index'])){
    try{ for(var q=0;q<obj.data['mz:index'].length;q++) await livePutIx(obj.data['mz:index'][q]); }
    catch(err){ liveFail('mz:index',err); return; }
  }
  if(MODE==='cloud'&&Array.isArray(obj.data['mz:index'])){
    if(!await DB.setMany(obj.data['mz:index'].map(function(e){ return ['mz:ix:'+e.id,e]; }))){
      toast('The job list could not be written back. Do not use the app until this is sorted.','bad'); return; }
  }
  var keys=Object.keys(obj.data).filter(function(k){ return k.indexOf('mz:')===0&&!((MODE==='cloud'||MODE==='live')&&k==='mz:index'); });
  var failed=0;
  for(var i=0;i<keys.length;i++){
    if(obj.data[keys[i]]===null||obj.data[keys[i]]===undefined) continue;
    if(!await DB.set(keys[i], obj.data[keys[i]])) failed++;
  }
  if(failed){ toast(failed+' part'+(failed>1?'s':'')+' of the backup could not be written. Do not use the app until this is sorted.','bad'); return; }
  var jobs=obj.data.jobs||{};   /* version 1 files */
  var ids=Object.keys(jobs);
  for(var k=0;k<ids.length;k++) await DB.set('mz:job:'+ids[k], jobs[ids[k]]);
  closeModal();
  toast('Restored. Reloading\u2026','good');
  setTimeout(function(){ location.reload(); },900);
}
async function saveWorkshop(){
  ['name','tagline','addr','phone','email','gstin','state','stateCode','prefix','bank'].forEach(function(f){
    var el=document.querySelector('[name="w_'+f+'"]'); if(el) S.core.workshop[f]=el.value.trim();
  });
  var W=S.core.workshop;
  [['wupi','upi'],['wupiname','upiName']].forEach(function(p){
    var el=document.querySelector('[name="'+p[0]+'"]'); if(el) W[p[1]]=el.value.trim();
  });
  [['wsvcm','svcMonths',1,24],['wsvck','svcKm',500,50000],['wopen','openHour',0,23],
   ['wclose','closeHour',1,24],['wbays','bays',1,20]].forEach(function(p){
    var el=document.querySelector('[name="'+p[0]+'"]'); if(!el) return;
    var v=parseInt(el.value,10);
    if(!isNaN(v)) W[p[1]]=Math.max(p[2],Math.min(p[3],v));
  });
  if(W.closeHour<=W.openHour){ toast('Closing time has to be after opening time','bad'); return; }
  if(W.upi&&!/^[\w.\-]{2,}@[A-Za-z]{2,}$/.test(W.upi)){
    toast('That UPI ID does not look right. It should read like name@bank.','bad'); return;
  }
  await saveCore(); toast('Saved','good'); rerender();
}
/* The PINs the app ships with. Anyone who has seen this file knows them,
   so they are flagged until changed. */
var DEFAULT_PINS=['1111','2222','3333','4444','4455','4466'];
function pinModal(id){
  var u=S.core.users.filter(function(x){ return x.id===id; })[0]; if(!u) return;
  openModal('<h2>New PIN for '+esc(u.name)+'</h2>'+
    '<div class="field" style="margin-top:12px"><label>4 digits</label>'+
    '<input type="password" name="np1" class="mono" inputmode="numeric" maxlength="4" autocomplete="off"></div>'+
    '<div class="field"><label>Same again</label>'+
    '<input type="password" name="np2" class="mono" inputmode="numeric" maxlength="4" autocomplete="off"></div>'+
    '<div class="btn-row"><button class="btn" data-act="closeModal">Cancel</button>'+
    '<button class="btn primary" data-act="pinSave" data-id="'+u.id+'">Save PIN</button></div>');
}
async function pinSave(id){
  var u=S.core.users.filter(function(x){ return x.id===id; })[0]; if(!u) return;
  var a=dg('np1'), b=dg('np2');
  if(!/^[0-9]{4}$/.test(a)){ toast('Four digits, numbers only','bad'); return; }
  if(a!==b){ toast('The two PINs do not match','bad'); return; }
  if(DEFAULT_PINS.indexOf(a)>=0||/^(\d)\1{3}$/.test(a)||a==='1234'){ toast('Too easy to guess \u2014 pick another','bad'); return; }
  if(S.core.users.some(function(x){ return x.id!==id&&x.active!==false&&x.pin===a; })){
    toast('Someone else already uses that PIN','bad'); return; }
  u.pin=a; await saveCore(); closeModal(); rerender(); toast('PIN changed for '+u.name,'good');
}

/* =====================================================================
   JOB CHAT
   One conversation per job card: the advisor, the store, the technician
   and the owner talking about one bike, with the photos, voice notes and
   documents that belong to it kept in the same place instead of scattered
   across personal WhatsApp groups.

   Storage is split on purpose:
     mz:chat:<jobId>  the messages, each small (text, or an attachment's
                      name and a tiny thumbnail)
     mz:att:<attId>   one attachment each, read only when someone taps it
     mz:chatmeta      per job: message count and the last few senders, so
                      the job list can show unread badges without opening
                      every conversation
   Chat never writes to the job card itself, so a message sent from one
   phone can never overwrite a price or a tick made on another.

   Everything goes through ChatStore. When this moves to a server, those
   six methods become API calls and nothing above them changes.
   ===================================================================== */
var CHAT_LIMITS={
  photoPx:1280, photoQ:0.7,          /* readable on any phone, ~150KB */
  thumbPx:240,  thumbQ:0.55,         /* lives inside the message, ~10KB */
  voiceMs:120000,                    /* two minutes */
  fileBytes:1500000,                 /* shared store: 1.5 MB a file */
  fileBytesLocal:350000,             /* this-browser-only store is ~5 MB in all */
  removeWindowMs:10*60000            /* authors can take a message back for 10 minutes */
};
var CHATMETA={}, CHATSEEN={};

var ChatStore={
  key:function(jobId){ return 'mz:chat:'+jobId; },
  attKey:function(id){ return 'mz:att:'+id; },
  list:async function(jobId){ return (await DB.get(this.key(jobId)))||[]; },
  /* The list is read again immediately before it is written, so two people
     posting a few seconds apart do not overwrite each other. It narrows
     the race; only a server can close it. */
  post:async function(jobId,msg,attData){
    if(attData){
      var okA=await DB.set(this.attKey(msg.att.id),attData);
      if(!okA) return null;
    }
    var list=await DB.append(this.key(jobId),msg);
    if(!list){ if(attData) await DB.del(this.attKey(msg.att.id)); return null; }
    await this.touch(jobId,list);
    return list;
  },
  /* A removed message leaves a marker behind, so the conversation still
     shows that something was said and by whom. */
  remove:async function(jobId,msgId){
    var list=await this.list(jobId);
    var m=list.filter(function(x){ return x.id===msgId; })[0];
    if(!m) return list;
    if(m.att&&m.att.asset){ if(LV.assets) LV.assets.delete(m.att.asset).catch(function(){}); }
    else if(m.att) await DB.del(this.attKey(m.att.id));
    m.removed={by:S.user.id, byName:S.user.name, at:Date.now()};
    delete m.text; delete m.att;
    if(!await DB.set(this.key(jobId),list)) return null;
    await this.touch(jobId,list);
    return list;
  },
  attachment:async function(id){ return DB.get(this.attKey(id)); },
  meta:async function(){ return (await DB.get('mz:chatmeta'))||{}; },
  touch:async function(jobId,list){
    var live=list.filter(function(m){ return !m.removed; });
    var last=live[live.length-1];
    var entry={ n:live.length, at:last?last.at:0, by:last?last.by:'', byName:last?last.byName:'',
      text:last?chatSummary(last):'',
      recent:live.slice(-30).map(function(x){ return {at:x.at, by:x.by}; }) };
    CHATMETA[jobId]=entry;
    var patch={}; patch[jobId]=entry;
    await DB.merge('mz:chatmeta',patch);
  }
};

/* ---------- who has read what ----------
   Kept per person on this device. Losing it costs nothing worse than a
   badge that shows old messages as new. */
async function loadChatSeen(){
  CHATSEEN=(S.user&&await DB.getMine('mz:chatseen:'+S.user.id))||{};
}
function markChatSeen(jobId){
  CHATSEEN[jobId]=Date.now();
  DB.setMine('mz:chatseen:'+S.user.id,CHATSEEN);
}
function chatUnread(jobId){
  var m=CHATMETA[jobId]; if(!m||!S.user) return 0;
  var seen=CHATSEEN[jobId]||0;
  return (m.recent||[]).filter(function(r){ return r.at>seen&&r.by!==S.user.id; }).length;
}
function chatBadge(jobId){
  var n=chatUnread(jobId);
  return n?'<span class="chatbadge" title="'+n+' new message'+(n>1?'s':'')+'">'+
    ICON.chat+n+'</span>':'';
}
function chatSummary(m){
  if(m.removed) return 'Message removed';
  if(m.att){
    if(m.att.kind==='image') return 'Photo'+(m.text?' · '+m.text:'');
    if(m.att.kind==='voice') return 'Voice note '+vTime(m.att.ms||0);
    return 'File · '+m.att.name;
  }
  return String(m.text||'').slice(0,80);
}

async function openChat(){

      try{ S.chat.msgs=await ChatStore.list(S.chat.jobId); markChatSeen(S.chat.jobId); paintChatList(false); }catch(e){}

    '<div class="actionbar"><div class="actionbar-in" id="composer">'+composerHtml()+'</div></div>';
