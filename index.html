  }
  return h;
}

/* =====================================================================
   SALES AND PURCHASES \u2014 the front end
   A section with tabs, not a wall. The numbers along the top are the
   filter: tap "Unpaid" and the list below is the unpaid ones. One object
   doing both jobs instead of a figure you can only read.
   ===================================================================== */

/* ---------- the pieces every list shares ---------- */
function statRow(cards,active,act){
  return '<div class="statgrid">'+cards.map(function(c){
    var on=(active===c.k);
    return '<button class="bigstat'+(c.tone?' '+c.tone:'')+(on?' on':'')+'" '+
      'data-act="'+act+'" data-k="'+c.k+'" aria-pressed="'+on+'">'+
      '<div class="k">'+esc(c.label)+'</div>'+
      '<div class="v">'+c.value+'</div>'+
      (c.sub?'<div class="s">'+esc(c.sub)+'</div>':'')+'</button>';
  }).join('')+'</div>';
}
/* Ageing looks backwards. This looks forwards, which is the one that
   changes what you do today. */
function dueIn(at,creditDays){
  if(!creditDays) return '';
  var due=at+creditDays*86400000;
  var days=Math.ceil((due-Date.now())/86400000);
  if(days>=0) return '<span class="due">Due in '+days+' day'+(days===1?'':'s')+'</span>';
  return '<span class="due over">Overdue '+(-days)+' day'+(days===-1?'':'s')+'</span>';
}
/* Billed and outstanding on one line, the way it reads on paper. */
function amountPair(total,unpaid){
  return '<b class="money">'+money(total)+'</b>'+
    (unpaid>0?'<div class="small" style="color:var(--bad)">'+money(unpaid)+' unpaid</div>':'');
}
function statusTag(s){
  var m={paid:['t-green','Paid'],unpaid:['t-red','Unpaid'],part:['t-amber','Part paid'],
    cancelled:['t-grey','Cancelled'],draft:['t-grey','Draft']};
  var x=m[s]||['t-grey',s];
  return '<span class="tag '+x[0]+'">'+x[1]+'</span>';
}
function sectionTabs(tabs,cur,act){
  return '<div class="subtabs">'+tabs.map(function(t){
    return '<button class="subtab" data-act="'+act+'" data-k="'+t[0]+'" aria-pressed="'+(cur===t[0])+'">'+
      esc(t[1])+(t[2]!==undefined&&t[2]!==null?' <b>'+t[2]+'</b>':'')+'</button>';
  }).join('')+'</div>';
}
function listEmpty(msg){
  return '<div class="card"><div class="card-b"><div class="empty" style="padding:30px 10px">'+
    '<b>'+esc(msg)+'</b></div></div></div>';
}

/* =====================================================================
   SALES
   ===================================================================== */
function saleStatus(s){
  if(s.status==='cancelled') return 'cancelled';
  if(saleDue(s)<=0) return 'paid';
  if((s.advance||0)+(s.paid||0)>0) return 'part';
  return 'unpaid';
}
function viewSalesSection(){
  var tab=S.view.tab||'over';
  var per=S.salesPeriod||'month', R=periodRange(per);
  var all=SALES.filter(function(s){ return s.at>=R.from&&s.at<=R.to; });
  var cn=returnsIn('sales',R.from,R.to);
  var pin=paymentsIn(R.from,R.to);
  var h=pageHead('','Sales','',can('sale.new')?'<button class="btn primary" data-act="newSale">+ New sale</button>':'')+openSalesCard()+periodBar('salesPeriod',per);
  h+=sectionTabs([['over','Overview'],['bills','Invoices',all.length],
    ['in','Payments in',pin.length],['cn','Credit notes',cn.length]],tab,'salesTab');
  if(tab==='over')  h+=salesOverview(R);
  if(tab==='bills') h+=salesInvoices(all);
  if(tab==='in')    h+=paymentsInList(pin);
  if(tab==='cn')    h+=returnsList('sales',cn);
  return h;
}
function salesInvoices(all){
  var f=S.salesFilter||'all';
  var live=all.filter(function(s){ return s.status!=='cancelled'; });
  var sum=function(l,k){ return l.reduce(function(a,s){ return a+(k==='due'?saleDue(s):s.grand); },0); };
  var paid=live.filter(function(s){ return saleStatus(s)==='paid'; });
  var unpaid=live.filter(function(s){ return saleStatus(s)!=='paid'; });
  var canc=all.filter(function(s){ return s.status==='cancelled'; });
  var h=statRow([
    {k:'all',    label:'Total sales', value:money(sum(live)),   sub:live.length+' bills'},
    {k:'paid',   label:'Paid',        value:money(sum(paid)),   sub:paid.length+' bills', tone:'good'},
    {k:'unpaid', label:'Unpaid',      value:money(sum(unpaid,'due')), sub:unpaid.length+' bills', tone:unpaid.length?'bad':''},
    {k:'cancelled', label:'Cancelled', value:String(canc.length), sub:''}
  ],f,'salesFilter');

  var list=all;
  if(f==='paid') list=paid;
  if(f==='unpaid') list=unpaid;
  if(f==='cancelled') list=canc;
  var q=(S.salesQ||'').trim().toLowerCase();
  if(q) list=list.filter(function(s){
    return (s.number+' '+s.custName+' '+regShow(s.reg)+' '+s.jobNo).toLowerCase().indexOf(q)>=0; });
  list=list.slice().sort(function(a,b){ return b.at-a.at; });

  h+='<div class="searchbar" style="position:static;margin:0;padding:6px 0;border:0">'+
    '<input type="text" id="salesq" placeholder="Invoice, customer or vehicle" value="'+esc(S.salesQ||'')+'" autocomplete="off"></div>';
  if(!list.length) return h+listEmpty('No bills match that.');
  h+='<div class="card"><div class="card-b tight"><table class="lines"><tbody>';
  list.slice(0,120).forEach(function(s){
    var pty=s.partyId?partyById(s.partyId):null;
    var st=saleStatus(s);
    h+='<tr'+(st==='cancelled'?' style="opacity:.5"':'')+'>'+
      '<td><button class="linkish" data-act="openInvoice" data-job="'+esc(s.jobId)+'" data-bill="'+esc(s.id)+'">'+esc(s.number)+'</button>'+
      '<div class="small muted">'+dOnly(s.at)+' \u00B7 '+esc(s.custName)+'</div>'+
      '<div class="small muted mono">'+(s.channel&&s.channel!=='workshop'?esc(channelName(s.channel)):esc(regShow(s.reg)))+'</div>'+
      (st!=='paid'&&st!=='cancelled'&&pty?'<div class="small">'+dueIn(s.at,pty.creditDays)+'</div>':'')+
      '</td>'+
      '<td class="num">'+amountPair(s.grand,saleDue(s))+
      '<div style="margin-top:6px">'+statusTag(st)+'</div>'+
      (st!=='paid'&&st!=='cancelled'&&s.jobId&&can('pay.take')?'<div style="margin-top:6px"><button class="btn sm go" data-act="salePay" data-job="'+esc(s.jobId)+'" data-bill="'+esc(s.id)+'">Receive</button></div>':'')+
      '</td></tr>';
  });
  h+='</tbody></table></div>';
  if(list.length>120) h+='<div class="hint" style="padding:10px 14px">Showing 120 of '+list.length+'.</div>';
  return h+'</div>';
}

/* =====================================================================
   PURCHASES
   ===================================================================== */
function purchPaid(p){
  var T=billTotals(p);
  var alloc=allocatedTo(p.id);
  return {total:T.grand, paid:alloc, due:Math.max(0,T.grand-alloc)};
}
function purchStatus(p){
  var x=purchPaid(p);
  if(x.due<=0) return 'paid';
  if(x.paid>0) return 'part';
  return 'unpaid';
}
function viewPurchSection(){
  var tab=S.view.tab||'over';
  var per=S.purchPeriod||'month', R=periodRange(per);
  var all=PURCHASES.filter(function(p){
    var at=new Date(p.invDate+'T10:00:00').getTime();
    return at>=R.from&&at<=R.to;
  });
  var dn=returnsIn('purchase',R.from,R.to);
  var pout=paymentsOut(R.from,R.to);
  var h=pageHead('','Purchases')+periodBar('purchPeriod',per);
  h+=sectionTabs([['over','Overview'],['bills','Bills',all.length],
    ['out','Payments out',pout.length],['dn','Debit notes',dn.length]],tab,'purchTab');
  if(tab==='over')  h+=purchOverview(R);
  if(tab==='bills') h+=purchBills(all);
  if(tab==='out')   h+=paymentsOutList(pout);
  if(tab==='dn')    h+=returnsList('purchase',dn);
  if(tab==='bills'||tab==='over'){
    h+='<div class="actionbar"><div class="actionbar-in">'+
       '<button class="btn primary lg" data-act="newPurchase">+ New Purchase Bill</button></div></div>';
  }
  return h;
}
function purchBills(all){
  var f=S.purchFilter||'all';
  var tot=0, paid=0, due=0;
  all.forEach(function(p){ var x=purchPaid(p); tot+=x.total; paid+=x.paid; due+=x.due; });
  var paidL=all.filter(function(p){ return purchStatus(p)==='paid'; });
  var unpaidL=all.filter(function(p){ return purchStatus(p)!=='paid'; });
  var withTax=all.filter(function(p){ return p.supplyType!=='composition'; });
  var noTax=all.filter(function(p){ return p.supplyType==='composition'; });

  var h=statRow([
    {k:'all',    label:'Total purchases', value:money(tot), sub:all.length+' bills'},
    {k:'paid',   label:'Paid',   value:money(paid), sub:paidL.length+' bills', tone:'good'},
    {k:'unpaid', label:'Unpaid', value:money(due),  sub:unpaidL.length+' bills', tone:due?'bad':''},
    {k:'notax',  label:'Without tax', value:String(noTax.length), sub:'no input credit'}
  ],f,'purchFilter');

  var list=all;
  if(f==='paid') list=paidL;
  if(f==='unpaid') list=unpaidL;
  if(f==='notax') list=noTax;
  if(f==='withtax') list=withTax;
  var q=(S.purchQ||'').trim().toLowerCase();
  if(q) list=list.filter(function(p){
    return (p.invNo+' '+((partyById(p.supplierId)||{name:''}).name)).toLowerCase().indexOf(q)>=0; });
  list=list.slice().sort(function(a,b){
    return new Date(b.invDate).getTime()-new Date(a.invDate).getTime(); });

  h+='<div class="searchbar" style="position:static;margin:0;padding:6px 0;border:0">'+
    '<input type="text" id="purchq" placeholder="Invoice or supplier" value="'+esc(S.purchQ||'')+'" autocomplete="off"></div>';
  if(!list.length) return h+listEmpty('No bills match that.');
  h+='<div class="card"><div class="card-b tight"><table class="lines"><tbody>';
  list.slice(0,120).forEach(function(p){
    var x=purchPaid(p), st=purchStatus(p);
    var sup=partyById(p.supplierId)||supplierById(p.supplierId)||{name:'\u2014',creditDays:0};
    h+='<tr><td><button class="linkish" data-act="openPurchase" data-id="'+p.id+'">'+esc(p.invNo)+'</button>'+
      '<div class="small muted">'+dOnly(new Date(p.invDate).getTime())+' \u00B7 '+esc(sup.name)+'</div>'+
      '<div class="small muted">'+(p.supplyType==='composition'
        ? '<span class="tag t-amber" style="font-size:9px;padding:1px 5px">no GST</span>'
        : '<span class="tag t-blue" style="font-size:9px;padding:1px 5px">'+(p.taxMode==='intra'?'CGST+SGST':'IGST')+'</span>')+
      '</div>'+
      (st!=='paid'?'<div class="small">'+dueLabel(purchDueAt(p))+'</div>':'')+
      '</td>'+
      '<td class="num">'+amountPair(x.total,x.due)+
      '<div style="margin-top:6px">'+statusTag(st)+'</div>'+
      (x.due>0&&can('pay.vendor')?'<div style="margin-top:6px"><button class="btn sm primary" data-act="purchPay" data-id="'+p.id+'">Pay</button></div>':'')+
      '</td></tr>';
  });
  h+='</tbody></table></div>';
  if(list.length>120) h+='<div class="hint" style="padding:10px 14px">Showing 120 of '+list.length+'.</div>';
  return h+'</div>';
}

/* =====================================================================
   MONEY IN AND OUT AS THEIR OWN LISTS
   Previously buried inside a party. A cashier wants today's receipts,
   not to go looking party by party.
   ===================================================================== */
function paymentsIn(from,to){
  var out=[];
  RECEIPTS.forEach(function(r){
    if(r.at<from||r.at>to) return;
    out.push({at:r.at, amount:r.amount, who:(partyById(r.partyId)||{name:''}).name,
      partyId:r.partyId, mode:r.mode||'cash', ref:r.billNo||r.ref||'',
      what:(r.kind==='advance'?'Advance':'Against a bill'), by:r.by, verified:true});
  });
  PAYMENTS.forEach(function(v){
    if(v.direction!=='in'||v.at<from||v.at>to) return;
    out.push({at:v.at, amount:v.amount, who:(partyById(v.partyId)||{name:''}).name,
      partyId:v.partyId, mode:(accountById(v.accountId)||{name:''}).name, ref:v.ref||'',
      what:(v.reversalOf?'Reversal':'Received'), by:v.by, verified:!!v.verified, id:v.id});
  });
  return out.sort(function(a,b){ return b.at-a.at; });
}
function paymentsOut(from,to){
  var out=[];
  PAYMENTS.forEach(function(v){
    if(v.direction!=='out'||v.at<from||v.at>to) return;
    out.push({at:v.at, amount:v.amount, who:(partyById(v.partyId)||{name:''}).name,
      partyId:v.partyId, mode:(accountById(v.accountId)||{name:''}).name, ref:v.ref||'',
      what:(v.reversalOf?'Reversal':'Paid'), by:v.by, verified:!!v.verified, id:v.id,
      allocs:(v.allocations||[]).map(function(a){ return a.docNo; })});
  });
  return out.sort(function(a,b){ return b.at-a.at; });
}
function paymentList(list,tone){
  if(!list.length) return listEmpty('Nothing yet.');
  var tot=list.reduce(function(a,x){ return a+x.amount; },0);
  var h=statRow([{k:'all',label:(tone==='good'?'Received':'Paid out'),value:money(tot),
    sub:list.length+' entries',tone:tone}],'all','noop');
  h+='<div class="card"><div class="card-b tight"><table class="lines"><tbody>';
  list.slice(0,120).forEach(function(x){
    h+='<tr><td>'+(x.partyId
        ? '<button class="linkish" data-act="openParty" data-id="'+x.partyId+'">'+esc(x.who||'\u2014')+'</button>'
        : '<b>'+esc(x.who||'\u2014')+'</b>')+
      '<div class="small muted">'+dOnly(x.at)+' \u00B7 '+esc(x.what)+' \u00B7 '+esc(x.mode)+
      (x.ref?' \u00B7 '+esc(x.ref):'')+'</div>'+
      ((x.allocs&&x.allocs.length)?'<div class="small muted">against '+esc(x.allocs.join(', '))+'</div>':'')+
      (x.id&&!x.verified?'<span class="tag t-amber" style="font-size:9px;padding:1px 5px">not checked</span>':'')+
      '</td>'+
      '<td class="num"><b class="money" style="color:'+(tone==='good'?'var(--ok)':'var(--bad)')+'">'+
      (tone==='good'?'+':'\u2212')+money(x.amount)+'</b>'+
      '<div class="small muted">'+esc(coreUser(x.by).name)+'</div></td></tr>';
  });
  return h+'</tbody></table></div></div>';
}
function paymentsInList(l){ return paymentList(l,'good'); }
function paymentsOutList(l){ return paymentList(l,''); }

function returnsList(kind,list){
  if(!list.length) return listEmpty(kind==='sales'?'Nothing has come back.':'Nothing sent back.');
  var tot=sumReturns(list);
  var h=statRow([{k:'all',label:(kind==='sales'?'Credited to customers':'Debited to suppliers'),
    value:money(tot), sub:list.length+' notes', tone:'bad'}],'all','noop');
  h+='<div class="card"><div class="card-b tight"><table class="lines"><tbody>';
  list.forEach(function(r){
    h+='<tr'+(r.status==='void'?' style="opacity:.5;text-decoration:line-through"':'')+'>'+
      '<td><b class="mono">'+esc(r.no)+'</b>'+
      '<div class="small muted">'+dOnly(r.at)+' \u00B7 '+esc(r.partyName||'')+
      (r.refNo?' \u00B7 against '+esc(r.refNo):'')+'</div>'+
      (r.reason?'<div class="small muted">'+esc(r.reason)+'</div>':'')+
      '<div class="small muted">'+(r.lines||[]).length+' item'+((r.lines||[]).length===1?'':'s')+'</div></td>'+
      '<td class="num"><b class="money">'+money(returnTotal(r))+'</b>'+
      (r.status!=='void'&&can('bill.final')
        ? '<div><button class="btn sm danger" style="margin-top:6px" data-act="voidReturn" data-id="'+r.id+'">Cancel</button></div>'
        : '')+'</td></tr>';
  });
  return h+'</tbody></table></div></div>';
}

/* A part with no printed number gets one made from its name — but never
   one that is already taken, or two different parts silently become one. */
function autoPartNo(name){
  var base=pkey(name).slice(0,18)||'PART';
  if(!partByNo(base)) return base;
  for(var i=2;i<99;i++){ var c=base.slice(0,16)+'-'+i; if(!partByNo(c)) return c; }
  return base+'-'+Date.now().toString(36).slice(-4);
}
/* Sale price defaults to MRP where the bill printed one. Where it did not,
   the part goes in with no selling price and the owner sets it. */
async function loadRealData(){
  if(PURCHASES.length){ toast('The store already has purchases in it. Clear them first.','bad'); return; }
  REAL_SUPPLIERS.forEach(function(s){
    if(!supplierById(s.id)) SUPPLIERS.push(Object.assign({at:Date.now(), by:S.user.id}, s));
  });
  var n=0, lines=0;
  for(var i=0;i<REAL_BILLS.length;i++){
    var b=REAL_BILLS[i];
    var p={ id:uid('pu'), supplierId:b.sup, invNo:b.no, invDate:b.date,
      supplyType:b.type, taxMode:(b.type==='composition')?'none':taxModeOf(b.sup),
      irn:b.irn||'', ackNo:b.ack||'', charges:toPaise(b.charges||0), chargesTaxed:!!b.chargesTaxed,
      roundOff:toPaise(b.round||0), needsCheck:!!b.needsCheck,
      at:new Date(b.date+'T10:00:00').getTime(), by:'u_for', saved:true,
      lines:b.lines.map(function(l){
        return { no:l.no||autoPartNo(l.name), name:l.name, category:l.cat,
          hsn:l.hsn||'', gst:l.gst||0, incl:!!l.incl, disc:l.disc||0, batchNo:l.batch||'',
          qty:l.qty, buyUnit:l.buyUnit||'piece', unit:l.unit||l.buyUnit||'piece', conv:l.conv||1,
          rate:toPaise(l.rate), mrp:toPaise(l.mrp||0), sale:toPaise(l.mrp||0),
          serials:l.serials||[], partId:'' };
      }) };
    lines+=p.lines.length;
    await receivePurchase(p);
    n++;
  }
  if(mergeSuppliers()) await savePartyData();
  await phonesMigrate(); await capsMigrate();
  toast(n+' bills loaded \u00b7 '+lines+' lines \u00b7 '+PARTS.length+' parts in stock','good');
  rerender();
}
async function clearStore(){
  SUPPLIERS=[]; PARTS=[]; BATCHES=[]; MOVES=[]; PURCHASES=[];
  await saveStore();
  toast('Store emptied'); rerender();
}

/* =====================================================================
   PARTIES AND THEIR LEDGERS
   One record per person or firm. Somebody can be a customer and a
   supplier at the same time.

   Sign convention, the same one your CA uses:
     Dr (+)  they owe you        \u2014 a customer's bill
     Cr (\u2212)  you owe them        \u2014 a supplier's bill
   Balance = Dr \u2212 Cr. Positive means money is coming to you.

   The ledger is never stored. It is worked out from the documents every
   time it is shown, so it can never drift out of step with them.
   ===================================================================== */
var PARTIES=[], PAYMENTS=[], ADJUST=[], SALES=[], ACCOUNTS=[], RECEIPTS=[];

function seedAccounts(){
  return [
    {id:'ac_cash', name:'Cash in hand', kind:'cash',  active:true},
    {id:'ac_bank', name:'Current account', kind:'bank', active:true},
    {id:'ac_upi',  name:'UPI', kind:'upi',   settlesTo:'ac_bank', active:true},
    {id:'ac_card', name:'Card machine', kind:'card', settlesTo:'ac_bank', active:true}
  ];
}
function accountById(id){ return ACCOUNTS.filter(function(a){return a.id===id;})[0]||null; }

/* ---------- the party record ---------- */
function blankParty(){
  return { id:uid('py'), name:'', types:[], gstin:'', pan:'', state:'', stateCode:'',
    phone:'', altPhone:'', email:'', address:'', pin:'',
    bank:{name:'',acNo:'',ifsc:'',branch:''},
    creditLimit:0, creditDays:0, opening:{amount:0, side:'cr', asOn:isoDate()},
    note:'', active:true, at:Date.now(), by:S.user?S.user.id:'' };
}
function partyById(id){ for(var i=0;i<PARTIES.length;i++) if(PARTIES[i].id===id) return PARTIES[i]; return null; }
function phoneKey(p){ return normPhone(p).replace(/\D/g,''); }
function partyByPhone(ph){
  var k=phoneKey(ph); if(k.length<6) return null;
  return PARTIES.filter(function(p){ return phoneKey(p.phone)===k||phoneKey(p.altPhone)===k; })[0]||null;
}
function partyByGstin(g){
  var k=pkey(g); if(!k) return null;
  return PARTIES.filter(function(p){ return pkey(p.gstin)===k; })[0]||null;
}
function isCustomer(p){ return (p.types||[]).indexOf('customer')>=0; }
function isSupplier(p){ return (p.types||[]).indexOf('supplier')>=0; }
function addType(p,t){ if((p.types||[]).indexOf(t)<0) p.types=(p.types||[]).concat([t]); }

/* Find the customer behind a job card, or make one. Matched on the phone
   number, because that is the one thing a workshop always gets right. */
function findOrMakeCustomer(name,phone,extra){
  var p=partyByPhone(phone);
  if(!p&&extra&&extra.gstin) p=partyByGstin(extra.gstin);
  if(p){
    addType(p,'customer');
    if(!p.name&&name) p.name=name;
    if(extra){
      if(extra.gstin&&!p.gstin){ var g=gstinCheck(extra.gstin);
        if(g.ok){ p.gstin=g.raw; p.state=g.state; p.stateCode=g.stateCode; p.pan=g.pan; } }
      if(extra.address&&!p.address) p.address=extra.address;
    }
    return p;
  }
  p=blankParty();
  p.name=name||'Walk-in'; p.phone=phone||''; p.types=['customer'];
  if(extra){
    if(extra.gstin){ var g2=gstinCheck(extra.gstin);
      if(g2.ok){ p.gstin=g2.raw; p.state=g2.state; p.stateCode=g2.stateCode; p.pan=g2.pan; } }
    p.address=extra.address||'';
  }
  if(!p.state){ p.state=S.core.workshop.state; p.stateCode=S.core.workshop.stateCode; }
  PARTIES.push(p);
  return p;
}

/* ---------- periods ---------- */
function fyStart(d){ var y=d.getFullYear(); return new Date((d.getMonth()>=3?y:y-1),3,1,0,0,0,0); }
function startOfDay(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,0,0,0); }
function endOfDay(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate(),23,59,59,999); }
var PERIODS=[['week','This week'],['month','This month'],['quarter','This quarter'],
  ['prevquarter','Last quarter'],['fy','This FY'],['prevfy','Last FY'],['d365','Last 365 days'],['all','Everything']];
function periodRange(key){
  var now=new Date(), a, b=endOfDay(now);
  if(key==='week'){ var d=new Date(now); var dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); a=startOfDay(d); }
  else if(key==='month'){ a=new Date(now.getFullYear(),now.getMonth(),1); }
  else if(key==='quarter'){ a=new Date(now.getFullYear(),Math.floor(now.getMonth()/3)*3,1); }
  else if(key==='prevquarter'){
    var qs=new Date(now.getFullYear(),Math.floor(now.getMonth()/3)*3,1);
    a=new Date(qs.getFullYear(),qs.getMonth()-3,1); b=new Date(qs.getTime()-1);
  }
  else if(key==='fy'){ a=fyStart(now); }
  else if(key==='prevfy'){ var f=fyStart(now); a=new Date(f.getFullYear()-1,3,1); b=new Date(f.getTime()-1); }
  else if(key==='d365'){ a=startOfDay(new Date(now.getTime()-364*86400000)); }
  else { a=new Date(2000,0,1); }
  var lab=(PERIODS.filter(function(x){ return x[0]===key; })[0]||['','Everything'])[1];
  return {from:a.getTime(), to:b.getTime(), label:lab};
}
/* One control instead of eight buttons. The row of chips was eating a third
   of every report screen. */
function periodPicker(act,cur,extra){
  return '<select class="periodsel" data-act="'+act+'"'+(extra||'')+'>'+
    PERIODS.map(function(x){
      return '<option value="'+x[0]+'"'+(cur===x[0]?' selected':'')+'>'+esc(x[1])+'</option>';
    }).join('')+'</select>';
}
function periodBar(act,cur,rightHtml){
  var R=periodRange(cur);
  return '<div class="periodbar">'+periodPicker(act,cur)+
    '<span class="small muted">'+dOnly(R.from)+' \u2013 '+dOnly(R.to)+'</span>'+
    (rightHtml?'<span style="margin-left:auto">'+rightHtml+'</span>':'')+'</div>';
}
function periodLabel(k){ var p=PERIODS.filter(function(x){return x[0]===k;})[0]; return p?p[1]:'Everything'; }

/* ---------- the sales register ----------
   A short record of every finalised bill, kept alongside the job card so
   the ledger and the registers do not have to open every job to add up. */
function syncSales(job){
  SALES=SALES.filter(function(s){ return s.jobId!==job.id; });
  /* Money handed over at the counter lives on the job card. Pull it out so
     the ledger sees it too, otherwise the balance and the outstanding list
     tell the owner two different things. */
  RECEIPTS=RECEIPTS.filter(function(r){ return r.jobId!==job.id; });
  if(job.advances&&job.advances.length){
    job.advances.forEach(function(a,i){
      RECEIPTS.push({ id:'rc_adv_'+job.id+(i?'_'+i:''), jobId:job.id, partyId:job.partyId||'', kind:'advance',
        at:a.at, amount:a.paise, mode:a.mode||'cash', ref:job.no, by:a.by });
    });
  } else if(job.advance&&job.advance.paise){
    RECEIPTS.push({ id:'rc_adv_'+job.id, jobId:job.id, partyId:job.partyId||'', kind:'advance',
      at:job.advance.at||job.createdAt, amount:job.advance.paise, mode:job.advance.mode||'cash',
      ref:job.no, by:job.advance.by||job.createdBy });
  }
  (job.bills||[]).forEach(function(b){
    if(b.status==='cancelled') return;
    (b.payments||[]).forEach(function(pm,i){
      RECEIPTS.push({ id:'rc_'+b.id+'_'+i, jobId:job.id, partyId:job.partyId||'', kind:'billpay',
        billId:b.id, billNo:b.number, at:pm.at, amount:pm.paise, mode:pm.mode||'cash',
        ref:pm.ref||'', by:pm.by });
    });
  });
  (job.bills||[]).forEach(function(b){
    if(b.status!=='final'&&b.status!=='cancelled') return;
    var c=billCalc(job,b);
    SALES.push({ id:b.id, jobId:job.id, jobNo:job.no, number:b.number, type:b.type,
      channel:job.direct?(job.channel||'counter'):'workshop',
      by:b.finalBy||job.createdBy, byName:b.finalByName||'', mechanicId:job.mechanicId||'',
      gstin:(job.cust&&job.cust.gstin)||'', inter:!!b.inter, jobType:job.jobType||'',
      status:b.status, partyId:job.partyId||'', custName:job.cust.name, reg:job.reg,
      at:b.finalAt||job.createdAt, taxable:c.sub, tax:c.tax, grand:c.grand,
      advance:c.advance, paid:c.paid, balance:c.balance,
      /* everything a GST return needs, captured at the same moment as the
         invoice itself so the return can never disagree with the paper */
      gstin:(b.snapshot&&b.snapshot.buyer?b.snapshot.buyer.gstin:job.cust.gstin)||'',
      inter:!!b.inter, roundOff:c.roundOff,
      pos:(b.snapshot&&b.snapshot.placeOfSupply)||'',
      byRate:c.byRate||{}, hsn:(b.snapshot&&b.snapshot.hsnSummary)||[],
      make:job.make||'', model:job.model||'', jobType:job.jobType||'',
      lines:(b.lineIds||[]).map(function(id){ var l=findLine(job,id); return l?{
        desc:l.desc, kind:l.kind, partId:l.partId||'', cat:(partById(l.partId)||{}).category||'',
        brand:(partById(l.partId)||{}).brand||'', qty:qtyNum(l.qty),
        hsn:l.hsn||'', amount:lineAmount(l), cost:Math.round(qtyNum(l.qty)*(l.cost||0)), gst:l.gst||0 }:null; }).filter(Boolean) });
  });
}

/* ---------- documents that touch a party ---------- */
function partyDocs(partyId){
  var out=[], py=partyById(partyId);
  if(py&&py.opening&&py.opening.amount){
    out.push({ kind:'opening', id:'op_'+py.id, no:'Opening', label:'Opening balance',
      at:new Date(py.opening.asOn+'T00:00:00').getTime(), amount:py.opening.amount,
      dr:py.opening.side==='dr'?py.opening.amount:0,
      cr:py.opening.side==='cr'?py.opening.amount:0, taxable:0, tax:0 });
  }
  PURCHASES.forEach(function(p){
    if(p.supplierId!==partyId) return;
    var T=billTotals(p);
    out.push({ kind:'purchase', id:p.id, no:p.invNo, at:new Date(p.invDate+'T10:00:00').getTime(),
      amount:T.grand, cr:T.grand, dr:0, label:'Purchase '+p.invNo, taxable:T.taxable, tax:T.tax });
  });
  SALES.forEach(function(s){
    if(s.partyId!==partyId) return;
    if(s.status==='cancelled'){
      /* kept in the ledger at nil so the number is never a silent gap */
      out.push({ kind:'cancelled', id:s.id, no:s.number, at:s.at, amount:0, dr:0, cr:0,
        label:'CANCELLED \u2014 '+(s.type==='gst'?'tax invoice ':'bill ')+s.number,
        wasFor:s.grand, taxable:0, tax:0 });
      return;
    }
    out.push({ kind:'sale', id:s.id, no:s.number, at:s.at, amount:s.grand, dr:s.grand, cr:0,
      label:(s.type==='gst'?'Tax invoice ':'Bill ')+s.number, taxable:s.taxable, tax:s.tax });
  });
  return out;
}
function partyEntries(partyId){
  var p=partyById(partyId); if(!p) return [];
  var out=partyDocs(partyId).filter(function(d){ return d.kind!=='cancelled'||true; });
  returnEntries(partyId).forEach(function(x){ out.push(x); });
  RECEIPTS.forEach(function(r){
    if(r.partyId!==partyId) return;
    out.push({ kind:'receipt', id:r.id, no:r.billNo||r.ref||'', at:r.at, amount:r.amount,
      dr:0, cr:r.amount,
      label:(r.kind==='advance'?'Advance taken \u00B7 ':'Received at the counter \u00B7 ')+String(r.mode||'').toUpperCase() });
  });
  PAYMENTS.forEach(function(v){
    if(v.partyId!==partyId) return;
    out.push({ kind:v.direction==='out'?'payment':'receipt', id:v.id, no:v.ref||'', at:v.at,
      amount:v.amount, dr:v.direction==='out'?v.amount:0, cr:v.direction==='in'?v.amount:0,
      label:(v.reversalOf?'REVERSAL \u00B7 ':'')+(v.direction==='out'?'Paid ':'Received ')+
        (accountById(v.accountId)||{name:''}).name,
      canReverse:!v.reversalOf&&!v.reversedBy, reversed:!!v.reversedBy,
      allocations:v.allocations||[] });
  });
  ADJUST.forEach(function(a){
    if(a.partyId!==partyId) return;
    out.push({ kind:a.kind, id:a.id, no:a.ref||'', at:a.at, amount:a.amount,
      dr:a.side==='dr'?a.amount:0, cr:a.side==='cr'?a.amount:0, label:a.label||a.kind });
  });
  out.sort(function(a,b){ return a.at-b.at||(a.kind==='opening'?-1:1); });
  var run=0;
  out.forEach(function(e){ run+=e.dr-e.cr; e.running=run; });
  return out;
}
/* A wrong payment is undone with an opposite entry, so both stay on the
   record. Nothing is ever quietly removed from a ledger. */
async function reversePayment(id){
  var v=PAYMENTS.filter(function(x){ return x.id===id; })[0];
  if(!v){ toast('Not found','bad'); return; }
  if(v.reversalOf||v.reversedBy){ toast('That one has already been reversed','bad'); return; }
  var r={ id:uid('pv'), partyId:v.partyId, direction:(v.direction==='out'?'in':'out'),
    amount:v.amount, accountId:v.accountId, ref:'Reversal of '+(v.ref||dOnly(v.at)),
    at:Date.now(), allocations:[], reversalOf:v.id, by:S.user.id, byName:S.user.name };
  v.reversedBy=r.id;
  PAYMENTS.push(r);
  if(!await savePartyData()){ PAYMENTS.pop(); delete v.reversedBy; return; }
  closeModal(); rerender(); toast('Reversed '+money(v.amount),'good');
}
/* =====================================================================
   PAYING A BILL WHERE THE BILL IS
   Purchase bills are paid bill by bill, so the payment lives on the bill:
   when it is entered (often already paid), on the bill itself, and in the
   list. It is the same payment record the party ledger uses, so the
   supplier's balance, ageing and the cash book all move together.
   Paying more than is due keeps the extra as credit with that supplier,
   and that credit is used first on their next bill.
   ===================================================================== */
var VENDOR_DAYS=30;   /* when a supplier has no credit days of their own */
function supplierOf(p){ return partyById(p.supplierId)||supplierById(p.supplierId)||{name:'—',creditDays:0}; }
function purchDueAt(p){
  var sup=supplierOf(p), d=sup.creditDays>0?sup.creditDays:VENDOR_DAYS;
  return new Date((p.invDate||isoDate())+'T10:00:00').getTime()+d*86400000;
}
function dueLabel(dueAt){
  var days=Math.ceil((dueAt-Date.now())/86400000);
  if(days>0) return '<span class="due">Due in '+days+' day'+(days===1?'':'s')+'</span>';
  if(days===0) return '<span class="due">Due today</span>';
  return '<span class="due over">Overdue by '+(-days)+' day'+(days===-1?'':'s')+'</span>';
}
function payAllocated(v){ return (v.allocations||[]).reduce(function(a,x){ return a+x.amount; },0); }
/* money already paid to a supplier that no bill has used yet */
function vendorCredit(partyId){
  var t=0;
  PAYMENTS.forEach(function(v){
    if(v.partyId!==partyId||v.direction!=='out'||v.reversalOf||v.reversedBy) return;
    t+=Math.max(0,v.amount-payAllocated(v));
  });
  return t;
}
/* use that credit, oldest first, against one bill */
function useVendorCredit(partyId,docId,docNo,upTo){
  var used=0;
  PAYMENTS.filter(function(v){ return v.partyId===partyId&&v.direction==='out'&&!v.reversalOf&&!v.reversedBy; })
    .sort(function(a,b){ return a.at-b.at; })
    .forEach(function(v){
      var free=v.amount-payAllocated(v), take=Math.min(free,upTo-used);
      if(take<=0) return;
      v.allocations=(v.allocations||[]).concat([{docId:docId,docNo:docNo,amount:take,credit:true,at:Date.now()}]);
      used+=take;
    });
  return used;
}
/* everything paid against one bill, for its history */
function billPayments(docId){
  var out=[];
  PAYMENTS.forEach(function(v){
    if(v.reversalOf) return;
    (v.allocations||[]).forEach(function(a){
      if(a.docId!==docId) return;
      out.push({pay:v, amount:a.amount, credit:!!a.credit, at:a.credit?(a.at||v.at):v.at});
    });
  });
  return out.sort(function(a,b){ return a.at-b.at; });
}
function payStats(total,paid,due){
  return '<div class="grid4" style="margin:6px 0 4px">'+
    '<div class="stat"><div class="k">Bill total</div><div class="v money">'+money(total)+'</div></div>'+
    '<div class="stat"><div class="k">Paid</div><div class="v money">'+money(paid)+'</div></div>'+
    '<div class="stat"><div class="k">Balance</div><div class="v money" style="color:'+(due>0?'var(--red)':'var(--green)')+'">'+money(Math.max(0,due))+'</div></div></div>';
}
function activeAccounts(){ return ACCOUNTS.filter(function(a){ return a.active!==false; }); }
function accountOptions(sel){
  return activeAccounts().map(function(a){ return '<option value="'+a.id+'"'+(a.id===sel?' selected':'')+'>'+esc(a.name)+'</option>'; }).join('');
}
/* record one payment to a supplier against one bill */
async function payPurchase(p,o){
  var due=purchPaid(p).due, used=0, payId='';
  if(o.useCredit&&due>0){
    used=useVendorCredit(p.supplierId,p.id,p.invNo,due);
    if(used) logAudit('Money','Supplier credit used',money(used)+' against '+p.invNo,p.invNo);
  }
  var rest=Math.max(0,due-used);
  if(o.amount>0){
    var alloc=Math.min(o.amount,rest);
    payId=uid('pv');
    PAYMENTS.push({ id:payId, partyId:p.supplierId, direction:'out', amount:o.amount,
      accountId:o.accountId||(activeAccounts()[0]||{}).id, ref:o.ref||'', at:o.at||Date.now(),
      allocations:alloc>0?[{docId:p.id, docNo:p.invNo, amount:alloc}]:[],
      by:S.user.id, byName:S.user.name, note:'Paid on bill '+p.invNo });
    logAudit('Money','Paid supplier',money(o.amount)+' on '+p.invNo+' · '+((accountById(o.accountId)||{}).name||'')+
      (o.amount>alloc?' · '+money(o.amount-alloc)+' kept as credit':''),p.invNo);
  }
  if(!o.amount&&!used) return true;
  if(!await savePartyData()){
    /* nothing half-saved: take this payment and the credit use back off */
    if(payId) PAYMENTS=PAYMENTS.filter(function(v){ return v.id!==payId; });
    PAYMENTS.forEach(function(v){ v.allocations=(v.allocations||[]).filter(function(a){ return !(a.credit&&a.docId===p.id&&used); }); });
    return false;
  }
  return true;
}

/* ---------- sales: what is still owed on an invoice ----------
   Money taken on the job card sits on the bill; money received through
   the customer's account is set against the invoice there. Both count. */
function billDue(j,b){ var c=billCalc(j,b); return c.balance-allocatedTo(b.id); }
function saleDue(s){ return Math.max(0,(s.balance||0)-allocatedTo(s.id)); }

  if(S.job&&S.job.id===jobId) payModal(billId);

/* partyEntries walks every purchase, sale and receipt. Doing that once per
   party per render is fine at fifty parties and hopeless at five thousand,
   so balances are worked out once and kept until something changes. */
var BALCACHE=null;
function clearBalCache(){ BALCACHE=null; }
function buildBalCache(){
  var m={};
  PARTIES.forEach(function(p){ m[p.id]=0; });
  function add(id,v){ if(id!==undefined&&id!==null&&id!=='') m[id]=(m[id]||0)+v; }
  PARTIES.forEach(function(p){
    if(p.opening&&p.opening.amount) add(p.id, p.opening.side==='dr'?p.opening.amount:-p.opening.amount);
  });
  PURCHASES.forEach(function(x){ add(x.supplierId, -billTotals(x).grand); });
  SALES.forEach(function(x){ if(x.status!=='cancelled') add(x.partyId, x.grand); });
  RECEIPTS.forEach(function(r){ add(r.partyId, -r.amount); });
  PAYMENTS.forEach(function(v){ add(v.partyId, v.direction==='out'?v.amount:-v.amount); });
  ADJUST.forEach(function(a){ add(a.partyId, a.side==='dr'?a.amount:-a.amount); });
  RETURNS.forEach(function(r){
    if(r.status==='void') return;
    var amt=r.taxable+r.tax;
    add(r.partyId, (r.kind==='purchase')?amt:-amt);
  });
  BALCACHE=m;
}
function balanceOf(partyId){
  if(!BALCACHE) buildBalCache();
  return BALCACHE[partyId]||0;
}

/* ---------- what is still unpaid, invoice by invoice ---------- */
function allocatedTo(docId){
  var t=0;
  PAYMENTS.forEach(function(v){
    if(v.reversedBy||v.reversalOf) return;
    (v.allocations||[]).forEach(function(a){ if(a.docId===docId) t+=a.amount; });
  });
  return t;
}
function openItems(partyId){
  return partyDocs(partyId).filter(function(d){ return d.kind!=='cancelled'; }).map(function(d){
    var paid=allocatedTo(d.id);
    if(d.kind==='sale'){ var s=SALES.filter(function(x){return x.id===d.id;})[0];
      if(s) paid+=(s.advance||0)+(s.paid||0); }
    return {doc:d, paid:paid, due:d.amount-paid};
  }).filter(function(x){ return x.due>0; })
    .sort(function(a,b){ return a.doc.at-b.doc.at; });
}
var AGE_BUCKETS=[[0,30,'0\u201330 days'],[31,60,'31\u201360'],[61,90,'61\u201390'],[91,99999,'Over 90']];
function ageing(partyId){
  var now=Date.now(), out=AGE_BUCKETS.map(function(b){ return {label:b[2], amount:0}; });
  openItems(partyId).forEach(function(x){
    var days=Math.floor((now-x.doc.at)/86400000);
    for(var i=0;i<AGE_BUCKETS.length;i++){
      if(days>=AGE_BUCKETS[i][0]&&days<=AGE_BUCKETS[i][1]){ out[i].amount+=x.due; break; }
    }
  });
  return out;
}
function creditUsed(partyId){
  var b=balanceOf(partyId); return b>0?b:0;
}
function overLimit(p){
  return p.creditLimit>0 && creditUsed(p.id)>p.creditLimit;
}

/* ---------- money in, money out ---------- */
async function savePartyData(){
  clearBalCache();
  var ok=true;
  ok=await DB.set('mz:parties',PARTIES)&&ok;
  ok=await DB.set('mz:payments',PAYMENTS)&&ok;
  ok=await DB.set('mz:adjust',ADJUST)&&ok;
  ok=await DB.set('mz:sales',SALES)&&ok;
  ok=await DB.set('mz:receipts',RECEIPTS)&&ok;
  ok=await DB.set('mz:accounts',ACCOUNTS)&&ok;
  if(!ok) toast('Could not save. Try again.','bad');
  return ok;
}
async function loadPartyData(){
  clearBalCache();
  PARTIES=await DB.get('mz:parties')||[];
  PAYMENTS=await DB.get('mz:payments')||[];
  ADJUST=await DB.get('mz:adjust')||[];
  SALES=await DB.get('mz:sales')||[];
  RECEIPTS=await DB.get('mz:receipts')||[];
  ACCOUNTS=await DB.get('mz:accounts')||seedAccounts();
}
function accountBalance(accId){
  var t=0;
  PAYMENTS.forEach(function(v){
    if(v.accountId!==accId) return;
    t+=(v.direction==='in')?v.amount:-v.amount;
  });
  return t;
}

/* Suppliers were kept in their own list before parties existed.
   Bring them across once, keeping their ids so purchases still point at them. */
function mergeSuppliers(){
  var moved=0;
  (SUPPLIERS||[]).forEach(function(sp){
    if(partyById(sp.id)) return;
    var p=blankParty();
    p.id=sp.id; p.name=sp.name; p.types=['supplier'];
    p.gstin=sp.gstin||''; p.pan=sp.pan||''; p.state=sp.state||''; p.stateCode=sp.stateCode||'';
    p.phone=sp.phone||''; p.address=sp.address||''; p.note=sp.note||'';
    p.at=sp.at||Date.now(); p.by=sp.by||'';
    PARTIES.push(p); moved++;
  });
  return moved;
}

function partyMatches(p,k){
  if(k==='customer') return isCustomer(p);
  if(k==='supplier') return isSupplier(p);
  if(k==='owing') return balanceOf(p.id)>0;
  if(k==='owed') return balanceOf(p.id)<0;
  if(k==='over') return overLimit(p);
  return true;
}

async function savePartyRec(id){
  var g=function(n){ var e=document.querySelector('.sheet [name="'+n+'"]'); return e?e.value.trim():''; };
  if(!g('yname')){ toast('The party needs a name','bad'); return; }
  var types=[]; document.querySelectorAll('#ptypes [aria-pressed="true"]').forEach(function(b){ types.push(b.dataset.v); });
  if(!types.length){ toast('Tick customer, supplier, or both','bad'); return; }
  var gi=gstinCheck(g('ygstin'));
  if(g('ygstin')&&!gi.ok){ toast(gi.why,'bad'); return; }
  if(gi.ok){ var other=partyByGstin(gi.raw); if(other&&other.id!==id){ toast('That GST number belongs to '+other.name,'bad'); return; } }
  var p=id?partyById(id):blankParty();
  p.name=titleCase(g('yname')); p.types=types;
  p.gstin=gi.ok?gi.raw:''; p.state=gi.state||p.state; p.stateCode=gi.stateCode||p.stateCode; p.pan=gi.pan||p.pan;
  var yp=readPhone('yphone'), ya=readPhone('yalt');
  if(!yp.empty&&!yp.ok){ toast('Phone: '+yp.why,'bad'); return; }
  if(!ya.empty&&!ya.ok){ toast('Other phone: '+ya.why,'bad'); return; }
  var clash=yp.e164?partyByPhone(yp.e164):null;
  if(clash&&clash.id!==p.id){ toast('That phone already belongs to '+clash.name,'bad'); return; }
  p.phone=yp.e164; p.altPhone=ya.e164; p.email=g('yemail'); p.address=titleCase(g('yaddr'));
  p.creditLimit=toPaise(g('ylimit')); p.creditDays=parseInt(g('ydays')||0,10)||0;
  p.bank={name:g('ybname'), acNo:g('yacno'), ifsc:g('yifsc').toUpperCase(), branch:''};
  if(!id){
    var op=toPaise(g('yopen'));
    if(op>0) p.opening={amount:op, side:g('yside')||'cr', asOn:isoDate()};
    PARTIES.push(p);
  }
  if(!await savePartyData()) return;
  closeModal(); rerender(); toast('Saved','good');
}

async function payPartyDo(partyId,dir){
  var g=function(n){ var e=document.querySelector('.sheet [name="'+n+'"]'); return e?e.value.trim():''; };
  var amt=toPaise(g('vamt'));

  });
  if(t>amt){ toast('You have allocated '+money(t)+' but the amount is '+money(amt),'bad'); return; }
  var when=g('vdate')?new Date(g('vdate')+'T12:00:00').getTime():Date.now();
  PAYMENTS.push({ id:uid('pv'), partyId:partyId, direction:dir, amount:amt,
    accountId:g('vacc')||ACCOUNTS[0].id, ref:g('vref'), at:when,
    allocations:allocs, by:S.user.id, byName:S.user.name, note:'' });
  if(!await savePartyData()) return;
  closeModal(); rerender();
  toast(money(amt)+(dir==='out'?' paid':' received'),'good');
}

/* ---------------- out to Excel and PDF ---------------- */
/* paise to a plain rupee figure Excel will treat as a number */
function rup(p){ return ((p||0)/100).toFixed(2); }
function csvCell(v){
  var s=String(v===undefined||v===null?'':v);
  return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function downloadCsv(name,rows){
  var csv=rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
  try{
    var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
    toast('Downloaded '+name,'good');
  }catch(e){ toast('Could not download here. Try the PDF button.','bad'); }
}
/* =====================================================================
   GST RETURN DATA  (G5)
   This produces the working papers a CA needs to file GSTR-1: the B2B
   table, the consolidated B2C table, the HSN summary and a document
   series statement. It does NOT file anything and does not pretend to —
   filing happens on the GST portal, and a tool that implies otherwise is
   dangerous. Figures come from the frozen invoice snapshots, so what is
   filed matches what the customer was handed.
   ===================================================================== */
function salesInPeriod(per){
  var R=periodRange(per||'month');
  return SALES.filter(function(s){
    return s.status==='final'&&s.type==='gst'&&s.at>=R.from&&s.at<=R.to;
  }).sort(function(a,b){ return a.at-b.at; });
}
function r2(p){ return (p/100).toFixed(2); }

function gstr1Rows(per){
  var rows=[], list=salesInPeriod(per), W=S.core.workshop;
  var b2b=list.filter(function(s){ return /^[0-9]{2}[A-Z0-9]{13}$/.test((s.gstin||'').toUpperCase()); });
  var b2c=list.filter(function(s){ return b2b.indexOf(s)<0; });

  rows.push(['GSTR-1 WORKING PAPERS \u2014 NOT A RETURN']);
  rows.push(['Supplier',W.name,'GSTIN',W.gstin,'Period',periodLabel(per)]);
  rows.push(['Prepared',dts(Date.now()),'By',S.user.name]);
  rows.push([]);

  rows.push(['TABLE 4A \u2014 B2B (registered customers)']);
  rows.push(['GSTIN of recipient','Receiver name','Invoice no','Invoice date','Invoice value',
             'Place of supply','Reverse charge','Rate','Taxable value','IGST','CGST','SGST','Cess']);
  b2b.forEach(function(s){
    Object.keys(s.byRate||{}).sort(function(a,b){return a-b;}).forEach(function(rt){
      var g=s.byRate[rt]; if(!g||!g.base) return;
      var half=Math.floor(g.tax/2);
      rows.push([s.gstin.toUpperCase(), s.custName, s.number, isoDate(s.at), r2(s.grand),
        s.pos||W.stateCode+'-'+W.state, 'N', rt, r2(g.base),
        s.inter?r2(g.tax):'0.00', s.inter?'0.00':r2(half), s.inter?'0.00':r2(g.tax-half), '0.00']);
    });
  });
  if(!b2b.length) rows.push(['(none in this period)']);
  rows.push([]);

  rows.push(['TABLE 7 \u2014 B2C (small, consolidated by rate)']);
  rows.push(['Type','Place of supply','Rate','Taxable value','IGST','CGST','SGST','Cess','Invoices']);
  var agg={};
  b2c.forEach(function(s){
    Object.keys(s.byRate||{}).forEach(function(rt){
      var g=s.byRate[rt]; if(!g||!g.base) return;
      var k=(s.inter?'INTER':'INTRA')+'|'+rt;
      agg[k]=agg[k]||{inter:s.inter,rate:rt,base:0,tax:0,n:0};
      agg[k].base+=g.base; agg[k].tax+=g.tax; agg[k].n++;
    });
  });
  Object.keys(agg).sort().forEach(function(k){
    var a=agg[k], half=Math.floor(a.tax/2);
    rows.push([a.inter?'OE (inter-state)':'OE (intra-state)', W.stateCode+'-'+W.state, a.rate, r2(a.base),
      a.inter?r2(a.tax):'0.00', a.inter?'0.00':r2(half), a.inter?'0.00':r2(a.tax-half), '0.00', a.n]);
  });
  if(!Object.keys(agg).length) rows.push(['(none in this period)']);
  rows.push([]);

  rows.push(['TABLE 12 \u2014 HSN SUMMARY']);
  rows.push(['HSN/SAC','Description','UQC','Total quantity','Total value','Rate','Taxable value','IGST','CGST','SGST']);
  var hs={};
  list.forEach(function(s){
    (s.lines||[]).forEach(function(l){
      var code=l.hsn||(l.kind==='labour'?'998714':'');
      if(!code) code='UNCLASSIFIED';
      var k=code+'|'+l.gst;
      hs[k]=hs[k]||{hsn:code, rate:l.gst, qty:0, value:0, base:0, tax:0,
                    labour:l.kind==='labour', inter:s.inter};
      var base=Math.round(l.amount*100/(100+(l.gst||0)));
      hs[k].qty+=l.qty; hs[k].value+=l.amount; hs[k].base+=base; hs[k].tax+=l.amount-base;
    });
  });
  Object.keys(hs).sort().forEach(function(k){
    var x=hs[k], half=Math.floor(x.tax/2);
    rows.push([x.hsn, x.labour?'Repair and maintenance services':'Motorcycle parts and accessories',
      x.labour?'NA':'NOS', x.qty, r2(x.value), x.rate, r2(x.base),
      x.inter?r2(x.tax):'0.00', x.inter?'0.00':r2(half), x.inter?'0.00':r2(x.tax-half)]);
  });
  if(!Object.keys(hs).length) rows.push(['(none in this period)']);
  rows.push([]);

  rows.push(['TABLE 13 \u2014 DOCUMENTS ISSUED']);
  rows.push(['Nature of document','From','To','Total issued','Cancelled','Net']);
  ['gst','nongst'].forEach(function(t){
    var all=SALES.filter(function(s){ var R=periodRange(per||'month');
      return s.type===t&&s.at>=R.from&&s.at<=R.to; });
    if(!all.length) return;
    var nums=all.map(function(s){ return s.number; }).filter(Boolean).sort();
    var canc=all.filter(function(s){ return s.status==='cancelled'; }).length;
    rows.push([t==='gst'?'Tax invoice':'Bill of supply / cash memo',
      nums[0]||'', nums[nums.length-1]||'', all.length, canc, all.length-canc]);
  });
  rows.push([]);
  rows.push(['CHECKS']);
  var noGstin=list.filter(function(s){ return s.gstin&&!/^[0-9]{2}[A-Z0-9]{13}$/.test(s.gstin.toUpperCase()); });
  rows.push(['Invoices with a GSTIN that fails the format check',noGstin.length]);
  noGstin.forEach(function(s){ rows.push(['',s.number,s.custName,s.gstin]); });
  var mismatch=list.filter(function(s){
    var cs=(s.gstin||'').slice(0,2);
    return cs&&(cs!==String(W.stateCode))!==!!s.inter;
  });
  rows.push(['Invoices where the state code and the CGST/IGST choice disagree',mismatch.length]);
  mismatch.forEach(function(s){ rows.push(['',s.number,s.custName,s.gstin,s.inter?'charged IGST':'charged CGST+SGST']); });
  var plain=SALES.filter(function(s){ var R=periodRange(per||'month');
    return s.type==='nongst'&&s.status==='final'&&s.at>=R.from&&s.at<=R.to; });
  if(plain.length){
    rows.push(['Plain bills (no GST) raised in this period',plain.length,
      r2(plain.reduce(function(a,s){ return a+s.grand; },0)),
      'These are NOT in the tables above. Confirm with your accountant that each one was correct to raise without GST.']);
  }
  return rows;
}
function exportGstr1(per){
  var W=S.core.workshop;
  downloadCsv('GSTR1-working-'+(W.prefix||'MTZ')+'-'+periodLabel(per).replace(/[^\w]+/g,'-')+'.csv', gstr1Rows(per));
}

/* =====================================================================
   TALLY  (G6)
   Tally reads its own XML dialect. Sales vouchers with ledger entries for
   the party, the sales account and each tax head. Import through
   Gateway of Tally > Import Data > Vouchers. The ledger names below must
   already exist in the company, which is why they are listed on screen
   before the download.
   ===================================================================== */
function tallyLedgers(){
  return {party:'Sundry Debtors', sales:'Sales - Workshop', salesNon:'Sales - Unregistered',
    cgst:'Output CGST', sgst:'Output SGST', igst:'Output IGST', round:'Round Off'};
}
function xmlEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function tallyDate(ts){ var d=new Date(ts);
  return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }
function tallyXml(per){
  var W=S.core.workshop, L=tallyLedgers(), R=periodRange(per||'month');
  var list=SALES.filter(function(s){ return s.status==='final'&&s.at>=R.from&&s.at<=R.to; })
                .sort(function(a,b){ return a.at-b.at; });
  var x='<?xml version="1.0" encoding="UTF-8"?>\n<ENVELOPE>\n'+
    '<HEADER><TALLYREQUEST>Import Data</TALLYREQUEST></HEADER>\n'+
    '<BODY><IMPORTDATA><REQUESTDESC><REPORTNAME>Vouchers</REPORTNAME>'+
    '<STATICVARIABLES><SVCURRENTCOMPANY>'+xmlEsc(W.name)+'</SVCURRENTCOMPANY></STATICVARIABLES>'+
    '</REQUESTDESC><REQUESTDATA>\n';
  list.forEach(function(s){
    var gst=(s.type==='gst'), tot=s.grand;
    /* In Tally a sales voucher credits the income and tax ledgers and
       debits the party. Debits are positive, credits negative. */
    var ent='';
    ent+='<ALLLEDGERENTRIES.LIST><LEDGERNAME>'+xmlEsc(s.custName||L.party)+'</LEDGERNAME>'+
      '<ISDEEMEDPOSITIVE>Yes</ISDEEMEDPOSITIVE><AMOUNT>-'+r2(tot)+'</AMOUNT></ALLLEDGERENTRIES.LIST>';
    var base=0, cg=0, sg=0, ig=0;
    Object.keys(s.byRate||{}).forEach(function(rt){
      var g=s.byRate[rt]; base+=g.base;
      if(s.inter) ig+=g.tax; else { var h=Math.floor(g.tax/2); cg+=h; sg+=g.tax-h; }
    });
    if(!gst) base=s.taxable;
    ent+='<ALLLEDGERENTRIES.LIST><LEDGERNAME>'+xmlEsc(gst?L.sales:L.salesNon)+'</LEDGERNAME>'+
      '<ISDEEMEDPOSITIVE>No</ISDEEMEDPOSITIVE><AMOUNT>'+r2(base)+'</AMOUNT></ALLLEDGERENTRIES.LIST>';
    [[L.cgst,cg],[L.sgst,sg],[L.igst,ig]].forEach(function(p){
      if(!p[1]) return;
      ent+='<ALLLEDGERENTRIES.LIST><LEDGERNAME>'+xmlEsc(p[0])+'</LEDGERNAME>'+
        '<ISDEEMEDPOSITIVE>No</ISDEEMEDPOSITIVE><AMOUNT>'+r2(p[1])+'</AMOUNT></ALLLEDGERENTRIES.LIST>';
    });
    if(s.roundOff) ent+='<ALLLEDGERENTRIES.LIST><LEDGERNAME>'+xmlEsc(L.round)+'</LEDGERNAME>'+
      '<ISDEEMEDPOSITIVE>'+(s.roundOff<0?'Yes':'No')+'</ISDEEMEDPOSITIVE><AMOUNT>'+r2(s.roundOff)+'</AMOUNT></ALLLEDGERENTRIES.LIST>';
    x+='<TALLYMESSAGE xmlns:UDF="TallyUDF">\n<VOUCHER VCHTYPE="Sales" ACTION="Create" OBJVIEW="Invoice Voucher View">\n'+
      '<DATE>'+tallyDate(s.at)+'</DATE>'+
      '<VOUCHERTYPENAME>Sales</VOUCHERTYPENAME>'+
      '<VOUCHERNUMBER>'+xmlEsc(s.number)+'</VOUCHERNUMBER>'+
      '<PARTYLEDGERNAME>'+xmlEsc(s.custName||L.party)+'</PARTYLEDGERNAME>'+
      '<PARTYNAME>'+xmlEsc(s.custName||'')+'</PARTYNAME>'+
      (s.gstin?'<PARTYGSTIN>'+xmlEsc(s.gstin)+'</PARTYGSTIN>':'')+
      '<PLACEOFSUPPLY>'+xmlEsc(s.pos||W.state)+'</PLACEOFSUPPLY>'+
      '<REFERENCE>'+xmlEsc(s.jobNo+' \u00B7 '+regShow(s.reg))+'</REFERENCE>'+
      '<PERSISTEDVIEW>Invoice Voucher View</PERSISTEDVIEW>'+
      ent+
      '</VOUCHER>\n</TALLYMESSAGE>\n';
  });
  x+='</REQUESTDATA></IMPORTDATA></BODY>\n</ENVELOPE>\n';
  return {xml:x, count:list.length};
}
function exportTally(per){
  var r=tallyXml(per);
  if(!r.count){ toast('No finalised bills in that period','bad'); return; }
  try{
    var blob=new Blob([r.xml],{type:'application/xml'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='tally-sales-'+periodLabel(per).replace(/[^\w]+/g,'-')+'.xml';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
    toast(r.count+' voucher'+(r.count>1?'s':'')+' exported for Tally','good');
  }catch(e){ toast('Could not download here','bad'); }
}

/* Sales register: the plain list, filterable, which is what most people
   actually want when they say "export to Excel". */
function salesRegisterRows(per,filt){
  var R=periodRange(per||'month'), f=filt||{};
  var list=SALES.filter(function(s){
    if(s.at<R.from||s.at>R.to) return false;
    if(f.status&&s.status!==f.status) return false;
    if(f.type&&s.type!==f.type) return false;
    if(f.make&&String(s.make||'').toLowerCase()!==f.make.toLowerCase()) return false;
    if(f.jobType&&!typeMatches(s.jobType,f.jobType)) return false;
    return true;
  }).sort(function(a,b){ return a.at-b.at; });
  var rows=[['Date','Invoice no','Type','Status','Job card','Registration','Make','Model','Job type',
    'Customer','GSTIN','Place of supply','Taxable','Tax','Round off','Invoice total','Advance','Paid','Balance']];
  list.forEach(function(s){
    rows.push([dOnly(s.at), s.number, s.type==='gst'?'Tax invoice':'Plain bill', s.status,
      s.jobNo, regShow(s.reg), s.make, s.model, s.jobType, s.custName, s.gstin, s.pos,
      r2(s.taxable), r2(s.tax), r2(s.roundOff||0), r2(s.grand), r2(s.advance||0), r2(s.paid||0), r2(s.balance||0)]);
  });
  var tot=list.reduce(function(a,s){ return {t:a.t+s.taxable,x:a.x+s.tax,g:a.g+s.grand,b:a.b+s.balance}; },{t:0,x:0,g:0,b:0});
  rows.push([]);
  rows.push(['','','','','','','','','','','','TOTAL',r2(tot.t),r2(tot.x),'',r2(tot.g),'','',r2(tot.b)]);
  return rows;
}

/* ---------------- labour rates ----------------
   One rate per labour job. The list starts from the labour named in
   "What each job usually needs", so only the rates need typing. Changing a
   price on one job card is still possible, and is logged there. */
function canRates(){ return can('price.set'); }
function labourItems(){ return PARTS.filter(isLabour).sort(function(a,b){ return String(a.name).localeCompare(String(b.name)); }); }
function seedLabour(){
  var have={}, added=0;
  PARTS.filter(isLabour).forEach(function(p){ have[String(p.name).toLowerCase()]=1; });
  var kits=parseKits(kitsText());
  Object.keys(kits).forEach(function(job){
    kits[job].forEach(function(it){
      if(it.kind!=='labour') return;
      var nm=titleCase(it.name), k=nm.toLowerCase(); if(have[k]) return; have[k]=1;
      PARTS.push({id:uid('pt'), no:'LAB-'+pkey(nm).slice(0,18), name:nm, category:'Labour', hsn:'998714', gst:18,
        unit:'job', buyUnit:'job', conv:1, sale:0, mrp:0, aliases:[], createdAt:Date.now(), updatedAt:Date.now()});
      added++;
    });
  });
  return added;
}
function deskLabour(){
  var ls=labourItems(), edit=canRates(), unpriced=ls.filter(function(p){ return !p.sale; }).length;
  var h='<p class="small muted" style="margin:6px 0 10px">'+ls.length+' labour jobs'+(unpriced?' \u00B7 <b style="color:var(--amber)">'+unpriced+' without a rate yet</b>':'')+
    '. Rates include GST. A job ticked on a job card brings its labour in at this rate.</p>';
  if(!ls.length) return h+'<div class="empty"><b>No labour jobs yet.</b></div>';
  h+='<div class="card"><div class="card-b tight" style="overflow-x:auto"><table class="lines"><thead><tr><th>Labour job</th><th>SAC</th><th class="num">GST</th><th class="num">Rate (\u20B9)</th>'+(edit?'<th></th>':'')+'</tr></thead><tbody>';
  ls.forEach(function(p){
    h+='<tr><td>'+(edit?'<input type="text" data-lab="name" data-id="'+p.id+'" value="'+esc(p.name)+'" style="min-height:40px;font-size:14px">':'<b>'+esc(p.name)+'</b>')+'</td>'+
      '<td class="mono small">'+esc(p.hsn||'')+'</td><td class="num small">'+(p.gst||0)+'%</td>'+
      '<td class="num">'+(edit?'<input type="number" step="0.01" inputmode="decimal" data-lab="rate" data-id="'+p.id+'" value="'+(p.sale?paiseToInput(p.sale):'')+'" placeholder="set rate" style="min-height:40px;width:120px;text-align:right">'
                          :(p.sale?'<b class="money">'+money(p.sale)+'</b>':'<span class="muted">\u2014</span>'))+'</td>'+

  });
  return h+'</tbody></table></div></div>';

async function labSet(id,f,v){
  var p=partById(id); if(!p||!canRates()) return;
  if(f==='rate'){ var was=p.sale||0; p.sale=toPaise(v)||0; if(was!==p.sale) logAudit('Labour rate',p.name,money(was)+' \u2192 '+money(p.sale),p.no); }
  if(f==='name'){ var nm=titleCase(v); if(!nm) return; logAudit('Labour rate','Renamed',p.name+' \u2192 '+nm,p.no); p.name=nm; }
  p.updatedAt=Date.now(); await saveStore('parts'); await saveAudit(); toast('Saved','good');
}
function labNew(){
  openModal('<h2>Add a labour job</h2>'+
    '<div class="field" style="margin-top:12px"><label class="req">Name</label><input type="text" name="labname"></div>'+

    '<div class="btn-row"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="labNewDo">Add it</button></div>');
}
async function labNewDo(){
  var g=function(n){ var e=document.querySelector('.sheet [name="'+n+'"]'); return e?e.value.trim():''; };
  var nm=titleCase(g('labname')); if(!nm){ toast('Give it a name','bad'); return; }
  if(PARTS.some(function(p){ return isLabour(p)&&String(p.name).toLowerCase()===nm.toLowerCase(); })){ toast('That labour job is already on the list','bad'); return; }
  PARTS.push({id:uid('pt'), no:'LAB-'+pkey(nm).slice(0,18), name:nm, category:'Labour', hsn:'998714', gst:parseInt(g('labgst')||18,10),
    unit:'job', buyUnit:'job', conv:1, sale:toPaise(g('labrate'))||0, mrp:0, aliases:[], createdAt:Date.now(), updatedAt:Date.now()});
  await saveStore('parts'); closeModal(); rerender(); toast(nm+' added','good');
}
async function labDel(id){
  var p=partById(id); if(!p||!canRates()) return;
  PARTS=PARTS.filter(function(x){ return x.id!==id; });
  logAudit('Labour rate','Removed',p.name,p.no); await saveAudit();
  await saveStore('parts'); rerender(); toast(p.name+' removed');
}
document.addEventListener('change',function(e){
  var n=e.target&&e.target.name;
  if((n==='charges'||n==='roundoff')&&S.view&&S.view.name==='purchase'&&S.purch&&!S.purch.saved){
    grabPurchaseHeader(); rerender(); return; }

});

function paintSupplierResults(){
  var box=document.getElementById('supres'), inp=document.getElementById('supsearch');
  if(!box||!inp) return;
  var q=inp.value.trim();
  if(!q){ box.innerHTML=''; return; }
  var g=gstinCheck(q);
  if(/^[0-9]{2}[A-Z]/i.test(pkey(q))&&pkey(q).length>=10){
    var known=supplierByGstin(q);
    if(known){
      box.innerHTML='<div class="banner ok small" style="margin:10px 0 0"><b>'+esc(known.name)+'</b> is already on file.'+
        '<button class="btn sm" style="margin-left:10px;background:var(--surface)" data-act="pickSupplier" data-id="'+known.id+'">Use them</button></div>';
      return;
    }
    if(g.ok){
      box.innerHTML='<div class="banner ok small" style="margin:10px 0 0"><b>Valid GST number.</b> '+
        esc(g.state)+' \u00B7 PAN '+esc(g.pan)+
        '<button class="btn sm" style="margin-left:10px;background:var(--surface)" data-act="newSupplierFrom" data-g="'+esc(g.raw)+'">Add this supplier</button></div>';
      return;
    }
    box.innerHTML='<div class="banner small" style="margin:10px 0 0;background:var(--red-bg);border-color:var(--red);color:var(--red)">'+esc(g.why)+'</div>';
    return;
  }
  var t=q.toLowerCase();
  var res=SUPPLIERS.filter(function(s){ return String(s.name).toLowerCase().indexOf(t)>=0; }).slice(0,8);
  if(!res.length){
    box.innerHTML='<div class="hint">No supplier by that name. <button class="btn sm" data-act="newSupplier">Add a new one</button></div>';
    return;
  }
  box.innerHTML='<div class="presults">'+res.map(function(s){
    return '<button class="partrow" data-act="pickSupplier" data-id="'+s.id+'">'+
      '<div style="flex:1"><div style="font-weight:800">'+esc(s.name)+'</div>'+
      '<div class="small muted mono">'+esc(s.gstin||'no GST number')+'</div></div></button>'; }).join('')+'</div>';
}

/* ---------------- parts master ---------------- */
/* ---- filter the shelf by group, category and brand, with counts ---- */
function partCatMatch(p,f){
  if(!f) return true;
  if(f==='x:') return !catIsSet(p.category);
  if(f.slice(0,2)==='g:') return catIsSet(p.category)&&catGroup(p.category)===f.slice(2);
  if(f.slice(0,2)==='c:') return p.category===f.slice(2);
  return true;
}
function partBrandMatch(p,f){
  if(!f) return true;
  if(f==='x:') return !p.brand;
  return p.brand===f.slice(2);
}
function partFilters(){
  var parts=shelfParts(), cc={}, gc={}, bc={}, noCat=0, noBrand=0;
  parts.forEach(function(p){
    if(catIsSet(p.category)){ cc[p.category]=(cc[p.category]||0)+1; var g=catGroup(p.category); gc[g]=(gc[g]||0)+1; } else noCat++;
    if(p.brand) bc[p.brand]=(bc[p.brand]||0)+1; else noBrand++;
  });
  var ch='<option value="">All categories ('+parts.length+')</option>';
  if(noCat) ch+='<option value="x:"'+(S.pcf==='x:'?' selected':'')+'>\u26A0 Category not set ('+noCat+')</option>';
  catTree().forEach(function(g){
    if(!gc[g[0]]) return;
    ch+='<optgroup label="'+esc(g[0])+'"><option value="g:'+esc(g[0])+'"'+(S.pcf==='g:'+g[0]?' selected':'')+'>All '+esc(g[0])+' ('+gc[g[0]]+')</option>'+
      g[1].filter(function(c){ return cc[c]; }).map(function(c){
        return '<option value="c:'+esc(c)+'"'+(S.pcf==='c:'+c?' selected':'')+'>'+esc(c)+' ('+cc[c]+')</option>'; }).join('')+'</optgroup>';
  });
  var bh='<option value="">All brands ('+parts.length+')</option>';
  if(noBrand) bh+='<option value="x:"'+(S.pbf==='x:'?' selected':'')+'>\u26A0 Brand not set ('+noBrand+')</option>';
  Object.keys(bc).sort(function(a,b){ return a.toLowerCase().localeCompare(b.toLowerCase()); }).forEach(function(b){
    bh+='<option value="b:'+esc(b)+'"'+(S.pbf==='b:'+b?' selected':'')+'>'+esc(b)+' ('+bc[b]+')</option>';
  });
  var h='<div class="two" style="margin:0 0 10px">'+
    '<div class="field" style="margin:0"><label>Category</label><select id="pcatf">'+ch+'</select></div>'+
    '<div class="field" style="margin:0"><label>Brand</label><select id="pbrandf">'+bh+'</select></div></div>';
  if(S.pcf||S.pbf) h+='<div style="margin:-4px 0 10px"><button class="btn sm" data-act="partFiltClear">Clear filters</button></div>';
  if((noCat||noBrand)&&!S.pcf&&!S.pbf)
    h+='<div class="banner warn small" style="margin-bottom:10px"><b>'+
      (noCat?noCat+' part'+(noCat>1?'s':'')+' need a category':'')+(noCat&&noBrand?' \u00B7 ':'')+
      (noBrand?noBrand+' need a brand':'')+'.</b> Pick \u201CCategory not set\u201D or \u201CBrand not set\u201D above, open each part and press Edit.</div>';
  return h;
}

function deskParts(){
  var q=(S.pq||'').trim();
  var list=(q?findParts(q,''):PARTS.slice().sort(function(a,b){ return (b.updatedAt||0)-(a.updatedAt||0); })).filter(function(p){ return !isLabour(p); });
  list=list.filter(function(p){ return partCatMatch(p,S.pcf)&&partBrandMatch(p,S.pbf); });
  var h='<div class="searchbar" style="position:static;margin:0;padding:0 0 10px;border:0">'+
    '<input type="text" id="pq" placeholder="Part number or name" value="'+esc(S.pq||'')+'" autocomplete="off"></div>';
  if(!shelfParts().length) return h+'<div class="empty"><b>No parts yet.</b>They appear here on their own as you enter purchase bills.</div>';
  h+=partFilters();
  var fc=fitCoverage();
  if(fc.mapped<fc.total){

function unitOpts(sel){ return UNITS.map(function(u){ return '<option'+(u===sel?' selected':'')+'>'+u+'</option>'; }).join(''); }
/* ---------- GST 2.0 ----------
   The Council abolished the 12% and 28% slabs with effect from 22 September
   2025 and added 40% for demerit goods. Auto parts moved to a flat 18%, and
   motorcycles up to 350cc came down from 28% to 18%. The old slabs are kept
   selectable ONLY when a record already carries one, so a bill written under
   the old regime still shows the rate that was law on its date. Nothing new
   can be written at an abolished rate. */
var GST_SLABS=[0,5,18,40];
var GST_DEAD={12:'abolished 22 Sep 2025',28:'abolished 22 Sep 2025'};
function gstOpts(sel,prefix){
  sel=(sel===undefined||sel===null||sel==='')?sel:parseInt(sel,10);
  var list=GST_SLABS.slice();
  if(sel!==undefined&&sel!==null&&list.indexOf(sel)<0) list.push(sel);
  list.sort(function(a,b){ return a-b; });
  return list.map(function(r){
    var dead=GST_DEAD[r];
    return '<option value="'+r+'"'+(r===sel?' selected':'')+(dead&&r!==sel?' disabled':'')+'>'+
      (prefix||'')+r+'%'+(dead?' \u2014 '+dead:'')+'</option>';
  }).join('');
}
/* the rate the law expects today, by what is being sold */
function gstDefault(kind){
  var d=S.core.defaults;
  return kind==='part'?(d.gstRateParts||18):(d.gstRateLabour||18);
}

/* the two percentages, worked out live, never typed */
function inclOn(){
  var b=document.querySelector('#inclseg [aria-pressed="true"]');
  return b?b.dataset.v==='1':false;
}
function paintPCalc(){
  var box=document.getElementById('pcalc'); if(!box) return;
  var rate=toPaise(dg('prate')), mrp=toPaise(dg('pmrp')), sale=toPaise(dg('psale'));
  var gst=parseInt(dg('pgst')||0,10), conv=parseFloat(dg('pconv')||1)||1;
  var disc=parseFloat(dg('pdisc')||0)||0, incl=inclOn();
  if(!rate){ box.innerHTML='<div class="hint">The discount and margin appear once you put in the rate.</div>'; return; }
  var net=Math.round(rate*(1-disc/100));
  var netEx=(incl&&gst)?exTax(net,gst):net;
  var costPer=Math.round(netEx/conv);
  var paidIncl=(incl||!gst)?net:Math.round(net*(100+gst)/100);
  var saleEx=exTax(sale,gst);
  var mg=(costPer&&sale)?Math.round(((saleEx-costPer)/costPer)*1000)/10:null;
  var dc=discountPct(mrp,paidIncl);
  var warn='';
  /* a cost above MRP almost always means the tax toggle is the wrong way round */
  if(!incl&&gst&&mrp&&paidIncl>mrp*conv&&exTax(net,gst)<=mrp*conv)
    warn+='<div class="banner warn small" style="margin:8px 0 0"><b>Check the tax switch.</b> At this rate the part costs more than its MRP. '+
      'If the rate on the bill already includes GST, choose \u201cTax included\u201d.</div>';
  paintBatchPick(costPer);
  if(sale&&mrp&&sale>mrp) warn+='<div class="banner small" style="margin:8px 0 0;background:var(--red-bg);border-color:var(--red);color:var(--red)"><b>The selling price is above MRP.</b> You cannot charge more than MRP.</div>';
  else if(mg!==null&&mg<0) warn+='<div class="banner small" style="margin:8px 0 0;background:var(--red-bg);border-color:var(--red);color:var(--red)"><b>You would lose money on this.</b> The selling price is below what it cost.</div>';
  box.innerHTML='<div class="banner info small" style="margin:10px 0 0">'+
    '<div style="display:flex;gap:18px;flex-wrap:wrap">'+
    '<div><div class="eyebrow">Cost per '+esc(dg('punit')||'unit')+'</div><b class="money">'+money(costPer)+'</b> <span class="small">no tax</span></div>'+
    (disc?'<div><div class="eyebrow">Net rate paid</div><b class="money">'+money(paidIncl)+'</b> <span class="small">with tax</span></div>':'')+
    (can('reports')?'<div><div class="eyebrow">Supplier discount off MRP</div>'+pctTag(dc,20)+'</div>'+
      '<div><div class="eyebrow">Your margin</div>'+pctTag(mg,15)+'</div>':'')+'</div></div>'+warn;
}

async function editLineField(lineId,field,value){
  var j=S.job, l=findLine(j,lineId); if(!l) return;
  if(field==='rate'){
    if(!can('price.set')&&!can('price.override')){ toast('You cannot change a price','bad'); return; }
    if(stageIdx(j.stage)<1){ toast('Nothing can be priced at the entry stage','bad'); return; }
    var old=l.unit||0, nu=toPaise(value);
    if(old===nu) return;
    var listed=(l.partId?(partById(l.partId)||{}).sale:0)||0;
    l.unit=nu; l.pricedBy=S.user.id; l.pricedAt=Date.now();
    /* off the price list is worth the owner knowing about */
    if(listed&&nu!==listed){
      l.overridden={from:listed, to:nu, by:S.user.id, byName:S.user.name, at:Date.now()};
      logIt(j,'Price changed off the list',l.desc+': list '+money(listed)+' \u2192 charged '+money(nu));
      logAudit('Price','Price charged off the list',
        l.desc+' \u00B7 list '+money(listed)+' \u2192 '+money(nu),j.no); saveAudit();
    } else {
      if(l.overridden&&nu===listed) delete l.overridden;
      logIt(j,'Price changed',l.desc+': '+money(old)+' \u2192 '+money(nu)+' each');
    }
    if(j.stage==='work_listed') j.stage='priced';
  }
  if(field==='qty'){
    var oq=qtyNum(l.qty), nq=qtyNum(value); if(oq===nq) return;
    l.qty=nq;
    if(l.partId&&l.kind==='part'){
      moveIn({partId:l.partId, batchId:l.batchId||'', qty:oq-nq, kind:(nq>oq?'issue':'return'),
        ref:j.no, note:'quantity changed on the job card'});
      await saveStore('moves');
    }
    logIt(j,'Quantity changed',l.desc+': '+oq+' → '+nq);
  }
  if(field==='gst'){
    var og=l.gst||0, ng=parseInt(value,10)||0; if(og===ng) return;
    l.gst=ng; logIt(j,'GST rate changed',l.desc+': '+og+'% → '+ng+'%');
  }
  await saveJob(j); rerender();
}

/* ---------- signature pad ----------
   Drawn at device pixel ratio so it is not a blurry smear on a phone, and
   stored as a small mono PNG. Pointer events cover finger, stylus and the
   occasional mouse without three separate code paths. */
var SIGDIRTY=false;
function mountSigPad(){
  var cv=document.getElementById('sigpad'); if(!cv||!cv.getContext) return;
  SIGDIRTY=false;
  var r=window.devicePixelRatio||1, rect=cv.getBoundingClientRect();
  cv.width=Math.round(rect.width*r); cv.height=Math.round(rect.height*r);
  var x=cv.getContext('2d');
  /* a canvas with no drawing context must not bring the whole screen down */
  if(!x) return;
  x.scale(r,r); x.lineWidth=2.2; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#12171C';
  var down=false, last=null;
  function pt(e){ var b=cv.getBoundingClientRect(); return {x:e.clientX-b.left, y:e.clientY-b.top}; }
  cv.addEventListener('pointerdown',function(e){ down=true; last=pt(e); SIGDIRTY=true;
    try{ cv.setPointerCapture(e.pointerId); }catch(err){} e.preventDefault(); });
  cv.addEventListener('pointermove',function(e){ if(!down) return; var p=pt(e);
    x.beginPath(); x.moveTo(last.x,last.y); x.lineTo(p.x,p.y); x.stroke(); last=p; e.preventDefault(); });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    cv.addEventListener(ev,function(){ down=false; }); });
}
function sigClear(){
  var cv=document.getElementById('sigpad'); if(!cv) return;
  cv.getContext('2d').clearRect(0,0,cv.width,cv.height); SIGDIRTY=false;
}
function sigData(){
  var cv=document.getElementById('sigpad');
  if(!cv||!SIGDIRTY) return '';
  try{
    /* shrink to a sane width before storing — a full-res signature is
       tens of kilobytes for no benefit */
    var out=document.createElement('canvas');
    out.width=420; out.height=Math.round(420*cv.height/cv.width);
    out.getContext('2d').drawImage(cv,0,0,out.width,out.height);
    return out.toDataURL('image/png');
  }catch(e){ return ''; }
}

/* ---- keeping the customer told: what is done, what is left, what was added ---- */
var UPD_SKIP=['Customer updated','Viewed','Job card corrected'];
function updChanges(j){
  var since=j.lastUpdateAt||j.createdAt||0;
  return (j.log||[]).filter(function(e){ return (e.ts||e.at||0)>since&&UPD_SKIP.indexOf(e.action)<0; }).length;
}
function updText(j){
  var W=S.core.workshop, since=j.lastUpdateAt||0, ap=approvedLines(j);
  var done=ap.filter(function(l){ return l.done; }), left=ap.filter(function(l){ return !l.done; });
  var pend=(j.lines||[]).filter(function(l){ return !l.void&&!batchApproved(j,l.batch); });
  var added=(j.lines||[]).filter(function(l){ return !l.void&&since&&l.addedAt>since; });
  var fin=finTasks(j);
  var t='Namaste '+j.cust.name+',\n\nUpdate on your '+j.make+' '+j.model+' ('+regShow(j.reg)+') at '+W.name+'.\n'+
    'Now: '+stageName(j.stage)+'\n';
  if(done.length||fin.some(function(x){ return x.done; })){
    t+='\nDone:\n'+done.map(function(l){ return '\u2713 '+l.desc; }).join('\n');
    fin.filter(function(x){ return x.done; }).forEach(function(x){ t+='\n\u2713 '+x.label; });
    t+='\n';
  }
  if(left.length||fin.some(function(x){ return !x.done; })){
    t+='\nStill to do:\n'+left.map(function(l){ return '\u2022 '+l.desc; }).join('\n');
    fin.filter(function(x){ return !x.done; }).forEach(function(x){ t+='\n\u2022 '+x.label; });
    t+='\n';
  }
  if(added.length) t+='\nAdded since our last message:\n'+added.map(function(l){ return '+ '+l.desc+' \u2014 '+money(lineAmount(l)); }).join('\n')+'\n';
  if(pend.length) t+='\nWaiting for your OK:\n'+pend.map(function(l){ return '? '+l.desc+' \u2014 '+money(lineAmount(l)); }).join('\n')+'\n';
  var due=jobDue(j);
  t+='\nSo far: '+money(estimateTotal(j))+((j.advance&&j.advance.paise)?' \u00B7 advance '+money(j.advance.paise):'')+' \u00B7 balance '+money(Math.max(0,due));

/* One action makes every bill the job needs: a tax invoice for labour and
   for parts bought on a tax invoice, a plain bill for parts bought without
   one. Numbered and dated the moment it happens \u2014 which, for a job card,
   is when the bike is ready for delivery. */
function readyProblems(j){
  var out=[], ap=approvedLines(j);
  if(j.direct){ if(!ap.length) out.push('nothing on it yet'); }
  else {
    if(stageIdx(j.stage)<stageIdx('work_done')) out.push('the work is not finished');
    if(ap.some(function(l){ return !l.done; })) out.push('some work is not ticked done');
    if(pendingAdditions(j).length) out.push('waiting for the customer to approve extra work');
    var fo=finOpen(j); if(fo.length) out.push(fo.map(function(t){ return t.label.toLowerCase(); }).join(' and ')+' not done yet');
  }
  if(!allPriced(unbilledApproved(j))) out.push('an item has no price');
  if(!unbilledApproved(j).length) out.push('everything is already billed');
  if(j.cust.gstin&&!gstinCheck(j.cust.gstin).ok) out.push('the customer\u2019s GSTIN is not valid');
  if(j.direct&&j.channel==='online'&&!(j.ship&&j.ship.addr&&j.ship.stateCode)) out.push('the delivery address and state are missing');
  return out;
}
function readyModal(){
  var j=S.job, p=readyProblems(j);
  if(p.length){ toast('Not yet: '+p.join('; '),'bad'); return; }
  var sp=billSplit(j), T=function(ls){ return money(sumLines(ls)); };
  openModal('<h2>'+(j.direct?'Make the bill':'Ready for delivery')+'</h2>'+
    '<p class="muted small">The bills are made now, dated today, and can\u2019t be changed afterwards.</p>'+
    (sp.tax.length?'<div class="totrow"><span>Tax invoice \u00B7 '+sp.tax.length+' item'+(sp.tax.length>1?'s':'')+'</span><span class="money">'+T(sp.tax)+'</span></div>':'')+
    (sp.plain.length?'<div class="totrow"><span>Plain bill (no GST) \u00B7 '+sp.plain.length+' item'+(sp.plain.length>1?'s':'')+'</span><span class="money">'+T(sp.plain)+'</span></div>':'')+
    '<div class="btn-row" style="margin-top:14px"><button class="btn" data-act="closeModal">Cancel</button>'+
    '<button class="btn primary" data-act="readyDo">Make '+((sp.tax.length&&sp.plain.length)?'both bills':'the bill')+'</button></div>');
}
async function makeBill(j,type,lines){
  var W=S.core.workshop, cs=j.direct?supplyStateCode(j):custStateCode(j);
  var b={id:uid('bl'),type:type,status:'draft',number:'',lineIds:lines.map(function(l){return l.id;}),
    incl:S.core.defaults.pricesIncludeGst, inter:type==='gst'&&!!(cs&&cs!==W.stateCode), roundOff:S.core.defaults.roundOff,
    advance:0,payments:[],createdBy:S.user.id,createdAt:Date.now(),auto:true};
  j.bills.push(b);
  if(advanceLeft(j,b.id)>0){ var c0=billCalc(j,b); b.advance=Math.max(0,Math.min(advanceLeft(j,b.id),c0.grand)); }
  try{ b.number=await allocNumber(type==='gst'?'gst':'nongst'); }
  catch(e){ j.bills=j.bills.filter(function(x){ return x.id!==b.id; }); throw e; }
  b.status='final'; b.finalAt=Date.now(); b.finalBy=S.user.id; b.finalByName=S.user.name;
  var c=billCalc(j,b); b.snapshot=freezeBill(j,b,c);
  logIt(j,'Bill made',b.number+' \u00B7 '+money(c.grand)+(type==='gst'?' (tax invoice)':' (no GST)'));
  return b;
}
async function readyDo(){

  }catch(e){ toast(e.message,'bad'); await saveJob(j); rerender(); return; }
  if(!j.direct&&(j.stage==='work_done'||j.stage==='billed')){ j.stage='billed'; logIt(j,'Ready for delivery',made.map(function(b){ return b.number; }).join(', ')); }
  if(j.direct) j.stage='billed';
  await saveJob(j);
  S.view={name:'bill'}; window.scrollTo(0,0); render();
  toast(made.map(function(b){ return b.number; }).join(' and ')+' made','good');
  if(!j.direct&&made.length) notify(watchers(j).concat(j.mechanicId?[j.mechanicId]:[]),j,'ready',
    'made the bills \u2014 ready for delivery ('+made.map(function(b){ return b.number; }).join(', ')+')');
}

async function setBillAdvance(billId,val){

async function finalBillDo(billId){
  var j=S.job, b=j.bills.filter(function(x){return x.id===billId;})[0];
  if(!b||b.status!=='draft') return;
  closeModal();
  if(b.type==='gst'&&j.cust.gstin&&!gstinCheck(j.cust.gstin).ok){
    toast('The customer\u2019s GSTIN "'+j.cust.gstin+'" is not valid. Correct it on the job card first.','bad'); return;
  }
  try{
    b.number=await allocNumber(b.type==='gst'?'gst':'nongst');
  }catch(e){ toast(e.message,'bad'); return; }
  b.status='final'; b.finalAt=Date.now(); b.finalBy=S.user.id; b.finalByName=S.user.name;
  var c=billCalc(j,b);
  /* Freeze the invoice. Until now a finalised bill was recomputed from the
     live job every time it was opened or printed, so any later edit to a
     line — or a change to the workshop's default tax rate — would silently
     rewrite an invoice that had already gone to a customer and into a GST
     return. A tax invoice must say the same thing forever, so the figures,
     the rates and the seller's own details are copied in here and read from
     the copy from this moment on. */
  b.snapshot=freezeBill(j,b,c);
  if(j.stage==='work_done'||j.stage==='billed') j.stage='billed';
  logIt(j,'Bill finalised',b.number+' · '+money(c.grand)+(b.type==='gst'?' (tax invoice)':' (no GST)'));
  await saveJob(j); rerender(); toast('Bill '+b.number+' made','good');
}

var ONES=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen',
'Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
var TENS=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function w2(n){ return n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:''); }
function w3(n){ return (n>99?ONES[Math.floor(n/100)]+' Hundred'+(n%100?' ':''):'')+(n%100?w2(n%100):''); }
function inWords(paise){
  var r=Math.floor(paise/100), p=paise%100, out='';
  if(r===0) out='Zero';
  else{
    var cr=Math.floor(r/10000000); r%=10000000;
    var lk=Math.floor(r/100000);   r%=100000;
    var th=Math.floor(r/1000);     r%=1000;
    if(cr) out+=w3(cr)+' Crore ';
    if(lk) out+=w2(lk)+' Lakh ';
    if(th) out+=w3(th)+' Thousand ';
    if(r)  out+=w3(r);
  }
  out='Rupees '+out.trim().replace(/\s+/g,' ');
  if(p) out+=' and '+w2(p)+' Paise';
  return out+' only';
}

function printDoc(html){
  document.getElementById('printarea').innerHTML='<div class="doc">'+html+'</div>';
