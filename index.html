<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motoreez Job Cards</title>
<meta name="theme-color" content="#12171C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Motoreez">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="config.js"></script>
<style>
:root{
  /* Neutrals carry a trace of blue so white surfaces read as clean rather
     than yellowed under the fluorescent tubes a workshop actually has. */
  --ink:#12171C; --ink2:#3D4852; --steel:#78848F; --paper:#F2F5F7; --card:#FFFFFF;
  --rule:#DFE5EA; --rule2:#EDF1F4;
  --surface:#FFFFFF; --onink:#FFFFFF;
  /* Petrol green is the working colour: every button that commits something.
     It is calm enough to sit on screen all day and distinct from the
     red/amber/green that status badges need. */
  --brand:#0B6E5F; --brand-d:#08574B; --brand-lt:#E7F2F0; --brand-rim:#B9DBD4;
  /* Plate yellow is now identity only — the plate, the brand mark, a
     highlight. It stopped being the button colour because a screen where
     everything shouts has nothing left to shout with. */
  --hivis:#FFC933; --hivis-d:#D9A400;
  --red:#C9243F; --red-bg:#FDEDEF; --red-rim:#F3C2CA;
  --green:#0B7D57; --green-bg:#E6F4EE; --green-rim:#B4DCC9;
  --blue:#1D5FA8; --blue-bg:#EAF1FA; --blue-rim:#BFD5EE;
  --amber:#9A5B00; --amber-bg:#FDF3E2; --amber-rim:#EFD4A6;
  --shadow-sm:0 1px 2px rgba(16,24,32,.07), 0 1px 1px rgba(16,24,32,.04);
  --shadow-md:0 2px 4px rgba(16,24,32,.06), 0 6px 16px rgba(16,24,32,.07);
  --shadow-lg:0 8px 28px rgba(16,24,32,.14);
  --r:12px; --r-sm:9px; --r-lg:16px;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, "Courier New", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --tap:56px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink)}
h1,h2,h3{margin:0; font-weight:750; letter-spacing:-.025em}
a{color:var(--blue)}

/* ---------- utility type ---------- */
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--steel)}
.muted{color:var(--steel)}
.small{font-size:14px}
.big{font-size:22px; font-weight:800}
.money{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap}
.right{text-align:right}
.hide{display:none !important}

/* ---------- shell ---------- */
.wrap{max-width:1120px; margin:0 auto; padding:0 12px 140px}
.topbar{
  position:sticky; top:0; z-index:40; background:var(--ink); color:var(--onink);
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
}
.topbar-in{max-width:1120px; margin:0 auto; display:flex; align-items:center; gap:10px}
.brand{font-weight:900; letter-spacing:-.03em; font-size:20px; color:var(--onink)}
.brand span{color:var(--hivis)}
.whoami{margin-left:auto; display:flex; align-items:center; gap:8px; font-size:13px; color:#C9CFD4}
.whoami b{color:var(--onink)}
.role-pill{background:var(--hivis); color:var(--ink); font-weight:800; font-size:11px; letter-spacing:.08em;
  text-transform:uppercase; padding:4px 8px; border-radius:3px; color:#000}

/* ---------- number plate (signature element) ---------- */
.plate{
  display:inline-flex; align-items:center; gap:6px; background:var(--hivis); color:#000;
  border:2.5px solid #111; border-radius:6px; padding:5px 10px 4px;
  font-family:var(--mono); font-weight:800; font-size:19px; letter-spacing:.06em; line-height:1;
  box-shadow:inset 0 0 0 2px var(--hivis);
}
.plate.sm{font-size:15px; padding:4px 8px 3px; border-width:2px}
.plate.lg{font-size:26px; padding:8px 14px 7px}

/* ---------- cards / sections ---------- */
.card{background:var(--card); border:1px solid var(--rule); border-radius:var(--r); margin:14px 0; overflow:hidden; box-shadow:var(--shadow-sm)}
.card-h{display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--rule); background:var(--card)}
.card-h h2{font-size:15px; font-weight:700; letter-spacing:-.01em; text-transform:none}
.card-b{padding:16px}
.card-b.tight{padding:0}
.sub{border-top:1px solid var(--rule2); padding:12px 14px}
.grid2{display:grid; grid-template-columns:1fr; gap:12px}
@media(min-width:820px){ .grid2{grid-template-columns:1fr 1fr; gap:16px} .grid2 .card{margin:0 0 16px} }

/* ---------- forms ---------- */
.field{margin:0 0 14px}
.field label{display:block; font-size:13px; font-weight:700; letter-spacing:0; text-transform:none;
  color:var(--ink2); margin-bottom:7px}
.req::after{content:"·required"; color:var(--red); font-size:10px; margin-left:6px; letter-spacing:.04em}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%; min-height:52px; padding:11px 13px; border:1px solid var(--rule);
  border-radius:var(--r-sm); background:var(--surface); font-weight:600;
  transition:border-color .12s ease, box-shadow .12s ease;
}
textarea{min-height:96px; padding:12px; line-height:1.45; font-weight:500}
input:focus,select:focus,textarea:focus{outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-rim)}
input.mono{font-family:var(--mono); letter-spacing:.08em; text-transform:uppercase; font-weight:800}
input:disabled,select:disabled{background:#F1F3F4; color:var(--steel)}
select{-webkit-appearance:none; appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 20px) 24px,calc(100% - 14px) 24px; background-size:6px 6px,6px 6px;
  background-repeat:no-repeat; padding-right:40px}
select optgroup{font-weight:800; color:var(--steel)}
select option{font-weight:600; color:var(--ink)}
.hint{font-size:13px; color:var(--steel); margin-top:6px}
.two{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.three{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}

/* segmented + chips: fat targets for gloves */
.seg{display:flex; gap:4px; padding:4px; border:1px solid var(--rule); border-radius:var(--r); background:var(--paper)}
.seg button{flex:1; min-height:48px; border:0; border-radius:var(--r-sm); background:transparent;
  font-weight:800; cursor:pointer}
.seg button:last-child{}
.seg button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:var(--shadow-sm)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{min-height:44px; padding:9px 15px; border:1px solid var(--rule); border-radius:22px; background:var(--surface);
  font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:8px}
.chip[aria-pressed="true"]{background:var(--brand-lt); border-color:var(--brand); color:var(--brand-d)}
.chip.filter[aria-pressed="true"]{background:var(--ink); color:var(--onink); border-color:var(--ink)}

/* ---------- buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px;
  padding:12px 18px; border:1px solid var(--rule); border-radius:var(--r-sm); background:var(--surface); color:var(--ink);
  font-weight:700; letter-spacing:.005em; cursor:pointer; text-decoration:none; box-shadow:var(--shadow-sm);
  transition:background .12s ease, border-color .12s ease}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand); color:#fff; border-color:var(--brand); box-shadow:var(--shadow-sm)}
.btn.primary:active{background:var(--brand-d); box-shadow:none}
.btn.dark{background:var(--ink); color:var(--onink)}
.btn.danger{background:var(--surface); color:var(--red); border-color:var(--red-rim)}
.btn.go{background:var(--green); color:#fff; border-color:var(--green); box-shadow:var(--shadow-sm)}
.btn.go:active{box-shadow:none}
.btn.lg{min-height:60px; font-size:18px; width:100%}
.btn.sm{min-height:40px; padding:8px 13px; font-size:15px; border-width:1px; border-radius:var(--r-sm)}
.btn[disabled]{opacity:.4; cursor:not-allowed; box-shadow:none}
.btn-row{display:flex; gap:10px; flex-wrap:wrap}
.btn-row .btn{flex:1; min-width:150px}

.actionbar{position:fixed; left:0; right:0; bottom:0; z-index:50; background:rgba(242,245,247,.92);
  backdrop-filter:blur(14px) saturate(1.4); border-top:1px solid var(--rule);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));}
.actionbar-in{max-width:1120px; margin:0 auto; display:flex; gap:10px}
.actionbar .btn{flex:1}

/* ---------- status ---------- */
.tag{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  padding:4px 9px; border-radius:999px; border:1px solid; white-space:nowrap}
.t-grey{background:var(--rule2); color:var(--ink2); border-color:var(--rule)}
.t-yellow{background:var(--hivis); color:#000; border-color:#000}
.t-blue{background:var(--blue-bg); color:var(--blue); border-color:var(--blue-rim)}
.t-green{background:var(--green-bg); color:var(--green); border-color:var(--green-rim)}
.t-red{background:var(--red-bg); color:var(--red); border-color:var(--red-rim)}
.t-amber{background:var(--amber-bg); color:var(--amber); border-color:var(--amber-rim)}

/* hazard tape — only for work stopped */
.hazard{height:14px; background:repeating-linear-gradient(45deg,var(--hivis) 0 16px,var(--ink) 16px 32px);
  background-size:45px 45px; animation:tape 1.4s linear infinite}
@keyframes tape{to{background-position:45px 0}}
.stopbox{border:1px solid var(--red-rim); border-left:4px solid var(--red); border-radius:var(--r); background:var(--red-bg); margin:14px 0}
.stopbox .in{padding:14px}
.stopbox h2{color:var(--red); font-size:20px}
@media (prefers-reduced-motion:reduce){ .hazard{animation:none} .btn:active{transform:none} }

/* ---------- job list ---------- */
.jobrow{display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--rule); box-shadow:var(--shadow-sm);
  border-radius:var(--r); padding:14px; margin:10px 0; cursor:pointer; transition:border-color .12s ease}
.jobrow:active{transform:translateY(1px); border-color:var(--brand-rim)}
.jobrow .l1{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.jobrow .l2{margin-top:8px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:15px; color:var(--ink2)}
.jobrow .jid{font-family:var(--mono); font-size:12px; color:var(--steel); font-weight:700}

/* ---------- tables (parts & labour) ---------- */
.lines{width:100%; border-collapse:collapse}
.lines th{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--steel); text-align:left;
  padding:9px 10px; border-bottom:1px solid var(--rule)}
.lines td{padding:10px; border-bottom:1px solid var(--rule2); vertical-align:middle}
.lines tr:last-child td{border-bottom:0}
.lines .num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
.lines input{min-height:46px; padding:6px 8px}
.lines input.qty{width:76px; text-align:right}
.lines input.rate{width:108px; text-align:right; font-family:var(--mono)}
.linekind{font-size:10px; font-weight:900; letter-spacing:.1em; padding:3px 6px; border-radius:3px; border:1px solid}
.k-part{background:#EDF3F8; color:var(--blue); border-color:var(--blue)}
.k-labour{background:#F4EFE6; color:var(--amber); border-color:var(--amber)}
.totrow{display:flex; justify-content:space-between; gap:16px; padding:7px 0; font-size:16px}
.totrow.grand{border-top:1px solid var(--rule); margin-top:10px; padding-top:13px; font-size:21px; font-weight:750}

/* ---------- stepper ---------- */
.steps{display:flex; overflow-x:auto; gap:6px; padding:2px 0 6px; scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:7px 10px; border:2px solid var(--rule);
  border-radius:4px; background:var(--surface); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
  color:var(--steel)}
.step b{font-family:var(--mono); font-size:11px}
.step.done{border-color:var(--green); color:var(--green); background:var(--green-bg)}
.step.now{border-color:var(--ink); background:var(--hivis); color:#000}

/* ---------- log ---------- */
.log{list-style:none; margin:0; padding:0}
.log li{padding:10px 0; border-bottom:1px solid var(--rule2); font-size:15px; display:flex; gap:10px}
.log li:last-child{border-bottom:0}
.log .when{font-family:var(--mono); font-size:12px; color:var(--steel); flex:0 0 116px}

/* ---------- attendance register ---------- */
table.att{border-collapse:collapse; font-size:13px}
table.att th{padding:6px 4px; font-size:11px; color:var(--steel); border-bottom:2px solid var(--rule); text-align:center}
table.att th.wo{background:var(--hivis); color:#000; font-weight:900}
table.att th.nm,table.att td.nm{text-align:left; padding:8px 10px; position:sticky; left:0; background:var(--surface); z-index:2;
  border-right:2px solid var(--rule); min-width:150px}
table.att td{padding:2px; text-align:center; border-bottom:1px solid var(--rule2)}
.att-b{display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px;
  border:2px solid var(--ink); border-radius:5px; font-weight:900; font-size:12px; cursor:pointer; background:var(--surface)}
.att-b.faint{opacity:.42}
.att-b[disabled]{opacity:.15; cursor:not-allowed}
.att-b.s-P{background:var(--green-bg); color:var(--green); border-color:var(--green)}
.att-b.s-H{background:var(--amber-bg); color:var(--amber); border-color:var(--amber)}
.att-b.s-L{background:var(--blue-bg); color:var(--blue); border-color:var(--blue)}
.att-b.s-W{background:#EEF1F3; color:var(--steel); border-color:var(--rule)}
.att-b.s-A{background:var(--red-bg); color:var(--red); border-color:var(--red)}

/* ---------- desk ---------- */
.linkish{background:none;border:0;padding:0;font:inherit;font-weight:800;color:var(--blue);
  text-decoration:underline;text-underline-offset:2px;cursor:pointer;text-align:left}
.lines td .small{line-height:1.35}
#pcalc .eyebrow{margin-bottom:2px}
details summary:hover{color:var(--ink)}

/* ---------- price-list search results ---------- */
.presults{margin-top:10px; max-height:46vh; overflow:auto}
.partrow{display:flex; align-items:center; gap:12px; width:100%; text-align:left; min-height:60px;
  padding:10px 12px; margin-bottom:8px; border:2px solid var(--rule); border-radius:6px; background:var(--surface); cursor:pointer}
.partrow:active{background:var(--hivis); border-color:var(--ink); color:#000}
details summary::-webkit-details-marker{display:none}
details summary{list-style:none; border-top:1px solid var(--rule2)}
details[open] summary{color:var(--ink)}

/* ---------- a field the app is still waiting on ---------- */
.field.bad label{color:var(--red)}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--red); background:var(--red-bg)}
.field.bad .tiles{outline:3px solid var(--red); outline-offset:5px; border-radius:8px}
.field.bad label::after{content:" \2190 needed"; color:var(--red); font-size:10px; letter-spacing:.04em}
.field.bad label.req::after{content:" \2190 needed"}

/* ---------- pick-one and tick-many tiles ---------- */
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:8px}
@media(min-width:640px){ .tiles{grid-template-columns:1fr 1fr 1fr} }
.tile{display:flex; align-items:center; gap:9px; min-height:60px; padding:10px 12px; border:2px solid var(--rule);
  border-radius:6px; background:var(--surface); font-weight:700; font-size:15px; line-height:1.2; text-align:left;
  cursor:pointer; color:var(--ink)}
.tile:active{transform:translate(1px,1px)}
.tile[aria-pressed="true"]{background:var(--hivis); border-color:var(--ink); color:#000; box-shadow:2px 2px 0 var(--ink)}
.tile .box{flex:0 0 24px; height:24px; border:2px solid var(--ink); border-radius:4px; background:var(--surface);
  display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:900; color:transparent}
.tile[aria-pressed="true"] .box{background:var(--ink); color:var(--hivis)}
.tile.one{justify-content:flex-start; border-left-width:6px}
.tile.one[aria-pressed="true"]{border-left-color:var(--ink)}

/* ---------- voice recorder ---------- */
.voicebox{border:2px dashed var(--rule); border-radius:6px; padding:12px; margin-top:10px; background:#F7F9FA}
.voicebox:empty{display:none}
.voicebox.live{border:3px solid var(--red); border-style:solid; background:var(--red-bg)}
.reclight{width:16px; height:16px; border-radius:50%; background:var(--red); display:inline-block;
  animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}
.vtime{font-family:var(--mono); font-weight:800; font-size:22px; color:var(--red)}
.veq{display:flex; gap:3px; align-items:flex-end; height:30px; margin:12px 0 8px}
.veq i{flex:1; background:var(--red); border-radius:2px; height:25%; transform-origin:bottom;
  animation:eq .85s ease-in-out infinite}
@keyframes eq{0%,100%{height:18%}50%{height:100%}}
.voicebox audio{border-radius:6px}
@media (prefers-reduced-motion:reduce){ .veq i{animation:none;height:55%} .reclight{animation:none} }

/* ---------- login ---------- */
.login{max-width:420px; margin:0 auto; padding:28px 16px 60px}
.userpick{display:grid; gap:10px; margin:18px 0}
.userpick button{display:flex; align-items:center; gap:12px; min-height:64px; padding:10px 14px;
  border:2px solid var(--ink); border-radius:6px; background:var(--surface); cursor:pointer; text-align:left}
.userpick button[aria-pressed="true"]{background:var(--hivis); color:#000; box-shadow:3px 3px 0 var(--ink)}
.userpick .nm{font-weight:800}
.pinpad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px}
.pinpad button{min-height:66px; font-size:24px; font-weight:800; border:2px solid var(--ink);
  border-radius:6px; background:var(--surface); cursor:pointer}
.pinpad button:active{background:var(--hivis); color:#000}
.pindots{display:flex; gap:12px; justify-content:center; margin:16px 0 4px}
.pindots i{width:18px; height:18px; border:2px solid var(--ink); border-radius:50%; background:var(--surface)}
.pindots i.on{background:var(--ink)}

/* ---------- modal / toast ---------- */
.scrim{position:fixed; inset:0; background:rgba(10,12,14,.55); z-index:80; display:flex; align-items:flex-end;
  justify-content:center; padding:0}
@media(min-width:700px){ .scrim{align-items:center; padding:20px} }
.sheet{background:var(--card); border:2px solid var(--ink); border-radius:10px 10px 0 0; width:100%;
  max-width:560px; max-height:92vh; overflow:auto; padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){ .sheet{border-radius:10px} }
.sheet h2{font-size:19px; margin-bottom:4px}
#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:96px; z-index:99; display:flex;
  flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:calc(100% - 24px); max-width:460px}
.toast{background:var(--ink); color:var(--onink); border-radius:6px; padding:12px 16px; font-weight:700; font-size:15px;
  box-shadow:0 6px 18px rgba(0,0,0,.3); width:100%}
.toast.bad{background:var(--red)}
.toast.good{background:var(--green)}

.searchbar{position:sticky; top:0; z-index:30; background:var(--paper); padding:12px 0 8px; margin:0 -12px;
  padding-left:12px; padding-right:12px; border-bottom:1px solid var(--rule)}
.searchbar input{min-height:60px; font-size:19px; font-weight:800; border-color:var(--ink)}
.empty{text-align:center; padding:40px 20px; color:var(--steel)}
.empty b{display:block; color:var(--ink); font-size:19px; margin-bottom:6px}
.kv{display:flex; justify-content:space-between; gap:14px; padding:9px 0; border-bottom:1px solid var(--rule2)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--steel); font-size:14px; font-weight:700}
.kv .v{font-weight:700; text-align:right}
.banner{border:1px solid var(--amber-rim); border-left:4px solid var(--hivis-d); border-radius:var(--r); padding:13px 15px; margin:14px 0; background:var(--amber-bg); color:var(--ink)}
.banner.info{background:var(--blue-bg); border-color:var(--blue-rim); border-left-color:var(--blue); color:var(--ink)}
.banner.ok{background:var(--green-bg); border-color:var(--green-rim); border-left-color:var(--green); color:var(--ink)}
.banner.warn{background:var(--amber-bg); border-color:var(--amber-rim); border-left-color:var(--amber); color:var(--ink)}

/* ---------- night shift ----------
   The plate stays yellow-on-black in both themes: it is the one thing
   everyone identifies a bike by, so it must never change appearance. */
:root[data-theme="dark"]{
  --ink:#EEF2F5; --ink2:#BAC4CC; --steel:#7E8B95; --paper:#0D1114; --card:#171C21;
  --surface:#171C21; --onink:#0D1114;
  --rule:#2C343A; --rule2:#222930;
  --brand:#2FA98F; --brand-d:#248B76; --brand-lt:#122925; --brand-rim:#2A5C53;
  --red:#FF7183; --red-bg:#3B1F25; --red-rim:#5E2C35;
  --green:#43CE93; --green-bg:#12312A; --green-rim:#255744;
  --blue:#7FC2F0; --blue-bg:#122A3A; --blue-rim:#26506E;
  --amber:#F0B564; --amber-bg:#332612; --amber-rim:#5C452166;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 2px 6px rgba(0,0,0,.45);
  --shadow-lg:0 10px 30px rgba(0,0,0,.55);
}
:root[data-theme="dark"] .btn.primary,
:root[data-theme="dark"] .btn.go{color:#08120F}
:root[data-theme="dark"] .seg{background:#11161A}
:root[data-theme="dark"] .card-h{background:var(--card)}
:root[data-theme="dark"] input:disabled,
:root[data-theme="dark"] select:disabled{background:#22282D; color:var(--steel)}
:root[data-theme="dark"] .empty b{color:var(--ink)}
:root[data-theme="dark"] .searchbar{background:var(--paper)}
:root[data-theme="dark"] .actionbar,
:root[data-theme="dark"] .navbar{background:rgba(13,17,20,.9)}
:root[data-theme="dark"] .voicebox{background:#1C2226}
:root[data-theme="dark"] .doc{background:#fff; color:#000}

/* ---------- bottom navigation ----------
   Five destinations at most, thumb-height, always in the same order so
   muscle memory survives a role change. The intake button is separate
   and larger because it starts every other flow in the app. */
.navbar{position:fixed; left:0; right:0; bottom:0; z-index:50; background:rgba(242,245,247,.92);
  backdrop-filter:blur(14px) saturate(1.4); border-top:1px solid var(--rule);
  padding:6px 8px calc(4px + env(safe-area-inset-bottom))}
.navbar-in{max-width:1120px; margin:0 auto; display:flex; align-items:flex-end; gap:2px}
.navbtn{flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; min-height:54px; padding:6px 2px 4px; border:0; background:none; cursor:pointer; color:var(--steel);
  font-family:inherit; font-weight:800; font-size:10px; letter-spacing:.06em; text-transform:uppercase;
  border-radius:6px; position:relative}
.navbtn .ico{font-size:19px; line-height:1}
.navbtn .lbl{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.navbtn[aria-current="page"]{color:var(--brand-d); background:var(--brand-lt)}
.navbtn:active{transform:translateY(1px)}
.navbtn .dot{position:absolute; top:3px; right:calc(50% - 20px); min-width:17px; height:17px; padding:0 4px;
  border-radius:9px; background:var(--red); color:#fff; font-size:10px; font-weight:900; line-height:17px}
.navfab{flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:7px; min-height:52px;
  padding:0 17px; margin:0 2px; border:1px solid var(--brand); border-radius:var(--r); background:var(--brand);
  color:#fff; font-family:inherit; font-weight:750; font-size:14px; cursor:pointer;
  box-shadow:var(--shadow-md); white-space:nowrap}
.navfab:active{background:var(--brand-d); transform:translateY(1px)}
@media(max-width:400px){ .navfab{padding:0 11px; font-size:13px} .navbtn{font-size:9px} }
/* the bar sits on top of the page, so the page has to end above it */
.wrap{padding-bottom:152px}
/* a screen with both: its own action bar rides on top of the navigation */
body.hasnav .actionbar{bottom:calc(66px + env(safe-area-inset-bottom)); border-bottom:1px solid var(--rule)}
body.hasnav .wrap{padding-bottom:230px}
body.hasnav #toast{bottom:calc(150px + env(safe-area-inset-bottom))}
/* the topbar gained two icon buttons; the name is the first thing to go */
@media(max-width:560px){ .hidesm{display:none !important} }

/* ---------- a button that is mid-save ----------
   Two taps on a slow connection is the single easiest way to create a
   duplicate job card, so the button locks itself until the write lands. */
.btn[aria-busy="true"],.navfab[aria-busy="true"]{opacity:.62; pointer-events:none; position:relative}
.btn[aria-busy="true"]::after,.navfab[aria-busy="true"]::after{
  content:""; width:15px; height:15px; margin-left:9px; border-radius:50%;
  border:2.5px solid currentColor; border-right-color:transparent; animation:spin .62s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .btn[aria-busy="true"]::after,.navfab[aria-busy="true"]::after{animation:none; border-right-color:currentColor; opacity:.45}
}

/* ---------- desk-width layout ----------
   The owner does the reading on a laptop. Give the tables the room. */
@media(min-width:1180px){
  .wrap{max-width:1320px}
  .topbar-in,.actionbar-in,.navbar-in{max-width:1320px}
  .grid2{grid-template-columns:1fr 1fr}
  .lines th,.lines td{padding:8px 12px}
  .lines td{font-size:15px}
  body{font-size:16px}
}
@media(min-width:820px){
  .navbar{padding-top:8px}
  .navbtn{flex-direction:row; gap:8px; font-size:12px; min-height:50px}
  .navbtn .ico{font-size:17px}
  .navbtn .dot{position:static; margin-left:2px}
}

/* ---------- days on site ---------- */
.dwell{display:inline-flex; align-items:center; gap:4px; font-family:var(--mono); font-size:11px; font-weight:700;
  letter-spacing:.02em; padding:3px 8px; border-radius:999px; border:1px solid var(--rule); color:var(--steel);
  background:var(--surface); white-space:nowrap}
.dwell.warn{border-color:var(--amber-rim); color:var(--amber); background:var(--amber-bg)}
.dwell.bad{border-color:var(--red-rim); color:var(--red); background:var(--red-bg)}

/* ---------- job chat ---------- */
.msgs{display:flex; flex-direction:column; gap:6px; padding:6px 0 18px}
.msg{max-width:84%; align-self:flex-start; background:var(--card); border:1px solid var(--rule);
  border-radius:16px 16px 16px 5px; padding:8px 12px; box-shadow:var(--shadow-sm)}
.msg.me{align-self:flex-end; background:var(--brand-lt); border-color:var(--brand-rim); border-radius:16px 16px 5px 16px}
.msg .who{font-size:12px; font-weight:750; color:var(--brand-d); margin-bottom:2px}
.msg .who span{font-weight:600; color:var(--steel)}
.msg .txt{white-space:pre-wrap; overflow-wrap:anywhere; font-size:15.5px; line-height:1.4}
.msg .meta{font-size:11px; color:var(--steel); margin-top:4px; text-align:right}
.msg.gone{font-style:italic; font-size:13px; color:var(--steel); background:transparent; box-shadow:none; border-style:dashed}
.imgbtn{display:block; padding:0; border:0; background:none; cursor:zoom-in; margin:2px 0 4px}
.msg img.thumb{display:block; width:240px; max-width:100%; height:auto; border-radius:10px; background:var(--rule2)}
.voicebtn{display:flex; align-items:center; gap:10px; min-height:44px; padding:6px 14px 6px 8px; border-radius:22px;
  border:1px solid var(--brand-rim); background:var(--surface); color:var(--brand-d); font:inherit; font-weight:700; cursor:pointer}
.voicebtn svg{width:20px; height:20px; fill:currentColor}
.filechip{display:flex; align-items:center; gap:10px; width:240px; max-width:100%; padding:9px 11px; border:1px solid var(--rule);
  border-radius:10px; background:var(--surface); color:var(--ink); font:inherit; cursor:pointer; text-align:left}
.filechip svg{flex:0 0 auto; color:var(--steel)}
.daysep{align-self:center; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--steel);
  background:var(--rule2); padding:4px 11px; border-radius:999px; margin:12px 0 4px}
.composer{display:flex; align-items:flex-end; gap:6px; width:100%}
.composer textarea{flex:1; min-width:0; min-height:48px; max-height:132px; resize:none; padding:12px 15px;
  border-radius:24px; font-weight:500; line-height:1.4}
.ibtn{flex:0 0 48px; width:48px; height:48px; border-radius:50%; border:1px solid var(--rule); background:var(--surface);
  color:var(--ink2); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px; padding:0}
.ibtn:active{transform:translateY(1px)}
.ibtn.send{background:var(--brand); color:#fff; border-color:var(--brand)}
:root[data-theme="dark"] .ibtn.send{color:#08120F}
.recbar{flex:1; min-width:0; display:flex; align-items:center; gap:10px; height:48px; padding:0 14px; border-radius:24px;
  background:var(--red-bg); border:1px solid var(--red-rim); overflow:hidden; white-space:nowrap}
.chatbadge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800; padding:3px 8px;
  border-radius:999px; background:var(--brand); color:#fff; white-space:nowrap}
:root[data-theme="dark"] .chatbadge{color:#08120F}

/* ---------- print ---------- */
#printarea{display:none}
@media print{
  :root{--surface:#fff}
  html[data-theme="dark"]{--ink:#000; --ink2:#000; --steel:#444; --surface:#fff; --card:#fff}
  body{background:#fff; font-size:12px; color:#000}
  .topbar,.actionbar,.navbar,.wrap,#toast,.scrim{display:none !important}
  #printarea{display:block; padding:0; margin:0}
  .doc{width:100%; color:#000}
  .doc .plate{box-shadow:none}
  @page{size:A4; margin:12mm}
}
/* Most workshops print on an 80mm roll, not A4. Same document, narrower
   plate, no side margins, and the two-column header stacks. */
@media print{
  body.thermal .doc{font-size:11px}
  body.thermal .doc .head{display:block; border-bottom:2px solid #000}
  body.thermal .doc .head>div+div{margin-top:7px}
  body.thermal .doc h1{font-size:16px}
  body.thermal .doc .plate{font-size:15px; border-width:2px; padding:3px 7px}
  body.thermal .doc th,body.thermal .doc td{padding:3px 4px; font-size:10px}
  body.thermal .doc .sign{display:block; margin-top:22px}
  body.thermal .doc .sign div{width:100%; margin-bottom:16px}
  body.thermal .hidethermal{display:none !important}
}
body.thermal{--tap:44px}
.doc{background:#fff; color:#000; font-size:13px}
.doc h1{font-size:22px}
.doc table{width:100%; border-collapse:collapse; margin-top:10px}
.doc th,.doc td{border:1px solid #000; padding:6px 8px; font-size:12px}
.doc th{background:#eee; text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em}
.doc .num{text-align:right; font-family:var(--mono)}
.doc .head{display:flex; justify-content:space-between; gap:20px; border-bottom:3px solid #000; padding-bottom:10px}
.doc .sign{margin-top:34px; display:flex; justify-content:space-between; gap:30px}
.doc .sign div{border-top:1px solid #000; padding-top:6px; width:44%; font-size:11px}

/* ---------- inspection (DVI) ---------- */
.insp{border:1px solid var(--rule); border-radius:var(--r); margin:10px 0; overflow:hidden; background:var(--card)}
.insp-h{display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; width:100%; border:0;
  background:none; font-family:inherit; font-size:16px; font-weight:700; text-align:left; color:var(--ink)}
.insp-h .nm{flex:1; min-width:0}
.lamp{width:12px; height:12px; border-radius:50%; flex:0 0 auto; border:1px solid rgba(0,0,0,.15)}
.lamp.ok{background:var(--green)} .lamp.soon{background:var(--amber)}
.lamp.now{background:var(--red)} .lamp.na{background:var(--rule)}
.insp-b{padding:0 14px 14px; border-top:1px solid var(--rule2)}
.rag{display:flex; gap:6px; margin:10px 0}
.rag button{flex:1; min-height:46px; border:1px solid var(--rule); border-radius:var(--r-sm); background:var(--surface);
  font-family:inherit; font-weight:700; font-size:14px; cursor:pointer; color:var(--ink2)}
.rag button[aria-pressed="true"].r-ok{background:var(--green-bg); border-color:var(--green); color:var(--green)}
.rag button[aria-pressed="true"].r-soon{background:var(--amber-bg); border-color:var(--amber); color:var(--amber)}
.rag button[aria-pressed="true"].r-now{background:var(--red-bg); border-color:var(--red); color:var(--red)}
.shots{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.shot{position:relative; width:78px; height:78px; border-radius:var(--r-sm); overflow:hidden; border:1px solid var(--rule)}
.shot img{width:100%; height:100%; object-fit:cover; display:block}
.shot button{position:absolute; top:2px; right:2px; width:22px; height:22px; min-height:22px; padding:0;
  border-radius:50%; border:0; background:rgba(0,0,0,.65); color:#fff; font-size:13px; line-height:1; cursor:pointer}
.addshot{width:78px; height:78px; border:1px dashed var(--rule); border-radius:var(--r-sm); background:var(--surface);
  font-size:22px; color:var(--steel); cursor:pointer; display:flex; align-items:center; justify-content:center}
.ragbar{display:flex; height:8px; border-radius:999px; overflow:hidden; background:var(--rule2); margin:10px 0}
.ragbar i{display:block; height:100%}

/* ---------- signature ---------- */
.sigpad{width:100%; height:170px; border:1px dashed var(--rule); border-radius:var(--r); background:var(--surface);
  touch-action:none; display:block}

/* ---------- QR ---------- */
.qrbox{display:inline-block; padding:10px; background:#fff; border:1px solid var(--rule); border-radius:var(--r-sm)}
.qrbox svg{display:block; width:150px; height:150px; shape-rendering:crispEdges}

/* ---------- slot picker (appointments) ---------- */
.slots{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px}
.slot{min-height:46px; border:1px solid var(--rule); border-radius:var(--r-sm); background:var(--surface);
  font-family:var(--mono); font-weight:700; font-size:14px; cursor:pointer; color:var(--ink)}
.slot[aria-pressed="true"]{background:var(--brand); color:#fff; border-color:var(--brand)}
.slot[disabled]{opacity:.34; cursor:not-allowed}
.daystrip{display:flex; gap:8px; overflow-x:auto; padding:4px 0 8px; -webkit-overflow-scrolling:touch}
.dayb{flex:0 0 auto; min-width:62px; min-height:62px; border:1px solid var(--rule); border-radius:var(--r);
  background:var(--surface); cursor:pointer; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:2px; font-family:inherit; color:var(--ink)}
.dayb b{font-size:19px; font-weight:750}
.dayb span{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--steel)}
.dayb[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:#fff}
.dayb[aria-pressed="true"] span{color:rgba(255,255,255,.8)}
.dayb i{font-style:normal; font-size:10px; font-weight:700; color:var(--brand)}
.dayb[aria-pressed="true"] i{color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalroot"></div>
<div id="toast"></div>
<div id="printarea"></div>
<script>
/* =====================================================================
   MOTOREEZ JOB CARD SYSTEM
   Money is ALWAYS stored as whole paise (integers). Never floats.
   ===================================================================== */


/* ---------- QR code ----------
   Byte mode, error-correction level M, versions 1-14. Written out rather
   than pulled from a CDN because the app has to keep working when the
   workshop's connection does not, and a payment QR that fails to draw is
   worse than no QR at all.
   Returns a square matrix of 0/1. */
function qrEncode(text){
  var data=[],i;
  for(i=0;i<text.length;i++){
    var c=text.charCodeAt(i);
    if(c<128) data.push(c);
    else if(c<2048){ data.push(192|(c>>6)); data.push(128|(c&63)); }
    else { data.push(224|(c>>12)); data.push(128|((c>>6)&63)); data.push(128|(c&63)); }
  }
  /* total codewords, ec codewords per block, block counts — level M */
  var SPEC=[
    null,
    [26,10,1,0],[44,16,1,0],[70,26,1,0],[100,18,2,0],[134,24,2,0],
    [172,16,4,0],[196,18,4,0],[242,22,2,2],[292,22,3,2],[346,26,4,1],
    [404,30,1,4],[466,22,6,2],[532,22,8,1],[581,24,4,5]
  ];
  var ver=0, cap=0;
  for(var v=1;v<=14;v++){
    var s=SPEC[v], nb=s[2]+s[3], total=s[0]-s[1]*nb;
    var lenBits=(v<10)?8:16;
    var avail=total*8-4-lenBits;
    if(data.length*8<=avail){ ver=v; cap=total; break; }
  }
  if(!ver) throw new Error('too much data for a QR of this size');
  var spec=SPEC[ver], ecLen=spec[1], g1=spec[2], g2=spec[3], nBlocks=g1+g2;
  var lenBits=(ver<10)?8:16;

  /* bit stream */
  var bits=[];
  function put(val,n){ for(var k=n-1;k>=0;k--) bits.push((val>>k)&1); }
  put(4,4); put(data.length,lenBits);
  for(i=0;i<data.length;i++) put(data[i],8);
  var totalBits=cap*8;
  var term=Math.min(4,totalBits-bits.length);
  for(i=0;i<term;i++) bits.push(0);
  while(bits.length%8) bits.push(0);
  var pad=[0xEC,0x11],pi=0;
  while(bits.length<totalBits){ put(pad[pi%2],8); pi++; }
  var cw=[];
  for(i=0;i<bits.length;i+=8){
    var byte=0; for(var k2=0;k2<8;k2++) byte=(byte<<1)|bits[i+k2];
    cw.push(byte);
  }

  /* GF(256) */
  var EXP=new Array(512), LOG=new Array(256), x=1;
  for(i=0;i<255;i++){ EXP[i]=x; LOG[x]=i; x<<=1; if(x&256) x^=285; }
  for(i=255;i<512;i++) EXP[i]=EXP[i-255];
  function mul(a,b){ return (a===0||b===0)?0:EXP[LOG[a]+LOG[b]]; }
  function genPoly(n){
    var p=[1];
    for(var d=0;d<n;d++){
      var np=new Array(p.length+1); for(var q=0;q<np.length;q++) np[q]=0;
      for(var a=0;a<p.length;a++){ np[a]^=mul(p[a],1); np[a+1]^=mul(p[a],EXP[d]); }
      p=np;
    }
    return p;
  }
  function ecc(block,n){
    var gp=genPoly(n), res=block.concat(new Array(n).fill(0));
    for(var a=0;a<block.length;a++){
      var f=res[a]; if(!f) continue;
      for(var b=0;b<gp.length;b++) res[a+b]^=mul(gp[b],f);
    }
    return res.slice(block.length);
  }

  /* split into blocks, interleave */
  var short=Math.floor(cap/nBlocks), blocks=[], eccs=[], pos=0;
  for(i=0;i<nBlocks;i++){
    var len=short+(i>=g1?1:0);
    var blk=cw.slice(pos,pos+len); pos+=len;
    blocks.push(blk); eccs.push(ecc(blk,ecLen));
  }
  var out=[], maxLen=0;
  blocks.forEach(function(b){ if(b.length>maxLen) maxLen=b.length; });
  for(i=0;i<maxLen;i++) for(var b2=0;b2<nBlocks;b2++) if(i<blocks[b2].length) out.push(blocks[b2][i]);
  for(i=0;i<ecLen;i++) for(var b3=0;b3<nBlocks;b3++) out.push(eccs[b3][i]);

  /* matrix */
  var size=17+ver*4;
  var m=[], used=[];
  for(i=0;i<size;i++){ m.push(new Array(size).fill(0)); used.push(new Array(size).fill(0)); }
  function set(r,c,v){ if(r<0||c<0||r>=size||c>=size) return; m[r][c]=v?1:0; used[r][c]=1; }
  function finder(r,c){
    for(var a=-1;a<=7;a++) for(var b=-1;b<=7;b++){
      var rr=r+a, cc=c+b;
      if(rr<0||cc<0||rr>=size||cc>=size) continue;
      var on=(a>=0&&a<=6&&(b===0||b===6))||(b>=0&&b<=6&&(a===0||a===6))||(a>=2&&a<=4&&b>=2&&b<=4);
      set(rr,cc,on);
    }
  }
  finder(0,0); finder(0,size-7); finder(size-7,0);
  for(i=8;i<size-8;i++){ set(6,i,i%2===0); set(i,6,i%2===0); }
  /* alignment patterns */
  var AL=[[],[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],
          [6,28,50],[6,30,54],[6,32,58],[6,34,62],[6,26,46,66]];
  var ap=AL[ver]||[];
  for(i=0;i<ap.length;i++) for(var j2=0;j2<ap.length;j2++){
    var r0=ap[i], c0=ap[j2];
    if((r0<9&&c0<9)||(r0<9&&c0>size-10)||(r0>size-10&&c0<9)) continue;
    for(var a2=-2;a2<=2;a2++) for(var b4=-2;b4<=2;b4++)
      set(r0+a2,c0+b4, Math.max(Math.abs(a2),Math.abs(b4))!==1);
  }
  set(size-8,8,1); /* dark module */
  /* reserve format areas */
  for(i=0;i<9;i++){ if(!used[8][i]) used[8][i]=1; if(!used[i][8]) used[i][8]=1; }
  for(i=0;i<8;i++){ used[8][size-1-i]=1; used[size-1-i][8]=1; }
  if(ver>=7) for(i=0;i<6;i++) for(var k3=0;k3<3;k3++){ used[i][size-11+k3]=1; used[size-11+k3][i]=1; }

  /* place data, mask 0 */
  var bi=0, dir=-1, row=size-1;
  for(var col=size-1;col>0;col-=2){
    if(col===6) col--;
    while(true){
      for(var s2=0;s2<2;s2++){
        var cc2=col-s2;
        if(!used[row][cc2]){
          var bit=0;
          if(bi<out.length*8) bit=(out[bi>>3]>>(7-(bi&7)))&1;
          bi++;
          if((row+cc2)%2===0) bit^=1;    /* mask pattern 0 */
          m[row][cc2]=bit; used[row][cc2]=1;
        }
      }
      row+=dir;
      if(row<0||row>=size){ row-=dir; dir=-dir; break; }
    }
  }
  /* format info: level M + mask 0. Bit 14 is the most significant; the
     two copies are laid out in opposite directions, which is the detail
     that is easy to get backwards. */
  var fmt=0x5412;
  function fbit(k){ return (fmt>>k)&1; }
  for(i=0;i<=5;i++){ m[i][8]=fbit(i); m[8][i]=fbit(14-i); }
  m[7][8]=fbit(6); m[8][8]=fbit(7); m[8][7]=fbit(8);
  for(i=0;i<=6;i++) m[size-1-i][8]=fbit(14-i);
  for(i=0;i<=7;i++) m[8][size-8+i]=fbit(7-i);
  m[size-8][8]=1;
  /* version info for 7+ */
  if(ver>=7){
    var VB=[0,0,0,0,0,0,0,0x07C94,0x085BC,0x09A99,0x0A4D3,0x0BBF6,0x0C762,0x0D847,0x0E60D];
    var vb=VB[ver];
    for(i=0;i<18;i++){
      var bt=(vb>>i)&1, r1=Math.floor(i/3), c1=i%3;
      m[r1][size-11+c1]=bt; m[size-11+c1][r1]=bt;
    }
  }
  return m;
}

/* Render a matrix as SVG. Rectangles per run, not per module, so a v10 code
   is a few hundred nodes instead of several thousand. */
function qrSvg(text,px){
  var m; try{ m=qrEncode(text); }catch(e){ return ''; }
  var n=m.length, q=2, size=n+q*2, s=(px||150)/size, r='';
  for(var y=0;y<n;y++){
    var x=0;
    while(x<n){
      if(m[y][x]){ var w=1; while(x+w<n&&m[y][x+w]) w++;
        r+='<rect x="'+((x+q)*s).toFixed(2)+'" y="'+((y+q)*s).toFixed(2)+
           '" width="'+(w*s).toFixed(2)+'" height="'+s.toFixed(2)+'"/>';
        x+=w; }
      else x++;
    }
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+(px||150)+' '+(px||150)+'">'+
    '<rect width="100%" height="100%" fill="#fff"/><g fill="#000">'+r+'</g></svg>';
}
/* ---------- UPI ----------
   A standard UPI intent string. Any Indian payment app reads it, so the
   customer scans from the invoice and the amount is already filled in —
   no typing a VPA wrong at the counter. */
function upiLink(amountPaise,note){
  var W=S.core.workshop;
  if(!W.upi) return '';
  var p=['pa='+encodeURIComponent(W.upi),
         'pn='+encodeURIComponent(W.upiName||W.name),
         'cu=INR'];
  if(amountPaise>0) p.push('am='+(amountPaise/100).toFixed(2));
  if(note) p.push('tn='+encodeURIComponent(String(note).slice(0,50)));
  return 'upi://pay?'+p.join('&');
}
function upiBlock(amountPaise,note,px){
  var l=upiLink(amountPaise,note); if(!l) return '';
  var svg=qrSvg(l,px||150); if(!svg) return '';
  return '<div class="qrbox">'+svg+'</div>';
}

/* ---------- one tap means one save ----------
   Storage writes are awaited but the screen does not move while they run.
   On a weak connection staff tap again, and the second tap used to create a
   second job card. The button now locks itself for the length of the write.
   Keyed by the button's own action so a re-render cannot lose the lock. */
var BUSY={};
function isBusy(a){ return !!BUSY[a]; }
async function guard(act,el,fn){
  if(BUSY[act]) return;
  BUSY[act]=true;
  if(el){ el.setAttribute('aria-busy','true'); el.setAttribute('disabled','disabled'); }
  try{
    /* act on what the server holds now, not on what this phone saw a minute ago */
    if(MODE==='cloud') await syncFromServer();
    if(MODE==='live') await liveCatchUp();
    await fn();
  }
  catch(err){
    console.error(act,err);
    if(err&&err.auth){ toast('This device has been signed out. Sign in again.','bad'); render(); }
    else if(MODE==='live'&&err&&err.code) liveFail(act,err);
    else toast(err&&err.net?'No connection to the server. Nothing was saved — try again when the signal is back.'
      :'That did not go through. Nothing was lost — try again.','bad');
  }
  finally{
    BUSY[act]=false;
    if(el&&el.isConnected){ el.removeAttribute('aria-busy'); el.removeAttribute('disabled'); }
  }
}

/* ---------- money ---------- */
function toPaise(v){
  if(v===null||v===undefined) return 0;
  var s=String(v).trim().replace(/[^0-9.\-]/g,'');
  if(!s||s==='-'||s==='.') return 0;
  var neg = s.charAt(0)==='-'; if(neg) s=s.slice(1);
  var parts=s.split('.');
  var rupees=parseInt(parts[0]||'0',10)||0;
  var frac=(parts[1]||'').slice(0,3);
  var paise;
  if(frac.length===0) paise=0;
  else if(frac.length===1) paise=parseInt(frac,10)*10;
  else if(frac.length===2) paise=parseInt(frac,10);
  else paise=Math.round(parseInt(frac,10)/10);
  var t=rupees*100+paise;
  return neg?-t:t;
}
function paiseToInput(p){ if(!p) return ''; return (Math.abs(p)/100).toFixed(2); }
function inGroup(intStr){
  if(intStr.length<=3) return intStr;
  var last3=intStr.slice(-3), rest=intStr.slice(0,-3);
  rest=rest.replace(/\B(?=(\d{2})+(?!\d))/g,',');
  return rest+','+last3;
}
function money(p,opt){
  opt=opt||{};
  var neg=p<0, v=Math.abs(Math.round(p||0));
  var r=Math.floor(v/100), pa=v%100;
  var s=inGroup(String(r));
  if(!opt.noPaise) s+='.'+String(pa).padStart(2,'0');
  return (neg?'-':'')+(opt.bare?'':'\u20B9')+s;
}

/* =====================================================================

   When config.js names a Supabase project, every phone and laptop reads
   and writes the same database. One workshop login per device keeps
   strangers out; the staff PIN then says which person is using it.

   Three rules this code keeps:
   - It never quietly falls back to saving on the phone. A phone that
     cannot reach the server says so and saves nothing, because two
     copies of the books that disagree are worse than a pause.
   - A read that fails is an error, never "nothing there". Treating a
     dropped connection as an empty job list is how a list gets wiped.
   - Invoice numbers and chat messages are handed out by the database
     itself, so two phones can never get the same number.
   ===================================================================== */

var Cloud={
  url:String(CFG.supabaseUrl||'').trim().replace(/\/+$/,''),
  key:String(CFG.supabaseKey||'').trim(),
  session:null, refreshing:null,
  on:function(){ return !!(this.url&&this.key); },
  load:function(){
    try{ this.session=JSON.parse(window.localStorage.getItem('mz:cloud:session')||'null'); }
    catch(e){ this.session=null; }
  },
  keep:function(s){
    this.session=s;
    try{
      if(s) window.localStorage.setItem('mz:cloud:session',JSON.stringify(s));
      else window.localStorage.removeItem('mz:cloud:session');
    }catch(e){}
  },
  pack:function(j){
    return {access:j.access_token, refresh:j.refresh_token,
      exp:Date.now()+((j.expires_in||3600)*1000), email:(j.user&&j.user.email)||(this.session&&this.session.email)||''};
  },
  authPost:async function(grant,body){
    var r;
    try{
      r=await fetch(this.url+'/auth/v1/token?grant_type='+grant,{method:'POST',
        headers:{apikey:this.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
    }catch(e){ throw new Error('No connection to the server. Check the internet and try again.'); }
    var j=await r.json().catch(function(){ return {}; });
    if(!r.ok){
      var m=j.error_description||j.msg||j.message||j.error||('Server said '+r.status);
      if(/invalid login|invalid grant|invalid_grant|invalid credentials/i.test(m)) m='That e-mail and password do not match.';
      var err=new Error(m); err.status=r.status; throw err;
    }
    return j;
  },
  signIn:async function(email,pw){ this.keep(this.pack(await this.authPost('password',{email:email,password:pw}))); },
  /* One refresh at a time: two at once makes Supabase treat the second as
     a stolen token and sign the device out. */
  refresh:async function(){
    if(this.refreshing) return this.refreshing;
    var self=this;
    this.refreshing=(async function(){
      try{
        if(!self.session||!self.session.refresh) throw CloudAuthError();
        self.keep(self.pack(await self.authPost('refresh_token',{refresh_token:self.session.refresh})));
      }catch(e){
        if(e.status===400||e.status===401||e.auth){ self.keep(null); throw CloudAuthError(); }
        throw e;
      }finally{ self.refreshing=null; }
    })();
    return this.refreshing;
  },
  token:async function(){
    if(!this.session) throw CloudAuthError();
    if(Date.now()>this.session.exp-90000) await this.refresh();
    return this.session.access;
  },
  req:async function(path,opt,retried){
    opt=opt||{};
    var t=await this.token();
    var h=Object.assign({apikey:this.key, Authorization:'Bearer '+t}, opt.headers||{});
    var r;
    try{ r=await fetch(this.url+path,{method:opt.method||'GET',headers:h,body:opt.body}); }
    catch(e){ var ne=new Error('No connection to the server.'); ne.net=true; throw ne; }
    if(r.status===401&&!retried){ await this.refresh(); return this.req(path,opt,true); }
    if(!r.ok){
      var tx=await r.text().catch(function(){ return ''; });
      if(/not allowed|permission denied|row-level security/i.test(tx))
      { var me=new Error('That login is not allowed into this workshop. Ask the owner to add it (setup guide, step 2).'); me.notMember=true; throw me; }
      var he=new Error('Server said '+r.status+': '+tx.slice(0,160)); he.status=r.status; throw he;
    }
    var txt=await r.text();
    return txt?JSON.parse(txt):null;
  },
  qk:function(k){ return encodeURIComponent('"'+String(k).replace(/"/g,'')+'"'); },
  get:async function(k){
    var rows=await this.req('/rest/v1/kv?select=value,updated_at&key=eq.'+encodeURIComponent(k));
    if(!rows||!rows.length) return null;
    STAMPS[k]=rows[0].updated_at;
    return rows[0].value;
  },
  getMany:async function(keys){
    if(!keys.length) return [];
    var out=[];
    for(var i=0;i<keys.length;i+=40){
      var part=keys.slice(i,i+40).map(this.qk).join(',');
      out=out.concat(await this.req('/rest/v1/kv?select=key,value,updated_at&key=in.('+part+')')||[]);
    }
    out.forEach(function(r){ STAMPS[r.key]=r.updated_at; });
    return out;
  },
  stamps:async function(keys){
    return await this.req('/rest/v1/kv?select=key,updated_at&key=in.('+keys.map(this.qk).join(',')+')')||[];
  },
  /* every key starting with a prefix, optionally only those changed since a moment */
  prefix:async function(pfx,since){
    var q='/rest/v1/kv?select=key,value,updated_at&key=like.'+encodeURIComponent(pfx+'*')+
      (since?'&updated_at=gt.'+encodeURIComponent(since):'')+'&order=updated_at.asc';
    return await this.req(q)||[];
  },
  /* bodies are already JSON text, so they are never stringified twice */
  setRaw:async function(rowsJson){
    var rows=await this.req('/rest/v1/kv?select=key,updated_at',{method:'POST',
      headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=representation'},
      body:rowsJson});
    (rows||[]).forEach(function(r){ STAMPS[r.key]=r.updated_at; });
  },
  row:function(k,body){ return '{"key":'+JSON.stringify(k)+',"value":'+body+'}'; },
  del:async function(k){ await this.req('/rest/v1/kv?key=eq.'+encodeURIComponent(k),{method:'DELETE'}); delete STAMPS[k]; },
  rpc:async function(fn,args){
    return this.req('/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(args)});
  }
};
function isShared(){ return MODE==='shared'||MODE==='cloud'||MODE==='live'; }

/* A save that failed in the cloud gets its own plain message. */
function cloudFail(k,e){
  if(e&&e.auth){ toast('This device has been signed out. Sign in again — nothing you saved is lost.','bad'); render(); return; }
  toast(e&&e.net
    ? 'No connection to the server — '+keyLabel(k)+' was not saved. Try again when the signal is back.'
    : 'The server did not save '+keyLabel(k)+'. Try again.','bad');
}

/* ---------- keeping every phone up to date ----------
   Each shared list has one owner variable in memory. Before anything is
   written, and every fifteen seconds while the app is open, the phone asks
   which of them changed on the server and reloads only those. */
var SYNC_KEYS={
  'mz:core':function(v){ if(v){ var b=S.core&&S.core.bikes; S.core=v; S.core.bikes=b||{}; normaliseCore(); } },
  'mz:bikes':function(v){ if(S.core) S.core.bikes=v||{}; },
  'mz:parts':function(v){ PARTS=v||[]; }, 'mz:batches':function(v){ BATCHES=v||[]; },
  'mz:moves':function(v){ MOVES=v||[]; }, 'mz:purchases':function(v){ PURCHASES=v||[]; },
  'mz:suppliers':function(v){ SUPPLIERS=v||[]; },
  'mz:parties':function(v){ PARTIES=v||[]; }, 'mz:payments':function(v){ PAYMENTS=v||[]; },
  'mz:adjust':function(v){ ADJUST=v||[]; }, 'mz:sales':function(v){ SALES=v||[]; },
  'mz:receipts':function(v){ RECEIPTS=v||[]; }, 'mz:accounts':function(v){ if(v&&v.length) ACCOUNTS=v; },
  'mz:expenses':function(v){ EXPENSES=v||[]; }, 'mz:transfers':function(v){ TRANSFERS=v||[]; },
  'mz:attend':function(v){ ATTEND=v||{}; }, 'mz:advances':function(v){ ADVANCES=v||[]; },
  'mz:appts':function(v){ APPTS=v||[]; }, 'mz:reminded':function(v){ REMINDED=v||{}; },
  'mz:chatmeta':function(v){ CHATMETA=v||{}; }
};
var IX_SINCE='';   /* newest job-list change this device has seen */
function ixMerge(rows){
  var byId={};
  S.index.forEach(function(e,i){ byId[e.id]=i; });
  rows.forEach(function(r){
    var e=r.value; if(!e||!e.id) return;
    if(byId[e.id]!==undefined) S.index[byId[e.id]]=e; else { S.index.unshift(e); byId[e.id]=0; }
    if(!IX_SINCE||r.updated_at>IX_SINCE) IX_SINCE=r.updated_at;
  });
}
async function syncFromServer(){
  if(MODE!=='cloud'||!Cloud.session) return false;
  var keys=Object.keys(SYNC_KEYS);
  var jobKey=S.job?'mz:job:'+S.job.id:'';
  if(jobKey) keys.push(jobKey);
  var stamps=await Cloud.stamps(keys);
  var changed=stamps.filter(function(r){ return STAMPS[r.key]!==r.updated_at; }).map(function(r){ return r.key; });
  var ix=await Cloud.prefix('mz:ix:',IX_SINCE);
  var mine=ix.filter(function(r){ return STAMPS[r.key]!==r.updated_at; });
  if(ix.length) ixMerge(ix);
  ix.forEach(function(r){ STAMPS[r.key]=r.updated_at; });
  if(!changed.length) return mine.length>0;
  var rows=await Cloud.getMany(changed);
  rows.forEach(function(r){
    LASTBODY[r.key]=(r.value===null||r.value===undefined)?undefined:JSON.stringify(r.value);
    if(r.key===jobKey){ if(S.job&&r.value) S.job=r.value; return; }
    if(SYNC_KEYS[r.key]) SYNC_KEYS[r.key](r.value);
  });
  clearBalCache();
  return true;
}
function normaliseCore(){
  if(!S.core.defaults) S.core.defaults=seedCore().defaults;
  if(!S.core.bikes) S.core.bikes={};
  if(!S.core.counters) S.core.counters={job:{},gst:{},nongst:{}};
}
/* the counters table is the truth in the cloud; settings shows it */
async function loadCounters(){
  if(MODE==='live'){
    var fy=fyOf();
    for(var sr of ['job','gst','nongst']){
      try{ var r=await liveGet('mz:counter:'+sr+':'+fy);
        if(r.value){ S.core.counters[sr]=S.core.counters[sr]||{};
          S.core.counters[sr][fy]=Math.max(r.value.n||0,S.core.counters[sr][fy]||0); } }catch(e){}
    }
    return;
  }
  if(MODE!=='cloud') return;
  try{
    var rows=await Cloud.req('/rest/v1/counters?select=series,fy,n')||[];
    rows.forEach(function(r){
      S.core.counters[r.series]=S.core.counters[r.series]||{};
      /* never go backwards: a restored backup may know of higher numbers */
      S.core.counters[r.series][r.fy]=Math.max(r.n,S.core.counters[r.series][r.fy]||0);
    });
  }catch(e){}
}

/* =====================================================================
   HOSTED ON CLAUDE
   When the app is opened from its claude.ai link, it keeps everything in
   that page's own database. People sign in with their Claude account;
   anyone the owner has invited as an Editor reads and writes the same
   job cards, from any phone or laptop, with nothing to install.

   The database's rules shape this code:
   - A record holds at most 256 KB, so anything bigger is split into
     numbered parts. The parts are written first and the record that
     points at them last, so a reader never sees half of a save.
   - Every write replaces the record, last one wins. Invoice numbers,
     chat messages and other "add one" changes take a short lease on the
     record first, so two phones queue instead of overwriting each other.
   - Every shared record is watched, so a change on one phone reaches the
     others within a second or two, without polling.
   ===================================================================== */
var LV={db:null, user:null, assets:null, dl:null, canWrite:null,
  holder:'h_'+Math.random().toString(36).slice(2,10),
  heads:{}, seen:{}, watch:{}, dirty:{}, timer:null, flushing:null, ixUnsub:null, jobKey:'', chatKey:''};
function lref(k){ return LV.db.collection('kv').doc(k); }
function lsleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
var LENC=(typeof TextEncoder!=='undefined')?new TextEncoder():null;
function jsonBytes(s){ var t=JSON.stringify(s); return LENC?LENC.encode(t).length:t.length*3; }
function liveVer(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

async function liveBody(k,d){
  if(typeof d.j==='string') return d.j;
  if(d.chunks){
    var ps=[];
    for(var i=0;i<d.chunks;i++) ps.push(lref(k+'~'+d.ver+'~'+i).get());
    var parts=await Promise.all(ps);
    if(parts.some(function(p){ return !p.exists; })){ var e=new Error('A part of '+k+' is missing'); e.code='unavailable'; throw e; }
    return parts.map(function(p){ return p.data().s; }).join('');
  }
  return undefined;
}
async function liveGet(k){
  for(var attempt=0;;attempt++){
    var s=await lref(k).get();
    if(!s.exists){ delete LV.heads[k]; delete LV.seen[k]; return {value:null, body:undefined}; }
    var d=s.data();
    try{
      var body=await liveBody(k,d);
      LV.heads[k]={ver:d.ver, chunks:d.chunks||0}; LV.seen[k]=d.ver;
      return {value:body===undefined?null:JSON.parse(body), body:body};
    }catch(e){
      /* someone saved a newer version while the parts were being read: read again */
      if(attempt>=2) throw e;
      await lsleep(200);
    }
  }
}
function splitBody(body){
  var out=[], pos=0;
  while(pos<body.length){
    var take=Math.min(90000, body.length-pos), piece=body.substr(pos,take);
    while(jsonBytes(piece)>230000&&take>1000){ take=Math.floor(take/2); piece=body.substr(pos,take); }
    out.push(piece); pos+=take;
  }
  return out;
}
async function livePut(k,body){
  var ver=liveVer(), head={ver:ver, at:Date.now()};
  if(jsonBytes(body)<=230000) head.j=body;
  else{
    var parts=splitBody(body);
    for(var i=0;i<parts.length;i+=4){
      await Promise.all(parts.slice(i,i+4).map(function(s,j){ return lref(k+'~'+ver+'~'+(i+j)).set({s:s}); }));
    }
    head.chunks=parts.length;
  }
  var prev=LV.heads[k];
  LV.seen[k]=ver;
  await lref(k).set(head);
  LV.heads[k]={ver:ver, chunks:head.chunks||0};
  if(prev&&prev.chunks&&prev.ver!==ver){
    for(var x=0;x<prev.chunks;x++) lref(k+'~'+prev.ver+'~'+x).delete().catch(function(){});
  }
}
async function liveDel(k){
  var prev=LV.heads[k];
  await lref(k).delete();
  if(prev&&prev.chunks) for(var x=0;x<prev.chunks;x++) lref(k+'~'+prev.ver+'~'+x).delete().catch(function(){});
  delete LV.heads[k]; delete LV.seen[k];
}
/* Hold a short lease on a record while changing it. Leases lapse on
   their own after two seconds; anyone else waiting simply tries again. */
/* Within one phone the calls queue up here; the lease then only has to
   keep different phones apart. A phone may renew its own lease, so
   without this queue two taps on one phone could both get in. */
var LEASEQ={};
function withLease(k,fn){
  var prev=LEASEQ[k]||Promise.resolve();
  var run=prev.catch(function(){}).then(function(){ return leaseOnce(k,fn); });
  LEASEQ[k]=run.catch(function(){});
  return run;
}
async function leaseOnce(k,fn){
  var ref=LV.db.collection('kv').doc('lock:'+k), t0=Date.now();
  for(;;){
    var r=await ref.acquire({holder:LV.holder, ttlMs:2000});
    if(r.acquired) break;
    if(Date.now()-t0>15000){ var e=new Error('Someone else is saving the same thing. Try again in a moment.'); e.code='busy'; throw e; }
    await lsleep(250+Math.random()*350);
  }
  return fn();
}
/* plain words for what went wrong */
function liveFail(k,e){
  var c=e&&e.code;
  if(c==='invalid_argument'&&LV.canWrite===false)
    toast('You can look but not change anything. Ask the owner to share this page with you as an Editor.','bad');
  else if(c==='quota_exceeded')
    toast('The workshop’s storage is full ('+(e.message||'')+'). Back up, then tell the owner.','bad');
  else if(c==='revoked')
    toast('Your access to this page was removed. Ask the owner.','bad');
  else if(c==='busy') toast(e.message,'bad');
  else toast('Could not save '+keyLabel(k)+'. Check the internet and try again — nothing was lost.','bad');
}

/* ---------- the job list: one small record per job ---------- */
function ixRef(id){ return LV.db.collection('ix').doc(id); }
async function livePutIx(e){ await ixRef(e.id).set({j:JSON.stringify(e)}); }
async function liveLoadIndex(){
  var qs=await LV.db.collection('ix').get();
  var out=[];
  qs.docs.forEach(function(d){ try{ out.push(JSON.parse(d.data().j)); }catch(x){} });
  return out;
}
function liveWatchIndex(){
  if(LV.ixUnsub) return;
  LV.ixUnsub=LV.db.collection('ix').onSnapshot(function(qs){
    var changed=false;
    qs.docChanges().forEach(function(c){
      if(c.type==='removed') return;
      var j=c.doc.data().j, e;
      try{ e=JSON.parse(j); }catch(x){ return; }
      var i=-1;
      for(var n=0;n<S.index.length;n++) if(S.index[n].id===e.id){ i=n; break; }
      if(i>=0){ if(JSON.stringify(S.index[i])!==j){ S.index[i]=e; changed=true; } }
      else { S.index.unshift(e); changed=true; }
    });
    if(changed) liveSoftRender();
  },function(){ LV.ixUnsub=null; });
}

/* ---------- seeing other phones' changes ---------- */
function watchKey(k,cb){
  unwatchKey(k);
  LV.watch[k]=lref(k).onSnapshot(function(s){
    if(!s.exists) return;
    var d=s.data();
    LV.heads[k]={ver:d.ver, chunks:d.chunks||0};
    if(d.ver===LV.seen[k]) return;         /* this phone's own save, or already loaded */
    cb(k,d);
  },function(){ delete LV.watch[k]; });
}
function unwatchKey(k){ if(LV.watch[k]){ try{ LV.watch[k](); }catch(e){} delete LV.watch[k]; } }
function liveMarkDirty(k,d){
  LV.dirty[k]=d;
  if(!LV.timer) LV.timer=setTimeout(liveFlush,300);
}
async function liveFlush(){
  clearTimeout(LV.timer); LV.timer=null;
  var run=(async function(){
    var keys=Object.keys(LV.dirty), any=false;
    for(var i=0;i<keys.length;i++){
      var k=keys[i]; delete LV.dirty[k];
      try{
        var r=await liveGet(k);
        LASTBODY[k]=r.body;
        if(SYNC_KEYS[k]){ SYNC_KEYS[k](r.value); any=true; }
      }catch(e){ console.error('refresh',k,e); }
    }
    if(any){ clearBalCache(); liveSoftRender(); }
  })();
  LV.flushing=run;
  try{ await run; } finally{ if(LV.flushing===run) LV.flushing=null; }
}
var LSOFT=null;
function liveSoftRender(){
  clearTimeout(LSOFT);
  LSOFT=setTimeout(function(){
    if(S.user&&SYNC_QUIET.indexOf(S.view.name)<0&&!busyTyping()) rerender();
  },250);
}
/* the open job card follows changes made on other phones */
function liveWatchJob(id){
  var k='mz:job:'+id;
  if(LV.jobKey===k) return;
  if(LV.jobKey) unwatchKey(LV.jobKey);
  LV.jobKey=k;
  watchKey(k,async function(){
    try{
      var r=await liveGet(k);
      if(S.job&&'mz:job:'+S.job.id===k&&r.value){ S.job=r.value; LASTBODY[k]=r.body; liveSoftRender(); }
    }catch(e){}
  });
}
/* Before any save: take in what other phones changed, and read the open
   job card fresh, so the save builds on the newest version. */
async function liveCatchUp(){
  if(LV.timer) await liveFlush();
  else if(LV.flushing) await LV.flushing;
  if(S.job){
    var k='mz:job:'+S.job.id, s=await lref(k).get();
    if(s.exists&&s.data().ver!==LV.seen[k]){
      var r=await liveGet(k);
      if(r.value){ S.job=r.value; LASTBODY[k]=r.body; }
    }
  }
}
function liveStartWatching(){
  Object.keys(SYNC_KEYS).forEach(function(k){ watchKey(k,liveMarkDirty); });
  liveWatchIndex();
}

/* ---------- attachments in the page's file store ----------
   Photos, PDFs and voice notes go to the file store, which holds far
   more than the database. Anything it will not take is kept in the
   database instead, split into parts like everything else. */
var ASSET_TYPES={'image/jpeg':1,'image/png':1,'image/webp':1,'application/pdf':1,'video/mp4':1,'video/webm':1};
function assetType(mime){
  if(ASSET_TYPES[mime]) return mime;
  if(/^audio\/webm/.test(mime)) return 'video/webm';
  if(/^audio\/(mp4|m4a|x-m4a|aac)/.test(mime)) return 'video/mp4';
  return '';
}
async function dataUrlBlob(u){ return (await fetch(u)).blob(); }
function assetUrl(id){ return '/_blob/'+id; }

/* ---------- files people save ---------- */
async function offerFile(name,data,mime){
  if(MODE==='live'&&LV.dl){
    try{ await LV.dl.save({filename:name, data:data}); toast('Saved '+name,'good'); }
    catch(e){
      if(e&&e.code==='declined') return;
      if(e&&e.code==='rejected_extension') toast('This page cannot save .'+String(name).split('.').pop()+' files.','bad');
      else toast('Could not save the file here.','bad');
    }
    return;
  }
  try{

var MEM={}, MODE='memory', STORE_OK=true, LS=null, LASTBODY={};
try{
  if(window.localStorage){ window.localStorage.setItem('mz:probe','1'); window.localStorage.removeItem('mz:probe'); LS=window.localStorage; }
}catch(e){ LS=null; }
async function detectStore(){
  if(Cloud.on()){ MODE='cloud'; SIZE_LIMIT=40*1024*1024; Cloud.load(); return; }
  /* opened from its claude.ai link */
  if(window.claude&&typeof window.claude.use==='function'){

      try{ LV.canWrite=LV.user?await LV.user.can('data.write'):null; }catch(e){ LV.canWrite=null; }
      return;
    }
    MODE='nodb'; return;
  }
  if(window.storage&&window.storage.set){
    try{ var r=await window.storage.set('mz:probe',JSON.stringify(1),true); if(r!==null&&r!==false){ MODE='shared'; return; } }catch(e){}
  }

/* ---------- how full is the drawer ----------
   Each key has a hard ceiling of about 5MB. Everything is kept in a handful
   of big keys, so a workshop does not creep towards the limit — it arrives
   at it in one afternoon and the write simply stops working. Warn while
   there is still room to act, and say plainly what to do about it. */
var SIZE_LIMIT=5*1024*1024, SIZE_WARN=0.75, SIZED={}, SIZE_TOLD={};
function fmtKb(n){ return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB'; }
function keyLabel(k){
  return {'mz:index':'the job card list','mz:parts':'the parts list','mz:moves':'stock movements',
    'mz:parties':'customers and suppliers','mz:expenses':'spends','mz:payments':'payments',
    'mz:core':'workshop settings','mz:purchases':'purchase bills','mz:batches':'stock batches',
    'mz:attend':'attendance','mz:sales':'the sales record'}[k]||
    (k.indexOf('mz:chat:')===0?'this job\u2019s chat':(k.indexOf('mz:att:')===0?'a chat attachment':k));
}
function sizeWatch(k,n){
  SIZED[k]=n;
  if(n>SIZE_LIMIT*SIZE_WARN&&!SIZE_TOLD[k]){
    SIZE_TOLD[k]=true;
    toast('Storage for '+keyLabel(k)+' is '+Math.round(n/SIZE_LIMIT*100)+'% full ('+fmtKb(n)+
          '). Back up now and speak to whoever set this up.','bad');
  }
}
function sizeFail(k,n){
  toast('Could not save '+keyLabel(k)+' — the space for it is full at '+fmtKb(n)+
        '. Do not close this tab. Back up from Settings first.','bad');
}
/* the largest keys, for the settings screen */
function storageReport(){
  return Object.keys(SIZED).map(function(k){
    return {key:k, label:keyLabel(k), bytes:SIZED[k], pct:Math.round(SIZED[k]/SIZE_LIMIT*100)};
  }).sort(function(a,b){ return b.bytes-a.bytes; });
}
function storeNote(){
  if(MODE==='browser') return 'Saving in this browser only \u2014 other phones will not see these job cards.';
  if(MODE==='memory') return 'Nothing is being saved. Close this tab and the job cards are gone.';
  return '';
}
var DB={
  /* In the cloud a failed read throws instead of returning nothing, so a
     dropped signal can never look like an empty list and get saved over. */
  async get(k){
    if(MODE==='live'){ var lr=await liveGet(k); LASTBODY[k]=lr.body; return lr.value; }
    if(MODE==='cloud'){
      var v;
      if(Object.prototype.hasOwnProperty.call(PREFETCH,k)){ v=PREFETCH[k]; delete PREFETCH[k]; }
      else v=await Cloud.get(k);
      LASTBODY[k]=(v===null||v===undefined)?undefined:JSON.stringify(v);
      return (v===undefined)?null:v;
    }
    if(MODE==='shared'){
      try{ var r=await window.storage.get(k,true); return r&&r.value?JSON.parse(r.value):null; }
      catch(e){ return (k in MEM)?MEM[k]:null; }
    }
    if(MODE==='browser'){
      try{ var v=LS.getItem(k); return v?JSON.parse(v):((k in MEM)?MEM[k]:null); }catch(e){ return (k in MEM)?MEM[k]:null; }
    }
    return (k in MEM)?MEM[k]:null;
  },
  async set(k,v){
    MEM[k]=v;
    var body=JSON.stringify(v);
    sizeWatch(k,body.length);
    if(MODE==='live'){
      if(LASTBODY[k]===body) return true;
      try{ await livePut(k,body); LASTBODY[k]=body; return true; }
      catch(e){ console.error('save',k,e); STORE_OK=false; liveFail(k,e); return false; }
    }
    if(MODE==='cloud'){
      /* nothing changed since this phone last read or wrote it: skip the upload */
      if(LASTBODY[k]===body) return true;
      try{ await Cloud.setRaw(Cloud.row(k,body)); LASTBODY[k]=body; return true; }
      catch(e){ STORE_OK=false; cloudFail(k,e); return false; }
    }
    if(MODE==='shared'){
      try{ var r=await window.storage.set(k,body,true); if(r===null||r===false) throw new Error('rejected'); return true; }
      catch(e){ STORE_OK=false; sizeFail(k,body.length); return false; }
    }
    if(MODE==='browser'){
      try{ LS.setItem(k,body); return true; }
      catch(e){ STORE_OK=false; sizeFail(k,body.length); return false; }
    }
    return true; /* memory: it is held for this session, which is all we promised */
  },
  async del(k){
    delete MEM[k]; delete LASTBODY[k];
    try{
      if(MODE==='live') await liveDel(k);
      else if(MODE==='cloud') await Cloud.del(k);
      else if(MODE==='browser') LS.removeItem(k);
      else if(MODE==='shared'){
        if(window.storage.delete) await window.storage.delete(k,true);
        else await window.storage.set(k,'null',true);
      }
    }catch(e){}
  },
  /* many keys at once: one request per ~1.5 MB in the cloud */
  async setMany(entries){
    if(MODE==='live'){
      for(var q=0;q<entries.length;q+=4){
        var res=await Promise.all(entries.slice(q,q+4).map(function(x){ return DB.set(x[0],x[1]); }));
        if(res.indexOf(false)>=0) return false;
      }
      return true;
    }
    if(MODE!=='cloud'){
      for(var i=0;i<entries.length;i++) if(!await this.set(entries[i][0],entries[i][1])) return false;
      return true;
    }
    var batch=[], size=0;
    try{
      for(var j=0;j<entries.length;j++){
        var b=JSON.stringify(entries[j][1]), row=Cloud.row(entries[j][0],b);
        if(size+row.length>1500000&&batch.length){ await Cloud.setRaw('['+batch.join(',')+']'); batch=[]; size=0; }
        batch.push(row); size+=row.length; LASTBODY[entries[j][0]]=b; MEM[entries[j][0]]=entries[j][1];
      }
      if(batch.length) await Cloud.setRaw('['+batch.join(',')+']');
      return true;
    }catch(e){ entries.forEach(function(x){ delete LASTBODY[x[0]]; }); cloudFail(entries[0][0],e); return false; }
  },
  /* add one item to a list; the server does it in one step in the cloud */
  async append(k,item){
    if(MODE==='live'){
      try{ return await withLease(k,async function(){
        var r=await liveGet(k), list=Array.isArray(r.value)?r.value:[];
        list.push(item); var b=JSON.stringify(list);
        await livePut(k,b); LASTBODY[k]=b; return list; }); }
      catch(e){ liveFail(k,e); return null; }
    }
    if(MODE==='cloud'){
      try{ var v=await Cloud.rpc('kv_append',{p_key:k,p_item:item}); LASTBODY[k]=JSON.stringify(v); return v; }
      catch(e){ cloudFail(k,e); return null; }
    }
    var list=await this.get(k)||[]; list.push(item);
    return (await this.set(k,list))?list:null;
  },
  /* merge a few named entries into an object without touching the rest */
  async merge(k,patch){
    if(MODE==='live'){
      try{ return await withLease(k,async function(){
        var r=await liveGet(k), o=(r.value&&typeof r.value==='object'&&!Array.isArray(r.value))?r.value:{};
        Object.assign(o,patch); var b=JSON.stringify(o);
        await livePut(k,b); LASTBODY[k]=b; return true; }); }
      catch(e){ liveFail(k,e); return false; }
    }
    if(MODE==='cloud'){
      try{ var v=await Cloud.rpc('kv_merge',{p_key:k,p_patch:patch}); LASTBODY[k]=JSON.stringify(v); return true; }
      catch(e){ cloudFail(k,e); return false; }
    }
    var o=await this.get(k)||{}; Object.assign(o,patch);
    return this.set(k,o);
  },
  async getMine(k){
    if(MODE==='cloud'||MODE==='live'){ try{ var cv=LS&&LS.getItem('my:'+k); return cv?JSON.parse(cv):null; }catch(e){ return null; } }
    if(MODE==='shared'){ try{ var r=await window.storage.get(k,false); return r&&r.value?JSON.parse(r.value):null; }catch(e){ return null; } }
    if(MODE==='browser'){ try{ var v=LS.getItem('my:'+k); return v?JSON.parse(v):null; }catch(e){ return null; } }
    return MEM['my:'+k]||null;
  },
  async setMine(k,v){
    MEM['my:'+k]=v;
    try{
      if(MODE==='cloud'||MODE==='live'){ if(LS) LS.setItem('my:'+k,JSON.stringify(v)); }
      else if(MODE==='shared') await window.storage.set(k,JSON.stringify(v),false);
      else if(MODE==='browser') LS.setItem('my:'+k,JSON.stringify(v));
    }catch(e){}
  }
};
