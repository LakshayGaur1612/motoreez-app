/* The PDF is drawn from the same page you see, by a library fetched only
   the first time it is needed, so the rest of the app still opens with no
   connection at all. */
var _scripts={};
function loadScript(src){
  if(_scripts[src]) return _scripts[src];
  _scripts[src]=new Promise(function(res,rej){
    var s=document.createElement('script'); s.src=src; s.async=true;
    s.onload=function(){ res(); }; s.onerror=function(){ delete _scripts[src]; rej(new Error('could not load')); };
    document.head.appendChild(s);
  });
  return _scripts[src];
}
async function invoicePdfBlob(j,b){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js');
  if(!window.html2pdf) throw new Error('no pdf library');
  var holder=document.createElement('div');
  holder.style.cssText='position:fixed;left:-12000px;top:0;width:760px;background:#fff;color:#000;padding:0';
  holder.innerHTML='<div class="doc">'+billDocHtml(j,b)+'</div>';
  document.body.appendChild(holder);
  try{
    return await window.html2pdf().set({ margin:[10,10,10,10], filename:invFileName(b),
      image:{type:'jpeg',quality:0.95}, html2canvas:{scale:2,backgroundColor:'#ffffff'},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}, pagebreak:{mode:['css','legacy']} })
      .from(holder.firstChild).outputPdf('blob');
  } finally { holder.remove(); }
}
function saveBlob(blob,name){
  var u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },800);
}

  try{ saveBlob(await invoicePdfBlob(j,b),invFileName(b)); toast('Downloaded '+invFileName(b),'good'); }
  catch(e){ toast('Could not make the PDF without an internet connection. Use Print and choose \u201cSave as PDF\u201d.','bad'); printBill(billId); }
}
function sendInvoiceModal(billId){

async function sendInvoiceDo(billId,how){
  var j=S.job, b=(j.bills||[]).filter(function(x){ return x.id===billId; })[0]; if(!b) return;
  var g=function(n){ var e=document.querySelector('.sheet [name="'+n+'"]'); return e?e.value.trim():''; };
  var phone=g('invphone')||j.cust.phone, text=g('invtext');
  var used=how;
  if(how==='pdf'){
    var blob=null;
    try{ blob=await invoicePdfBlob(j,b); }
    catch(e){ toast('Could not make the PDF without an internet connection. Sending the message only.','bad'); used='wa'; }
    if(blob){
      var file=new File([blob],invFileName(b),{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file],text:text,title:b.number}); used='pdf'; }
        catch(e){ if(e&&e.name==='AbortError'){ toast('Not sent'); return; } saveBlob(blob,file.name); used='pdfwa'; }
      } else { saveBlob(blob,file.name); used='pdfwa'; }
    }
  }
  if(used==='wa'||used==='pdfwa'){ try{ window.open(waLink(phone,text),'_blank'); }catch(e){} }
  if(used==='sms'){ try{ window.open(smsLink(phone,text),'_blank'); }catch(e){} }
  b.sends=b.sends||[];
  b.sends.push({at:Date.now(), by:S.user.id, byName:S.user.name, how:used, to:phone});
  logIt(j,'Invoice sent to the customer',b.number+' \u00B7 '+sendHow(used)+' \u00B7 '+phone+
    (b.sends.length>1?' \u00B7 '+b.sends.length+' times now':''));
  await saveJob(j);
  closeModal(); rerender(); toast('Sent \u2014 and logged','good');
}

/* Bulk-load the parts master. Prices and units only — stock comes from
   purchase bills, or from a stock correction. */
async function loadPartsCsv(){
  var ta=document.querySelector('[name="partscsv"]');
  if(!ta||!ta.value.trim()){ toast('Paste the list in first','bad'); return; }
  var added=0, updated=0, bad=0;
  ta.value.split(/\r?\n/).forEach(function(line){
    if(!line.trim()) return;
    var c=line.split(',').map(function(x){ return x.trim(); });
    if(c.length<2||!c[0]||!c[1]){ bad++; return; }
    var cat=catFind(c[2]||'')||catGuess(c[1]);
    var ex=partByNo(c[0]);
    var rec={ no:c[0], name:c[1], category:cat||(/^99/.test(c[3]||'')?'Labour':''), brand:brandGuess(c[1]),
      hsn:c[3]||'', gst:c[4]!==''&&c[4]!==undefined?(parseInt(c[4],10)||0):18,
      sale:toPaise(c[5]||'0'), mrp:toPaise(c[6]||'0'),
      unit:UNITS.indexOf(c[7])>=0?c[7]:'piece', buyUnit:UNITS.indexOf(c[8])>=0?c[8]:(UNITS.indexOf(c[7])>=0?c[7]:'piece'),
      conv:parseFloat(c[9]||1)||1, minQty:parseFloat(c[10]||0)||0 };
    if(ex){ Object.keys(rec).forEach(function(k){ ex[k]=rec[k]; }); ex.updatedAt=Date.now(); updated++; }
    else{ rec.id=uid('pt'); rec.aliases=[]; rec.createdAt=Date.now(); rec.updatedAt=Date.now(); PARTS.push(rec); added++; }
  });
  if(!added&&!updated){ toast('Could not read any lines. Check the order of the columns.','bad'); return; }
  if(!await saveStore('parts')) return;
  toast(added+' added, '+updated+' updated'+(bad?', '+bad+' skipped':''),'good');
  rerender();
}
async function clearParts(){
  if(MOVES.length){ toast('Parts with stock movements cannot be wiped. Correct the stock instead.','bad'); return; }
  PARTS=[]; await saveStore('parts'); toast('Parts cleared'); rerender();
}

async function backupAll(){
  var out={ made:new Date().toISOString(), app:'Motoreez', version:2, data:{} };
  async function put(k){ var v=await DB.get(k); if(v!==null&&v!==undefined) out.data[k]=v; return v; }
  for(var i=0;i<BACKUP_KEYS.length;i++) await put(BACKUP_KEYS[i]);
  var allJobs=S.index.concat(S.saleIndex||[]);
  for(var k=0;k<allJobs.length;k++){
    var id=allJobs[k].id;
    await put('mz:job:'+id); await put('mz:dvi:'+id); await put('mz:audio:'+id);
    var msgs=await put('mz:chat:'+id)||[];
    for(var m=0;m<msgs.length;m++) if(msgs[m].att) await put('mz:att:'+msgs[m].att.id);
  }
  for(var x=0;x<EXPENSES.length;x++) if(EXPENSES[x].photo) await put('mz:exphoto:'+EXPENSES[x].id);
  out.data['mz:index']=S.index;                      /* the live lists, however they are stored */
  out.data['mz:saleidx']=S.saleIndex||[];
  out.data['mz:bikes']=S.core.bikes;
  downloadFileRaw('motoreez-backup-'+isoDate()+'.json', JSON.stringify(out), 'application/json');
  toast('Backed up '+S.index.length+' job cards and everything else','good');
}
function downloadFileRaw(name,text,mime){
  try{
    var blob=new Blob([text],{type:mime||'text/plain'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },300);
  }catch(e){ toast('Could not download here. Open the app in its own browser tab.','bad'); }
}

  openModal('<h2>Put a backup back</h2>'+

    '<b>This wipes what is here now</b> and replaces it with the file.</div>'+

    '<input type="file" accept="application/json,.json" id="restorefile" style="min-height:52px;padding:12px"></div>'+

async function restoreDo(){
  var f=document.getElementById('restorefile');
  if(!f||!f.files||!f.files[0]){ toast('Choose the file first','bad'); return; }
  var txt=await f.files[0].text();
  var obj;
  try{ obj=JSON.parse(txt); }catch(e){ toast('That is not a backup file','bad'); return; }
  if(!obj||!obj.data||!obj.data['mz:core']){ toast('That backup looks wrong','bad'); return; }
  /* the job list goes back as one row per job on the server */
  if(MODE==='cloud'){
    var rowsBack=(obj.data['mz:index']||[]).map(function(e){ return [ixKey(false)+e.id,e]; })
      .concat((obj.data['mz:saleidx']||[]).map(function(e){ return [ixKey(true)+e.id,e]; }));
    if(rowsBack.length&&!await DB.setMany(rowsBack)){
      toast('The job list could not be written back. Do not use the app until this is sorted.','bad'); return; }
  }
  var keys=Object.keys(obj.data).filter(function(k){ return k.indexOf('mz:')===0&&!(MODE==='cloud'&&(k==='mz:index'||k==='mz:saleidx')); });
  var failed=0;
  for(var i=0;i<keys.length;i++){
    if(obj.data[keys[i]]===null||obj.data[keys[i]]===undefined) continue;
    if(!await DB.set(keys[i], obj.data[keys[i]])) failed++;
  }
  if(failed){ toast(failed+' part'+(failed>1?'s':'')+' of the backup could not be written. Do not use the app until this is sorted.','bad'); return; }
  var jobs=obj.data.jobs||{};   /* version 1 files */
  var ids=Object.keys(jobs);
  for(var k=0;k<ids.length;k++) await DB.set('mz:job:'+ids[k], jobs[ids[k]]);
  closeModal();
  toast('Restored. Reloading\u2026','good');
  setTimeout(function(){ location.reload(); },900);
}
async function saveWorkshop(){
  ['name','tagline','addr','phone','email','gstin','state','stateCode','prefix','bank'].forEach(function(f){
    var el=document.querySelector('[name="w_'+f+'"]'); if(el) S.core.workshop[f]=el.value.trim();
  });
  var W=S.core.workshop;
  [['wupi','upi'],['wupiname','upiName']].forEach(function(p){
    var el=document.querySelector('[name="'+p[0]+'"]'); if(el) W[p[1]]=el.value.trim();
  });
  [['wsvcm','svcMonths',1,24],['wsvck','svcKm',500,50000],['wopen','openHour',0,23],
   ['wclose','closeHour',1,24],['wbays','bays',1,20]].forEach(function(p){
    var el=document.querySelector('[name="'+p[0]+'"]'); if(!el) return;
    var v=parseInt(el.value,10);
    if(!isNaN(v)) W[p[1]]=Math.max(p[2],Math.min(p[3],v));
  });
  if(W.closeHour<=W.openHour){ toast('Closing time has to be after opening time','bad'); return; }
  if(W.upi&&!/^[\w.\-]{2,}@[A-Za-z]{2,}$/.test(W.upi)){
    toast('That UPI ID does not look right. It should read like name@bank.','bad'); return;
  }
  await saveCore(); toast('Saved','good'); rerender();
}

  u.pin=a; await saveCore(); closeModal(); rerender(); toast('PIN changed for '+u.name,'good');

/* =====================================================================
   JOB CHAT
   One conversation per job card: the advisor, the store, the technician
   and the owner talking about one bike, with the photos, voice notes and
   documents that belong to it kept in the same place instead of scattered
   across personal WhatsApp groups.

   Storage is split on purpose:
     mz:chat:<jobId>  the messages, each small (text, or an attachment's
                      name and a tiny thumbnail)
     mz:att:<attId>   one attachment each, read only when someone taps it
     mz:chatmeta      per job: message count and the last few senders, so
                      the job list can show unread badges without opening
                      every conversation
   Chat never writes to the job card itself, so a message sent from one
   phone can never overwrite a price or a tick made on another.

   Everything goes through ChatStore. When this moves to a server, those
   six methods become API calls and nothing above them changes.
   ===================================================================== */
var CHAT_LIMITS={
  photoPx:1280, photoQ:0.7,          /* readable on any phone, ~150KB */
  thumbPx:240,  thumbQ:0.55,         /* lives inside the message, ~10KB */
  voiceMs:120000,                    /* two minutes */
  fileBytes:1500000,                 /* shared store: 1.5 MB a file */
  fileBytesLocal:350000,             /* this-browser-only store is ~5 MB in all */
  removeWindowMs:10*60000            /* authors can take a message back for 10 minutes */
};
var CHATMETA={}, CHATSEEN={};

var ChatStore={
  key:function(jobId){ return 'mz:chat:'+jobId; },
  attKey:function(id){ return 'mz:att:'+id; },
  list:async function(jobId){ return (await DB.get(this.key(jobId)))||[]; },
  /* The list is read again immediately before it is written, so two people
     posting a few seconds apart do not overwrite each other. It narrows
     the race; only a server can close it. */
  post:async function(jobId,msg,attData){
    if(attData){
      var okA=await DB.set(this.attKey(msg.att.id),attData);
      if(!okA) return null;
    }
    var list=await DB.append(this.key(jobId),msg);
    if(!list){ if(attData) await DB.del(this.attKey(msg.att.id)); return null; }
    await this.touch(jobId,list);
    return list;
  },
  /* A removed message leaves a marker behind, so the conversation still
     shows that something was said and by whom. */
  remove:async function(jobId,msgId){
    var list=await this.list(jobId);
    var m=list.filter(function(x){ return x.id===msgId; })[0];
    if(!m) return list;
    if(m.att) await DB.del(this.attKey(m.att.id));
    m.removed={by:S.user.id, byName:S.user.name, at:Date.now()};
    delete m.text; delete m.att;
    if(!await DB.set(this.key(jobId),list)) return null;
    await this.touch(jobId,list);
    return list;
  },
  attachment:async function(id){ return DB.get(this.attKey(id)); },
  meta:async function(){ return (await DB.get('mz:chatmeta'))||{}; },
  touch:async function(jobId,list){
    var live=list.filter(function(m){ return !m.removed; });
    var last=live[live.length-1];
    var entry={ n:live.length, at:last?last.at:0, by:last?last.by:'', byName:last?last.byName:'',
      text:last?chatSummary(last):'',
      recent:live.slice(-30).map(function(x){ return {at:x.at, by:x.by}; }) };
    CHATMETA[jobId]=entry;
    var patch={}; patch[jobId]=entry;
    await DB.merge('mz:chatmeta',patch);
  }
};

/* ---------- who has read what ----------
   Kept per person on this device. Losing it costs nothing worse than a
   badge that shows old messages as new. */
async function loadChatSeen(){
  CHATSEEN=(S.user&&await DB.getMine('mz:chatseen:'+S.user.id))||{};
}
function markChatSeen(jobId){
  CHATSEEN[jobId]=Date.now();
  DB.setMine('mz:chatseen:'+S.user.id,CHATSEEN);
}
function chatUnread(jobId){
  var m=CHATMETA[jobId]; if(!m||!S.user) return 0;
  var seen=CHATSEEN[jobId]||0;
  return (m.recent||[]).filter(function(r){ return r.at>seen&&r.by!==S.user.id; }).length;
}
function chatBadge(jobId){
  var n=chatUnread(jobId);
  return n?'<span class="chatbadge" title="'+n+' new message'+(n>1?'s':'')+'">'+
    ICON.chat+n+'</span>':'';
}
function chatSummary(m){
  if(m.removed) return 'Message removed';
  if(m.att){
    if(m.att.kind==='image') return 'Photo'+(m.text?' · '+m.text:'');
    if(m.att.kind==='voice') return 'Voice note '+vTime(m.att.ms||0);
    return 'File · '+m.att.name;
  }
  return String(m.text||'').slice(0,80);
}

/* ---------- the card on the job ---------- */
function sectionChat(j){

/* ---------- sending ---------- */
function newMsg(text,att){
  return { id:uid('m'), at:Date.now(), by:S.user.id, byName:S.user.name, title:userTitle(S.user),
    text:text||'', att:att||null };
}
async function chatPost(text,att,data){
  var c=S.chat; if(!c) return false;
  var list=await ChatStore.post(c.jobId,newMsg(text,att),data);
  if(!list){ toast('That did not send. Nothing was lost — try again.','bad'); return false; }
  if(S.chat&&S.chat.jobId===c.jobId){ S.chat.msgs=list; markChatSeen(c.jobId); paintChatList(true); }
  return true;
}
async function chatSend(){
  var text=(S.chatDraft||'').trim(); if(!text) return;
  if(text.length>4000){ toast('That is very long — split it into two messages','bad'); return; }
  if(await chatPost(text,null,null)){ S.chatDraft=''; paintComposer(); }
}
function attCap(){ return isShared()?CHAT_LIMITS.fileBytes:CHAT_LIMITS.fileBytesLocal; }
function readDataUrl(f){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){ res(String(r.result)); };
    r.onerror=function(){ rej(new Error('read failed')); };
    r.readAsDataURL(f);
  });
}
function imgSize(url){
  return new Promise(function(res){
    var i=new Image(); i.onload=function(){ res({w:i.width,h:i.height}); };
    i.onerror=function(){ res({w:0,h:0}); }; i.src=url;
  });
}
/* Photos are squeezed before they are kept; anything else goes as it is,
   up to the size limit. A caption typed before attaching rides on the
   first file. */
async function chatAddFiles(files){
  if(!files||!files.length) return;
  var caption=(S.chatDraft||'').trim(), sent=0;
  for(var i=0;i<files.length;i++){
    var f=files[i], att, data;
    try{
      if(/^image\//.test(f.type)&&!/gif|svg/.test(f.type)){
        var full=await shrinkImage(f,CHAT_LIMITS.photoPx,CHAT_LIMITS.photoQ);
        var thumb=await shrinkImage(f,CHAT_LIMITS.thumbPx,CHAT_LIMITS.thumbQ);
        var sz=await imgSize(thumb);
        att={id:uid('at'), kind:'image', name:f.name||'photo.jpg', mime:'image/jpeg',
          size:Math.round(full.length*0.75), thumb:thumb, w:sz.w, h:sz.h};
        data={mime:'image/jpeg', name:att.name, data:full};
      } else {
        if(f.size>attCap()){
          toast(f.name+' is '+fmtKb(f.size)+'. The limit here is '+fmtKb(attCap())+'.','bad'); continue; }
        att={id:uid('at'), kind:'file', name:f.name||'file', mime:f.type||'application/octet-stream', size:f.size};
        data={mime:att.mime, name:att.name, data:await readDataUrl(f)};
      }
    }catch(e){ toast('Could not read '+(f.name||'that file'),'bad'); continue; }
    toast('Sending '+(att.kind==='image'?'photo':att.name)+'…');
    if(await chatPost(sent===0?caption:'',att,data)) sent++;
  }
  if(sent&&caption){ S.chatDraft=''; paintComposer(); }
}

/* ---------- voice notes ---------- */
var CHATREC={on:false, mr:null, stream:null, chunks:[], t0:0, timer:null, cancel:false};
async function chatRecStart(){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)){
    toast('This browser cannot record. Send a photo or type it instead.','bad'); return; }
  try{
    CHATREC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  }catch(err){
    toast((err&&err.name==='NotAllowedError')
      ? 'The microphone is blocked. Allow it for this page and try again.'
      : 'Could not reach the microphone.','bad');
    return;
  }
  var mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].filter(function(m){
    try{ return MediaRecorder.isTypeSupported(m); }catch(e){ return false; } })[0];
  CHATREC.chunks=[]; CHATREC.cancel=false;
  CHATREC.mr=new MediaRecorder(CHATREC.stream, mime?{mimeType:mime,audioBitsPerSecond:32000}:undefined);
  CHATREC.mr.ondataavailable=function(ev){ if(ev.data&&ev.data.size) CHATREC.chunks.push(ev.data); };
  CHATREC.mr.onstop=chatRecDone;
  CHATREC.mr.start();
  CHATREC.on=true; CHATREC.t0=Date.now();
  CHATREC.timer=setInterval(function(){
    var ms=Date.now()-CHATREC.t0, t=document.getElementById('chatrectime');
    if(t) t.textContent=vTime(ms);
    if(ms>=CHAT_LIMITS.voiceMs){ chatRecStop(true); toast('Stopped at two minutes — sending'); }
  },250);
  paintComposer();
}
function chatRecStop(send){
  if(!CHATREC.on) return;
  CHATREC.cancel=!send; CHATREC.on=false;
  CHATREC.ms=Date.now()-CHATREC.t0;
  clearInterval(CHATREC.timer); CHATREC.timer=null;
  try{ if(CHATREC.mr&&CHATREC.mr.state!=='inactive') CHATREC.mr.stop(); }catch(e){}
  if(CHATREC.stream){ CHATREC.stream.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} }); CHATREC.stream=null; }
  paintComposer();
}
async function chatRecDone(){
  if(CHATREC.cancel||!CHATREC.chunks.length) return;
  if(CHATREC.ms<800){ toast('Too short — hold on a moment longer next time'); return; }
  var blob=new Blob(CHATREC.chunks,{type:(CHATREC.mr&&CHATREC.mr.mimeType)||'audio/webm'});
  if(blob.size>attCap()){ toast('That recording is too large to keep here','bad'); return; }
  var att={id:uid('at'), kind:'voice', name:'voice-note', mime:blob.type, size:blob.size, ms:CHATREC.ms};
  var data={mime:blob.type, name:att.name, data:'data:'+blob.type+';base64,'+await blobB64(blob)};
  await chatPost('',att,data);
}

async function saveDataUrl(url,name){
  try{
    var blob=await (await fetch(url)).blob();
    var u=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=u; a.download=name||'file'; document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); URL.revokeObjectURL(u); },400);
  }catch(e){ toast('Could not save that here','bad'); }
}

/* ---------- keeping up with the other phones ----------
   No push yet, so the open conversation checks every few seconds and the
   job list every twenty. Nothing redraws while someone is typing. */
var CHATTICK=0;
function busyTyping(){
  var a=document.activeElement;
  return MODAL||(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.id!=='chatbox');
}
async function chatPoll(){
  try{ await chatPollInner(); }catch(e){ if(e&&e.auth) render(); }
}
var SYNC_QUIET=['intake','purchase','chat','settings','inspect','import','book'];
async function chatPollInner(){
  if(!S.user||document.hidden) return;
  CHATTICK++;
  if(S.view.name==='chat'&&S.chat&&S.chat.msgs){
    if(MODE==='cloud'){
      /* the rest of the workshop keeps moving while a chat is open */
      if(CHATTICK%3===0){ await syncFromServer(); checkNewNotes(); }
      /* ask only whether it changed; download it only when it has */
      var ck=ChatStore.key(S.chat.jobId), st=await Cloud.stamps([ck]);
      if(!st.length||st[0].updated_at===STAMPS[ck]) return;
    }
    var list=await ChatStore.list(S.chat.jobId);
    var a=S.chat.msgs, la=a[a.length-1], lb=list[list.length-1];
    var changed=list.length!==a.length||(lb&&la&&(lb.id!==la.id||!!lb.removed!==!!la.removed))||
      list.some(function(m,i){ return a[i]&&!!m.removed!==!!a[i].removed; });
    if(changed){ S.chat.msgs=list; markChatSeen(S.chat.jobId); paintChatList(false); }
    return;
  }
  if(MODE==='cloud'){
    var changed=await syncFromServer();
    checkNewNotes();
    if(changed&&SYNC_QUIET.indexOf(S.view.name)<0&&!busyTyping()) rerender();
    return;
  }
  checkNewNotes();
  if(CHATTICK%3) return;
  var m=await ChatStore.meta();
  if(JSON.stringify(m)===JSON.stringify(CHATMETA)) return;
  CHATMETA=m;
  if((S.view.name==='board'||S.view.name==='job')&&!busyTyping()) rerender();
}

var XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

    var s=document.createElement('script'); s.src=XLSX_URL;
    s.onload=function(){ res(window.XLSX); };
    s.onerror=function(){ rej(new Error('Could not load the Excel reader. Check the internet, or save the sheet as CSV.')); };
    document.head.appendChild(s);
  });
}
function parseCsv(text){
  var rows=[], row=[], cell='', q=false;
  text=String(text).replace(/^﻿/,'');
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; }
      else cell+=c;
    } else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'||c==='\r'){
      if(c==='\r'&&text[i+1]==='\n') i++;
      row.push(cell); rows.push(row); row=[]; cell='';
    } else cell+=c;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
async function readSheetFile(f){
  if(/\.csv$/i.test(f.name)||f.type==='text/csv') return {sheets:{Sheet1:parseCsv(await f.text())}};
  var X=await loadXlsx();
  var wb=X.read(await f.arrayBuffer(),{type:'array',cellDates:true});
  var out={};
  wb.SheetNames.forEach(function(n){
    out[n]=X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});
  });
  return {sheets:out};
}
/* the first row with two or more filled cells is the header */
function splitHeader(rows){
  for(var i=0;i<Math.min(rows.length,15);i++){
    var filled=rows[i].filter(function(c){ return String(c).trim()!==''; }).length;
    if(filled>=2) return {headers:rows[i].map(function(h){ return String(h).trim(); }),
      data:rows.slice(i+1).filter(function(r){ return r.some(function(c){ return String(c).trim()!==''; }); })};
  }
  return {headers:[],data:[]};
}
function normH(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9%/#]+/g,' ').trim(); }
function guessMap(type,headers){
  var map={}, used={}, H=headers.map(normH), F=IMPORT_TYPES[type].fields;
  /* exact names first, then a header that contains a known name */
  [0,1].forEach(function(pass){
    F.forEach(function(f){
      if(map[f[0]]!==undefined) return;
      for(var i=0;i<H.length;i++){
        if(used[i]||!H[i]) continue;
        var hit=f[3].some(function(syn){
          return pass===0 ? H[i]===syn : (syn.length>=3&&(' '+H[i]+' ').indexOf(' '+syn+' ')>=0);
        });
        if(hit){ map[f[0]]=i; used[i]=1; return; }
      }
    });
  });
  return map;
}

/* ---------- reading values ---------- */
function cellStr(v){
  if(v===null||v===undefined) return '';
  if(v instanceof Date) return isoDate(v.getTime());
  if(typeof v==='number'&&Math.abs(v)>=1e9&&Number.isInteger(v)) return String(v);
  return String(v).trim();
}
/* Indian sheets write the day first. A bare number is an Excel date. */
function parseDateCell(v){
  if(v instanceof Date&&!isNaN(v)) return new Date(v.getFullYear(),v.getMonth(),v.getDate(),12).getTime();
  if(typeof v==='number'&&v>20000&&v<80000) return Math.round((v-25569)*86400000)+12*3600000-new Date().getTimezoneOffset()*60000;
  var s=String(v||'').trim(); if(!s) return null;
  var m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ var y=+m[3]; if(y<100) y+=2000;
    var d=new Date(y,+m[2]-1,+m[1],12); return (d.getMonth()===+m[2]-1)?d.getTime():null; }
  m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m){ var d2=new Date(+m[1],+m[2]-1,+m[3],12); return isNaN(d2)?null:d2.getTime(); }
  var t=Date.parse(s); return isNaN(t)?null:t;
}
function numCell(v){ var n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }
function phoneCell(v){
  var d=cellStr(v).replace(/[^0-9+]/g,'');
  if(/^\+?91\d{10}$/.test(d)) d=d.slice(-10);
  if(/^0\d{10}$/.test(d)) d=d.slice(1);
  return normPhone(d);     /* kept with its country code, like every other number */
}
function rowRec(type,row,map){
  var o={};
  IMPORT_TYPES[type].fields.forEach(function(f){ var i=map[f[0]]; o[f[0]]=(i===undefined||i==='')?'':row[i]; });
  return o;
}

/* ---------- checking each row ----------
   Returns {ok, why, rec}: rec is the cleaned-up record, why says plainly
   what is wrong with a row that will be skipped. Nothing is written here. */
/* names and addresses are kept in Title Case and notes as sentences, the
   same as anything typed into the app */
function checkRow(type,r){
  var x=checkRowRaw(type,r), c=x&&x.rec;
  if(c){
    ['name','address','vendor','supplier'].forEach(function(k){ if(typeof c[k]==='string'&&c[k]) c[k]=titleCase(c[k]); });
    ['complaint','work','notes','note'].forEach(function(k){ if(typeof c[k]==='string'&&c[k]) c[k]=sentenceCase(c[k]); });
  }
  return x;
}
function checkRowRaw(type,r){
  var why=[];
  if(type==='customers'){
    var name=cellStr(r.name), ph=phoneCell(r.phone);
    if(!name) return {ok:false,why:'no name'};
    if(ph&&ph.length<10) why.push('phone looks short');
    var g=cellStr(r.gstin).toUpperCase(), gc=g?gstinCheck(g):null;
    if(g&&!gc.ok) why.push('GSTIN fails its check — left out');
    return {ok:true, why:why.join('; '), rec:{name:name, phone:ph, altPhone:phoneCell(r.altPhone), email:cellStr(r.email),
      gstin:(gc&&gc.ok)?gc.raw:'', address:cellStr(r.address), opening:toPaise(r.opening)}};
  }
  if(type==='vendors'){
    var vn=cellStr(r.name); if(!vn) return {ok:false,why:'no name'};
    var vg=cellStr(r.gstin).toUpperCase(), vgc=vg?gstinCheck(vg):null;
    if(vg&&!vgc.ok) why.push('GSTIN fails its check — left out');
    return {ok:true, why:why.join('; '), rec:{name:vn, gstin:(vgc&&vgc.ok)?vgc.raw:'', gc:vgc, phone:phoneCell(r.phone),
      email:cellStr(r.email), address:cellStr(r.address), bankName:cellStr(r.bankName), acNo:cellStr(r.acNo),
      ifsc:cellStr(r.ifsc).toUpperCase(), opening:toPaise(r.opening)}};
  }
  if(type==='bikes'){
    var reg=regKey(cellStr(r.reg)); if(reg.length<4) return {ok:false,why:'no registration number'};
    var mk=matchMake(cellStr(r.make)), md=matchModel(mk,cellStr(r.model));
    return {ok:true, why:'', rec:{reg:reg, make:mk, model:md, cc:cellStr(r.cc)||ccFor(mk,md)||'',
      name:cellStr(r.name), phone:phoneCell(r.phone), odo:String(Math.round(numCell(r.odo))||''),
      lastVisit:parseDateCell(r.lastVisit)||0}};
  }
  if(type==='inventory'){
    var no=cellStr(r.no), nm=cellStr(r.name);
    if(!no&&!nm) return {ok:false,why:'no part number or name'};
    var gst=r.gst===''?18:Math.round(numCell(String(r.gst).replace('%','')));
    if(gst>0&&gst<1) gst=Math.round(gst*100);       /* 0.18 written as a fraction */
    if([0,5,12,18,28,40].indexOf(gst)<0){ why.push('GST '+gst+'% is not a GST rate — set to 18%'); gst=18; }
    if(gst===12||gst===28) why.push('GST '+gst+'% was abolished in Sept 2025 — check this part');
    var cat=matchCategory(cellStr(r.category),nm);
    var brand=cat==='Labour'?'':matchBrand(cellStr(r.brand),nm);
    if(!cat) why.push('category not recognised — shows under "Category not set"');
    if(!brand&&cat!=='Labour') why.push('no brand — shows under "Brand not set"');
    var qty=numCell(r.qty);
    if(qty<0){ why.push('negative quantity — opening stock left at 0'); qty=0; }
    var cost=toPaise(cellStr(r.cost));
    if(qty>0&&!cost) why.push('stock with no cost — margins for it will read wrong');
    var unit=cellStr(r.unit).toLowerCase(); if(UNITS.indexOf(unit)<0) unit='piece';
    return {ok:true, why:why.join('; '), rec:{no:no, name:nm||no, category:cat, brand:brand, hsn:cellStr(r.hsn), gst:gst, qty:qty,
      cost:cost, sale:toPaise(cellStr(r.sale)), mrp:toPaise(cellStr(r.mrp)), unit:unit, minQty:numCell(r.minQty)}};
  }
  if(type==='history'){
    var dt=parseDateCell(r.date); if(!dt) return {ok:false,why:'date not readable'};
    if(dt>Date.now()+86400000) return {ok:false,why:'date is in the future'};
    var hreg=regKey(cellStr(r.reg)); if(hreg.length<4) return {ok:false,why:'no registration number'};
    var hmk=matchMake(cellStr(r.make));
    return {ok:true, why:'', rec:{at:dt, reg:hreg, no:cellStr(r.no), make:hmk, model:matchModel(hmk,cellStr(r.model)),
      name:cellStr(r.name), phone:phoneCell(r.phone), odo:String(Math.round(numCell(r.odo))||''),
      jobType:cellStr(r.jobType), complaint:cellStr(r.complaint), amount:toPaise(cellStr(r.amount)),
      invoiceNo:cellStr(r.invoiceNo)}};
  }
  return {ok:false,why:'unknown type'};
}
/* "royal enfield", "RE", "Royal-Enfield" all land on the one make the app knows */
var MAKE_ALIAS={re:'Royal Enfield',hero:'Hero MotoCorp',heromotocorp:'Hero MotoCorp',hd:'Harley-Davidson',harley:'Harley-Davidson',
  bmw:'BMW Motorrad',indian:'Indian Motorcycle',ola:'Ola Electric',ktm:'KTM',tvs:'TVS'};
function matchMake(s){
  if(!s) return '';
  var k=pkey(s), all=allMakes();
  for(var i=0;i<all.length;i++) if(pkey(all[i])===k) return all[i];
  if(MAKE_ALIAS[k.toLowerCase()]) return MAKE_ALIAS[k.toLowerCase()];
  for(var j=0;j<all.length;j++) if(pkey(all[j]).indexOf(k)===0&&k.length>=3) return all[j];
  return s;
}
function matchModel(make,s){
  if(!s) return '';
  var k=pkey(s), ms=modelsFor(make);
  for(var i=0;i<ms.length;i++) if(pkey(ms[i].n)===k) return ms[i].n;
  return s;
}
/* the specific category as written; else read off the product name; else
   left unset so it shows under "Category not set" for someone to file */
function matchCategory(s,name){
  var c=catFind(s);
  if(c) return c;
  if(/^labou?r$/i.test(String(s||'').trim())) return 'Labour';
  return catGuess(name||'')||catGuess(s||'')||'';
}
function matchBrand(s,name){
  var b=String(s||'').trim();
  if(b){ if(/^(local|unbranded|local\s*\/\s*unbranded|no brand)$/i.test(b)) return BRAND_LOCAL;
    return brandFind(b)||titleCase(b); }
  return brandGuess(name||'');
}

function partyMatch(rec,type){
  var p=null;
  if(rec.gstin) p=partyByGstin(rec.gstin);
  if(!p&&rec.phone&&rec.phone.length>=10) p=partyByPhone(rec.phone);
  if(!p){ var nk=String(rec.name).toLowerCase().trim();
    p=PARTIES.filter(function(x){ return String(x.name).toLowerCase().trim()===nk&&(!type||(x.types||[]).indexOf(type)>=0); })[0]||null; }
  return p;
}
function fillBlank(p,rec,keys){ keys.forEach(function(k){ if(rec[k]&&!p[k]) p[k]=rec[k]; }); }
async function importCustomers(recs){
  var made=0, upd=0;
  recs.forEach(function(r){
    var p=partyMatch(r,'customer');
    if(p){ upd++; addType(p,'customer'); }
    else { p=blankParty(); p.name=r.name; p.types=['customer'];
      p.state=S.core.workshop.state; p.stateCode=S.core.workshop.stateCode; PARTIES.push(p); made++; }
    fillBlank(p,r,['phone','altPhone','email','address']);
    if(r.gstin&&!p.gstin){ var g=gstinCheck(r.gstin); p.gstin=g.raw; p.state=g.state; p.stateCode=g.stateCode; p.pan=g.pan; }
    if(r.opening>0&&!(p.opening&&p.opening.amount)) p.opening={amount:r.opening, side:'dr', asOn:isoDate()};
  });
  if(!await savePartyData()) return null;
  return made+' customers added, '+upd+' already on file were filled in.';
}

async function importBikes(recs){

async function importHistory(recs){
  var seen={};
  S.index.forEach(function(e){
    if(e.imported) seen[(e.no||'')+'|'+e.reg+'|'+isoDate(e.createdAt)]=1;
  });
  var entries=[], ix=[], made=0, dup=0, bikes={}, n=0;
  recs.sort(function(a,b){ return a.at-b.at; });
  recs.forEach(function(r){

    var j={ id:uid('job'), no:r.no||('OLD-'+String(n).padStart(5,'0')), imported:true, createdAt:r.at, closedAt:r.at,
      createdBy:S.user.id, stage:'closed', hold:false, reg:r.reg, make:r.make, model:r.model, cc:ccFor(r.make,r.model)||'',
      odo:r.odo, fuel:'', cust:{name:r.name, phone:r.phone, gstin:'', address:''},

      required:[], mechanicId:'', expected:'', partyId:pty?pty.id:'', advance:null, lines:[],
      approvals:{owner:null,customer:null}, additions:[], bills:[], estimates:[],
      histTotal:r.amount, histInvoice:r.invoiceNo,
      log:[{ts:Date.now(), by:S.user.id, byName:S.user.name, role:roleList(S.user)[0], title:userTitle(S.user),
        action:'Brought in from old records', detail:(S.imp.fileName||'')+(r.invoiceNo?' · old bill '+r.invoiceNo:'')}] };
    var e=indexEntry(j);
    entries.push(['mz:job:'+j.id,j]); ix.push(e); made++;
    var b=Object.assign({},S.core.bikes[r.reg]||bikes[r.reg]||{},{reg:r.reg});
    ['make','model'].forEach(function(k){ if(r[k]) b[k]=r[k]; });
    if(r.name) b.name=r.name; if(r.phone) b.phone=r.phone;
    if(r.odo&&(!b.lastOdo||+r.odo>=+b.lastOdo)) b.lastOdo=r.odo;

  });
  if(!made){ return dup+' rows were already brought in before — nothing new.'; }
  toast('Writing '+made+' old job cards…');
  if(MODE==='cloud'){
    if(!await DB.setMany(entries.concat(ix.map(function(e){ return ['mz:ix:'+e.id,e]; })))) return null;

  await DB.merge('mz:bikes',bikes);

  return made+' past visits brought in'+(dup?', '+dup+' skipped as already here':'')+
    '. They show under each bike’s past visits at intake and feed the Due for service list. They are not counted in sales or GST.';

/* =====================================================================
   NOTIFICATIONS
   The people on a job hear about it without having to go looking:
     assigned          -> the technician
     work ticked done  -> the owner and whoever took the bike in
     all work done     -> the owner and whoever took the bike in
     extra work found  -> the owner and whoever took the bike in
     customer said yes -> the technician
   Each one goes into one shared list, added one at a time so two phones
   never overwrite each other. Every phone checks the list every few
   seconds while the app is open: a new one shows in the bell, as a
   message on screen, and, where the person has allowed it, as the
   phone's own notification.
   ===================================================================== */
var NOTES=[], NOTESEEN=0, NOTIFIED=null, SWREG=null;
var NOTE_KEEP=600;

function uniqIds(a){ var o={}, r=[]; a.forEach(function(x){ if(x&&!o[x]){ o[x]=1; r.push(x); } }); return r; }
function ownerIds(){
  return S.core.users.filter(function(u){ return u.active!==false&&roleList(u).indexOf('owner')>=0; })
    .map(function(u){ return u.id; });
}
/* who keeps an eye on a job: the owner and whoever took the bike in */
function watchers(j){ return uniqIds(ownerIds().concat([j.createdBy])); }

async function notify(toIds,j,kind,text){
  if(!S.user) return;
  var ids=uniqIds(toIds).filter(function(id){ return id!==S.user.id; });
  if(!ids.length) return;
  var n={ id:uid('nt'), at:Date.now(), to:ids, by:S.user.id, byName:S.user.name, kind:kind,
    jobId:j?j.id:'', jobNo:j?j.no:'', reg:j?j.reg:'', model:j?((j.make||'')+' '+(j.model||'')).trim():'', text:text };
  var list=await DB.append('mz:notes',n);
  if(list){
    NOTES=list;
    if(NOTIFIED) NOTIFIED[n.id]=1;
    /* keep the list short; the job card's own history keeps everything */
    if(list.length>NOTE_KEEP*1.4){ NOTES=list.slice(-NOTE_KEEP); DB.set('mz:notes',NOTES); }
  }
}
function myNotes(){
  if(!S.user) return [];
  return NOTES.filter(function(n){ return (n.to||[]).indexOf(S.user.id)>=0; });
}
function unreadNotes(){ return myNotes().filter(function(n){ return n.at>NOTESEEN; }); }

  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>'+

/* ---------- the phone's own notifications ----------
   Android shows them only through a service worker, so one small worker
   is registered for that job alone. It caches nothing, so an update to
   the app always reaches everyone on their next open. */
function canSysNotify(){ return ('Notification' in window)&&location.protocol.indexOf('http')===0; }
async function registerSw(){
  if(!('serviceWorker' in navigator)||location.protocol.indexOf('http')!==0) return;
  try{
    SWREG=await navigator.serviceWorker.register('sw.js');
    navigator.serviceWorker.addEventListener('message',function(e){
      if(e.data&&e.data.openJob&&S.user) openJob(e.data.openJob);
    });
  }catch(e){ SWREG=null; }
}
function sysNotify(n){
  if(!canSysNotify()||Notification.permission!=='granted') return;
  var title=regShow(n.reg)+(n.model?' · '+n.model:'');
  var opts={ body:n.byName+': '+n.text, tag:'job-'+n.jobId+'-'+n.kind, renotify:true,
    data:{jobId:n.jobId}, icon:'icon-192.png', badge:'icon-192.png' };
  try{
    if(SWREG&&SWREG.showNotification){ SWREG.showNotification(title,opts); return; }
    new Notification(title,opts);
  }catch(e){}
}
async function askNotify(){
  if(!canSysNotify()){
    toast('This phone can only show alerts inside the app. On an iPhone, add the app to the home screen first.','bad'); return; }
  try{
    var p=await Notification.requestPermission();
    if(p==='granted'){ toast('Alerts are on for this phone','good'); sysNotify({reg:'',model:'',byName:'Motoreez',text:'Alerts are working on this phone.',jobId:'',kind:'test'}); }
    else toast('Alerts are blocked. Allow them for this site in the browser settings.','bad');

/* Everything typed goes in as capitals, the way a job card is written by
   hand. Registered before the other input handlers so whatever they read is
   already capitalised. Email addresses and the message that goes to the
   customer opt out with data-nocaps — capitals there read as shouting. */
document.addEventListener('input',function(e){
  var el=e.target;
  if(!el||!el.tagName) return;
  var isText=(el.tagName==='TEXTAREA')||(el.tagName==='INPUT'&&(el.type==='text'||el.type===''));
  if(!isText) return;
  if(el.dataset&&el.dataset.nocaps!==undefined) return;
  var up=el.value.toUpperCase();
  if(up===el.value) return;
  var a=el.selectionStart, b=el.selectionEnd;
  el.value=up;
  try{ el.setSelectionRange(a,b); }catch(err){}
});

/* A search box redraws the whole screen \u2014 sidebar, top bar and bottom bar
   included \u2014 then puts the cursor back where it was. */
function searchRedraw(id){
  var y=window.scrollY;
  render();
  var f=document.getElementById(id);
  if(f){ f.focus(); try{ f.setSelectionRange(f.value.length,f.value.length); }catch(e){} }
  window.scrollTo(0,y);
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&MODAL) closeModal();
  /* Enter sends on a keyboard; on a phone it is a new line, as people expect */
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='chatbox'&&!('ontouchstart' in window)){
    e.preventDefault(); guard('chatSend',null,chatSend); }
});

var POLLING=false;
async function bootData(){
  S.bootErr='';
  try{ await bootLoad(); }
  catch(e){
    console.error(e);
    if(e&&e.auth){ render(); return; }
    if(e&&e.notMember){ Cloud.keep(null); S.cloudErr=e.message; render(); return; }
    S.bootErr=(e&&e.net)?'No internet, or the server is not answering.':(e&&e.message)||'Something went wrong starting up.';
    render(); return;
  }
  if(!POLLING){ POLLING=true; setInterval(chatPoll,5000); }
  render();
  if(MODE==='memory') toast(storeNote(),'bad');
}
async function bootLoad(){
  if(MODE==='cloud'){
    if(await Cloud.rpc('is_member',{})!==true){
      var nm=new Error('That login is not allowed into this workshop. Ask the owner to add it (setup guide, step 2).');
      nm.notMember=true; throw nm;
    }
    /* everything shared, in one request */
    var want=Object.keys(SYNC_KEYS);
    want.forEach(function(k){ PREFETCH[k]=null; });
    (await Cloud.getMany(want)).forEach(function(r){ PREFETCH[r.key]=r.value; });
  }
  S.core=await DB.get('mz:core');
  if(!S.core){ S.core=seedCore(); await DB.set('mz:core',S.core); }
  if((S.core.seed||0)<3){          /* staff list and workshop details brought up to date */
    var fresh=seedCore();
    S.core.users=fresh.users;
    if(!S.core.workshop.gstin||S.core.workshop.gstin.indexOf('ABCDE')>=0) S.core.workshop=fresh.workshop;
    S.core.seed=3;
    await saveCore();
  }
  if((S.core.seed||0)<4){          /* new staff and roles: keep PINs, pay and dates, change roles and titles */
    var fresh4=seedCore().users, mine=S.core.users||[], out4=[];
    fresh4.forEach(function(f){
      var have=mine.filter(function(u){ return u.id===f.id; })[0];
      if(have){ have.roles=f.roles; have.title=f.title; delete have.role; out4.push(have); }
      else out4.push(f);
    });
    mine.forEach(function(u){ if(out4.indexOf(u)<0) out4.push(u); });
    S.core.users=out4; S.core.seed=4;
    await saveCore();
  }
  normaliseCore();
  /* bikes used to live inside the settings record; move them out once */
  var bikes=await DB.get('mz:bikes');
  var legacy=S.core.bikes&&Object.keys(S.core.bikes).length?S.core.bikes:null;
  S.core.bikes=dropGone(Object.assign({},legacy||{},bikes||{}));
  bikesSeen();
  if(legacy){ if(!await DB.merge('mz:bikes',legacy)) throw new Error('Could not move the bike list.'); await saveCore(); }
  await loadIndex();
  await loadCounters();
  await loadStore();
  await loadPartyData();
  await loadExpenseData();
  await loadPayroll();
  await loadAudit();
  await loadReturns();
  S.repFav=await DB.getMine('mz:repfav')||['pnl','daybook','outstand'];
  await loadAppts();
  await loadReminded();
  S.core.users.forEach(function(u){ if(u.active!==false&&hasFloat(u.id)) ensureFloat(u.id); });
  if(!ACCOUNTS.length){ ACCOUNTS=seedAccounts(); await DB.set('mz:accounts',ACCOUNTS); }
  if(mergeSuppliers()) await DB.set('mz:parties',PARTIES);
  if(!S.core.phonesDone){ await phonesMigrate(); S.core.phonesDone=1; await saveCore(); }
  if(S.core.kitsText&&!/DIAGNOSIS:/.test(S.core.kitsText)){
    var have4=parseKits(S.core.kitsText);
    S.core.kitsText=S.core.kitsText.replace(/\s*$/,'')+'\n'+KIT_DEFAULT.split('\n').filter(function(l){ return !have4[upReq(l.slice(0,l.indexOf(':')))]; }).join('\n');
    await saveCore();
  }
  if(!S.core.labourSeeded){ if(seedLabour()) await saveStore('parts'); S.core.labourSeeded=1; await saveCore(); }
  if(!S.core.jobs3){
    if(S.core.kitsText&&/ENGINE SERVICE:/.test(S.core.kitsText)&&!/ENGINE FLUSH \+ OIL:/.test(S.core.kitsText)) S.core.kitsText=null;
    S.core.jobs3=1; await saveCore();
  }
  if(!S.core.caseDone){ await caseMigrate(); S.core.caseDone=1; S.core.capsDone=1; await saveCore(); }
  if(!S.core.cats2){ if(catsMigrate()) await saveStore('parts'); S.core.cats2=1; await saveCore(); }
  if(!S.core.batchNames){ if(migrateBatchNames()) await DB.set('mz:batches',BATCHES); S.core.batchNames=1; await saveCore(); }
  CHATMETA=await ChatStore.meta();
  NOTES=await DB.get('mz:notes')||[];
  registerSw();
  var last=await DB.getMine('mz:lastuser'); if(last&&coreUser(last).id) S.pickUser=last;
  if(S.user) await loadChatSeen();
}
