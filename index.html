/* ---------- lookups ---------- */
function pkey(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
/* the things that sit on a shelf; labour lives only under Labour rates */
function shelfParts(){ return PARTS.filter(function(p){ return !isLabour(p); }); }
function partById(id){ for(var i=0;i<PARTS.length;i++) if(PARTS[i].id===id) return PARTS[i]; return null; }
function partByNo(no){
  var k=pkey(no);
  for(var i=0;i<PARTS.length;i++){
    if(pkey(PARTS[i].no)===k) return PARTS[i];
    var al=PARTS[i].aliases||[];
    for(var j=0;j<al.length;j++) if(pkey(al[j])===k) return PARTS[i];
  }
  return null;
}
function supplierById(id){ for(var i=0;i<SUPPLIERS.length;i++) if(SUPPLIERS[i].id===id) return SUPPLIERS[i]; return null; }
function supplierByGstin(g){
  var k=pkey(g); return SUPPLIERS.filter(function(s){ return pkey(s.gstin)===k; })[0]||null;
}
function isLabour(p){ return p.category==='Labour'||/^99/.test(String(p.hsn||'')); }
function findParts(q,kind){
  var t=pkey(q), raw=String(q||'').trim().toLowerCase();
  if(!raw) return [];
  var hit=[], mid=[];
  for(var i=0;i<PARTS.length;i++){
    var p=PARTS[i];
    if(kind==='part'&&isLabour(p)) continue;
    if(kind==='labour'&&!isLabour(p)) continue;
    var no=pkey(p.no), nm=String(p.name||'').toLowerCase();
    var alias=(p.aliases||[]).some(function(a){ return pkey(a).indexOf(t)===0; });
    if((t&&no.indexOf(t)===0)||nm.indexOf(raw)===0||alias) hit.push(p);
    else if((t&&no.indexOf(t)>=0)||nm.indexOf(raw)>=0) mid.push(p);
  }
  return hit.concat(mid).slice(0,12);
}

/* ---------- the ledger ---------- */
function moveIn(o){
  MOVES.push({id:uid('mv'), partId:o.partId, batchId:o.batchId||'', qty:o.qty, kind:o.kind,
    ref:o.ref||'', note:o.note||'', at:Date.now(), by:S.user?S.user.id:''});
}
function stockOf(partId){
  var t=0; for(var i=0;i<MOVES.length;i++) if(MOVES[i].partId===partId) t+=MOVES[i].qty;
  return Math.round(t*1000)/1000;
}
function stockOfBatch(batchId){
  var t=0; for(var i=0;i<MOVES.length;i++) if(MOVES[i].batchId===batchId) t+=MOVES[i].qty;
  return Math.round(t*1000)/1000;
}
function batchesOf(partId){
  return BATCHES.filter(function(b){ return b.partId===partId; })
    .sort(function(a,b){ return a.at-b.at; });   /* oldest first — FIFO */
}
/* the oldest batch that still has something in it */
function pickBatch(partId){
  var bs=batchesOf(partId);
  for(var i=0;i<bs.length;i++) if(stockOfBatch(bs[i].id)>0) return bs[i];
  return bs[bs.length-1]||null;
}
function costOf(partId){
  var b=pickBatch(partId); return b?b.cost:0;
}
function stockValue(){
  var t=0;
  BATCHES.forEach(function(b){ var q=stockOfBatch(b.id); if(q>0) t+=Math.round(q*b.cost); });
  return t;
}
/* Parts the books say you have less than none of. The shelf is the truth,
   so nothing is blocked \u2014 but somebody has to go and count these. */
function negativeStock(){
  return shelfParts().map(function(p){ return {part:p, qty:stockOf(p.id)}; })
    .filter(function(x){ return x.qty<0; })
    .sort(function(a,b){ return a.qty-b.qty; });
}

/* ---------- what a part earns ----------
   Both worked out, never typed. Compared without tax so that two different
   GST rates cannot make the number lie. */
function exTax(amountInclusive, rate){ return splitTax(amountInclusive, rate||0, true).base; }
function marginPct(part){
  var cost=costOf(part.id); if(!cost) return null;
  var sale=exTax(part.sale||0, part.gst||0);
  if(!sale) return null;
  return Math.round(((sale-cost)/cost)*1000)/10;
}
function discountPct(mrpIncl, buyIncl){
  if(!mrpIncl||!buyIncl) return null;
  return Math.round(((mrpIncl-buyIncl)/mrpIncl)*1000)/10;
}
function pctTag(v,goodAbove){
  if(v===null||v===undefined) return '<span class="muted">—</span>';
  var cls=(v<0)?'t-red':(v>=goodAbove?'t-green':'t-amber');
  return '<span class="tag '+cls+'">'+(v>0?'+':'')+v+'%</span>';
}

/* ---------- saving ---------- */
async function saveStore(what){
  var m={suppliers:['mz:suppliers',SUPPLIERS], parts:['mz:parts',PARTS], batches:['mz:batches',BATCHES],
         moves:['mz:moves',MOVES], purchases:['mz:purchases',PURCHASES]};
  var keys=what?[what]:Object.keys(m);
  for(var i=0;i<keys.length;i++){
    var ok=await DB.set(m[keys[i]][0], m[keys[i]][1]);
    if(!ok){ toast('Could not save the store data. Try again.','bad'); return false; }
  }
  return true;
}
async function loadStore(){
  SUPPLIERS=await DB.get('mz:suppliers')||[];
  PARTS=await DB.get('mz:parts')||[];
  BATCHES=await DB.get('mz:batches')||[];
  MOVES=await DB.get('mz:moves')||[];
  PURCHASES=await DB.get('mz:purchases')||[];
}

/* ---------- receiving a purchase ----------
   Freight and other charges are spread across the lines by value, otherwise
   every margin in the workshop is overstated. */
/* One line, exactly as the supplier printed it.
   rate  - what is on the paper, per bought unit
   incl  - is that rate with tax in it, or without
   disc  - trade discount % on that rate
   A composition dealer's bill of supply has no tax at all.          */
function lineNet(l){ return Math.round(l.qty*l.rate*(1-(l.disc||0)/100)); }
function lineTaxable(l){
  var net=lineNet(l);
  return (l.incl&&l.gst)?exTax(net,l.gst):net;
}
function lineTax(l){ return lineNet(l)-lineTaxable(l)+((!l.incl&&l.gst)?Math.round(lineTaxable(l)*l.gst/100):0); }
function billTotals(p){
  var taxable=0, tax=0;
  (p.lines||[]).forEach(function(l){ taxable+=lineTaxable(l); tax+=lineTax(l); });
  var charges=p.charges||0;
  var chargeTax=(p.chargesTaxed&&charges)?Math.round(charges*0.18):0;
  var gross=taxable+tax+charges+chargeTax;
  /* new bills round to the nearest rupee by themselves; older bills keep what was typed */
  if(p.roundMode==='auto') p.roundOff=Math.round(gross/100)*100-gross;
  return {taxable:taxable, tax:tax, charges:charges, chargeTax:chargeTax,
          gross:gross, roundOff:p.roundOff||0, grand:gross+(p.roundOff||0)};
}
function taxModeOf(supplierId){
  var sp=supplierById(supplierId);
  if(!sp||!sp.gstin) return 'none';
  return (sp.stateCode===(S.core.workshop.stateCode||'06'))?'intra':'igst';
}
/* Every purchase line is its own record, but lines bought at the same cost
   share a name: the first lot is Batch #1, a later lot at the same cost is
   Batch #1 again, and a lot at a new cost becomes Batch #2. What is on the
   supplier's box (a lot or batch code) is kept separately as the lot. */
function batchNum(no){ var m=String(no||'').match(/^batch\s*#\s*(\d+)$/i); return m?parseInt(m[1],10):0; }
function batchLabelFor(partId,cost,supplyType,pick,exceptId){
  var bs=batchesOf(partId).filter(function(b){ return b.id!==exceptId; });
  if(pick&&pick!=='auto'&&pick!=='new') return pick;
  if(pick!=='new'){
    var same=bs.filter(function(b){ return Math.abs(b.cost-cost)<=1&&(b.supplyType||'tax')===(supplyType||'tax')&&batchNum(b.batchNo); })[0];
    if(same) return 'Batch #'+batchNum(same.batchNo);
  }
  var max=0; bs.forEach(function(b){ max=Math.max(max,batchNum(b.batchNo)); });
  return 'Batch #'+(max+1);
}
function batchLabels(partId){
  var seen={}, out=[];
  batchesOf(partId).forEach(function(b){
    var n=batchNum(b.batchNo); if(!n) return;
    var k='Batch #'+n;
    if(!seen[k]){ seen[k]={label:k, cost:b.cost, left:0, supplyType:b.supplyType||'tax'}; out.push(seen[k]); }
    seen[k].left+=Math.max(0,stockOfBatch(b.id));
  });
  return out;
}
function upsertPart(p,l){
  var part=partById(l.partId)||partByNo(l.no);
  if(!part){
    part={id:uid('pt'), no:l.no, aliases:[], name:l.name,
      category:catIsSet(l.category)?l.category:(catGuess(l.name)||l.category||''),
      brand:l.brand||brandGuess(l.name)||'', hsn:l.hsn, gst:l.gst,
      unit:l.unit, buyUnit:l.buyUnit, conv:l.conv, mrp:l.mrp, sale:l.sale, minQty:0,
      createdAt:Date.now(), updatedAt:Date.now()};
    PARTS.push(part);
  } else {
    /* the latest bill wins on price, but the part keeps its identity */
    part.name=l.name||part.name; part.hsn=l.hsn||part.hsn; part.gst=l.gst;
    if(catIsSet(l.category)||!catIsSet(part.category)) part.category=catIsSet(l.category)?l.category:(part.category||l.category);
    if(l.brand) part.brand=l.brand;
    part.unit=l.unit; part.buyUnit=l.buyUnit; part.conv=l.conv;
    if(l.mrp) part.mrp=l.mrp;
    if(l.sale) part.sale=l.sale;
    part.updatedAt=Date.now();
    if(l.no&&pkey(l.no)!==pkey(part.no)&&(part.aliases||[]).map(pkey).indexOf(pkey(l.no))<0){
      part.aliases=(part.aliases||[]).concat([l.no]);
    }
  }
  l.partId=part.id;
  if(p.supplyType==='composition') part.noGst=true;
  else if(part.noGst) part.noGst=false;   /* once it arrives on a tax invoice it can be taxed */
  return part;
}
function lineShare(p,l){
  var lineValue=p.lines.reduce(function(a,x){ return a+lineTaxable(x); },0);
  var charges=p.charges||0;
  return (charges&&lineValue)?Math.round(charges*lineTaxable(l)/lineValue):0;
}
function lineCostPer(p,l){
  return Math.round((lineTaxable(l)+lineShare(p,l))/((l.qty||1)*(l.conv||1)));
}
function postLine(p,l){
  var part=upsertPart(p,l);
  var perIssue=lineCostPer(p,l);
  var b={id:uid('bt'), partId:part.id,
    batchNo:batchLabelFor(part.id,perIssue,p.supplyType||'tax',l.batchPick||'auto'),
    lot:l.lot||l.batchNo||'', cost:perIssue,
    rate:l.rate, incl:!!l.incl, disc:l.disc||0, gst:l.gst, freight:lineShare(p,l),
    serials:l.serials||[], purchaseId:p.id, supplierId:p.supplierId, supplyType:p.supplyType||'tax',
    invNo:p.invNo, invDate:p.invDate, at:p.at||Date.now(), qtyIn:l.qty*(l.conv||1)};
  BATCHES.push(b);
  l.batchId=b.id; l.batchLabel=b.batchNo;
  MOVES.push({id:uid('mv'), partId:part.id, batchId:b.id, qty:l.qty*(l.conv||1), kind:'purchase',
    ref:p.invNo, note:'From '+(supplierById(p.supplierId)||partyById(p.supplierId)||{name:'supplier'}).name,
    at:p.at||Date.now(), by:p.by||(S.user?S.user.id:'')});
  return b;
}
async function receivePurchase(p){
  clearBalCache();
  for(var i=0;i<p.lines.length;i++) postLine(p,p.lines[i]);
  PURCHASES.push(p);
  return saveStore();
}
/* Batches entered before the naming rule get named once, oldest first. */
function migrateBatchNames(){
  var changed=0;
  PARTS.forEach(function(pt){
    var bs=batchesOf(pt.id), n=0, byCost={};
    bs.forEach(function(b){
      if(batchNum(b.batchNo)&&/^Batch #\d+$/.test(b.batchNo)){ n=Math.max(n,batchNum(b.batchNo)); return; }
      if(String(b.batchNo).toUpperCase()==='OPENING') return;
      if(b.batchNo&&!batchNum(b.batchNo)) b.lot=b.lot||b.batchNo;
      var k=Object.keys(byCost).filter(function(x){ var q=x.split('|'); return q[1]===(b.supplyType||'tax')&&Math.abs(+q[0]-b.cost)<=1; })[0];
      if(k) b.batchNo=byCost[k];
      else { n++; b.batchNo='Batch #'+n; byCost[b.cost+'|'+(b.supplyType||'tax')]=b.batchNo; }
      changed++;
    });
  });
  return changed;
}

/* =====================================================================
   CORRECTING A PURCHASE BILL AFTER IT IS SAVED
   Whatever has not been used can change freely. What has already gone on
   to job cards cannot be taken away, but its price can be corrected and
   the cost on those job cards follows. Every correction is written down,
   field by field.
   ===================================================================== */
function batchUsed(b){ return b?Math.max(0,Math.round((b.qtyIn-stockOfBatch(b.id))*1000)/1000):0; }
function batchJobs(batchId){
  var refs={};
  MOVES.forEach(function(m){ if(m.batchId===batchId&&m.kind==='issue'&&m.ref) refs[m.ref]=1; });
  return Object.keys(refs);
}
function editPurchase(id){
  var orig=PURCHASES.filter(function(x){ return x.id===id; })[0]; if(!orig) return;
  if(!can('purch.edit')){ toast('Only the owner or the store manager can correct a purchase bill','bad'); return; }
  var c=JSON.parse(JSON.stringify(orig));
  c.editing=true; c.origId=orig.id; c.saved=false;
  S.purch=c; S.view={name:'purchase'}; window.scrollTo(0,0); render();
}
async function applyPurchaseEdit(p){
  var orig=PURCHASES.filter(function(x){ return x.id===p.origId; })[0];
  if(!orig){ toast('The original bill is gone','bad'); return; }
  var errs=[], keep={};
  p.lines.forEach(function(l){ if(l.batchId) keep[l.batchId]=l; });
  orig.lines.forEach(function(l){
    if(!l.batchId||keep[l.batchId]) return;
    var b=BATCHES.filter(function(x){ return x.id===l.batchId; })[0], used=batchUsed(b);
    if(used>0) errs.push(l.name+': '+used+' already used on '+batchJobs(l.batchId).join(', ')+' \u2014 it cannot be taken off the bill');
  });
  p.lines.forEach(function(l){
    if(!l.batchId) return;
    var b=BATCHES.filter(function(x){ return x.id===l.batchId; })[0], used=batchUsed(b);
    if(l.qty*(l.conv||1)<used) errs.push(l.name+': '+used+' already used on '+batchJobs(l.batchId).join(', ')+
      ' \u2014 the quantity cannot go below that');
  });
  if(errs.length){ openModal('<h2>This cannot be saved yet</h2><ul class="small" style="padding-left:18px">'+
    errs.map(function(e){ return '<li style="margin:6px 0">'+esc(e)+'</li>'; }).join('')+'</ul>'+
    '<div class="btn-row"><button class="btn" data-act="closeModal">Back to the bill</button></div>'); return; }

  var diff=[], sup=function(id){ return (partyById(id)||supplierById(id)||{name:'?'}).name; };
  if(orig.supplierId!==p.supplierId) diff.push('Supplier: '+sup(orig.supplierId)+' \u2192 '+sup(p.supplierId));
  if(orig.invNo!==p.invNo) diff.push('Invoice: '+orig.invNo+' \u2192 '+p.invNo);
  if(orig.invDate!==p.invDate) diff.push('Date: '+orig.invDate+' \u2192 '+p.invDate);
  if((orig.supplyType||'tax')!==(p.supplyType||'tax')) diff.push('Kind: '+(orig.supplyType==='composition'?'no GST':'tax invoice')+' \u2192 '+(p.supplyType==='composition'?'no GST':'tax invoice'));
  if((orig.charges||0)!==(p.charges||0)) diff.push('Charges: '+money(orig.charges||0)+' \u2192 '+money(p.charges||0));
  if((orig.roundOff||0)!==(p.roundOff||0)) diff.push('Round off: '+money(orig.roundOff||0)+' \u2192 '+money(p.roundOff||0));

  /* lines that came off the bill */
  orig.lines.forEach(function(l){
    if(!l.batchId||keep[l.batchId]) return;
    var left=stockOfBatch(l.batchId);
    if(left) MOVES.push({id:uid('mv'), partId:l.partId, batchId:l.batchId, qty:-left, kind:'adjust',
      ref:p.invNo, note:'Taken off the purchase bill', at:Date.now(), by:S.user.id});
    BATCHES=BATCHES.filter(function(b){ return b.id!==l.batchId; });
    diff.push('Removed '+l.name+' \u00D7 '+l.qty);
  });
  /* lines kept: correct in place */
  var costMoved=[];
  p.lines.forEach(function(l){
    if(!l.batchId) return;
    var b=BATCHES.filter(function(x){ return x.id===l.batchId; })[0]; if(!b) return;
    var was=orig.lines.filter(function(x){ return x.batchId===l.batchId; })[0]||{};
    upsertPart(p,l);
    var newIn=l.qty*(l.conv||1), delta=Math.round((newIn-b.qtyIn)*1000)/1000;
    var newCost=lineCostPer(p,l);
    if(delta) MOVES.push({id:uid('mv'), partId:b.partId, batchId:b.id, qty:delta, kind:'purchase',
      ref:p.invNo, note:'Purchase bill corrected', at:Date.now(), by:S.user.id});
    if(was.qty!==l.qty) diff.push(l.name+': qty '+was.qty+' \u2192 '+l.qty);
    if(was.rate!==l.rate) diff.push(l.name+': rate '+money(was.rate)+' \u2192 '+money(l.rate));
    if(was.name!==l.name) diff.push('Renamed '+was.name+' \u2192 '+l.name);
    if((was.sale||0)!==(l.sale||0)) diff.push(l.name+': selling price '+money(was.sale||0)+' \u2192 '+money(l.sale||0));
    if((was.mrp||0)!==(l.mrp||0)) diff.push(l.name+': MRP '+money(was.mrp||0)+' \u2192 '+money(l.mrp||0));
    if(was.gst!==l.gst) diff.push(l.name+': GST '+was.gst+'% \u2192 '+l.gst+'%');
    if(b.cost!==newCost&&batchUsed(b)>0) costMoved.push(b.id);
    Object.assign(b,{ qtyIn:newIn, cost:newCost, rate:l.rate, incl:!!l.incl, disc:l.disc||0, gst:l.gst,
      freight:lineShare(p,l), supplierId:p.supplierId, supplyType:p.supplyType||'tax',
      invNo:p.invNo, invDate:p.invDate, lot:l.lot||b.lot||'' });
    if(l.batchPick&&l.batchPick!=='auto') b.batchNo=batchLabelFor(b.partId,newCost,b.supplyType,l.batchPick,b.id);
    else if(was.rate!==l.rate||was.qty!==l.qty) b.batchNo=batchLabelFor(b.partId,newCost,b.supplyType,'auto',b.id);
    l.batchLabel=b.batchNo;
  });
  /* lines added */
  var addTo={id:orig.id, supplierId:p.supplierId, supplyType:p.supplyType, invNo:p.invNo, invDate:p.invDate,
    at:orig.at, by:S.user.id, charges:p.charges, lines:p.lines};
  p.lines.forEach(function(l){ if(!l.batchId){ postLine(addTo,l); diff.push('Added '+l.name+' \u00D7 '+l.qty); } });

  var edits=(orig.edits||[]).concat([{at:Date.now(), by:S.user.id, byName:S.user.name, changes:diff}]);
  ['supplierId','invNo','invDate','supplyType','taxMode','irn','ackNo','charges','chargesTaxed','roundOff'].forEach(function(k){ orig[k]=p[k]; });
  orig.lines=p.lines.map(function(l){ var c=Object.assign({},l); delete c.batchPick; return c; });
  orig.edits=edits; orig.editedAt=Date.now(); orig.needsCheck=p.needsCheck&&!diff.length?true:false;
  if(!await saveStore()) return;
  clearBalCache();

  /* job cards that used a re-costed batch carry the new cost */
  var touched=0;
  for(var i=0;i<costMoved.length;i++){
    var bid=costMoved[i], b2=BATCHES.filter(function(x){ return x.id===bid; })[0];
    var nos=batchJobs(bid);
    for(var k=0;k<nos.length;k++){
      var ent=S.index.concat(S.saleIndex||[]).filter(function(e){ return e.no===nos[k]; })[0]; if(!ent) continue;
      var job=await DB.get('mz:job:'+ent.id); if(!job) continue;
      (job.lines||[]).forEach(function(ln){ if(ln.batchId===bid) ln.cost=b2.cost; });
      logIt(job,'Cost corrected from the purchase bill',orig.invNo+' \u00B7 '+(partById(b2.partId)||{name:''}).name+' now '+money(b2.cost)+' each');
      await saveJob(job); touched++;
    }
  }
  logAudit('Purchase','Purchase bill corrected',diff.join(' \u00B7 ')||'No figures changed',orig.invNo);
  await saveAudit();
  S.purch=orig; S.view={name:'purchase'}; window.scrollTo(0,0); render();
  toast(diff.length?'Corrected \u2014 '+diff.length+' change'+(diff.length>1?'s':'')+' logged'+(touched?', '+touched+' job card'+(touched>1?'s':'')+' re-costed':''):'Nothing changed','good');
}

function unverifiedExpenses(){ return EXPENSES.filter(function(e){ return !e.verified; }); }

async function verifyItem(kind,id){

/* ---------- floats ---------- */
function floatId(userId){ return 'ac_float_'+userId; }
function ensureFloat(userId){
  var id=floatId(userId), a=accountById(id);
  if(a) return a;
  var u=coreUser(userId);
  a={id:id, name:(u.name||'Staff')+' \u2014 cash float', kind:'float', ownerId:userId, active:true};
  ACCOUNTS.push(a);
  return a;
}
function myFloat(){ return ensureFloat(S.user.id); }
/* Anything that moved through an account: transfers in, spends out,
   and the payments already recorded against parties. */
function accountMoves(accId){
  var out=[];
  TRANSFERS.forEach(function(t){
    if(t.fromId===accId) out.push({at:t.at, amount:-t.amount, label:'Moved to '+(accountById(t.toId)||{name:'?'}).name, kind:'transfer', id:t.id, by:t.by});
    if(t.toId===accId)   out.push({at:t.at, amount:t.amount, label:'Received from '+(accountById(t.fromId)||{name:'?'}).name, kind:'transfer', id:t.id, by:t.by});
  });
  EXPENSES.forEach(function(e){
    if(e.accountId!==accId) return;
    out.push({at:e.at, amount:-e.amount, label:(expCat(e.categoryId)||{name:'Expense'}).name, kind:'expense', id:e.id, by:e.by, note:e.note});
  });
  PAYMENTS.forEach(function(v){
    if(v.accountId!==accId) return;
    out.push({at:v.at, amount:v.direction==='in'?v.amount:-v.amount, kind:'payment', id:v.id, by:v.by,
      label:(v.direction==='in'?'Received from ':'Paid ')+((partyById(v.partyId)||{name:'party'}).name)});
  });
  (ADVANCES||[]).forEach(function(a){
    if(a.accountId!==accId) return;
    out.push({at:a.at, amount:-a.amount, kind:'advance', id:a.id, by:a.by,
      label:'Advance to '+coreUser(a.userId).name});
  });
  out.sort(function(a,b){ return a.at-b.at; });
  var run=0; out.forEach(function(m){ run+=m.amount; m.running=run; });
  return out;
}
function accountHeld(accId){
  var m=accountMoves(accId);
  return m.length?m[m.length-1].running:0;
}

/* ---------- totals ---------- */
function expensesIn(from,to,opts){
  opts=opts||{};
  return EXPENSES.filter(function(e){
    if(e.at<from||e.at>to) return false;
    if(opts.userId&&e.by!==opts.userId) return false;
    if(opts.accountId&&e.accountId!==opts.accountId) return false;
    if(opts.categoryId&&e.categoryId!==opts.categoryId) return false;
    if(opts.partyId&&e.partyId!==opts.partyId) return false;
    if(opts.kind==='job'&&!(expCat(e.categoryId)||{}).job) return false;
    if(opts.kind==='overhead'&&(expCat(e.categoryId)||{}).job) return false;
    return true;
  });
}
function sumExp(list){ return list.reduce(function(a,e){ return a+e.amount; },0); }
function expByCategory(from,to){
  var m={};
  expensesIn(from,to).forEach(function(e){
    var c=expCat(e.categoryId)||{id:'?',name:'Unknown'};
    m[c.id]=m[c.id]||{cat:c, total:0, count:0};
    m[c.id].total+=e.amount; m[c.id].count++;
  });
  return Object.keys(m).map(function(k){ return m[k]; })
    .sort(function(a,b){ return b.total-a.total; });
}
/* how much machinery work went to each shop */
function expByParty(from,to,onlyJob){
  var m={};
  expensesIn(from,to,onlyJob?{kind:'job'}:{}).forEach(function(e){
    if(!e.partyId) return;
    m[e.partyId]=m[e.partyId]||{party:partyById(e.partyId), total:0, count:0, cats:{}};
    m[e.partyId].total+=e.amount; m[e.partyId].count++;
    var c=(expCat(e.categoryId)||{name:'?'}).name;
    m[e.partyId].cats[c]=(m[e.partyId].cats[c]||0)+e.amount;
  });
  return Object.keys(m).map(function(k){ return m[k]; })
    .filter(function(x){ return x.party; })
    .sort(function(a,b){ return b.total-a.total; });
}

/* =====================================================================
   ATTENDANCE AND SALARY
   Everyone is on a fixed monthly figure.
   Tuesday is the weekly off. An absent day costs salary \u00f7 30.
   One paid leave a month; any more is treated as absent.
   Overtime at an hourly rate, which defaults to salary \u00f7 30 \u00f7 8.
   ===================================================================== */
var ATTEND={}, ADVANCES=[];      /* ATTEND['2026-08'] = { userId: { '01':'P', ... } } */

var WEEKOFF_DAY=2;               /* 0 Sun, 1 Mon, 2 Tue */
var STATUS={
  P:{label:'Present',   tag:'t-green', pay:1},
  H:{label:'Half day',  tag:'t-amber', pay:0.5},
  L:{label:'Paid leave',tag:'t-blue',  pay:1},
  W:{label:'Week off',  tag:'t-grey',  pay:1},
  A:{label:'Absent',    tag:'t-red',   pay:0}
};
var STATUS_ORDER=['P','H','L','W','A'];
var PAID_LEAVE_PER_MONTH=1;

function monthKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(mk){
  var p=mk.split('-'); return MON[parseInt(p[1],10)-1]+' '+p[0];
}
function daysInMonth(mk){ var p=mk.split('-'); return new Date(+p[0], +p[1], 0).getDate(); }
function dowOf(mk,day){ var p=mk.split('-'); return new Date(+p[0], +p[1]-1, day).getDay(); }
function defaultStatus(mk,day){ return dowOf(mk,day)===WEEKOFF_DAY?'W':'P'; }
function dayKey(day){ return String(day).padStart(2,'0'); }

function attOf(mk,userId,day){
  var m=ATTEND[mk]||{}, u=m[userId]||{};
  var v=u[dayKey(day)];
  if(v===undefined) return null;                 /* not marked yet */
  return v;
}
function attOrDefault(mk,userId,day){
  var v=attOf(mk,userId,day);
  return v===null?defaultStatus(mk,day):v;
}
function otOf(mk,userId,day){
  var m=ATTEND[mk]||{}, u=m[userId+':ot']||{};
  return parseFloat(u[dayKey(day)]||0)||0;
}
function setAtt(mk,userId,day,val){
  ATTEND[mk]=ATTEND[mk]||{};
  ATTEND[mk][userId]=ATTEND[mk][userId]||{};
  ATTEND[mk][userId][dayKey(day)]=val;
}
function setOt(mk,userId,day,hours){
  ATTEND[mk]=ATTEND[mk]||{};
  ATTEND[mk][userId+':ot']=ATTEND[mk][userId+':ot']||{};
  if(hours>0) ATTEND[mk][userId+':ot'][dayKey(day)]=hours;
  else delete ATTEND[mk][userId+':ot'][dayKey(day)];
}
function staffList(){ return S.core.users.filter(function(u){ return u.active!==false; }); }
function salaryOf(u){ return u.salary||0; }
function otRateOf(u){
  if(u.otRate) return u.otRate;
  return Math.round(salaryOf(u)/30/8);
}

/* ---------- the month's figures ----------
   upto: count only days up to this one, so a man can watch it climb. */
function employedOn(u,mk,day){
  var p=mk.split('-'), t=new Date(+p[0], +p[1]-1, day).getTime();
  if(u.joinedOn && t < new Date(u.joinedOn+'T00:00:00').getTime()) return false;
  if(u.leftOn   && t > new Date(u.leftOn+'T23:59:59').getTime()) return false;
  return true;
}
function payrollFor(userId,mk,upto){
  var u=coreUser(userId), n=daysInMonth(mk), sal=salaryOf(u), per=Math.round(sal/30);
  var last=(upto===undefined)?n:Math.min(upto,n);
  var c={P:0,H:0,L:0,W:0,A:0}, ot=0, marked=0, employedDays=0;
  for(var d=1;d<=last;d++){
    if(!employedOn(u,mk,d)) continue;      /* before he joined, or after he left */
    employedDays++;
    var v=attOrDefault(mk,userId,d);
    c[v]=(c[v]||0)+1;
    if(attOf(mk,userId,d)!==null) marked++;
    ot+=otOf(mk,userId,d);
  }
  /* only the first paid leave of the month is paid */
  var paidLeave=Math.min(c.L, PAID_LEAVE_PER_MONTH);
  var unpaidLeave=c.L-paidLeave;
  var payDays=c.P + c.W + paidLeave + (c.H*0.5);
  var lostDays=c.A + unpaidLeave + (c.H*0.5);
  /* He is on a monthly figure. The whole salary is his, and each day he
     misses costs salary/30. Part way through the month we show the share
     of the salary the days so far have earned, so it climbs as he works. */
  var accrued=Math.round(sal*employedDays/n);
  var deduction=Math.round(per*lostDays);
  var earned=accrued-deduction;
  var otPay=Math.round(ot*otRateOf(u));
  var adv=advancesFor(userId,mk);
  return { user:u, month:mk, days:n, counted:last, marked:marked, employedDays:employedDays,
    partMonth:(employedDays<n),
    counts:c, paidLeave:paidLeave, unpaidLeave:unpaidLeave,
    payDays:payDays, lostDays:lostDays, perDay:per, salary:sal,
    accrued:accrued, earned:earned, otHours:ot, otRate:otRateOf(u), otPay:otPay,
    deduction:deduction, advances:adv,
    payable:earned+otPay-adv };
}
function advancesFor(userId,mk){
  return ADVANCES.filter(function(a){ return a.userId===userId&&monthKey(new Date(a.at))===mk; })
    .reduce(function(t,a){ return t+a.amount; },0);
}
function monthWage(mk){
  return staffList().reduce(function(t,u){ return t+payrollFor(u.id,mk).payable; },0);
}

async function dviSet(k,v){
  var j=S.job, d=await loadDvi(j.id);
  d.items[k]=d.items[k]||{shots:[]};
  d.items[k].state=(d.items[k].state===v)?'':v;
  d.items[k].at=Date.now(); d.items[k].by=S.user.name;
  if(!d.startedAt){ d.startedAt=Date.now(); d.byName=S.user.name; }
  await saveDvi(j.id,d); rerender();
}
function dviNoteCapture(){
  var j=S.job; if(!j) return;
  var d=DVICACHE[j.id]; if(!d) return;
  document.querySelectorAll('[data-dvinote]').forEach(function(el){
    var k=el.dataset.dvinote;
    d.items[k]=d.items[k]||{shots:[]};
    d.items[k].note=el.value.trim();
  });
}
async function dviShot(k){
  var j=S.job, d=await loadDvi(j.id);
  if((d.shots||0)>=DVI_MAXTOTAL){
    toast('That is '+DVI_MAXTOTAL+' photos on this job \u2014 the limit until this runs on a real server.','bad'); return;
  }
  var inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.capture='environment';
  inp.onchange=async function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    try{
      var url=await shrinkImage(f,DVI_PX,DVI_Q);
      /* A photo above ~180KB means the compression did not bite; refuse it
         rather than quietly fill the drawer. */
      if(url.length>240000){ toast('That photo is too large even after shrinking. Try again in better light.','bad'); return; }
      dviNoteCapture();
      d.items[k]=d.items[k]||{shots:[]};
      d.items[k].shots=d.items[k].shots||[];
      if(d.items[k].shots.length>=DVI_MAXSHOT){ toast('Three photos is enough for one point','bad'); return; }
      d.items[k].shots.push(url);
      if(!d.startedAt){ d.startedAt=Date.now(); d.byName=S.user.name; }
      var ok=await saveDvi(j.id,d);
      if(!ok){ d.items[k].shots.pop(); toast('No room to save that photo. Back up and clear some space.','bad'); }
      rerender();
    }catch(e){ toast('Could not read that photo','bad'); }
  };
  inp.click();
}
async function dviDropShot(k,i){
  var j=S.job, d=await loadDvi(j.id);
  dviNoteCapture();
  if(d.items[k]&&d.items[k].shots) d.items[k].shots.splice(parseInt(i,10),1);
  await saveDvi(j.id,d); rerender();
}
async function dviDone(){
  var j=S.job, d=await loadDvi(j.id);

  if(!d.startedAt){ d.startedAt=Date.now(); d.byName=S.user.name; }

/* =====================================================================
   APPOINTMENTS  (G12)
   A booking is not a job card. It is an intention: a name, a number, a
   bike and a slot. It becomes a job card only when the bike physically
   arrives, because a workshop that opens job cards for bikes that never
   turn up cannot trust its own board.
   ===================================================================== */
var APPTS=[];
function todayKey(){ return isoDate(); }
function dayAdd(iso,n){ var p=iso.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n); return isoDate(d.getTime()); }
function dayLabel(iso){ var p=iso.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]);
  return {d:d.getDate(), m:MON[d.getMonth()], w:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]}; }
function slotList(){
  var W=S.core.workshop, out=[], mins=W.slotMins||60;
  for(var m=(W.openHour||9)*60; m+mins<=(W.closeHour||19)*60; m+=mins){
    var h=Math.floor(m/60), mm=m%60, ap=h<12?'am':'pm', hh=h%12; if(hh===0) hh=12;
    out.push({k:String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0'), label:hh+(mm?':'+String(mm).padStart(2,'0'):'')+' '+ap});
  }
  return out;
}
function apptsOn(iso){ return APPTS.filter(function(a){ return a.day===iso&&a.status==='booked'; }); }
function slotTaken(iso,slot){ return apptsOn(iso).filter(function(a){ return a.slot===slot; }).length; }
async function loadAppts(){ APPTS=(await DB.get('mz:appts'))||[]; }
async function saveAppts(){ return DB.set('mz:appts',APPTS); }

  var days=[], i;
  for(i=0;i<14;i++) days.push(dayAdd(todayKey(),i));
  var day=S.bookDay||todayKey(), W=S.core.workshop, cap=W.bays||3;
  var h=pageHead('Appointments','Book a bike in',
    'A booking holds a slot. The job card is opened when the bike actually arrives.');

  h+='<div class="daystrip">'+days.map(function(dd){
    var L=dayLabel(dd), n=apptsOn(dd).length;
    return '<button class="dayb" data-act="bookDay" data-k="'+dd+'" aria-pressed="'+(dd===day)+'">'+
      '<span>'+L.w+'</span><b>'+L.d+'</b><i>'+(n?n+' in':'\u00A0')+'</i></button>';
  }).join('')+'</div>';

  var slots=slotList();
  h+='<div class="card"><div class="card-h"><h2>'+esc(dayLabel(day).w+' '+dayLabel(day).d+' '+dayLabel(day).m)+'</h2>'+
    '<span class="tag t-grey" style="margin-left:auto">'+apptsOn(day).length+' booked</span></div><div class="card-b">'+
    '<div class="slots">'+slots.map(function(s){
      var used=slotTaken(day,s.k), full=used>=cap;
      return '<button class="slot" data-act="bookSlot" data-k="'+s.k+'" '+(full?'disabled':'')+
        ' aria-pressed="'+(S.bookSlot===s.k)+'" title="'+used+' of '+cap+' taken">'+s.label+
        (used?'<br><span style="font-size:10px;font-weight:600">'+used+'/'+cap+'</span>':'')+'</button>';
    }).join('')+'</div>';

  if(S.bookSlot){
    h+='<div class="sub" style="margin:16px -16px -16px"><div class="eyebrow">New booking</div>'+
      '<div class="two" style="margin-top:10px">'+
      '<div class="field"><label>Registration</label><input type="text" class="mono" name="breg" placeholder="HR 26 AB 1234"></div>'+
      '<div class="field"><label>Customer name</label><input type="text" name="bname"></div></div>'+
      '<div class="two"><div class="field"><label>Phone</label>'+phoneField('bphone','')+'</div>'+
      '<div class="field"><label>What for</label><select name="btype">'+

/* =====================================================================
   SERVICE REMINDERS  (G7)
   Whichever comes first: months since the last visit, or kilometres since
   the last recorded odometer. The estimate of kilometres driven is
   deliberately conservative — telling someone their service is overdue
   when it is not is how a workshop teaches customers to ignore it.
   ===================================================================== */
function lastVisitByReg(){
  var m={};
  S.index.forEach(function(e){
    if(!e.reg) return;
    var t=e.closedAt||e.updatedAt||e.createdAt;
    if(!m[e.reg]||t>m[e.reg].at) m[e.reg]={at:t, job:e, odo:e.odo||0, name:e.name, phone:e.phone};
  });
  return m;
}
function dueList(){
  var W=S.core.workshop, months=W.svcMonths||4, km=W.svcKm||3000;
  var m=lastVisitByReg(), out=[], now=Date.now();
  Object.keys(m).forEach(function(reg){
    var v=m[reg];
    if(v.job.stage!=='closed') return;              /* still with us */
    var days=Math.floor((now-v.at)/86400000);
    var dueDays=months*30;
    var overDays=days-dueDays;
    /* 30 km/day is a modest commuter assumption for a two-wheeler */
    var estKm=days*30, overKm=estKm-km;
    if(overDays<-14&&overKm<-500) return;            /* not close yet */
    out.push({ reg:reg, name:v.name, phone:v.phone, lastAt:v.at, lastOdo:v.odo,
      days:days, overDays:overDays, estKm:estKm, overKm:overKm,
      due:(overDays>=0||overKm>=0), soon:(overDays>=-14||overKm>=-500),
      done:(REMINDED[reg]&&REMINDED[reg]>v.at) });
  });
  out.sort(function(a,b){ return b.overDays-a.overDays; });
  return out;
}
var REMINDED={};
async function loadReminded(){ REMINDED=(await DB.get('mz:reminded'))||{}; }
async function remindMark(reg){
  REMINDED[reg]=Date.now();
  await DB.set('mz:reminded',REMINDED);

}
function viewRemind(){
  var list=dueList(), due=list.filter(function(x){ return x.due&&!x.done; });
  var soon=list.filter(function(x){ return !x.due&&!x.done; });
  var doneN=list.filter(function(x){ return x.done; }).length;
  var W=S.core.workshop;
  var h=pageHead('Follow-ups','Due for a service',
    'Every bike that has been here before, '+(W.svcMonths||4)+' months or '+(W.svcKm||3000)+
    ' km since the last visit \u2014 whichever came first.');
  if(!list.length)
    return h+'<div class="empty" style="padding:26px 8px"><b>Nobody is due yet.</b>'+
      'This list fills up as bikes are handed back and time passes.</div>'+
      '<div class="actionbar"><div class="actionbar-in"><button class="btn lg" data-act="goBoard">Back</button></div></div>';

  function card(x,tone){
    return '<div class="card"><div class="card-b">'+
      '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+
      '<span class="plate sm">'+esc(regShow(x.reg))+'</span>'+
      '<span class="tag '+tone+'">'+(x.due?(x.overDays>0?x.overDays+' days over':'due now'):'due soon')+'</span>'+
      '<span style="margin-left:auto" class="small muted">last in '+dOnly(x.lastAt)+'</span></div>'+
      '<div style="margin-top:8px;font-weight:700">'+esc(x.name||'\u2014')+'</div>'+
      '<div class="small muted">'+(x.phone?esc(x.phone):'no number on file')+
      ' \u00B7 '+x.days+' days ago \u00B7 odometer then '+esc(String(x.lastOdo||'\u2014'))+' km</div>'+
      '<div class="btn-row" style="margin-top:12px">'+
      (x.phone?'<button class="btn sm primary" data-act="waSend" data-k="service" data-id="'+esc(x.reg)+'">Message on WhatsApp</button>':'')+
      '<button class="btn sm" data-act="remindMark" data-id="'+esc(x.reg)+'">Mark contacted</button>'+
      '</div></div></div>';
  }
  if(due.length){ h+='<div class="eyebrow" style="margin:18px 0 6px">Overdue \u00B7 '+due.length+'</div>';
    due.forEach(function(x){ h+=card(x,'t-red'); }); }
  if(soon.length){ h+='<div class="eyebrow" style="margin:18px 0 6px">Coming up \u00B7 '+soon.length+'</div>';
    soon.forEach(function(x){ h+=card(x,'t-amber'); }); }
  if(doneN) h+='<p class="small muted" style="margin-top:16px">'+doneN+' already contacted since their last visit.</p>';
  
  return h;
}

/* =====================================================================
   WHATSAPP
   wa.me opens the app with the message pre-typed; the person still presses
   send. That is deliberate: it needs no Business API account, no per-message
   fee and no approval of templates, and the staff member sees exactly what
   is going out under the workshop's name before it goes.
   ===================================================================== */
function waNumber(p){
  if(String(p||'').trim().charAt(0)==='+') return String(p).replace(/\D/g,'');
  var d=String(p||'').replace(/\D/g,'');
  if(d.length===10) d='91'+d;
  if(d.length===11&&d[0]==='0') d='91'+d.slice(1);
  return d.length>=11?d:'';
}
function waText(kind,id){
  var W=S.core.workshop;
  if(kind==='appt'){
    var a=APPTS.filter(function(x){ return x.id===id; })[0]; if(!a) return null;
    var L=dayLabel(a.day);
    return {num:waNumber(a.phone),
      msg:'Namaste '+a.name+',\n\nThis is a reminder from '+W.name+'. Your '+
        (a.reg?regShow(a.reg)+' ':'bike ')+'is booked in on '+L.w+' '+L.d+' '+L.m+
        ' at '+slotLabel(a.slot)+' for '+a.jobType+'.\n\nPlease reply if you need a different time.\n\n'+W.phone};
  }
  if(kind==='service'){
    var m=lastVisitByReg()[id]; if(!m) return null;
    var months=Math.max(1,Math.round((Date.now()-m.at)/2592000000));
    return {num:waNumber(m.phone),
      msg:'Namaste '+(m.name||'')+',\n\n'+regShow(id)+' was last serviced with us about '+months+
        ' month'+(months>1?'s':'')+' ago, so it is due for a check.\n\n'+
        'Reply with a day that suits you and we will hold a slot.\n\n'+W.name+'\n'+W.phone};
  }
  if(kind==='bill'){
    var j=S.job, b=(j.bills||[]).filter(function(x){ return x.id===id; })[0]; if(!b) return null;
    var c=billCalc(j,b);
    var link=upiLink(c.balance,b.number);
    return {num:waNumber(j.cust.phone),
      msg:'Namaste '+j.cust.name+',\n\n'+(j.direct?'Thank you for shopping with us.':regShow(j.reg)+' is ready.')+'\n\n'+
        (b.type==='gst'?'Invoice ':'Bill ')+b.number+'\nTotal '+money(c.grand,{bare:1})+
        (c.balance>0?'\nStill to pay '+money(c.balance,{bare:1}):'\nPaid in full \u2014 thank you')+
        (c.balance>0&&link?'\n\nYou can pay by UPI to '+W.upi:'')+
        '\n\n'+W.name+'\n'+W.phone};
  }
  if(kind==='ready'){
    var jj=S.job;
    return {num:waNumber(jj.cust.phone),
      msg:'Namaste '+jj.cust.name+',\n\nWork on '+regShow(jj.reg)+' is finished and the bike is ready for collection.\n\n'+
        W.name+'\n'+W.phone+'\n'+W.addr};
  }
  return null;
}
function waSend(kind,id){
  var t=waText(kind,id);
  if(!t){ toast('Nothing to send','bad'); return; }
  if(!t.num){ toast('No usable phone number on file for this customer','bad'); return; }
  var url='https://wa.me/'+t.num+'?text='+encodeURIComponent(t.msg);

      '<div class="btn-row"><button class="btn" data-act="closeModal">Close</button>'+

function copyText(t){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t); toast('Copied','good'); return; }
  }catch(e){}
  var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); toast('Copied','good'); }catch(e){ toast('Could not copy','bad'); }
  document.body.removeChild(ta);
}

/* =====================================================================
   DIGITAL VEHICLE INSPECTION
   A structured walk-round recorded once per job: every point gets a
   red / amber / green, optional note, optional photos. Two reasons it
   earns its place. First, it is the only proof of what the bike looked
   like when it arrived — the single most common argument in a workshop
   is a scratch nobody can date. Second, an amber finding is an honest
   basis for recommending work, and it can be pushed straight onto the
   estimate rather than re-typed.

   Photos live in their own storage key per job, never inside the job
   record or the index. Putting them in the job would drag the whole
   thing over the size ceiling within weeks and the index is read on
   every single screen.
   ===================================================================== */
var DVI_TEMPLATE=[
  {g:'Arrival condition', items:[
    {k:'body',   n:'Bodywork and panels', hint:'Scratches, dents, cracked fairing'},
    {k:'seat',   n:'Seat and grab rail'},
    {k:'mirror', n:'Mirrors, indicators, lights'},
    {k:'fuel',   n:'Fuel level and locks'}
  ]},
  {g:'Safety', items:[
    {k:'brakeF', n:'Front brake', hint:'Pad thickness, lever travel, disc lip'},
    {k:'brakeR', n:'Rear brake'},
    {k:'tyreF',  n:'Front tyre', hint:'Tread depth, cracking, pressure'},
    {k:'tyreR',  n:'Rear tyre'},
    {k:'susp',   n:'Suspension and forks', hint:'Leaks, play, rebound'}
  ]},
  {g:'Running', items:[
    {k:'chain',  n:'Chain and sprockets', hint:'Slack, lubrication, hooked teeth'},
    {k:'engine', n:'Engine and leaks'},
    {k:'oil',    n:'Engine oil level and colour'},
    {k:'batt',   n:'Battery and charging'},
    {k:'elec',   n:'Wiring, horn, switches'}
  ]}
];
function dviLabel(k){ return tr({ok:'Good',soon:'Watch',now:'Needs work'}[k]); }
var DVI_MAXSHOT=3, DVI_MAXTOTAL=24, DVI_PX=780, DVI_Q=0.55;

var DVICACHE={};
function dviKey(id){ return 'mz:dvi:'+id; }
async function loadDvi(jobId){
  if(DVICACHE[jobId]) return DVICACHE[jobId];
  var d=await DB.get(dviKey(jobId));
  DVICACHE[jobId]=d||{items:{},startedAt:0,byName:'',shots:0};
  return DVICACHE[jobId];
}
async function saveDvi(jobId,d){
  DVICACHE[jobId]=d;
  d.shots=countShots(d);
  return DB.set(dviKey(jobId),d);
}
function countShots(d){
  var n=0; Object.keys(d.items||{}).forEach(function(k){ n+=((d.items[k].shots||[]).length); });
  return n;
}
function dviAll(){
  var out=[]; DVI_TEMPLATE.forEach(function(g){ g.items.forEach(function(i){ out.push(i); }); });
  return out;
}
/* Counts for the traffic-light bar. "Not checked" is deliberately visible:
   a half-done inspection should not be able to look like a clean one. */
function dviTally(d){
  var t={ok:0,soon:0,now:0,na:0}, all=dviAll();
  all.forEach(function(i){
    var v=d.items&&d.items[i.k]&&d.items[i.k].state;
    if(v==='ok') t.ok++; else if(v==='soon') t.soon++; else if(v==='now') t.now++; else t.na++;
  });
  t.total=all.length; t.done=t.total-t.na;
  return t;
}
function dviBar(t){
  if(!t.total) return '';
  function w(n){ return (n/t.total*100).toFixed(1)+'%'; }
  return '<div class="ragbar">'+
    (t.ok?'<i style="width:'+w(t.ok)+';background:var(--green)"></i>':'')+
    (t.soon?'<i style="width:'+w(t.soon)+';background:var(--amber)"></i>':'')+
    (t.now?'<i style="width:'+w(t.now)+';background:var(--red)"></i>':'')+
    '</div>';
}
function shrinkImage(file,maxPx,quality){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var w=img.width, hh=img.height, s=Math.min(1,maxPx/Math.max(w,hh));
        var cv=document.createElement('canvas');
        cv.width=Math.round(w*s); cv.height=Math.round(hh*s);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',quality));
      };
      img.onerror=function(){ rej(new Error('bad image')); };
      img.src=fr.result;
    };
    fr.onerror=function(){ rej(new Error('read failed')); };
    fr.readAsDataURL(file);
  });
}

async function countCashDo(accId){
  var g=function(n){ var e=document.querySelector('.sheet [name="'+n+'"]'); return e?e.value.trim():''; };
  var held=accountHeld(accId), actual=toPaise(g('ccamt')), diff=actual-held;
  if(diff===0){ closeModal(); toast('Counted \u2014 it matches','good'); return; }
  EXPENSES.push({ id:uid('ex'), at:Date.now(), amount:Math.abs(diff),
    categoryId:'ec_misc', jobId:'', partyId:'', accountId:accId,
    note:(diff<0?'Cash short on counting':'Cash extra on counting')+(g('ccnote')?' \u2014 '+g('ccnote'):''),
    shortfall:diff, gstRate:0, tax:0, taxable:Math.abs(diff), photo:'',
    by:S.user.id, enteredAt:Date.now() });
  if(diff>0){ /* extra found: record it as money coming in, not a spend */
    EXPENSES.pop();
    TRANSFERS.push({ id:uid('tf'), fromId:'ac_cash', toId:accId, amount:diff, at:Date.now(),
      by:S.user.id, byName:S.user.name, note:'found on counting' });
  }
  if(!await saveExpenseData()) return;
  closeModal(); rerender();
  toast(diff<0?money(-diff)+' short \u2014 recorded':money(diff)+' extra \u2014 recorded', diff<0?'bad':'good');
}

/* =====================================================================
   WHAT FITS WHAT
   A Himalayan comes in and nobody remembers there is a \u20B95,699 BMC filter
   for it on the shelf. Map a part to the bikes it fits once, and the job
   card offers it every time.

   Most of the mapping is already sitting in the part names \u2014 "BMC Air
   Filter RE Interceptor/GT/Bear650", "packing kit activa". So the app
   proposes and a person confirms. It never guesses silently.
   ===================================================================== */
function fitKey(make,model){ return pkey(make)+'|'+pkey(model); }
function fitLabel(key){
  var p=String(key).split('|');
  var mk=allMakes().filter(function(m){ return pkey(m)===p[0]; })[0]||p[0];
  var md=modelsFor(mk).filter(function(m){ return pkey(m.n)===p[1]; })[0];
  return mk+' '+(md?md.n:p[1]);
}
function partFitsBike(part,make,model){
  var f=part.fits||[];
  if(!f.length) return false;
  return f.indexOf(fitKey(make,model))>=0;
}
/* everything on the shelf that suits this bike */
function partsForBike(make,model,opts){
  opts=opts||{};
  var k=fitKey(make,model);
  return PARTS.filter(function(p){
    if((p.fits||[]).indexOf(k)<0) return false;
    if(opts.inStock&&stockOf(p.id)<=0) return false;
    return true;
  }).sort(function(a,b){
    var sa=stockOf(a.id)>0?0:1, sb=stockOf(b.id)>0?0:1;
    if(sa!==sb) return sa-sb;
    return String(a.name).localeCompare(String(b.name));
  });
}

/* ---------- reading the bikes out of a part name ---------- */
function longestAlpha(str){
  var toks=String(str).toUpperCase().split(/[^A-Z]+/).filter(Boolean);
  toks.sort(function(a,b){ return b.length-a.length; });
  return toks[0]||'';
}
function digitsOf(str){ return (String(str).match(/\d+/g)||[]); }
/* A Pulsar NS200 gets written "200NS" as often as "NS200". Only tokens that
   mix letters and digits are used this way, so a bare "390" never matches. */
function swapKeys(model){
  var out=[];
  String(model).toUpperCase().split(/\s+/).forEach(function(tok){
    var k=tok.replace(/[^A-Z0-9]/g,'');
    if(k.length<4||!/[A-Z]/.test(k)||!/[0-9]/.test(k)) return;
    out.push(k);
    var m=k.match(/^([A-Z]+)([0-9]+)$/);
    if(m) out.push(m[2]+m[1]);
    var m2=k.match(/^([0-9]+)([A-Z]+)$/);
    if(m2) out.push(m2[2]+m2[1]);
  });
  return out;
}
function suggestFits(part){
  if(!part) return [];
  var name=pkey(part.name+' '+(part.no||''));
  var out=[];
  allMakes().forEach(function(mk){
    modelsFor(mk).forEach(function(md){
      var key=pkey(md.n), strong=false, weak=false;
      if(key.length>=4&&name.indexOf(key)>=0) strong=true;
      else if(swapKeys(md.n).some(function(k){ return name.indexOf(k)>=0; })) strong=true;
      else{
        var la=longestAlpha(md.n), nums=digitsOf(md.n);
        if(la.length>=4&&name.indexOf(la)>=0){
          if(!nums.length) weak=true;
          else if(nums.some(function(n){ return name.indexOf(n)>=0; })) strong=true;
          else if(la.length>=5) weak=true;
        }
      }
      if(strong||weak) out.push({key:fitKey(mk,md.n), make:mk, model:md.n, strong:strong});
    });
  });
  /* if the brand is named too, that settles it */
  var brandHit=allMakes().filter(function(mk){ return pkey(mk).length>=4&&name.indexOf(pkey(mk))>=0; });
  if(brandHit.length){
    var strongOnes=out.filter(function(o){ return brandHit.indexOf(o.make)>=0; });
    if(strongOnes.length) out=strongOnes;
  }
  out.sort(function(a,b){ return (b.strong?1:0)-(a.strong?1:0); });
  return out.slice(0,24);
}
function fitCoverage(){
  var sp=shelfParts(), mapped=sp.filter(function(p){ return (p.fits||[]).length; }).length;
  return {mapped:mapped, total:sp.length,
    pct:sp.length?Math.round(mapped*100/sp.length):0};
}

function kitsText(){ return (S.core.kitsText!==undefined&&S.core.kitsText!==null)?S.core.kitsText:KIT_DEFAULT; }
function parseKits(txt){
  var out={};
  String(txt||'').split(/\r?\n/).forEach(function(line){
    var i=line.indexOf(':'); if(i<1) return;
    var job=upReq(line.slice(0,i)); if(!job) return;
    out[job]=line.slice(i+1).split(';').map(function(x){
      var t=x.trim(); if(!t) return null;
      var m=t.match(/^(part|labour|labor)\s+(.+)$/i);
      return m?{kind:(/^part$/i.test(m[1])?'part':'labour'), name:m[2].trim()}:{kind:'part', name:t};
    }).filter(Boolean);
  });
  return out;
}
var KIT_STOP=['labour','labor','and','the','for','with','charge','charges','work'];
function kitWords(name){
  return String(name).toLowerCase().split(/[^a-z0-9]+/).filter(function(w){ return w.length>=3&&KIT_STOP.indexOf(w)<0; });
}
/* 1 = made for this bike, 0 = fits anything, -1 = made for some other bike.
   Uses the fitment mapping when there is one, otherwise reads the bike out
   of the part's name the same way the fitment helper does. */
var KITFIT={};
function kitFit(p,fk){
  if(!fk) return 0;
  if((p.fits||[]).length) return p.fits.indexOf(fk)>=0?1:-1;
  var ck=p.id+'|'+fk;
  if(KITFIT[ck]!==undefined) return KITFIT[ck];
  var strong=suggestFits(p).filter(function(x){ return x.strong; });
  var v=0;
  if(strong.length) v=strong.some(function(x){ return x.key===fk; })?1:-1;
  else {
    /* the name gives a brand but not a model: "BMC Air Filter \u2014 Triumph 900" */
    var brands=partBrands(p), mk=fk.split('|')[0];
    if(brands.length) v=brands.indexOf(mk)>=0?0:-1;
  }
  return KITFIT[ck]=v;
}
var BRAND_SHORT={RE:'ROYALENFIELD',KTM:'KTM',TVS:'TVS',BMW:'BMWMOTORRAD',HD:'HARLEYDAVIDSON',BSA:'BSA'};
function partBrands(p){
  var words=String(p.name).toUpperCase().split(/[^A-Z0-9]+/), out=[];
  words.forEach(function(w){ if(BRAND_SHORT[w]&&out.indexOf(BRAND_SHORT[w])<0) out.push(BRAND_SHORT[w]); });
  var nm=pkey(p.name);
  allMakes().forEach(function(mk){ var k=pkey(mk); if(k.length>=5&&nm.indexOf(k)>=0&&out.indexOf(k)<0) out.push(k); });
  ['HONDA','YAMAHA','SUZUKI','BAJAJ','TRIUMPH','DUCATI','KAWASAKI','APRILIA','BENELLI','JAWA','YEZDI','HUSQVARNA','HERO'].forEach(function(b){
    if(words.indexOf(b)>=0){ var mk=allMakes().filter(function(m){ return pkey(m).indexOf(b)===0; })[0]; if(mk&&out.indexOf(pkey(mk))<0) out.push(pkey(mk)); }
  });
  return out;
}
/* parts in the store that answer to this kit item, best first */
function kitCandidates(item,job){
  var words=kitWords(item.name); if(!words.length) return [];
  var fk=(job.make&&job.model)?fitKey(job.make,job.model):'';
  return PARTS.filter(function(p){
    if(item.kind==='part'&&isLabour(p)) return false;
    if(item.kind==='labour'&&!isLabour(p)) return false;
    var hay=(p.name+' '+(p.no||'')+' '+(p.aliases||[]).join(' ')).toLowerCase();
    if(!words.every(function(w){ return hay.indexOf(w)>=0||(w.length>4&&hay.indexOf(w.slice(0,-1))>=0); })) return false;
    /* a part meant for another bike is not offered for this one */
    if(item.kind==='part'&&fk&&kitFit(p,fk)<0) return false;
    return true;
  }).sort(function(a,b){
    var fa=-kitFit(a,fk), fb=-kitFit(b,fk);
    if(fa!==fb) return fa-fb;
    var sa=(isLabour(a)||stockOf(a.id)>0)?0:1, sb=(isLabour(b)||stockOf(b.id)>0)?0:1;
    if(sa!==sb) return sa-sb;
    return String(a.name).length-String(b.name).length;
  }).slice(0,8);
}
/* everything the ticked jobs call for, once each, minus what is already on the card */
function kitSuggestions(job){
  var kits=parseKits(kitsText()), seen={}, out=[];
  var onCard=(job.lines||[]).filter(function(l){ return !l.void&&l.batch==='main'; });
  (job.required||[]).forEach(function(r){
    (kits[upReq(r)]||[]).forEach(function(item){
      var key=item.kind+'|'+item.name.toLowerCase();
      if(seen[key]){ seen[key].jobs.push(r); return; }
      var cands=kitCandidates(item,job);
      var already=onCard.some(function(l){
        if(l.kitItem===key) return true;
        if(l.partId&&cands.some(function(c){ return c.id===l.partId; })) return true;
        return String(l.desc).toLowerCase()===item.name.toLowerCase();
      });
      var row={key:key, item:item, jobs:[r], cands:cands, done:already};
      seen[key]=row; out.push(row);
    });
  });
  return out;
}

    'pick it above. Quantities go on as 1; change oil and the like to what this bike takes.</div></div>';

/* safe to add without asking: labour, or one clear part that is on the shelf */
function kitReady(r){
  var c=r.cands[0]; if(!c) return false;
  if(isLabour(c)) return true;
  if(stockOf(c.id)<=0) return false;
  var fk=(S.job&&S.job.make)?fitKey(S.job.make,S.job.model):'';
  return r.cands.length===1||kitFit(c,fk)===1;
}
async function kitAddOne(r,partId,quiet){
  var j=S.job;
  if(partId){
    await pickPart(partId,'main',r.item.kind,quiet);
    var last=j.lines[j.lines.length-1]; if(last&&last.partId===partId){ last.kitItem=r.key; }
    return;
  }
  var kind=r.item.kind;
  var l={ id:uid('ln'), kind:kind, desc:titleCase(r.item.name), qty:1, unit:0, gst:gstDefault(kind),
    hsn:kind==='labour'?'998714':'', batch:'main', addedBy:S.user.id, addedAt:Date.now(), done:false, kitItem:r.key };
  j.lines.push(l);
  logIt(j,'Added from the suggestions',l.desc+' \u2014 no rate yet');
  await saveJob(j);
}
async function kitAdd(i){
  var r=(S.kitRows||[])[i]; if(!r) return;
  var sel=document.getElementById('kitsel-'+i);
  var pid=sel?sel.value:(r.cands[0]?r.cands[0].id:'');

async function kitAddAll(){

/* one pass over everything, accepting only the certain ones */
async function autoFitAll(){
  var done=0, added=0;
  PARTS.forEach(function(p){
    if((p.fits||[]).length) return;
    var strong=suggestFits(p).filter(function(x){ return x.strong; });
    if(!strong.length) return;
    p.fits=strong.map(function(x){ return x.key; });
    p.updatedAt=Date.now();
    done++; added+=strong.length;
  });
  if(!done){ toast('Nothing else could be read from the names','bad'); return; }
  if(!await saveStore('parts')) return;
  rerender();
  toast(done+' parts mapped to '+added+' bikes. Check them and add the rest by hand.','good');
}

/* =====================================================================
   THE OWNER'S DASHBOARD
   Kunal takes few bikes in. This is his screen: what happened today,
   who owes what, what is waiting on him, and what the business made.
   ===================================================================== */
function todayRange(){
  var n=new Date();
  return {from:new Date(n.getFullYear(),n.getMonth(),n.getDate(),0,0,0,0).getTime(),
          to:new Date(n.getFullYear(),n.getMonth(),n.getDate(),23,59,59,999).getTime()};
}
function salesIn(from,to){
  return SALES.filter(function(s){ return s.status==='final'&&s.at>=from&&s.at<=to; });
}
function receiptsIn(from,to){
  var t=0;
  RECEIPTS.forEach(function(r){ if(r.at>=from&&r.at<=to) t+=r.amount; });
  PAYMENTS.forEach(function(v){ if(v.direction==='in'&&!v.reversalOf&&v.at>=from&&v.at<=to) t+=v.amount; });
  return t;
}
/* What the business actually made. Sales, less what those parts cost,
   less everything spent to keep the doors open. */
function pnl(from,to){
  var ss=salesIn(from,to);
  var revenue=0, tax=0, cogs=0;
  ss.forEach(function(s){
    revenue+=s.taxable; tax+=s.tax;
    (s.lines||[]).forEach(function(l){ cogs+=l.cost||0; });
  });
  var jobSpend=sumExp(expensesIn(from,to,{kind:'job'}));
  var overhead=sumExp(expensesIn(from,to,{kind:'overhead'}));
  var wages=0;
  var a=new Date(from), b=new Date(to), seen={};
  for(var d=new Date(a); d<=b; d.setMonth(d.getMonth()+1)){
    var mk=monthKey(d); if(seen[mk]) continue; seen[mk]=1;
    wages+=monthWage(mk);
  }
  var gross=revenue-cogs-jobSpend;
  return { revenue:revenue, tax:tax, cogs:cogs, jobSpend:jobSpend, overhead:overhead, wages:wages,
    gross:gross, net:gross-overhead-wages, bills:ss.length,
    marginPct:revenue?Math.round((gross/revenue)*1000)/10:null };
}
function gstSummary(from,to){
  var outGst=0, outTaxable=0, exempt=0;
  salesIn(from,to).forEach(function(s){
    if(s.type==='gst'){ outTaxable+=s.taxable; outGst+=s.tax; }
    else exempt+=s.grand;
  });
  var inGst=0, inTaxable=0;
  PURCHASES.forEach(function(p){
    var at=new Date(p.invDate+'T10:00:00').getTime();
    if(at<from||at>to||p.supplyType==='composition') return;
    var T=billTotals(p); inTaxable+=T.taxable; inGst+=T.tax;
  });
  var expGst=0;
  expensesIn(from,to).forEach(function(e){ expGst+=e.tax||0; });
  return { outTaxable:outTaxable, outGst:outGst, exempt:exempt,
    inTaxable:inTaxable, inGst:inGst+expGst, payable:outGst-(inGst+expGst) };
}
function owedBothWays(){
  var owed=0, owing=0;
  PARTIES.forEach(function(p){ var b=balanceOf(p.id); if(b>0) owed+=b; else owing-=b; });
  return {owed:owed, owing:owing};
}

/* =====================================================================
   THE BOOKS
   Day book   \u2014 every rupee that moved on one day, and where the cash
                stood at the start and the end of it.
   Job profit \u2014 what each bike actually earned, once the spares it ate
                and the work sent out for it are taken off.
   Both are the owner's alone.
   ===================================================================== */
function dayBounds(iso){
  var p=String(iso||isoDate()).split('-');
  var a=new Date(+p[0], +p[1]-1, +p[2], 0,0,0,0);
  var b=new Date(+p[0], +p[1]-1, +p[2], 23,59,59,999);
  return {from:a.getTime(), to:b.getTime()};
}
function shiftDay(iso,by){
  var p=String(iso).split('-');
  var d=new Date(+p[0], +p[1]-1, +p[2]+by);
  return isoDate(d.getTime());
}
/* what an account held just before a moment */
function heldBefore(accId,ts){
  var m=accountMoves(accId), t=0;
  for(var i=0;i<m.length;i++){ if(m[i].at<ts) t=m[i].running; else break; }
  return t;
}
/* every movement of money in the window, whatever kind */
function dayEntries(from,to){
  var out=[];
  RECEIPTS.forEach(function(r){
    if(r.at<from||r.at>to) return;
    out.push({at:r.at, dir:'in', amount:r.amount, accId:'', by:r.by,
      what:(r.kind==='advance'?'Advance':'Counter payment'),
      who:(partyById(r.partyId)||{name:''}).name, ref:r.billNo||r.ref||'', mode:r.mode});
  });
  PAYMENTS.forEach(function(v){
    if(v.at<from||v.at>to) return;
    out.push({at:v.at, dir:v.direction==='in'?'in':'out', amount:v.amount, accId:v.accountId, by:v.by,
      what:(v.reversalOf?'Reversal':(v.direction==='in'?'Received':'Paid supplier')),
      who:(partyById(v.partyId)||{name:''}).name, ref:v.ref||'', verified:!!v.verified, id:v.id, kind:'pay'});
  });
  EXPENSES.forEach(function(e){
    if(e.at<from||e.at>to) return;
    var c=expCat(e.categoryId)||{name:'Spend'};
    out.push({at:e.at, dir:'out', amount:e.amount, accId:e.accountId, by:e.by,
      what:c.name, who:(partyById(e.partyId)||{name:''}).name, ref:e.billNo||'',
      verified:!!e.verified, id:e.id, kind:'exp'});
  });
  (ADVANCES||[]).forEach(function(a){
    if(a.at<from||a.at>to) return;
    out.push({at:a.at, dir:'out', amount:a.amount, accId:a.accountId, by:a.by,
      what:'Staff advance', who:coreUser(a.userId).name, ref:''});
  });
  TRANSFERS.forEach(function(tr){
    if(tr.at<from||tr.at>to) return;
    out.push({at:tr.at, dir:'move', amount:tr.amount, accId:tr.toId, by:tr.by,
      what:'Moved to float', who:(accountById(tr.toId)||{name:''}).name,
      ref:(accountById(tr.fromId)||{name:''}).name});
  });
  out.sort(function(a,b){ return a.at-b.at; });
  return out;
}
function dayTotals(from,to){
  var t={in:0, out:0, sales:0, bills:0, purch:0};
  dayEntries(from,to).forEach(function(e){
    if(e.dir==='in') t.in+=e.amount;
    else if(e.dir==='out') t.out+=e.amount;
  });
  salesIn(from,to).forEach(function(s){ t.sales+=s.grand; t.bills++; });
  PURCHASES.forEach(function(p){
    var at=new Date(p.invDate+'T10:00:00').getTime();
    if(at>=from&&at<=to) t.purch+=billTotals(p).grand;
  });
  return t;
}

/* ---------- what a bike actually earned ---------- */
function jobProfits(from,to){
  var byJob={};
  salesIn(from,to).forEach(function(s){
    var g=byJob[s.jobId]=byJob[s.jobId]||{jobId:s.jobId, jobNo:s.jobNo, reg:s.reg, cust:s.custName,
      at:s.at, revenue:0, cost:0, partsRev:0, partsCost:0, labourRev:0, labourCost:0, bills:[]};
    g.bills.push(s.number);
    (s.lines||[]).forEach(function(l){
      var rev=exTax(l.amount, l.gst||0), c=l.cost||0;
      g.revenue+=rev; g.cost+=c;
      if(l.kind==='part'){ g.partsRev+=rev; g.partsCost+=c; }
      else { g.labourRev+=rev; g.labourCost+=c; }
    });
  });
  return Object.keys(byJob).map(function(k){
    var g=byJob[k];
    g.profit=g.revenue-g.cost;
    g.pct=g.revenue?Math.round((g.profit/g.revenue)*1000)/10:null;
    return g;
  }).sort(function(a,b){ return b.profit-a.profit; });
}
/* level: 'kind' (the old one), 'group', 'cat' or 'brand'. The part as it is
   filed today wins over the snapshot, so a re-filed part moves its history. */
function categorySplit(from,to,level){
  var m={};
  salesIn(from,to).forEach(function(s){
    (s.lines||[]).forEach(function(l){
      var pt=l.partId?partById(l.partId):null;
      var cat=pt?pt.category:(l.cat||''), brand=pt?(pt.brand||''):(l.brand||'');
      var key;
      if(l.kind==='labour'||cat==='Labour') key='Labour';
      else if(level==='brand') key=brand||'Brand not set';
      else if(level==='cat') key=catIsSet(cat)?cat:'Category not set';
      else key=catGroup(cat)||(cat||'Category not set');
      m[key]=m[key]||{name:key, rev:0, cost:0, qty:0};
      m[key].rev+=exTax(l.amount,l.gst||0); m[key].cost+=l.cost||0; m[key].qty+=l.qty||0;
    });
  });
  return Object.keys(m).map(function(k){
    var x=m[k]; x.profit=x.rev-x.cost;
    x.pct=x.rev?Math.round((x.profit/x.rev)*1000)/10:null;
    return x;
  }).sort(function(a,b){ return b.rev-a.rev; });
}

var AUDIT=[];
/* Some changes leave no trace of their own \u2014 a price moved off the list,
   a salary altered, a job card corrected. Those are written down here. */
function logAudit(kind,what,detail,ref){
  AUDIT.push({ id:uid('au'), at:Date.now(), by:S.user?S.user.id:'', byName:S.user?S.user.name:'',
    kind:kind, what:what, detail:detail||'', ref:ref||'' });
  if(AUDIT.length>4000) AUDIT=AUDIT.slice(-3000);
  /* on the shared database each entry is added on its own, so two phones
     logging at the same moment both keep theirs */
  if(MODE==='cloud') DB.append('mz:audit',AUDIT[AUDIT.length-1]);
}
async function saveAudit(){ if(MODE==='cloud') return true; return DB.set('mz:audit',AUDIT); }
async function loadAudit(){ AUDIT=await DB.get('mz:audit')||[]; }

/* Everything that already carries a who and a when, plus the notes above,
   read as one list. Nothing here can be edited or deleted. */
function auditTrail(from,to){
  var out=[];
  function add(at,by,kind,what,detail,ref){
    if(at<from||at>to) return;
    out.push({at:at, by:by, kind:kind, what:what, detail:detail||'', ref:ref||''});
  }
  AUDIT.forEach(function(a){ add(a.at,a.by,a.kind,a.what,a.detail,a.ref); });
  PURCHASES.forEach(function(p){
    add(p.at,p.by,'Purchase','Purchase bill entered',
      (supplierById(p.supplierId)||{name:''}).name+' \u00B7 '+money(billTotals(p).grand), p.invNo);
  });
  SALES.forEach(function(sl){
    add(sl.at,sl.by,'Sale',(sl.status==='cancelled'?'Bill cancelled':'Bill raised'),
      sl.custName+' \u00B7 '+money(sl.grand), sl.number);
  });
  PAYMENTS.forEach(function(v){
    add(v.at,v.by,'Money',(v.reversalOf?'Payment reversed':(v.direction==='out'?'Paid a supplier':'Money received')),
      (partyById(v.partyId)||{name:''}).name+' \u00B7 '+money(v.amount), v.ref||'');
  });
  EXPENSES.forEach(function(e){
    add(e.at,e.by,'Spend','Spend recorded',
      (expCat(e.categoryId)||{name:''}).name+' \u00B7 '+money(e.amount), e.billNo||'');
  });
  TRANSFERS.forEach(function(t){
    add(t.at,t.by,'Money','Cash moved',
      (accountById(t.fromId)||{name:''}).name+' \u2192 '+(accountById(t.toId)||{name:''}).name+' \u00B7 '+money(t.amount),'');
  });
  (ADVANCES||[]).forEach(function(a){
    add(a.at,a.by,'Payroll','Advance to staff', coreUser(a.userId).name+' \u00B7 '+money(a.amount),'');
  });
  MOVES.forEach(function(m){
    if(m.kind==='purchase'||m.kind==='issue') return;   /* already covered above */
    add(m.at,m.by,'Stock',moveLabel(m.kind),
      (partById(m.partId)||{name:''}).name+' \u00B7 '+(m.qty>0?'+':'')+m.qty, m.ref||'');
  });
  out.sort(function(a,b){ return b.at-a.at; });
  return out;
}

/* ---------- GST ---------- */
function salePos(sl){
  var g=String(sl.gstin||'');
  var code=g?g.slice(0,2):(S.core.workshop.stateCode||'06');
  return code+'-'+(GST_STATES[code]||S.core.workshop.state||'');
}
/* Split a bill's tax the way the return wants it: one line per rate. */
function saleRateLines(sl){
  var m={};
  (sl.lines||[]).forEach(function(l){
    var r=l.gst||0;
    var taxable=exTax(l.amount,r);
    m[r]=m[r]||{rate:r, taxable:0, tax:0};
    m[r].taxable+=taxable; m[r].tax+=l.amount-taxable;
  });
  return Object.keys(m).map(function(k){ return m[k]; });
}
function gstr1(from,to){
  var b2b=[], b2cs={}, hsn={}, docs={gst:{nums:[],cancelled:0}, nongst:{nums:[],cancelled:0}};
  SALES.forEach(function(sl){
    if(sl.at<from||sl.at>to) return;
    var series=(sl.type==='gst')?'gst':'nongst';
    docs[series].nums.push(sl.number);
    if(sl.status==='cancelled'){ docs[series].cancelled++; return; }
    if(sl.type!=='gst') return;                    /* plain bills are not in GSTR-1 tables */
    var pos=salePos(sl), inter=!!sl.inter;
    saleRateLines(sl).forEach(function(rl){
      if(sl.gstin){
        b2b.push({ gstin:sl.gstin, name:sl.custName, no:sl.number, date:sl.at, value:sl.grand,
          pos:pos, rate:rl.rate, taxable:rl.taxable, tax:rl.tax, inter:inter });
      } else {
        var k=pos+'|'+rl.rate;
        b2cs[k]=b2cs[k]||{pos:pos, rate:rl.rate, taxable:0, tax:0, inter:inter};
        b2cs[k].taxable+=rl.taxable; b2cs[k].tax+=rl.tax;
      }
    });
    (sl.lines||[]).forEach(function(l){
      var pt=l.partId?partById(l.partId):null;
      var code=(pt&&pt.hsn)||l.hsn||'';
      if(!code) code=(l.kind==='labour')?'998714':'00000000';
      var k=code+'|'+(l.gst||0);
      var taxable=exTax(l.amount,l.gst||0);
      hsn[k]=hsn[k]||{hsn:code, desc:l.desc, uqc:(l.kind==='labour'?'OTH':'PCS'),
        qty:0, value:0, rate:l.gst||0, taxable:0, igst:0, cgst:0, sgst:0};
      var x=hsn[k];
      x.qty+=l.qty||0; x.value+=l.amount; x.taxable+=taxable;
      var tax=l.amount-taxable;
      if(inter) x.igst+=tax; else { var h=Math.floor(tax/2); x.cgst+=h; x.sgst+=tax-h; }
    });
  });
  function span(nums){
    var clean=nums.filter(Boolean).sort();
    return clean.length?{from:clean[0], to:clean[clean.length-1], n:clean.length}:null;
  }
  return { b2b:b2b,
    b2cs:Object.keys(b2cs).map(function(k){ return b2cs[k]; }),
    hsn:Object.keys(hsn).map(function(k){ return hsn[k]; }).sort(function(a,b){ return b.taxable-a.taxable; }),
    docs:[{name:'Tax invoice', s:span(docs.gst.nums), cancelled:docs.gst.cancelled},
          {name:'Bill of supply', s:span(docs.nongst.nums), cancelled:docs.nongst.cancelled}] };
}
function gstr3b(from,to){
  var g=gstSummary(from,to);
  var out={taxable:0, igst:0, cgst:0, sgst:0, exempt:g.exempt};
  SALES.forEach(function(sl){
    if(sl.at<from||sl.at>to||sl.status==='cancelled'||sl.type!=='gst') return;
    saleRateLines(sl).forEach(function(rl){
      out.taxable+=rl.taxable;
      if(sl.inter) out.igst+=rl.tax;
      else { var h=Math.floor(rl.tax/2); out.cgst+=h; out.sgst+=rl.tax-h; }
    });
  });
  var inIgst=0, inCgst=0, inSgst=0;
  PURCHASES.forEach(function(p){
    var at=new Date(p.invDate+'T10:00:00').getTime();
    if(at<from||at>to||p.supplyType==='composition') return;
    var T=billTotals(p);
    if(p.taxMode==='intra'){ var h=Math.floor(T.tax/2); inCgst+=h; inSgst+=T.tax-h; }
    else inIgst+=T.tax;
  });
  expensesIn(from,to).forEach(function(e){
    if(!e.tax) return;
    var sup=e.partyId?partyById(e.partyId):null;
    if(sup&&sup.stateCode&&sup.stateCode!==(S.core.workshop.stateCode||'06')) inIgst+=e.tax;
    else { var h=Math.floor(e.tax/2); inCgst+=h; inSgst+=e.tax-h; }
  });
  out.inIgst=inIgst; out.inCgst=inCgst; out.inSgst=inSgst;
  /* Credit is set off in the order the law lays down: IGST credit against
     IGST first, then whatever is left against CGST and SGST. CGST credit
     only touches CGST, SGST credit only SGST — the two never cross.
     Without this the return reads as money owed while credit sits idle. */
  var li=out.igst, lc=out.cgst, ls=out.sgst;
  var ci=inIgst, cc=inCgst, cs=inSgst;
  var useIgstOnIgst=Math.min(li,ci); li-=useIgstOnIgst; ci-=useIgstOnIgst;
  var useCgstOnCgst=Math.min(lc,cc); lc-=useCgstOnCgst; cc-=useCgstOnCgst;
  var useSgstOnSgst=Math.min(ls,cs); ls-=useSgstOnSgst; cs-=useSgstOnSgst;
  var useIgstOnCgst=Math.min(lc,ci); lc-=useIgstOnCgst; ci-=useIgstOnCgst;
  var useIgstOnSgst=Math.min(ls,ci); ls-=useIgstOnSgst; ci-=useIgstOnSgst;
  var useCgstOnIgst=Math.min(li,cc); li-=useCgstOnIgst; cc-=useCgstOnIgst;
  var useSgstOnIgst=Math.min(li,cs); li-=useSgstOnIgst; cs-=useSgstOnIgst;
  out.setoff={igstOnIgst:useIgstOnIgst, igstOnCgst:useIgstOnCgst, igstOnSgst:useIgstOnSgst,
    cgstOnCgst:useCgstOnCgst, sgstOnSgst:useSgstOnSgst,
    cgstOnIgst:useCgstOnIgst, sgstOnIgst:useSgstOnIgst};
  out.netIgst=li; out.netCgst=lc; out.netSgst=ls;
  out.creditLeft={igst:ci, cgst:cc, sgst:cs};
  out.carried=ci+cc+cs;
  out.payable=li+lc+ls;
  return out;
}

/* ---------- balance sheet ---------- */
function balanceSheet(asOn){
  var to=asOn||Date.now();
  var stock=stockValue();
  var debtors=0, creditors=0;
  PARTIES.forEach(function(p){ var b=balanceOf(p.id); if(b>0) debtors+=b; else creditors-=b; });
  var cash=0, bank=0;
  ACCOUNTS.forEach(function(a){
    if(a.active===false) return;
    var h=accountHeld(a.id);
    if(a.kind==='bank') bank+=h; else cash+=h;
  });
  var fy=periodRange('fy');
  var earned=pnl(fy.from,to).net;
  var assets=stock+debtors+cash+bank;
  var liabilities=creditors;
  /* Opening capital was never entered \u2014 only stock and supplier balances
     were. This is what it must have been for the two sides to agree. */
  var capital=assets-liabilities-earned;
  return { stock:stock, debtors:debtors, cash:cash, bank:bank, assets:assets,
    creditors:creditors, liabilities:liabilities, earned:earned, capital:capital,
    equity:capital+earned, asOn:to };
}

    '<b>Nothing in this period.</b></div></div></div>';

    '</tr></thead><tbody>';
  rows.slice(0,400).forEach(function(r){

        (c.raw?v:esc(String(v)))+'</td>';

function gstDate(ts){
  var d=new Date(ts);
  return String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear();
}

/* every other report shares one path: same columns you see, as a file */
function repRows(id,R){
  var out={cols:[],rows:[],title:repDef(id).n};
  function grab(html){ return null; }
  if(id==='sales'){
    out.cols=['Date','Number','Kind','Channel','Customer','Vehicle','Job card','Taxable','GST','Total','Received','Due','Status'];
    SALES.filter(function(s){ return s.at>=R.from&&s.at<=R.to; })
      .sort(function(a,b){ return a.at-b.at; }).forEach(function(s){
      out.rows.push([dOnly(s.at),s.number,s.type==='gst'?'Tax invoice':'Plain bill',channelName(s.channel||'workshop'),s.custName,
        regShow(s.reg),(s.channel&&s.channel!=='workshop')?'':s.jobNo,rup(s.taxable),rup(s.tax),rup(s.grand),
        rup((s.advance||0)+(s.paid||0)+allocatedTo(s.id)),rup(saleDue(s)),
        s.status==='cancelled'?'CANCELLED':(saleDue(s)>0?'Unpaid':'Paid')]);
    });
  }
  else if(id==='purchsum'){
    out.cols=['Date','Supplier','GSTIN','Invoice','Kind','Tax type','Items','Taxable','GST','Total'];
    PURCHASES.forEach(function(p){
      var at=new Date(p.invDate+'T10:00:00').getTime();
      if(at<R.from||at>R.to) return;
      var sup=partyById(p.supplierId)||supplierById(p.supplierId)||{name:'',gstin:''};
      var T=billTotals(p);
      out.rows.push([dOnly(at),sup.name,sup.gstin||'',p.invNo,
        p.supplyType==='composition'?'Bill of supply':'Tax invoice',
        p.supplyType==='composition'?'':(p.taxMode==='intra'?'CGST+SGST':'IGST'),

    });
    PURCHASES.forEach(function(p){
      var at=new Date(p.invDate+'T10:00:00').getTime();
      if(at<R.from||at>R.to) return;
      p.lines.forEach(function(l){
        if(!l.partId||!mm[l.partId]) return;
        mm[l.partId].bought+=l.qty*(l.conv||1); mm[l.partId].spend+=lineTaxable(l);
      });
    });
    Object.keys(mm).forEach(function(k){
      var x=mm[k]; if(!x.sold&&!x.bought) return;
      out.rows.push([x.no,x.name,x.cat,x.bought,rup(x.spend),x.sold,rup(x.rev),
        rup(x.rev-x.cost),x.rev?Math.round((x.rev-x.cost)*1000/x.rev)/10:0]);
    });
  }
  else if(id==='outstand'){
    out.cols=['Party','Customer','Supplier','Phone','GSTIN','They owe','You owe','Credit limit','Over limit'];
    PARTIES.forEach(function(p){
      var b=balanceOf(p.id); if(!b) return;
      out.rows.push([p.name,isCustomer(p)?'Yes':'',isSupplier(p)?'Yes':'',p.phone||'',p.gstin||'',
        rup(b>0?b:0),rup(b<0?-b:0),rup(p.creditLimit||0),overLimit(p)?'YES':'']);
    });
  }
  else if(id==='ageing'){
    out.cols=['Party','0-30 days','31-60','61-90','Over 90','Total'];
    PARTIES.forEach(function(p){
      var a=ageing(p.id), tot=a.reduce(function(t,x){ return t+x.amount; },0);
      if(!tot) return;
      out.rows.push([p.name,rup(a[0].amount),rup(a[1].amount),rup(a[2].amount),rup(a[3].amount),rup(tot)]);
    });
  }
  else if(id==='partyitem'){
    out.cols=['Customer','What they bought','Qty','Value'];
    var pm={};
    SALES.filter(function(s){ return s.at>=R.from&&s.at<=R.to&&s.status!=='cancelled'; }).forEach(function(s){
      (s.lines||[]).forEach(function(l){
        var k=(s.partyId||s.custName)+'|'+l.desc;
        pm[k]=pm[k]||{party:s.custName,item:l.desc,qty:0,amt:0};
        pm[k].qty+=l.qty||0; pm[k].amt+=l.amount;
      });
    });
    Object.keys(pm).forEach(function(k){ var x=pm[k]; out.rows.push([x.party,x.item,x.qty,rup(x.amt)]); });
  }
  return out;
}
function exportReport(id){

  if(id==='gstr1'){ exportGstr1Range(R); return; }

/* =====================================================================
   RETURNS
   A part comes back off a bike, or goes back to the supplier.

   Sales return   \u2192 credit note. Stock comes back, the customer owes less,
                    the GST you charged is reversed.
   Purchase return \u2192 debit note. Stock goes out, you owe the supplier less,
                    the credit you claimed is reversed.

   Nothing is ever edited. A return is its own document, numbered in its
   own series, and both sides stay on the record.
   ===================================================================== */
var RETURNS=[];

async function saveReturns(){ return DB.set('mz:returns',RETURNS); }
async function loadReturns(){ RETURNS=await DB.get('mz:returns')||[]; }

function returnsIn(kind,from,to){
  return RETURNS.filter(function(r){
    return r.kind===kind && r.at>=from && r.at<=to && r.status!=='void';
  });
}
function returnTotal(r){ return r.taxable+r.tax; }
function sumReturns(list){ return list.reduce(function(a,r){ return a+returnTotal(r); },0); }
/* how much of a bill has already come back, so it cannot come back twice */
function returnedAgainst(refId){
  return RETURNS.filter(function(r){ return r.refId===refId&&r.status!=='void'; })
    .reduce(function(a,r){ return a+returnTotal(r); },0);
}

/* ---------- raising one ---------- */
async function makeReturn(o){
  var taxable=0, tax=0;
  o.lines.forEach(function(l){
    var t=exTax(l.amount, l.gst||0);
    l.taxable=t; l.tax=l.amount-t;
    taxable+=t; tax+=l.amount-t;
  });
  var series=(o.kind==='sales')?'cn':'dn';
  var no;
  try{ no=await allocNumber(series); }
  catch(e){ toast(e.message,'bad'); return null; }
  var r={ id:uid('rt'), kind:o.kind, no:no, refId:o.refId||'', refNo:o.refNo||'',
    partyId:o.partyId||'', partyName:o.partyName||'', reg:o.reg||'', jobId:o.jobId||'',
    at:Date.now(), reason:o.reason||'', lines:o.lines, taxable:taxable, tax:tax,
    inter:!!o.inter, gstin:o.gstin||'', status:'final',
    by:S.user.id, byName:S.user.name };
  RETURNS.push(r);

  /* stock moves the opposite way to the original */
  for(var i=0;i<o.lines.length;i++){
    var l=o.lines[i];
    if(!l.partId) continue;
    moveIn({ partId:l.partId, batchId:l.batchId||'',
      qty:(o.kind==='sales')? qtyNum(l.qty) : -qtyNum(l.qty),
      kind:(o.kind==='sales')?'salesreturn':'purchreturn',
      ref:no, note:(o.kind==='sales'?'Back from ':'Back to ')+(o.partyName||'') });
  }
  await saveStore('moves');
  if(!await saveReturns()){ RETURNS.pop(); return null; }
  clearBalCache();
  logAudit('Return',(o.kind==='sales'?'Credit note raised':'Debit note raised'),
    no+' \u00B7 '+(o.partyName||'')+' \u00B7 '+money(taxable+tax), o.refNo||'');
  await saveAudit();
  return r;
}
async function voidReturn(id){
  var r=RETURNS.filter(function(x){ return x.id===id; })[0];
  if(!r||r.status==='void') return;
  r.status='void'; r.voidAt=Date.now(); r.voidBy=S.user.id;
  (r.lines||[]).forEach(function(l){
    if(!l.partId) return;
    moveIn({ partId:l.partId, batchId:l.batchId||'',
      qty:(r.kind==='sales')? -qtyNum(l.qty) : qtyNum(l.qty),
      kind:'adjust', ref:r.no, note:'return cancelled' });
  });
  await saveStore('moves');
  await saveReturns();
  clearBalCache();
  logAudit('Return','Return cancelled',r.no,'');
  await saveAudit();
  rerender(); toast(r.no+' cancelled');
}

/* ---------- what they do to a party's balance ---------- */
function returnEntries(partyId){
  return RETURNS.filter(function(r){ return r.partyId===partyId&&r.status!=='void'; })
    .map(function(r){
      var amt=returnTotal(r);
      return { kind:'return', id:r.id, no:r.no, at:r.at, amount:amt,
        dr:(r.kind==='purchase')?amt:0, cr:(r.kind==='sales')?amt:0,
        label:(r.kind==='sales'?'Credit note \u00B7 goods returned':'Debit note \u00B7 returned to supplier') };
    });
}

/* ---------------- SALES ---------------- */

  live.forEach(function(s){

    if(s.type==='gst') gst+=s.grand; else plain+=s.grand;
  });
  var ret=returnsIn('sales',R.from,R.to);
  var cost=0;
  live.forEach(function(s){ (s.lines||[]).forEach(function(l){ cost+=l.cost||0; }); });
  return { bills:live.length, gross:gross, taxable:taxable, tax:tax, due:due,
    gst:gst, plain:plain, cost:cost, earned:taxable-cost,
    ret:ret, retTotal:sumReturns(ret), list:live,

/* ---------------- PURCHASES ---------------- */
function purchStats(R){

  var ret=returnsIn('purchase',R.from,R.to);

    credit:credit, items:items, list:live, ret:ret, retTotal:sumReturns(ret) };
}
/* stock on the shelf, split by whether tax was paid on it */

  var withTax=0, noTax=0, wq=0, nq=0;

    if(b.supplyType==='composition'){ noTax+=v; nq++; } else { withTax+=v; wq++; }

  return {withTax:withTax, noTax:noTax, withN:wq, noN:nq, total:withTax+noTax};
}

  var recent=A.list.slice().sort(function(a,b){
    return new Date(b.invDate).getTime()-new Date(a.invDate).getTime(); }).slice(0,10);
  if(recent.length){
    h+='<div class="card"><div class="card-h"><h2>Recent Bills</h2>'+

        return '<tr><td><button class="linkish" data-act="openPurchase" data-id="'+p.id+'">'+esc(p.invNo)+'</button>'+
          '<div class="small muted">'+dOnly(new Date(p.invDate).getTime())+' \u00B7 '+
