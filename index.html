function chatListHtml(){
  var c=S.chat;
  if(!c||!c.msgs) return '<div class="empty" style="padding:30px 8px"><b>Opening the chat…</b></div>';
  if(!c.msgs.length) return '<div class="empty" style="padding:30px 8px"><b>No messages yet.</b>'+
    'Send a photo of what you found, a voice note, or a quick line — everyone on this job sees it.</div>';
  var h='', lastDay='';
  c.msgs.forEach(function(m){
    var day=dOnly(m.at);
    if(day!==lastDay){ h+='<div class="daysep">'+(day===dOnly(Date.now())?tr('today'):day)+'</div>'; lastDay=day; }
    h+=msgHtml(m);
  });
  return h;
}
function canRemoveMsg(m){
  if(m.removed) return false;
  if(can('settings')) return true;
  return m.by===S.user.id && (Date.now()-m.at)<CHAT_LIMITS.removeWindowMs;
}
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
}
function msgHtml(m){
  var me=(m.by===S.user.id);
  if(m.removed) return '<div class="msg gone'+(me?' me':'')+'">Message removed by '+esc(m.removed.byName)+'</div>';
  var h='<div class="msg'+(me?' me':'')+'" data-mid="'+m.id+'">';
  if(!me) h+='<div class="who">'+esc(m.byName)+' <span>'+esc(m.title||'')+'</span></div>';
  if(m.att){
    var a=m.att;
    if(a.kind==='image')
      h+='<button class="imgbtn" data-act="chatAtt" data-id="'+m.id+'" aria-label="Open photo">'+
         '<img class="thumb" src="'+a.thumb+'" alt="Photo"'+(a.w?' width="'+a.w+'" height="'+a.h+'"':'')+'></button>';
    else if(a.kind==='voice')
      h+='<div id="att_'+m.id+'"><button class="voicebtn" data-act="chatAtt" data-id="'+m.id+'">'+ICON.play+
         '<span>Voice note</span>'+(a.ms?'<b class="mono">'+vTime(a.ms)+'</b>':'')+'</button></div>';
    else
      h+='<button class="filechip" data-act="chatAtt" data-id="'+m.id+'">'+ICON.file+
         '<span style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
         esc(a.name)+'</b><span class="small muted">'+fmtKb(a.size||0)+' · tap to download</span></span></button>';
  }
  if(m.text) h+='<div class="txt">'+linkify(m.text)+'</div>';
  h+='<div class="meta">'+tms(new Date(m.at))+
     (canRemoveMsg(m)?' · <button class="linkish small" style="font-weight:600;color:var(--steel)" '+
       'data-act="chatDelAsk" data-id="'+m.id+'">remove</button>':'')+'</div>';
  return h+'</div>';
}

function composerHtml(){

      '<button class="ibtn send" data-act="chatRecSend" aria-label="Send the voice note">'+ICON.send+'</button></div>';
  }

function paintComposer(){

function growBox(t){ t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,132)+'px'; }
/* Swap mic for send only when the box goes from empty to not, so typing
   does not rebuild the composer on every key. */
function onChatInput(t){
  var was=!!(S.chatDraft||'').trim();
  S.chatDraft=t.value; growBox(t);

/* ---------- sending ---------- */
function newMsg(text,att){
  return { id:uid('m'), at:Date.now(), by:S.user.id, byName:S.user.name, title:userTitle(S.user),
    text:text||'', att:att||null };
}
async function chatPost(text,att,data){
  var c=S.chat; if(!c) return false;
  var list=await ChatStore.post(c.jobId,newMsg(text,att),data);
  if(!list){ toast('That did not send. Nothing was lost — try again.','bad'); return false; }
  if(S.chat&&S.chat.jobId===c.jobId){ S.chat.msgs=list; markChatSeen(c.jobId); paintChatList(true); }
  return true;
}
async function chatSend(){
  var text=(S.chatDraft||'').trim(); if(!text) return;
  if(text.length>4000){ toast('That is very long — split it into two messages','bad'); return; }
  if(await chatPost(text,null,null)){ S.chatDraft=''; paintComposer(); }
}
function attCap(){ return isShared()?CHAT_LIMITS.fileBytes:CHAT_LIMITS.fileBytesLocal; }
function readDataUrl(f){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){ res(String(r.result)); };
    r.onerror=function(){ rej(new Error('read failed')); };
    r.readAsDataURL(f);
  });
}
function imgSize(url){
  return new Promise(function(res){
    var i=new Image(); i.onload=function(){ res({w:i.width,h:i.height}); };
    i.onerror=function(){ res({w:0,h:0}); }; i.src=url;
  });
}
/* Photos are squeezed before they are kept; anything else goes as it is,
   up to the size limit. A caption typed before attaching rides on the
   first file. */
async function chatAddFiles(files){
  if(!files||!files.length) return;
  var caption=(S.chatDraft||'').trim(), sent=0;
  for(var i=0;i<files.length;i++){
    var f=files[i], att, data;
    try{
      if(/^image\//.test(f.type)&&!/gif|svg/.test(f.type)){
        var full=await shrinkImage(f,CHAT_LIMITS.photoPx,CHAT_LIMITS.photoQ);
        var thumb=await shrinkImage(f,CHAT_LIMITS.thumbPx,CHAT_LIMITS.thumbQ);
        var sz=await imgSize(thumb);
        att={id:uid('at'), kind:'image', name:f.name||'photo.jpg', mime:'image/jpeg',
          size:Math.round(full.length*0.75), thumb:thumb, w:sz.w, h:sz.h};
        data={mime:'image/jpeg', name:att.name, data:full};
      } else {
        var big=(MODE==='live'&&LV.assets&&assetType(f.type||''))?20*1024*1024:attCap();
        if(f.size>big){
          toast(f.name+' is '+fmtKb(f.size)+'. The limit here is '+fmtKb(big)+'.','bad'); continue; }
        att={id:uid('at'), kind:/^audio\//.test(f.type||'')?'voice':'file', name:f.name||'file',
          mime:f.type||'application/octet-stream', size:f.size, ms:0};
        data={mime:att.mime, name:att.name, data:await readDataUrl(f)};
      }
      /* hosted: photos, PDFs and voice go to the page's file store */
      if(MODE==='live'&&LV.assets){
        var at=assetType(att.mime);
        if(at){
          try{
            var up=await LV.assets.upload(await dataUrlBlob(data.data),{type:at});
            att.asset=up.id; data=null;
          }catch(e){
            if(e&&(e.code==='quota_or_state'||e.code==='too_large')){ toast('The page\u2019s file storage would not take '+att.name+'.','bad'); continue; }
          }
        }
      }
    }catch(e){ toast('Could not read '+(f.name||'that file'),'bad'); continue; }
    toast('Sending '+(att.kind==='image'?'photo':att.name)+'…');
    if(await chatPost(sent===0?caption:'',att,data)) sent++;
  }
  if(sent&&caption){ S.chatDraft=''; paintComposer(); }
}

/* ---------- voice notes ---------- */
var CHATREC={on:false, mr:null, stream:null, chunks:[], t0:0, timer:null, cancel:false};
async function chatRecStart(){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)){
    toast('This browser cannot record. Send a photo or type it instead.','bad'); return; }
  try{
    CHATREC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  }catch(err){
    toast((err&&err.name==='NotAllowedError')
      ? 'The microphone is blocked. Allow it for this page and try again.'
      : 'Could not reach the microphone.','bad');
    return;
  }
  var mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].filter(function(m){
    try{ return MediaRecorder.isTypeSupported(m); }catch(e){ return false; } })[0];
  CHATREC.chunks=[]; CHATREC.cancel=false;
  CHATREC.mr=new MediaRecorder(CHATREC.stream, mime?{mimeType:mime,audioBitsPerSecond:32000}:undefined);
  CHATREC.mr.ondataavailable=function(ev){ if(ev.data&&ev.data.size) CHATREC.chunks.push(ev.data); };
  CHATREC.mr.onstop=chatRecDone;
  CHATREC.mr.start();
  CHATREC.on=true; CHATREC.t0=Date.now();
  CHATREC.timer=setInterval(function(){
    var ms=Date.now()-CHATREC.t0, t=document.getElementById('chatrectime');
    if(t) t.textContent=vTime(ms);
    if(ms>=CHAT_LIMITS.voiceMs){ chatRecStop(true); toast('Stopped at two minutes — sending'); }
  },250);
  paintComposer();
}
function chatRecStop(send){
  if(!CHATREC.on) return;
  CHATREC.cancel=!send; CHATREC.on=false;
  CHATREC.ms=Date.now()-CHATREC.t0;
  clearInterval(CHATREC.timer); CHATREC.timer=null;
  try{ if(CHATREC.mr&&CHATREC.mr.state!=='inactive') CHATREC.mr.stop(); }catch(e){}
  if(CHATREC.stream){ CHATREC.stream.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} }); CHATREC.stream=null; }
  paintComposer();
}
async function chatRecDone(){
  if(CHATREC.cancel||!CHATREC.chunks.length) return;
  if(CHATREC.ms<800){ toast('Too short — hold on a moment longer next time'); return; }
  var blob=new Blob(CHATREC.chunks,{type:(CHATREC.mr&&CHATREC.mr.mimeType)||'audio/webm'});
  if(blob.size>attCap()){ toast('That recording is too large to keep here','bad'); return; }
  var att={id:uid('at'), kind:'voice', name:'voice-note', mime:blob.type, size:blob.size, ms:CHATREC.ms};
  var data={mime:blob.type, name:att.name, data:'data:'+blob.type+';base64,'+await blobB64(blob)};
  await chatPost('',att,data);
}

/* ---------- reading the file ---------- */
var XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function loadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise(function(res,rej){
    var s=document.createElement('script'); s.src=XLSX_URL;
    s.onload=function(){ res(window.XLSX); };
    s.onerror=function(){ rej(new Error('Could not load the Excel reader. Check the internet, or save the sheet as CSV.')); };
    document.head.appendChild(s);
  });
}
function parseCsv(text){
  var rows=[], row=[], cell='', q=false;
  text=String(text).replace(/^﻿/,'');
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; }
      else cell+=c;
    } else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'||c==='\r'){
      if(c==='\r'&&text[i+1]==='\n') i++;
      row.push(cell); rows.push(row); row=[]; cell='';
    } else cell+=c;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
async function readSheetFile(f){
  if(/\.csv$/i.test(f.name)||f.type==='text/csv') return {sheets:{Sheet1:parseCsv(await f.text())}};
  var X=await loadXlsx();
  var wb=X.read(await f.arrayBuffer(),{type:'array',cellDates:true});
  var out={};
  wb.SheetNames.forEach(function(n){
    out[n]=X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});
  });
  return {sheets:out};
}
/* the first row with two or more filled cells is the header */
function splitHeader(rows){
  for(var i=0;i<Math.min(rows.length,15);i++){
    var filled=rows[i].filter(function(c){ return String(c).trim()!==''; }).length;
    if(filled>=2) return {headers:rows[i].map(function(h){ return String(h).trim(); }),
      data:rows.slice(i+1).filter(function(r){ return r.some(function(c){ return String(c).trim()!==''; }); })};
  }
  return {headers:[],data:[]};
}
function normH(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9%/#]+/g,' ').trim(); }
function guessMap(type,headers){
  var map={}, used={}, H=headers.map(normH), F=IMPORT_TYPES[type].fields;
  /* exact names first, then a header that contains a known name */
  [0,1].forEach(function(pass){
    F.forEach(function(f){
      if(map[f[0]]!==undefined) return;
      for(var i=0;i<H.length;i++){
        if(used[i]||!H[i]) continue;
        var hit=f[3].some(function(syn){
          return pass===0 ? H[i]===syn : (syn.length>=3&&(' '+H[i]+' ').indexOf(' '+syn+' ')>=0);
        });
        if(hit){ map[f[0]]=i; used[i]=1; return; }
      }
    });
  });
  return map;
}

/* ---------- reading values ---------- */
function cellStr(v){
  if(v===null||v===undefined) return '';
  if(v instanceof Date) return isoDate(v.getTime());
  if(typeof v==='number'&&Math.abs(v)>=1e9&&Number.isInteger(v)) return String(v);
  return String(v).trim();
}
/* Indian sheets write the day first. A bare number is an Excel date. */
function parseDateCell(v){
  if(v instanceof Date&&!isNaN(v)) return new Date(v.getFullYear(),v.getMonth(),v.getDate(),12).getTime();
  if(typeof v==='number'&&v>20000&&v<80000) return Math.round((v-25569)*86400000)+12*3600000-new Date().getTimezoneOffset()*60000;
  var s=String(v||'').trim(); if(!s) return null;
  var m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ var y=+m[3]; if(y<100) y+=2000;
    var d=new Date(y,+m[2]-1,+m[1],12); return (d.getMonth()===+m[2]-1)?d.getTime():null; }
  m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m){ var d2=new Date(+m[1],+m[2]-1,+m[3],12); return isNaN(d2)?null:d2.getTime(); }
  var t=Date.parse(s); return isNaN(t)?null:t;
}
function numCell(v){ var n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }
function phoneCell(v){
  var d=cellStr(v).replace(/[^0-9+]/g,'');
  if(/^\+?91\d{10}$/.test(d)) d=d.slice(-10);
  if(/^0\d{10}$/.test(d)) d=d.slice(1);
  return d;
}
function rowRec(type,row,map){
  var o={};
  IMPORT_TYPES[type].fields.forEach(function(f){ var i=map[f[0]]; o[f[0]]=(i===undefined||i==='')?'':row[i]; });
  return o;
}

/* ---------- checking each row ----------
   Returns {ok, why, rec}: rec is the cleaned-up record, why says plainly
   what is wrong with a row that will be skipped. Nothing is written here. */
function checkRow(type,r){
  var why=[];
  if(type==='customers'){
    var name=cellStr(r.name), ph=phoneCell(r.phone);
    if(!name) return {ok:false,why:'no name'};
    if(ph&&ph.length<10) why.push('phone looks short');
    var g=cellStr(r.gstin).toUpperCase(), gc=g?gstinCheck(g):null;
    if(g&&!gc.ok) why.push('GSTIN fails its check — left out');
    return {ok:true, why:why.join('; '), rec:{name:name, phone:ph, altPhone:phoneCell(r.altPhone), email:cellStr(r.email),
      gstin:(gc&&gc.ok)?gc.raw:'', address:cellStr(r.address), opening:toPaise(r.opening)}};
  }
  if(type==='vendors'){
    var vn=cellStr(r.name); if(!vn) return {ok:false,why:'no name'};
    var vg=cellStr(r.gstin).toUpperCase(), vgc=vg?gstinCheck(vg):null;
    if(vg&&!vgc.ok) why.push('GSTIN fails its check — left out');
    return {ok:true, why:why.join('; '), rec:{name:vn, gstin:(vgc&&vgc.ok)?vgc.raw:'', gc:vgc, phone:phoneCell(r.phone),
      email:cellStr(r.email), address:cellStr(r.address), bankName:cellStr(r.bankName), acNo:cellStr(r.acNo),
      ifsc:cellStr(r.ifsc).toUpperCase(), opening:toPaise(r.opening)}};
  }
  if(type==='bikes'){
    var reg=regKey(cellStr(r.reg)); if(reg.length<4) return {ok:false,why:'no registration number'};
    var mk=matchMake(cellStr(r.make)), md=matchModel(mk,cellStr(r.model));
    return {ok:true, why:'', rec:{reg:reg, make:mk, model:md, cc:cellStr(r.cc)||ccFor(mk,md)||'',
      name:cellStr(r.name), phone:phoneCell(r.phone), odo:String(Math.round(numCell(r.odo))||''),
      lastVisit:parseDateCell(r.lastVisit)||0}};
  }
  if(type==='inventory'){
    var no=cellStr(r.no), nm=cellStr(r.name);
    if(!no&&!nm) return {ok:false,why:'no part number or name'};
    var gst=r.gst===''?18:Math.round(numCell(String(r.gst).replace('%','')));
    if(gst>0&&gst<1) gst=Math.round(gst*100);       /* 0.18 written as a fraction */
    if([0,5,12,18,28,40].indexOf(gst)<0){ why.push('GST '+gst+'% is not a GST rate — set to 18%'); gst=18; }
    if(gst===12||gst===28) why.push('GST '+gst+'% was abolished in Sept 2025 — check this part');
    var cat=matchCategory(cellStr(r.category));
    var qty=numCell(r.qty);
    if(qty<0){ why.push('negative quantity — opening stock left at 0'); qty=0; }
    var cost=toPaise(cellStr(r.cost));
    if(qty>0&&!cost) why.push('stock with no cost — margins for it will read wrong');
    var unit=cellStr(r.unit).toLowerCase(); if(UNITS.indexOf(unit)<0) unit='piece';
    return {ok:true, why:why.join('; '), rec:{no:no, name:nm||no, category:cat, hsn:cellStr(r.hsn), gst:gst, qty:qty,
      cost:cost, sale:toPaise(cellStr(r.sale)), mrp:toPaise(cellStr(r.mrp)), unit:unit, minQty:numCell(r.minQty)}};
  }
  if(type==='history'){
    var dt=parseDateCell(r.date); if(!dt) return {ok:false,why:'date not readable'};
    if(dt>Date.now()+86400000) return {ok:false,why:'date is in the future'};
    var hreg=regKey(cellStr(r.reg)); if(hreg.length<4) return {ok:false,why:'no registration number'};
    var hmk=matchMake(cellStr(r.make));
    return {ok:true, why:'', rec:{at:dt, reg:hreg, no:cellStr(r.no), make:hmk, model:matchModel(hmk,cellStr(r.model)),
      name:cellStr(r.name), phone:phoneCell(r.phone), odo:String(Math.round(numCell(r.odo))||''),
      jobType:cellStr(r.jobType), complaint:cellStr(r.complaint), amount:toPaise(cellStr(r.amount)),
      invoiceNo:cellStr(r.invoiceNo)}};
  }
  return {ok:false,why:'unknown type'};
}
/* "royal enfield", "RE", "Royal-Enfield" all land on the one make the app knows */
var MAKE_ALIAS={re:'Royal Enfield',hero:'Hero MotoCorp',heromotocorp:'Hero MotoCorp',hd:'Harley-Davidson',harley:'Harley-Davidson',
  bmw:'BMW Motorrad',indian:'Indian Motorcycle',ola:'Ola Electric',ktm:'KTM',tvs:'TVS'};
function matchMake(s){
  if(!s) return '';
  var k=pkey(s), all=allMakes();
  for(var i=0;i<all.length;i++) if(pkey(all[i])===k) return all[i];
  if(MAKE_ALIAS[k.toLowerCase()]) return MAKE_ALIAS[k.toLowerCase()];
  for(var j=0;j<all.length;j++) if(pkey(all[j]).indexOf(k)===0&&k.length>=3) return all[j];
  return s;
}
function matchModel(make,s){
  if(!s) return '';
  var k=pkey(s), ms=modelsFor(make);
  for(var i=0;i<ms.length;i++) if(pkey(ms[i].n)===k) return ms[i].n;
  return s;
}
function matchCategory(s){
  if(!s) return 'Uncategorised';
  var k=s.toLowerCase();
  for(var i=0;i<CATEGORIES.length;i++) if(CATEGORIES[i].toLowerCase()===k) return CATEGORIES[i];
  for(var j=0;j<CATEGORIES.length;j++){
    var first=CATEGORIES[j].toLowerCase().split(/[ &]+/)[0];
    if(first.length>=4&&k.indexOf(first)>=0) return CATEGORIES[j];
  }
  return 'Uncategorised';
}

async function importRun(){
  var I=S.imp; if(!I||!I.type) return;
  var recs=I.data.map(function(r){ return checkRow(I.type,rowRec(I.type,r,I.map)); })
    .filter(function(c){ return c.ok; }).map(function(c){ return c.rec; });
  if(!recs.length){ toast('Nothing to import','bad'); return; }
  var res;
  if(I.type==='customers') res=await importCustomers(recs);
  if(I.type==='vendors')   res=await importVendors(recs);
  if(I.type==='bikes')     res=await importBikes(recs);
  if(I.type==='inventory') res=await importInventory(recs,!!I.costIncl);
  if(I.type==='history')   res=await importHistory(recs);
  if(!res) return;
  S.imp={type:I.type};
  rerender();
  openModal('<h2>Import finished</h2><p style="margin-top:10px">'+esc(res)+'</p>'+
    '<div class="btn-row" style="margin-top:16px"><button class="btn primary" data-act="closeModal">Done</button></div>');
}
function partyMatch(rec,type){
  var p=null;
  if(rec.gstin) p=partyByGstin(rec.gstin);
  if(!p&&rec.phone&&rec.phone.length>=10) p=partyByPhone(rec.phone);
  if(!p){ var nk=String(rec.name).toLowerCase().trim();
    p=PARTIES.filter(function(x){ return String(x.name).toLowerCase().trim()===nk&&(!type||(x.types||[]).indexOf(type)>=0); })[0]||null; }
  return p;
}
function fillBlank(p,rec,keys){ keys.forEach(function(k){ if(rec[k]&&!p[k]) p[k]=rec[k]; }); }
async function importCustomers(recs){
  var made=0, upd=0;
  recs.forEach(function(r){
    var p=partyMatch(r,'customer');
    if(p){ upd++; addType(p,'customer'); }
    else { p=blankParty(); p.name=r.name; p.types=['customer'];
      p.state=S.core.workshop.state; p.stateCode=S.core.workshop.stateCode; PARTIES.push(p); made++; }
    fillBlank(p,r,['phone','altPhone','email','address']);
    if(r.gstin&&!p.gstin){ var g=gstinCheck(r.gstin); p.gstin=g.raw; p.state=g.state; p.stateCode=g.stateCode; p.pan=g.pan; }
    if(r.opening>0&&!(p.opening&&p.opening.amount)) p.opening={amount:r.opening, side:'dr', asOn:isoDate()};
  });
  if(!await savePartyData()) return null;
  return made+' customers added, '+upd+' already on file were filled in.';
}
async function importVendors(recs){
  var made=0, upd=0;
  recs.forEach(function(r){

      p.state=S.core.workshop.state; p.stateCode=S.core.workshop.stateCode; PARTIES.push(p); made++; }

async function importBikes(recs){
  var patch={}, n=0;
  recs.forEach(function(r){
    var old=S.core.bikes[r.reg]||{};
    var b=Object.assign({},old,{reg:r.reg});
    ['make','model','cc','name','phone'].forEach(function(k){ if(r[k]) b[k]=r[k]; });
    if(r.odo&&(!old.lastOdo||+r.odo>+old.lastOdo)) b.lastOdo=r.odo;
    if(r.lastVisit&&(!old.lastVisit||r.lastVisit>old.lastVisit)) b.lastVisit=r.lastVisit;
    patch[r.reg]=b; S.core.bikes[r.reg]=b; n++;
    if(r.phone&&r.phone.length>=10) findOrMakeCustomer(r.name||'Customer',r.phone,{});
  });
  if(!await DB.merge('mz:bikes',patch)) return null;
  if(!await savePartyData()) return null;
  return n+' bikes on file. Typing any of these numbers at intake now fills in the bike and its owner.';
}
async function importInventory(recs,costIncl){
  var made=0, upd=0, stocked=0, skippedStock=0;
  recs.forEach(function(r){
    var p=r.no?partByNo(r.no):null;
    if(!p&&!r.no){ var nk=r.name.toLowerCase(); p=PARTS.filter(function(x){ return String(x.name).toLowerCase()===nk; })[0]||null; }
    if(!p){
      p={id:uid('pt'), no:r.no||autoPartNo(r.name), aliases:[], name:r.name, category:r.category, hsn:r.hsn, gst:r.gst,
        unit:r.unit, buyUnit:r.unit, conv:1, mrp:r.mrp, sale:r.sale||r.mrp, minQty:r.minQty, createdAt:Date.now(), updatedAt:Date.now()};
      PARTS.push(p); made++;
    } else {
      upd++;
      if(r.name) p.name=r.name; if(r.hsn) p.hsn=r.hsn; p.gst=r.gst;
      if(r.category!=='Uncategorised') p.category=r.category;
      if(r.sale) p.sale=r.sale; if(r.mrp) p.mrp=r.mrp; if(r.minQty) p.minQty=r.minQty;
      p.updatedAt=Date.now();
    }
    if(r.qty>0){
      var already=MOVES.some(function(m){ return m.partId===p.id&&m.kind==='opening'&&m.ref==='import'; });
      if(already){ skippedStock++; return; }
      var cost=costIncl?exTax(r.cost,r.gst):r.cost;
      var b={id:uid('bt'), partId:p.id, batchNo:'OPENING', cost:cost, rate:cost, incl:false, disc:0, gst:r.gst,
        freight:0, serials:[], purchaseId:'', supplierId:'', supplyType:'tax', invNo:'opening', invDate:isoDate(),
        at:Date.now(), qtyIn:r.qty};
      BATCHES.push(b);
      MOVES.push({id:uid('mv'), partId:p.id, batchId:b.id, qty:r.qty, kind:'opening', ref:'import',
        note:'Opening stock brought in from '+(S.imp.fileName||'a file'), at:Date.now(), by:S.user.id});
      stocked++;
    }
  });
  if(!await saveStore()) return null;
  return made+' parts added, '+upd+' updated, '+stocked+' given opening stock.'+
    (skippedStock?' '+skippedStock+' already had imported opening stock, so their quantity was left alone — use Correct the stock for those.':'');
}
async function importHistory(recs){
  var seen={};
  S.index.forEach(function(e){
    if(e.imported) seen[(e.no||'')+'|'+e.reg+'|'+isoDate(e.createdAt)]=1;
  });
  var entries=[], ix=[], made=0, dup=0, bikes={}, n=0;
  recs.sort(function(a,b){ return a.at-b.at; });
  recs.forEach(function(r){
    var sig=(r.no||'')+'|'+r.reg+'|'+isoDate(r.at);
    if(seen[sig]){ dup++; return; } seen[sig]=1;
    n++;
    var pty=(r.phone&&r.phone.length>=10)?findOrMakeCustomer(r.name||'Customer',r.phone,{}):null;
    var j={ id:uid('job'), no:r.no||('OLD-'+String(n).padStart(5,'0')), imported:true, createdAt:r.at, closedAt:r.at,
      createdBy:S.user.id, stage:'closed', hold:false, reg:r.reg, make:r.make, model:r.model, cc:ccFor(r.make,r.model)||'',
      odo:r.odo, fuel:'', cust:{name:r.name, phone:r.phone, gstin:'', address:''},
      complaint:r.complaint||'(brought in from old records)', items:{}, damage:'', jobType:r.jobType||'Old record',
      required:[], mechanicId:'', expected:'', partyId:pty?pty.id:'', advance:null, lines:[],
      approvals:{owner:null,customer:null}, additions:[], bills:[], estimates:[],
      histTotal:r.amount, histInvoice:r.invoiceNo,
      log:[{ts:Date.now(), by:S.user.id, byName:S.user.name, role:roleList(S.user)[0], title:userTitle(S.user),
        action:'Brought in from old records', detail:(S.imp.fileName||'')+(r.invoiceNo?' · old bill '+r.invoiceNo:'')}] };
    var e=indexEntry(j);
    entries.push(['mz:job:'+j.id,j]); ix.push(e); made++;
    var b=Object.assign({},S.core.bikes[r.reg]||bikes[r.reg]||{},{reg:r.reg});
    ['make','model'].forEach(function(k){ if(r[k]) b[k]=r[k]; });
    if(r.name) b.name=r.name; if(r.phone) b.phone=r.phone;
    if(r.odo&&(!b.lastOdo||+r.odo>=+b.lastOdo)) b.lastOdo=r.odo;
    if(!b.lastVisit||r.at>b.lastVisit) b.lastVisit=r.at;
    bikes[r.reg]=b;
  });
  if(!made){ return dup+' rows were already brought in before — nothing new.'; }
  toast('Writing '+made+' old job cards…');
  if(MODE==='cloud'){
    if(!await DB.setMany(entries.concat(ix.map(function(e){ return ['mz:ix:'+e.id,e]; })))) return null;
    ix.forEach(function(e){ S.index.push(e); });
  } else if(MODE==='live'){
    if(!await DB.setMany(entries)) return null;
    try{ for(var q=0;q<ix.length;q+=6) await Promise.all(ix.slice(q,q+6).map(livePutIx)); }
    catch(err){ liveFail('mz:index',err); return null; }
    ix.forEach(function(e){ S.index.push(e); });
  } else {
    if(!await DB.setMany(entries)) return null;
    ix.forEach(function(e){ S.index.push(e); });
    if(!await DB.set('mz:index',S.index)) return null;
  }
  Object.keys(bikes).forEach(function(k){ S.core.bikes[k]=bikes[k]; });
  await DB.merge('mz:bikes',bikes);
  await savePartyData();
  return made+' past visits brought in'+(dup?', '+dup+' skipped as already here':'')+
    '. They show under each bike’s past visits at intake and feed the Due for service list. They are not counted in sales or GST.';
}

async function openJob(id){

document.addEventListener('change',function(e){
  var el=e.target; if(!el) return;
  if(el.id==='impfile'){ var imf=el.files&&el.files[0]; if(imf) impPickFile(imf); return; }
  if(el.dataset&&el.dataset.impmap){ S.imp.map[el.dataset.impmap]=el.value===''?undefined:parseInt(el.value,10); rerender(); return; }
  if(el.id==='chatcam'||el.id==='chatfile'||el.id==='chataudio'){
    var fl=Array.prototype.slice.call(el.files||[]); el.value='';
    guard('chatFiles',null,function(){ return chatAddFiles(fl); }); return; }
  if(el.id==='vlang'){ VOICE.lang=el.value; return; }
  if(['pgst','punit'].indexOf(el.name)>=0&&document.getElementById('pcalc')){ paintPCalc(); return; }
  if(!el.dataset) return;
  if(el.dataset.f&&el.dataset.line){ var lv=el.value, ll=el.dataset.line, lf=el.dataset.f;
    guard('edit:'+ll+lf,null,function(){ return editLineField(ll,lf,lv); }); }
  else if(el.dataset.f==='adv'&&el.dataset.bill){ var bv=el.value, bb=el.dataset.bill;
    guard('adv:'+bb,null,function(){ return setBillAdvance(bb,bv); }); }
});

document.addEventListener('keydown',function(e){

(async function boot(){
  await detectStore();
  render();
  if(MODE==='cloud'&&!Cloud.session) return;     /* the sign-in screen continues from here */
  if(MODE==='nodb') return;
  await bootData();
})();
var POLLING=false;
async function bootData(){
  S.bootErr='';
  try{ await bootLoad(); }
  catch(e){
    console.error(e);
    if(e&&e.auth){ render(); return; }
    if(e&&e.notMember){ Cloud.keep(null); S.cloudErr=e.message; render(); return; }
    S.bootErr=(e&&e.net)?'No internet, or the server is not answering.':(e&&e.message)||'Something went wrong starting up.';
    render(); return;
  }
  if(!POLLING){ POLLING=true; setInterval(chatPoll,5000); }
  render();
  if(MODE==='memory') toast(storeNote(),'bad');
}
async function bootLoad(){
  if(MODE==='cloud'){
    /* An outsider's reads come back empty rather than refused, which would
       look like a brand-new workshop. Ask the database directly. */
    if(await Cloud.rpc('is_member',{})!==true){
      var nm=new Error('That login is not allowed into this workshop. Ask the owner to add it (setup guide, step 2).');
      nm.notMember=true; throw nm;
    }
    /* everything shared, in one request */
    var want=Object.keys(SYNC_KEYS);
    want.forEach(function(k){ PREFETCH[k]=null; });
    (await Cloud.getMany(want)).forEach(function(r){ PREFETCH[r.key]=r.value; });
  }
  S.core=await DB.get('mz:core');
  if(!S.core){
    S.core=seedCore();
    if(!await DB.set('mz:core',S.core)) throw new Error('Could not set up the workshop on the server.');
  }
  if((S.core.seed||0)<3){          /* staff list and workshop details brought up to date */
    var fresh=seedCore();
    S.core.users=fresh.users;
    if(!S.core.workshop.gstin||S.core.workshop.gstin.indexOf('ABCDE')>=0) S.core.workshop=fresh.workshop;
    S.core.seed=3;
    await saveCore();
  }
  normaliseCore();
  /* bikes used to live inside the settings record; move them out once */
  var bikes=await DB.get('mz:bikes');
  var legacy=S.core.bikes&&Object.keys(S.core.bikes).length?S.core.bikes:null;
  S.core.bikes=Object.assign({},legacy||{},bikes||{});
  if(legacy){ if(!await DB.merge('mz:bikes',legacy)) throw new Error('Could not move the bike list.'); await saveCore(); }
  await loadIndex();
  await loadCounters();
  await loadStore();
  await loadPartyData();
  await loadExpenseData();
  await loadPayroll();
  await loadAppts();
  await loadReminded();
  S.core.users.forEach(function(u){ if(u.active!==false&&hasFloat(u.id)) ensureFloat(u.id); });
  if(!ACCOUNTS.length){ ACCOUNTS=seedAccounts(); await DB.set('mz:accounts',ACCOUNTS); }
  if(mergeSuppliers()) await DB.set('mz:parties',PARTIES);
  CHATMETA=await ChatStore.meta();
  if(MODE==='live') liveStartWatching();
  var last=await DB.getMine('mz:lastuser'); if(last&&coreUser(last).id) S.pickUser=last;
  if(S.user) await loadChatSeen();
}
