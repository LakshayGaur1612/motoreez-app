/* ---------- how full is the drawer ----------
   Each key has a hard ceiling of about 5MB. Everything is kept in a handful
   of big keys, so a workshop does not creep towards the limit — it arrives
   at it in one afternoon and the write simply stops working. Warn while
   there is still room to act, and say plainly what to do about it. */
var SIZE_LIMIT=5*1024*1024, SIZE_WARN=0.75, SIZED={}, SIZE_TOLD={};
function fmtKb(n){ return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB'; }
function keyLabel(k){
  return {'mz:index':'the job card list','mz:parts':'the parts list','mz:moves':'stock movements',
    'mz:parties':'customers and suppliers','mz:expenses':'spends','mz:payments':'payments',
    'mz:core':'workshop settings','mz:purchases':'purchase bills','mz:batches':'stock batches',
    'mz:attend':'attendance','mz:sales':'the sales record'}[k]||
    (k.indexOf('mz:chat:')===0?'this job\u2019s chat':(k.indexOf('mz:att:')===0?'a chat attachment':k));
}
function sizeWatch(k,n){
  SIZED[k]=n;
  if(n>SIZE_LIMIT*SIZE_WARN&&!SIZE_TOLD[k]){
    SIZE_TOLD[k]=true;
    toast('Storage for '+keyLabel(k)+' is '+Math.round(n/SIZE_LIMIT*100)+'% full ('+fmtKb(n)+
          '). Back up now and speak to whoever set this up.','bad');
  }
}
function sizeFail(k,n){
  toast('Could not save '+keyLabel(k)+' — the space for it is full at '+fmtKb(n)+
        '. Do not close this tab. Back up from Settings first.','bad');
}
/* the largest keys, for the settings screen */
function storageReport(){
  return Object.keys(SIZED).map(function(k){
    return {key:k, label:keyLabel(k), bytes:SIZED[k], pct:Math.round(SIZED[k]/SIZE_LIMIT*100)};
  }).sort(function(a,b){ return b.bytes-a.bytes; });
}
function storeNote(){
  if(MODE==='browser') return 'Saving in this browser only \u2014 other phones will not see these job cards.';
  if(MODE==='memory') return 'Nothing is being saved. Close this tab and the job cards are gone.';
  return '';
}
var DB={
  /* In the cloud a failed read throws instead of returning nothing, so a
     dropped signal can never look like an empty list and get saved over. */
  async get(k){
    if(MODE==='cloud'){
      var v;
      if(Object.prototype.hasOwnProperty.call(PREFETCH,k)){ v=PREFETCH[k]; delete PREFETCH[k]; }
      else v=await Cloud.get(k);
      LASTBODY[k]=(v===null||v===undefined)?undefined:JSON.stringify(v);
      return (v===undefined)?null:v;
    }
    if(MODE==='shared'){
      try{ var r=await window.storage.get(k,true); return r&&r.value?JSON.parse(r.value):null; }
      catch(e){ return (k in MEM)?MEM[k]:null; }
    }
    if(MODE==='browser'){
      try{ var v=LS.getItem(k); return v?JSON.parse(v):((k in MEM)?MEM[k]:null); }catch(e){ return (k in MEM)?MEM[k]:null; }
    }
    return (k in MEM)?MEM[k]:null;
  },
  async set(k,v){
    MEM[k]=v;
    var body=JSON.stringify(v);
    sizeWatch(k,body.length);
    if(MODE==='cloud'){
      /* nothing changed since this phone last read or wrote it: skip the upload */
      if(LASTBODY[k]===body) return true;
      try{ await Cloud.setRaw(Cloud.row(k,body)); LASTBODY[k]=body; return true; }
      catch(e){ STORE_OK=false; cloudFail(k,e); return false; }
    }
    if(MODE==='shared'){
      try{ var r=await window.storage.set(k,body,true); if(r===null||r===false) throw new Error('rejected'); return true; }
      catch(e){ STORE_OK=false; sizeFail(k,body.length); return false; }
    }
    if(MODE==='browser'){
      try{ LS.setItem(k,body); return true; }
      catch(e){ STORE_OK=false; sizeFail(k,body.length); return false; }
    }
    return true; /* memory: it is held for this session, which is all we promised */
  },
  async del(k){
    delete MEM[k]; delete LASTBODY[k];
    try{
      if(MODE==='cloud') await Cloud.del(k);
      else if(MODE==='browser') LS.removeItem(k);
      else if(MODE==='shared'){
        if(window.storage.delete) await window.storage.delete(k,true);
        else await window.storage.set(k,'null',true);
      }
    }catch(e){}
  },
  /* many keys at once: one request per ~1.5 MB in the cloud */
  async setMany(entries){
    if(MODE!=='cloud'){
      for(var i=0;i<entries.length;i++) if(!await this.set(entries[i][0],entries[i][1])) return false;
      return true;
    }
    var batch=[], size=0;
    try{
      for(var j=0;j<entries.length;j++){
        var b=JSON.stringify(entries[j][1]), row=Cloud.row(entries[j][0],b);
        if(size+row.length>1500000&&batch.length){ await Cloud.setRaw('['+batch.join(',')+']'); batch=[]; size=0; }
        batch.push(row); size+=row.length; LASTBODY[entries[j][0]]=b; MEM[entries[j][0]]=entries[j][1];
      }
      if(batch.length) await Cloud.setRaw('['+batch.join(',')+']');
      return true;
    }catch(e){ entries.forEach(function(x){ delete LASTBODY[x[0]]; }); cloudFail(entries[0][0],e); return false; }
  },
  /* add one item to a list; the server does it in one step in the cloud */
  async append(k,item){
    if(MODE==='cloud'){
      try{ var v=await Cloud.rpc('kv_append',{p_key:k,p_item:item}); LASTBODY[k]=JSON.stringify(v); return v; }
      catch(e){ cloudFail(k,e); return null; }
    }
    var list=await this.get(k)||[]; list.push(item);
    return (await this.set(k,list))?list:null;
  },
  /* merge a few named entries into an object without touching the rest */
  async merge(k,patch){
    if(MODE==='cloud'){
      try{ var v=await Cloud.rpc('kv_merge',{p_key:k,p_patch:patch}); LASTBODY[k]=JSON.stringify(v); return true; }
      catch(e){ cloudFail(k,e); return false; }
    }
    var o=await this.get(k)||{}; Object.assign(o,patch);
    return this.set(k,o);
  },
  async getMine(k){
    if(MODE==='cloud'){ try{ var cv=LS&&LS.getItem('my:'+k); return cv?JSON.parse(cv):null; }catch(e){ return null; } }
    if(MODE==='shared'){ try{ var r=await window.storage.get(k,false); return r&&r.value?JSON.parse(r.value):null; }catch(e){ return null; } }
    if(MODE==='browser'){ try{ var v=LS.getItem('my:'+k); return v?JSON.parse(v):null; }catch(e){ return null; } }
    return MEM['my:'+k]||null;
  },
  async setMine(k,v){
    MEM['my:'+k]=v;
    try{
      if(MODE==='cloud'){ if(LS) LS.setItem('my:'+k,JSON.stringify(v)); }
      else if(MODE==='shared') await window.storage.set(k,JSON.stringify(v),false);
      else if(MODE==='browser') LS.setItem('my:'+k,JSON.stringify(v));
    }catch(e){}
  }
};

/* GST maths, all in paise */
function splitTax(amount, rate, inclusive){
  if(!rate) return {base:amount, tax:0, total:amount};
  if(inclusive){
    var base=Math.round(amount*100/(100+rate));
    return {base:base, tax:amount-base, total:amount};
  }
  var tax=Math.round(amount*rate/100);
  return {base:amount, tax:tax, total:amount+tax};
}

/* Place of supply for a repair job is where the work was done, so it is the
   workshop's own state unless the customer's GSTIN says otherwise. */
function placeOfSupply(j,b){
  var W=S.core.workshop;
  if(j.direct){
    var sc=supplyStateCode(j);
    return sc+' \u2014 '+(STATE_BY_CODE[sc]||(sc===W.stateCode?W.state:'other state'));
  }
  var cs=custStateCode(j);
  if(b.inter&&cs) return cs+' \u2014 '+(STATE_BY_CODE[cs]||'other state');
  return W.stateCode+' \u2014 '+W.state;
}

/* Goods sold over the counter are supplied where the counter is. Goods
   sent out are supplied where they are delivered, so an online order to
   another state is IGST whatever the buyer's GSTIN says. */
function supplyStateCode(j){
  var W=S.core.workshop;
  if(j.direct) return (j.channel==='online'&&j.ship&&j.ship.stateCode)?j.ship.stateCode:W.stateCode;
  return custStateCode(j);

/* HSN-wise summary. Good practice on every invoice and required once
   turnover crosses the reporting threshold. */
function hsnSummary(rows,b){
  var m={};
  rows.forEach(function(r){
    var k=(r.line?r.line.hsn:r.hsn)||(((r.line?r.line.kind:r.kind)==='part')?'':'998714');
    k=k||'\u2014';
    m[k]=m[k]||{hsn:k,qty:0,base:0,tax:0,rate:r.rate};
    m[k].qty+=(r.line?r.line.qty:r.qty); m[k].base+=r.base; m[k].tax+=r.tax;
  });
  return Object.keys(m).map(function(k){ return m[k]; });
}
function billCalc(job,bill){
  /* A finalised bill answers from its snapshot, never from the live job. */
  var sn=bill.snapshot;
  if(sn&&sn.v>=2){
    var adv0=bill.advance||0;
    var paid0=(bill.payments||[]).reduce(function(a,p){return a+p.paise;},0);
    return {rows:sn.rows.map(function(r){ return {line:r, amount:r.amount, rate:r.rate,
              base:r.base, tax:r.tax, total:r.total}; }),
            sub:sn.sub, tax:sn.tax, gross:sn.gross, roundOff:sn.roundOff, grand:sn.grand,
            advance:adv0, paid:paid0, balance:sn.grand-adv0-paid0, byRate:sn.byRate, frozen:true};
  }
  var rows=[], sub=0, taxSum=0, gross=0, byRate={};
  (bill.lineIds||[]).forEach(function(id){
    var l=findLine(job,id); if(!l||l.void) return;
    var amt=lineAmount(l);
    var rate=(bill.type==='gst')?(l.gst||0):0;
    var t=splitTax(amt,rate,bill.incl!==false);
    rows.push({line:l, amount:amt, rate:rate, base:t.base, tax:t.tax, total:t.total});
    sub+=t.base; taxSum+=t.tax; gross+=t.total;
    if(bill.type==='gst'){
      byRate[rate]=byRate[rate]||{base:0,tax:0};
      byRate[rate].base+=t.base; byRate[rate].tax+=t.tax;
    }
  });
  var roundOff=0, grand=gross;
  if(bill.roundOff!==false){ grand=Math.round(gross/100)*100; roundOff=grand-gross; }
  var adv=bill.advance||0;
  var paid=(bill.payments||[]).reduce(function(a,p){return a+p.paise;},0);
  return {rows:rows, sub:sub, tax:taxSum, gross:gross, roundOff:roundOff, grand:grand,
          advance:adv, paid:paid, balance:grand-adv-paid, byRate:byRate};
}
/* Which bill a line belongs on. Labour is always taxable. A part follows
   the batch it was actually taken from \u2014 a filter from a no-GST supplier
   stays no-GST even after the same filter is later bought on a tax invoice. */
function lineNoGst(l){
  if(l.kind!=='part') return false;
  if(l.batchId){ for(var i=0;i<BATCHES.length;i++) if(BATCHES[i].id===l.batchId) return BATCHES[i].supplyType==='composition'; }
  return !!l.noGst;
}
function billSplit(job){
  var ub=unbilledApproved(job);
  return { tax:ub.filter(function(l){ return !lineNoGst(l); }), plain:ub.filter(lineNoGst) };
}
/* what this customer still owes on this job: before billing, against what
   they approved; once billed, against the bills */
/* before the customer approves, the estimate is everything on the card */
function estimateTotal(job){ return (job.approvals&&job.approvals.customer)?approvedTotal(job):sumLines(mainLines(job)); }
function jobDue(job){
  var paidAdv=(job.advance&&job.advance.paise)||0;
  var fin=(job.bills||[]).filter(function(b){ return b.status==='final'; });
  var billed=fin.reduce(function(a,b){ return a+billCalc(job,b).grand; },0);
  var paid=fin.reduce(function(a,b){ return a+(b.payments||[]).reduce(function(x,p){ return x+p.paise; },0); },0);
  var due=(billed||estimateTotal(job))+(fin.length?sumLines(unbilledApproved(job)):0);
  /* money received through the customer's account and set against a bill */
  var viaAcct=(typeof allocatedTo==='function')?fin.reduce(function(a,b){ return a+allocatedTo(b.id); },0):0;
  return due-paidAdv-paid-viaAcct;
}
function liveBills(job){ return (job.bills||[]).filter(function(b){return b.status!=='cancelled';}); }
function advanceUsed(job,exceptId){
  return liveBills(job).reduce(function(a,b){ return a+((b.id===exceptId)?0:(b.advance||0)); },0);
}
function advanceLeft(job,exceptId){ return ((job.advance&&job.advance.paise)||0)-advanceUsed(job,exceptId); }
function billedLineIds(job){
  var s={}; liveBills(job).forEach(function(b){ (b.lineIds||[]).forEach(function(id){ s[id]=b.id; }); }); return s;
}
function unbilledApproved(job){
  var m=billedLineIds(job);

function jobBalance(job){
  var t=0; liveBills(job).forEach(function(b){ if(b.status==='final') t+=billCalc(job,b).balance; }); return t;

/* gap-free numbering: a number is handed out only at the moment a bill is finalised,
   it is written to the counter before it is used, and it is never handed out twice. */
async function allocNumber(series){
  if(MODE==='cloud'){
    /* the database hands out the number; two phones can never share one */
    var cfy=fyOf();
    S.core.counters[series]=S.core.counters[series]||{};
    var floor=S.core.counters[series][cfy]||0;
    var cn=parseInt(await Cloud.rpc('next_number',{p_series:series,p_fy:cfy,p_floor:floor}),10);
    if(!cn) throw new Error('Could not reserve a number. Nothing was saved \u2014 try again.');
    S.core.counters[series][cfy]=cn;
    var cmid={job:'JC',gst:'GST',nongst:'BILL',cn:'CN',dn:'DN'}[series];
    var cnum=(S.core.workshop.prefix||'MTZ')+'/'+cmid+'/'+cfy+'/'+String(cn).padStart(4,'0');
    /* every number ever handed out, kept so any gap can be explained */
    await DB.append('mz:issued',{series:series,fy:cfy,n:cn,number:cnum,at:Date.now(),by:S.user.id,
      job:S.job?S.job.no:''});
    return cnum;
  }
  /* The counter is re-read from storage rather than trusted from memory,
     because two devices numbering an invoice at the same moment is the one
     race that produces a duplicate GST number. This narrows the window; it
     does not close it. Only a database sequence can do that.

     What is deliberately NOT taken from that fresh read is the rest of the
     settings. Replacing S.core wholesale used to throw away anything the
     owner had changed but not yet saved — a UPI ID typed into Settings
     would vanish the moment a cashier finalised a bill. Only the counters
     and the issued register come across. */
  var fresh=await DB.get('mz:core');
  var fy=fyOf();
  var counters=(fresh&&fresh.counters)||S.core.counters||{job:{},gst:{},nongst:{},cn:{},dn:{}};
  var issued=(fresh&&fresh.issued)||S.core.issued||[];
  counters[series]=counters[series]||{};
  /* if memory has run ahead of storage, keep the higher of the two so a
     number can never be handed out twice */
  var mine=(S.core.counters&&S.core.counters[series]&&S.core.counters[series][fy])||0;
  var n=Math.max(counters[series][fy]||0,mine)+1;
  counters[series][fy]=n;
  var mid={job:'JC',gst:'GST',nongst:'BILL',cn:'CN',dn:'DN'}[series];
  var num=(S.core.workshop.prefix||'MTZ')+'/'+mid+'/'+fy+'/'+String(n).padStart(4,'0');
  issued.push({series:series,fy:fy,n:n,number:num,at:Date.now(),by:S.user.id});
  S.core.counters=counters; S.core.issued=issued;
  var ok=await DB.set('mz:core',S.core);
  if(!ok){
    /* give the number back rather than leave a hole in the series */
    counters[series][fy]=n-1; issued.pop();
    throw new Error('Could not reserve a number. Nothing was saved — try again.');
  }
  return num;
}

var VIEW_PERM={ invoice:'see.money', sale:'sale.new', sales:'reports', purch:'parts', exports:'export', rep:'reports', desk:'parts', purchase:'parts', part:'parts',

/* Views return their primary actions in a plain container; the shell is what
   decides where the bottom of the screen goes. Nothing else may position
   itself there. */
/* Buttons are matched on what they do and what they say, so two routes to
   the same action collapse into one. */
function dedupeActions(html){
  if(!html) return html;
  var seen={}, out='';
  var re=/<button[^>]*>[\s\S]*?<\/button>/g, m;
  var rest=html.replace(re,'');
  while((m=re.exec(html))!==null){
    var b=m[0];
    var act=(b.match(/data-act="([^"]*)"/)||[])[1]||'';
    var txt=b.replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
    var key=act+'|'+txt;
    if(seen[key]) continue;
    seen[key]=1; out+=b;
  }
  return out+(rest.trim()?rest:'');
}
function dock(actionsHtml,navHtml){
  if(!actionsHtml&&!navHtml) return '';
  return '<div class="dock" id="dock">'+
    (actionsHtml?'<div class="dock-actions">'+actionsHtml+'</div>':'')+
    (navHtml||'')+'</div>';
}
/* The dock overlays the page, so the page has to know how tall it is. */
var _dockTimer=null;
window.addEventListener('resize',function(){ clearTimeout(_dockTimer); _dockTimer=setTimeout(measureDock,120); });
window.addEventListener('orientationchange',function(){ setTimeout(measureDock,220); });
function measureDock(){
  var d=document.getElementById('dock');
  if(!d){ document.documentElement.style.setProperty('--dockh','0px'); return; }
  var h=Math.round(d.getBoundingClientRect().height);
  /* If measurement fails — a browser that has not laid out yet, or an engine
     that returns nothing — fall back to a height tall enough to clear the
     dock rather than let the last row of content sit underneath it. */
  if(!h||h<48) h=(d.querySelector('.dock-nav')?(d.querySelector('.dock-actions')?132:66):66);
  document.documentElement.style.setProperty('--dockh',h+'px');
}

function matchFilter(e,k){
  if(k==='active') return e.stage!=='closed';
  if(k==='price')  return e.stage==='work_listed'||e.stage==='priced';
  if(k==='appr')   return e.stage==='owner_ok'||!!e.hold;
  if(k==='hold')   return !!e.hold;
  if(k==='tba')    return e.stage!=='closed'&&!e.mechanicId;
  if(k==='bill')   return e.stage==='work_done'||(e.stage==='billed'&&e.balance>0);
  return true;

function filterJobs(){
  var q=regKey(S.q), qt=S.q.trim().toLowerCase();
  var list=S.index.slice();
  if(!can('see.all')) list=list.filter(function(e){ return e.mechanicId===S.user.id; });
  if(qt){
    list=list.filter(function(e){
      return (q && regKey(e.reg).indexOf(q)>=0) ||
        (e.name||'').toLowerCase().indexOf(qt)>=0 ||
        (seePhone() && (e.phone||'').indexOf(qt)>=0) ||
        (e.no||'').toLowerCase().indexOf(qt)>=0 ||
        (e.model||'').toLowerCase().indexOf(qt)>=0;
    });
  } else {
    list=list.filter(function(e){ return matchFilter(e,S.filter); });
  }
  if(S.jobSort==='age'){
    /* oldest intake first, and anything stopped floats to the top of that —
       this is the order you walk the workshop floor in */
    list.sort(function(a,b){
      if(!!a.hold!==!!b.hold) return a.hold?-1:1;
      return (a.createdAt||0)-(b.createdAt||0);
    });
  } else {
    list.sort(function(a,b){ return (b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt); });
  }
  return list;
}

    h+='<div class="empty"><b>'+(S.q?'Nothing matches that.':'No job cards here yet.')+'</b>'+
       (S.q?'Check the registration number, or clear the search.':'Take in a bike to start one.')+'</div>';
  }
  var cap=S.boardShow||60;
  list.slice(0,cap).forEach(function(e){ h+=jobRow(e); });
  if(list.length>cap)
    h+='<button class="btn" style="width:100%;margin:10px 0" data-act="moreJobs">'+
       'Show more \u00B7 '+(list.length-cap)+' further job card'+((list.length-cap)>1?'s':'')+'</button>';
  return h;
}
/* ---------- how long has this bike been standing here ----------
   A bike nobody has touched for a week is the most expensive thing in a
   workshop: it occupies a bay, the customer is losing patience, and no
   single screen used to show it. Counted from intake, stopped at handover. */
function dwellDays(e){
  if(!e.createdAt) return 0;
  var end=(e.stage==='closed')?(e.updatedAt||Date.now()):Date.now();
  return Math.floor((end-e.createdAt)/86400000);
}
function dwellBadge(e){
  if(e.stage==='closed') return '';
  var d=dwellDays(e);
  if(d<1) return '<span class="dwell" title="Taken in today">today</span>';
  var cls=d>=7?' bad':(d>=3?' warn':'');
  return '<span class="dwell'+cls+'" title="'+d+' day'+(d>1?'s':'')+' in the workshop">'+
         d+'d</span>';
}
function jobRow(e){
  var late=e.expected && e.stage!=='closed' && new Date(e.expected+'T23:59:59').getTime()<Date.now();
  var h='<button class="jobrow" data-act="openJob" data-id="'+e.id+'">';
  if(e.hold) h+='<div class="hazard" style="margin:-12px -12px 10px;border-radius:3px 3px 0 0"></div>';
  h+='<div class="l1"><span class="plate sm">'+esc(regShow(e.reg))+'</span>'+
     '<span class="tag '+(e.hold?'t-red':'t-grey')+'">'+(e.hold?'Work stopped':esc((function(){ var ts=splitTypes(e.jobType); return ts.length?titleCase(ts[0])+(ts.length>1?' +'+(ts.length-1):''):'Job'; })()))+'</span>'+
     dwellBadge(e)+chatBadge(e.id)+
     '<span style="margin-left:auto" class="jid">'+esc(e.no||'')+'</span></div>';
  h+='<div class="l2"><b>'+esc(e.make)+' '+esc(e.model)+'</b>'+
     (e.cc?'<span class="muted small">'+esc(ccLabel(e.cc))+'</span>':'')+
     (can('see.all')?'<span class="muted">· '+esc(e.name)+'</span>':'')+'</div>';
  h+='<div class="l2">'+stageTag(e)+
     (e.mechanicId?'<span class="small muted">'+esc(coreUser(e.mechanicId).name)+'</span>':'<span class="tag t-amber">To be allocated</span>')+
     finBoardTag(e)+
     (e.expected?'<span class="small '+(late?'':'muted')+'" style="'+(late?'color:var(--red);font-weight:800':'')+'">Due '+dOnly(new Date(e.expected).getTime())+(late?' · late':'')+'</span>':'')+
     (seeMoney()&&e.balance>0?'<span class="money" style="margin-left:auto;color:var(--red)">'+money(e.balance)+' due</span>':'')+
     '</div></button>';
  return h;
}

function allMakes(){ var o=[]; BIKE_GROUPS.forEach(function(g){ o=o.concat(g[1]); }); return o; }
function modelsFor(make){
  var s=BIKES[make]; if(!s) return [];
  return s.split(',').map(function(x){ var p=x.split('|'); return {n:p[0],cc:p[1]||''}; });
}
function ccFor(make,model){
  var m=modelsFor(make).filter(function(x){ return x.n===model; })[0];
  if(!m) return '';
  return m.cc==='e'?'Electric':m.cc;
}
function ccLabel(cc){
  if(!cc) return '';
  return /^[0-9]+$/.test(String(cc).trim())?(cc+'cc'):cc;
}
/* what this workshop actually sees most — floats to the top of the list */
function oftenMakes(){
  var c={}; S.index.forEach(function(e){ if(e.make) c[e.make]=(c[e.make]||0)+1; });
  return Object.keys(c).sort(function(a,b){ return c[b]-c[a]; }).slice(0,6);
}
function oftenModels(make){
  var c={}; S.index.forEach(function(e){ if(e.make===make&&e.model) c[e.model]=(c[e.model]||0)+1; });
  return Object.keys(c).sort(function(a,b){ return c[b]-c[a]; }).slice(0,5);
}

function modelOptions(make,sel){

}

function paintVoice(){
  var el=document.getElementById('voicebox'); if(!el) return;

    if(VOICE.blob){
      h+='<div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
         '<span class="tag t-green">Voice kept \u00B7 '+vTime(VOICE.ms)+'</span>'+
         '<audio controls src="'+VOICE.url+'" style="flex:1;min-width:200px;height:44px"></audio>'+
         '<button class="btn sm danger" data-act="voiceDrop">Delete</button></div>';
      if(!VOICE.gotText) h+='<div class="hint" style="margin-top:8px">No words came through, but the recording is saved. Type what they said \u2014 the technician can play it back.</div>';
    }
    if(!VOICE.blob&&VOICE.gotText) h+='<div class="hint" style="margin-top:8px">Words captured. Read it back to the customer before you save.</div>';
  }

function voiceTarget(){ return document.querySelector('[name="complaint"]'); }

async function voiceStart(){
  var ta=voiceTarget(); if(!ta) return;
  VOICE.err=''; VOICE.stopping=false; VOICE.base=ta.value.trim(); VOICE.chunks=[];
  if(VOICE.url){ try{ URL.revokeObjectURL(VOICE.url); }catch(e){} VOICE.url=null; VOICE.blob=null; }

  if(VOICE.mic){
    try{
      VOICE.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
      var mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].filter(function(m){
        try{ return MediaRecorder.isTypeSupported(m); }catch(e){ return false; } })[0];
      VOICE.mr=new MediaRecorder(VOICE.stream, mime?{mimeType:mime,audioBitsPerSecond:32000}:undefined);
      VOICE.mr.ondataavailable=function(ev){ if(ev.data&&ev.data.size) VOICE.chunks.push(ev.data); };
      VOICE.mr.onstop=function(){
        if(VOICE.chunks.length){
          VOICE.blob=new Blob(VOICE.chunks,{type:VOICE.mr.mimeType||'audio/webm'});
          VOICE.url=URL.createObjectURL(VOICE.blob);
        }
        paintVoice();
      };
      VOICE.mr.start();
    }catch(err){
      var denied=(err&&(err.name==='NotAllowedError'||err.name==='SecurityError'));
      VOICE.err=denied
        ? 'The microphone is blocked. Allow it for this page, or open the app in its own browser tab.'
        : 'Could not reach the microphone. Type what the customer said instead.';
      VOICE.mr=null; VOICE.stream=null; VOICE.on=false;
      paintVoice(); toast(VOICE.err,'bad');
      /* speech to text needs the same permission, so there is no point carrying on */
      return;
    }
  }

  if(VOICE.text){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    var r=new SR();
    r.lang=VOICE.lang; r.continuous=true; r.interimResults=true; r.maxAlternatives=1;
    r.onresult=function(ev){
      var fin='', mid='';
      for(var i=ev.resultIndex;i<ev.results.length;i++){
        var t=ev.results[i][0].transcript;
        if(ev.results[i].isFinal) fin+=t; else mid+=t;
      }
      if(fin.trim()){
        VOICE.gotText=true;
        VOICE.base=(VOICE.base?VOICE.base.replace(/\s+$/,'')+' ':'')+fin.trim();
      }
      var ta2=voiceTarget();
      if(ta2){ ta2.value=(VOICE.base+(mid.trim()?(VOICE.base?' ':'')+mid.trim():'')).toUpperCase(); ta2.scrollTop=ta2.scrollHeight; }
      var iv=document.getElementById('vinterim');
      if(iv) iv.textContent=mid.trim()||'Listening \u2014 speak normally';
    };
    r.onerror=function(ev){
      if(ev.error==='not-allowed'||ev.error==='service-not-allowed')
        VOICE.err='Speech to text is blocked here. The audio is still being recorded.';
      else if(ev.error==='no-speech') VOICE.err='';
    };
    r.onend=function(){ if(VOICE.on&&!VOICE.stopping){ try{ r.start(); }catch(e){} } };
    VOICE.rec=r;
    try{ r.start(); }catch(e){}
  }

  VOICE.on=true; VOICE.startedAt=Date.now();
  VOICE.timer=setInterval(function(){
    var ms=Date.now()-VOICE.startedAt;
    var t=document.getElementById('vtime'); if(t) t.textContent=vTime(ms);
    if(ms>MAXREC){ voiceStop(); toast('Stopped at two minutes','bad'); }
  },300);
  paintVoice();
}
function voiceStop(){
  VOICE.stopping=true; VOICE.on=false;
  VOICE.ms=Date.now()-VOICE.startedAt;
  clearInterval(VOICE.timer); VOICE.timer=null;
  if(VOICE.rec){ try{ VOICE.rec.stop(); }catch(e){} VOICE.rec=null; }
  if(VOICE.mr&&VOICE.mr.state!=='inactive'){ try{ VOICE.mr.stop(); }catch(e){} }
  if(VOICE.stream){ VOICE.stream.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} }); VOICE.stream=null; }
  var ta=voiceTarget(); if(ta) VOICE.base=ta.value.trim();
  paintVoice();
}
function voiceDrop(){
  if(VOICE.url){ try{ URL.revokeObjectURL(VOICE.url); }catch(e){} }
  VOICE.blob=null; VOICE.url=null; VOICE.ms=0; paintVoice(); toast('Recording deleted');
}
function blobB64(b){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){ res(String(r.result).split(',')[1]||''); };
    r.onerror=function(){ rej(new Error('read failed')); };
    r.readAsDataURL(b);
  });
}
/* keep the audio under its own key so the job card itself stays small */
async function saveVoice(job){
  if(!VOICE.blob) return;
  try{
    var b64=await blobB64(VOICE.blob);
    var cap=(MODE==='browser')?700000:4200000; /* this browser's own store is small — protect the job cards */
    if(b64.length>cap){ toast('The recording is too long to keep here. The typed words have been saved.','bad'); return; }
    var ok=await DB.set('mz:audio:'+job.id,{mime:VOICE.blob.type,ms:VOICE.ms,at:Date.now(),
      by:S.user.id,byName:S.user.name,lang:VOICE.lang,data:b64});
    if(!ok){ toast('The recording could not be kept. The typed words have been saved.','bad'); return; }
    job.voice={ms:VOICE.ms,at:Date.now(),by:S.user.id,lang:VOICE.lang,bytes:VOICE.blob.size};
    var ln=VLANGS.filter(function(l){ return l[0]===VOICE.lang; })[0];
    logIt(job,'Customer recorded',vTime(VOICE.ms)+' of audio kept with the job card'+(ln?' \u00B7 '+ln[1]:''));
  }catch(e){
    toast('The recording could not be kept. The typed words have been saved.','bad');
  }
}
async function playVoice(){

  box.innerHTML='<div class="small muted" style="margin-top:8px">Loading the recording\u2026</div>';

var JOBTYPES=Object.keys(TYPE_WORK);
var JOBREQ=[]; JOBTYPES.forEach(function(t){ TYPE_WORK[t].forEach(function(w){ if(JOBREQ.indexOf(w)<0) JOBREQ.push(w); }); });

/* Old job cards say "Periodic Service". Read them through these so nothing
   written before the lists changed comes up blank. */
function upType(v){
  var u=String(v||'').toUpperCase().trim();
  if(u==='PERIODIC SERVICE') return 'PERIODIC MAINTENANCE';
  if(u==='TYRES AND ALIGNMENT') return 'TYRES & WHEELS';
  return u;
}
function upReq(v){ return String(v||'').toUpperCase().trim(); }
/* A bike can come in for more than one reason. Reasons are stored as a
   list and also joined into one line ("A + B") for screens that show text. */
function splitTypes(v){
  if(Array.isArray(v)) return v.map(upType).filter(Boolean);
  return String(v||'').split(/\s*\+\s*(?=[A-Z])/).map(upType).filter(Boolean);
}
function jobTypesOf(j){ return (j&&j.jobTypes&&j.jobTypes.length)?j.jobTypes.map(upType):splitTypes(j&&j.jobType); }
function typeMatches(stored,want){ return !want||splitTypes(stored).indexOf(upType(want))>=0; }
function usualWork(type){
  var out=[];
  splitTypes(type).forEach(function(t){
    (TYPE_WORK[t]||[]).forEach(function(w){ if(out.indexOf(w)<0) out.push(w); });
  });
  return out;
}
/* if nobody chose a type, work out which one the ticked jobs point at */
function impliedType(required){
  var have=(required||[]).map(upReq);
  if(!have.length) return '';
  var best='', score=0;
  JOBTYPES.forEach(function(t){
    var n=usualWork(t).filter(function(x){ return have.indexOf(x)>=0; }).length;
    if(n>score){ score=n; best=t; }
  });
  return score?best:'';
}
/* Job required is the scope of work only. It is never priced and never billed.
   Spares and labour are separate lines, issued from the price list.            */
function jobTypeTiles(sel){
  var cur=splitTypes(sel);
  return '<div class="tiles" id="jobtypes">'+JOBTYPES.map(function(t){
    return '<button type="button" class="tile" data-act="jobtype" data-v="'+esc(t)+'" aria-pressed="'+(cur.indexOf(t)>=0)+'">'+
      '<span class="box">\u2713</span><span>'+esc(titleCase(t))+'</span></button>'; }).join('')+'</div>';
}
function pickedTypes(){
  var out=[]; document.querySelectorAll('#jobtypes [aria-pressed="true"]').forEach(function(b){ out.push(b.dataset.v); });
  return out;
}
/* The work list, ordered by the reason the bike came in. What is usually
   done for that reason sits on top; the rest is behind one tap. */
function jobReqTiles(on,act,type){
  var have=(on||[]).map(upReq);
  var picked=splitTypes(type).filter(function(t){ return TYPE_WORK[t]; });
  function tile(t){
    return '<button type="button" class="tile" data-act="'+act+'" data-v="'+esc(t)+'" aria-pressed="'+
      (have.indexOf(t)>=0)+'"><span class="box">\u2713</span><span>'+esc(titleCase(t))+'</span></button>';
  }
  function group(t,list){
    return '<div class="eyebrow" style="margin:12px 0 6px">'+esc(titleCase(t))+'</div><div class="tiles">'+list.map(tile).join('')+'</div>';
  }
  var shown=[], h='<div id="jobreq">';
  if(!picked.length) h+='<div class="small muted" style="padding:6px 0">Tick why it came in to see the jobs.</div>';
  picked.forEach(function(t){
    var list=TYPE_WORK[t].filter(function(w){ return shown.indexOf(w)<0; });
    if(!list.length) return;
    list.forEach(function(w){ shown.push(w); });
    h+=group(t,list);
  });
  /* anything already ticked that sits outside the ticked reasons \u2014 an older card, say \u2014 is still shown */
  var also=have.filter(function(w){ return shown.indexOf(w)<0; });
  if(also.length) h+=group(JOBREQ.some(function(w){ return also.indexOf(w)>=0; })?'Also ticked':'From before the lists changed',also);
  return h+'</div>';
}

/* ---------- the half-finished intake form ----------
   Taking a bike in is the longest form in the app and it is filled in
   standing at the shutter with a customer talking. A dropped call, a
   locked screen or an accidental back gesture used to empty it. The
   answers are kept on this device as they are typed and cleared the
   moment the job card is saved. Voice is not kept: it is large, and a
   recording nobody has heard is not worth restoring silently. */
var DRAFTKEY='mz:intakedraft';
var DRAFT_FIELDS=['reg','platetype','platecountry','makeother','modelother','odo','cname','cphone','cphone_cc','cgstin','caddr',
  'complaint','expected','advance','damageother','itemother'];
function draftSnapshot(){
  var o={at:Date.now(), f:{}, tiles:{}};
  DRAFT_FIELDS.forEach(function(n){
    var el=document.querySelector('#intakeform [name="'+n+'"]');
    if(el&&el.value) o.f[n]=el.value;
  });
  ['make','model','cc','fuel'].forEach(function(n){
    var el=document.querySelector('#intakeform [name="'+n+'"]');
    if(el&&el.value) o.f[n]=el.value;
  });
  document.querySelectorAll('#intakeform [aria-pressed="true"][data-act]').forEach(function(b){
    var k=b.dataset.act+':'+(b.dataset.v||b.textContent.trim());
    o.tiles[k]=1;
  });
  return o;
}
function saveDraft(){
  try{
    var s=draftSnapshot();
    if(!Object.keys(s.f).length&&!Object.keys(s.tiles).length){ clearDraft(); return; }
    window.localStorage.setItem(DRAFTKEY,JSON.stringify(s));
  }catch(e){}
}
function readDraft(){
  try{
    var v=window.localStorage.getItem(DRAFTKEY); if(!v) return null;
    var o=JSON.parse(v);
    /* a draft older than a day is somebody else's abandoned attempt */
    if(!o||!o.at||Date.now()-o.at>86400000){ clearDraft(); return null; }
    return o;
  }catch(e){ return null; }
}
function clearDraft(){ try{ window.localStorage.removeItem(DRAFTKEY); }catch(e){} }
function applyDraft(){
  var o=readDraft(); if(!o) return;
  Object.keys(o.f).forEach(function(n){
    var el=document.querySelector('#intakeform [name="'+n+'"]');
    if(el&&(!el.value||el.tagName==='SELECT'||el.type==='hidden')) el.value=o.f[n];
  });
  if(o.f.platetype) paintPlate(o.f.platetype);
  if(o.f.make){ onMakeChange(true); if(o.f.model){
    var md=document.querySelector('#intakeform [name="model"]'); if(md) md.value=o.f.model; onModelChange(); } }
  document.querySelectorAll('#intakeform [aria-pressed][data-act]').forEach(function(b){
    var k=b.dataset.act+':'+(b.dataset.v||b.textContent.trim());
    if(o.tiles[k]) b.setAttribute('aria-pressed','true');
  });
  paintOdo();
  if(document.getElementById('jobtypes')) reorderReq(pickedTypes());
  toast('Picked up where you left off','good');
}

var PLATE_TYPES=[['in','Indian'],['bh','BH series'],['temp','Temporary'],['foreign','Foreign'],['none','No plate yet']];

  if(t==='bh'&&!/^\d{2}BH\d{4}[A-Z]{1,2}$/.test(k)) return 'a BH number looks like 22 BH 1234 AB';

/* =====================================================================
   WALK-ROUND PHOTOS AND VIDEO
   Four sides and one walk-round video are required before a job card can
   exist; close-ups are optional. A video is tens of megabytes, far past the
   few megabytes the rest of the app lives in, so media goes into the
   browser's own file store (IndexedDB), which holds hundreds of megabytes.
   On the shared server the files are uploaded to Supabase Storage when the
   job card is created, and every other phone fetches them from there.
   While the form is being filled the files sit under "draft:" keys, so a
   slow upload or an accidental back gesture loses nothing.
   ===================================================================== */
var MEDIA_SIDES=[['front','Front'],['rear','Rear'],['left','Left side'],['right','Right side']];
var MEDIA_DRAFT={};          /* slot -> {url,size,type} for what is on screen */
var MEDIA_MAX_VIDEO=150*1024*1024;
var IDB=null;
function idb(){
  if(IDB) return IDB;
  IDB=new Promise(function(res,rej){
    if(!window.indexedDB){ rej(new Error('no file store')); return; }
    var r=indexedDB.open('motoreez-media',1);
    r.onupgradeneeded=function(){ r.result.createObjectStore('files'); };
    r.onsuccess=function(){ res(r.result); };
    r.onerror=function(){ rej(r.error); };
  });
  return IDB;
}
function idbDo(mode,fn){
  return idb().then(function(db){ return new Promise(function(res,rej){
    var tx=db.transaction('files',mode), st=tx.objectStore('files'), out;
    var q=fn(st); if(q) q.onsuccess=function(){ out=q.result; };
    tx.oncomplete=function(){ res(out); }; tx.onerror=function(){ rej(tx.error); }; tx.onabort=function(){ rej(tx.error); };
  }); });
}
var MEDIA={
  put:function(k,v){ return idbDo('readwrite',function(s){ return s.put(v,k); }); },
  get:function(k){ return idbDo('readonly',function(s){ return s.get(k); }); },
  del:function(k){ return idbDo('readwrite',function(s){ return s.delete(k); }); },
  keys:function(prefix){ return idbDo('readonly',function(s){
    return s.getAllKeys(IDBKeyRange.bound(prefix,prefix+'\uffff')); }); }
};
function mediaSlots(){
  var extras=Object.keys(MEDIA_DRAFT).filter(function(k){ return k.indexOf('extra')===0; }).sort();
  return {extras:extras};
}
function paintOdo(){
  var bad=tilePressed('meterbad'), o=document.querySelector('#intakeform [name="odo"]'), l=document.getElementById('odolabel');
  if(o){ o.disabled=bad; if(bad) o.value=''; o.placeholder=bad?'Not working':'18420'; }
  if(l) l.className=bad?'':'req';
}
function tilePressed(v){ var b=document.querySelector('#intakeform [data-act="tog"][data-v="'+v+'"]'); return !!(b&&b.getAttribute('aria-pressed')==='true'); }
function intakeMediaMissing(){
  var miss=[];
  MEDIA_SIDES.forEach(function(s){ if(!MEDIA_DRAFT[s[0]]) miss.push(s[1].toLowerCase()); });
  if(!MEDIA_DRAFT.video) miss.push('video');
  return miss;
}
function mediaTile(k,label,kind){
  var m=MEDIA_DRAFT[k];
  if(m){
    return '<div class="mslot done"><button type="button" class="mthumb" data-act="mediaView" data-k="'+k+'">'+
      (kind==='video'
        ? '<span class="mvid">\u25B6</span><span class="mlbl">'+esc(label)+' \u00B7 '+fmtKb(m.size)+'</span>'
        : '<img src="'+m.url+'" alt=""><span class="mlbl">'+esc(label)+'</span>')+
      '</button><button type="button" class="mx" data-act="mediaDrop" data-k="'+k+'" aria-label="Remove">\u00D7</button></div>';
  }
  return '<button type="button" class="mslot" data-act="mediaShot" data-k="'+k+'">'+
    '<span class="mplus">'+(kind==='video'?'\u25B6':'+')+'</span><span class="mlbl">'+esc(label)+'</span></button>';
}
function mediaGrid(){
  var h='<div class="mgrid">';
  MEDIA_SIDES.forEach(function(s){ h+=mediaTile(s[0],s[1],'photo'); });
  h+=mediaTile('video','Walk-round video','video');
  h+='</div>';
  var ex=mediaSlots().extras;
  h+='<div class="eyebrow" style="margin:14px 0 8px">Close-ups \u00B7 optional</div><div class="mgrid">';
  ex.forEach(function(k,i){ h+=mediaTile(k,'Close-up '+(i+1),'photo'); });
  h+='<button type="button" class="mslot" data-act="mediaShot" data-k="extra"><span class="mplus">+</span>'+
     '<span class="mlbl">Add a close-up</span></button></div>';
  var miss=intakeMediaMissing();
  h+='<div class="small" style="margin-top:10px;font-weight:700;color:'+(miss.length?'var(--red)':'var(--green)')+'">'+
     (miss.length?'Still needed: '+esc(miss.join(', ')):'All required photos and the video are in.')+'</div>';
  return h;
}
function paintMedia(){ var g=document.getElementById('mediagrid'); if(g) g.innerHTML=mediaGrid(); }
function dataUrlToBlob(u){
  var p=u.split(','), mime=(p[0].match(/:(.*?);/)||[])[1]||'image/jpeg';
  var bin=atob(p[1]), n=bin.length, arr=new Uint8Array(n);
  while(n--) arr[n]=bin.charCodeAt(n);
  return new Blob([arr],{type:mime});
}
function mediaCapture(k){
  var video=(k==='video');
  var inp=document.createElement('input');
  inp.type='file'; inp.accept=video?'video/*':'image/*'; inp.setAttribute('capture','environment');
  inp.onchange=async function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    try{
      var blob=f;
      if(!video){ blob=dataUrlToBlob(await shrinkImage(f,1400,0.72)); }
      else if(f.size>MEDIA_MAX_VIDEO){ toast('That video is '+fmtKb(f.size)+'. Keep it under 150 MB \u2014 30 to 60 seconds is plenty.','bad'); return; }
      var slot=k;
      if(k==='extra'){ var n=1; while(MEDIA_DRAFT['extra'+String(n).padStart(2,'0')]) n++; slot='extra'+String(n).padStart(2,'0'); }
      await MEDIA.put('draft:'+slot,{blob:blob,type:blob.type||(video?'video/mp4':'image/jpeg'),size:blob.size,at:Date.now(),by:S.user.id});
      MEDIA_DRAFT[slot]={url:await mediaUrl(blob),size:blob.size,type:blob.type,blob:blob};
      paintMedia();
      var bad=document.getElementById('mediaslots'); if(bad) bad.classList.remove('bad');
    }catch(e){ toast('Could not keep that '+(video?'video':'photo')+'. Try again.','bad'); }
  };
  inp.click();
}
async function mediaDrop(k){
  try{ await MEDIA.del('draft:'+k); }catch(e){}
  delete MEDIA_DRAFT[k]; paintMedia();
}
/* Photos are shown from their data rather than a blob: link, because a
   page opened straight from a folder on the computer is not allowed to
   show blob: links. A video only becomes data when someone presses play. */
function blobToDataUrl(b){
  return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ res(r.result); };
    r.onerror=function(){ rej(r.error); }; r.readAsDataURL(b); });
}
async function mediaUrl(b){ return (b.type||'').indexOf('video')===0?'':blobToDataUrl(b); }
async function showMedia(blob,type){

/* ---------- the server copy ----------
   Each phone fetches a job's photos the first time it opens that card and
   keeps them in its own file store after that. Videos are fetched only when
   someone presses play: they are big, and most people never need them. */
function mediaFile(j,slot){ return ((j&&j.media&&j.media.files)||[]).filter(function(f){ return f.slot===slot; })[0]||null; }
var MEDIA_FETCHING={};
async function fetchMediaFile(j,f){
  var key='job:'+j.id+':'+f.slot;
  if(MEDIA_FETCHING[key]) return MEDIA_FETCHING[key];
  MEDIA_FETCHING[key]=(async function(){
    try{
      var blob=await Cloud.getFile(f.path);
      var rec={blob:blob,type:f.type||blob.type,size:f.size||blob.size,at:Date.now()};
      try{ await MEDIA.put(key,rec); }catch(e){}
      return rec;
    }finally{ delete MEDIA_FETCHING[key]; }
  })();
  return MEDIA_FETCHING[key];
}
async function fetchJobMedia(j,withVideo){
  var have=await MEDIA.keys('job:'+j.id+':');
  var want=((j.media&&j.media.files)||[]).filter(function(f){
    return (withVideo||f.slot!=='video')&&have.indexOf('job:'+j.id+':'+f.slot)<0; });
  for(var i=0;i<want.length;i++){ try{ await fetchMediaFile(j,want[i]); }catch(e){} }
}

/* the draft files become the job card's own */
async function commitIntakeMedia(j){
  try{
    var keys=await MEDIA.keys('draft:'), list={sides:[],video:null,extras:0,bytes:0}, files=[];
    /* on the server first, so every phone sees them; nothing is created if this fails */
    if(MODE==='cloud'){
      for(var u=0;u<keys.length;u++){
        var us=keys[u].slice(6), ur=await MEDIA.get(keys[u]); if(!ur||!ur.blob) continue;
        toast('Uploading '+(us==='video'?'the video ('+fmtKb(ur.size||0)+')':'photo '+(u+1)+' of '+keys.length)+'\u2026');
        var path='job/'+j.id+'/'+us;
        try{ await Cloud.putFile(path,ur.blob,ur.type); }
        catch(e){
          toast(e.big?'That '+(us==='video'?'video':'photo')+' is too big for the server. Take a shorter video (30 seconds) and try again.'
            :'The photos could not be uploaded. Nothing was created \u2014 check the signal and try again.','bad');
          return false;
        }
        files.push({slot:us,path:path,type:ur.type,size:ur.size||0});
      }
    }
    for(var i=0;i<keys.length;i++){
      var slot=keys[i].slice(6), rec=await MEDIA.get(keys[i]); if(!rec) continue;
      await MEDIA.put('job:'+j.id+':'+slot,rec);
      list.bytes+=rec.size||0;
      if(slot==='video') list.video={size:rec.size,type:rec.type};
      else if(slot.indexOf('extra')===0) list.extras++;
      else list.sides.push(slot);
    }
    for(var k=0;k<keys.length;k++) await MEDIA.del(keys[k]);
    j.media={at:Date.now(), by:S.user.id, byName:S.user.name, sides:list.sides, video:list.video,
      extras:list.extras, bytes:list.bytes, device:MODE!=='cloud', files:files};
    logIt(j,'Walk-round recorded',list.sides.length+' sides, '+(list.video?'video':'no video')+
      (list.extras?', '+list.extras+' close-up'+(list.extras>1?'s':''):'')+' \u00B7 '+fmtKb(list.bytes));
    return true;
  }catch(e){
    toast('The photos could not be kept on this phone. Nothing was created \u2014 try again.','bad');
    return false;
  }
}

async function phonesMigrate(){

/* Names, part names and addresses saved in capitals are tidied into
   Title Case, complaints and notes into sentences. Finalised invoices
   keep the frozen copy of what was printed. */
async function caseMigrate(){
  var T=function(v){ return v?titleCase(v):v; }, Sn=function(v){ return v?sentenceCase(v):v; };
  PARTS.forEach(function(p){ p.name=T(p.name); });
  (SUPPLIERS||[]).forEach(function(s){ s.name=T(s.name); s.addr=T(s.addr); s.address=T(s.address); });
  PARTIES.forEach(function(p){ p.name=T(p.name); p.address=T(p.address); });
  SALES.forEach(function(s){ s.custName=T(s.custName); });
  PURCHASES.forEach(function(p){ (p.lines||[]).forEach(function(l){ l.name=T(l.name); }); });
  Object.keys(S.core.bikes||{}).forEach(function(k){ var b=S.core.bikes[k]; if(b){ b.name=T(b.name); b.address=T(b.address); } });
  var all=S.index.concat(S.saleIndex||[]);
  for(var i=0;i<all.length;i++){
    var e=all[i]; e.name=T(e.name);
    var j=await DB.get('mz:job:'+e.id); if(!j) continue;
    j.cust.name=T(j.cust.name); j.cust.address=T(j.cust.address);
    j.complaint=Sn(j.complaint); j.damage=Sn(j.damage);
    if(j.items&&j.items.other) j.items.other=T(j.items.other);
    if(j.ship){ j.ship.addr=T(j.ship.addr); j.ship.name=T(j.ship.name); }
    (j.lines||[]).forEach(function(l){ l.desc=T(l.desc); });
    await DB.set('mz:job:'+j.id,j);
  }
  await saveIndexes();
  await saveStore(); await savePartyData(); await saveCore();
}

  }
  if(b.length) h+='<div class="actionbar"><div class="actionbar-in">'+b.join('')+'</div></div>';

}
async function saleSet(f,v){
  var j=S.job; if(!j||!j.direct||saleLocked(j)) return;
  v=String(v===undefined||v===null?'':v);
  if(f==='channel'){ j.channel=v; if(v==='online'&&!j.ship) j.ship={}; }
  else if(f==='gstin'){
    if(v){ var gc=gstinCheck(v); if(!gc.ok){ toast('GSTIN: '+gc.why,'bad'); return; } v=gc.raw; }
    j.cust.gstin=v;
  }
  else if(f==='phone'){
    j.cust.phone=normPhone(v);
    var known=partyByPhone(j.cust.phone);
    if(known){ saleFillFrom(j,known); j.partyId=known.id; j.makeParty=true; }
    else if(j.partyId&&phoneKey((partyById(j.partyId)||{}).phone)!==phoneKey(j.cust.phone)){ j.partyId=''; j.makeParty=false; }
    var bk=bikesForPhone(j.cust.phone);
    if(bk.length===1&&!j.reg) saleFillBike(j,bk[0]);
  }
  else if(f==='name'||f==='address') j.cust[f]=titleCase(v);
  else if(f==='altPhone') j.cust.altPhone=normPhone(v);
  else if(f==='email') j.cust.email=v.trim().toLowerCase();
  else if(f==='pin') j.cust.pin=v.replace(/[^0-9]/g,'').slice(0,6);
  else if(f==='reg'){
    j.reg=regKey(v);
    var rb=j.reg?S.core.bikes[j.reg]:null;
    if(rb){ saleFillBike(j,rb);
      if(!j.cust.phone&&rb.phone){ j.cust.phone=rb.phone; var kp=partyByPhone(rb.phone); if(kp){ saleFillFrom(j,kp); j.partyId=kp.id; j.makeParty=true; } }
      if(!j.cust.name&&rb.name) j.cust.name=rb.name; }
  }
  else if(f==='make'){
    if(v==='__other'){ j.makeOther=true; j.make=''; j.model=''; }
    else { j.make=j.makeOther?titleCase(v):v; j.model=''; j.modelOther=false; if(!j.makeOther) j.cc=''; }
  }
  else if(f==='model'){
    if(v==='__other'){ j.modelOther=true; j.model=''; }
    else { j.model=(j.makeOther||j.modelOther)?titleCase(v):v; var cc=ccFor(j.make,j.model); if(cc) j.cc=cc; }
  }
  else if(f==='cc'||f==='odo') j[f]=v.trim();
  else if(f==='orderNo') j.orderNo=v.trim();
  else if(f.indexOf('ship.')===0){ j.ship=j.ship||{}; var k=f.slice(5); j.ship[k]=(k==='addr'||k==='name')?titleCase(v):v.trim(); }
  if(j.partyId) saleSyncParty(j);
  if(j.reg&&(j.make||j.cust.phone)) saleKeepBike(j);
  await saveJob(j);
  if(['channel','ship.stateCode','name','phone','reg','make','model'].indexOf(f)>=0) rerender();
}
/* ---- who is this? Looked up from the phone number, and from the bike ---- */
function bikesForPhone(ph){
  var k=phoneKey(ph); if(k.length<6) return [];
  return Object.keys(S.core.bikes||{}).map(function(r){ return S.core.bikes[r]; })
    .filter(function(b){ return b&&phoneKey(b.phone)===k; })
    .sort(function(a,b){ return (b.lastVisit||0)-(a.lastVisit||0); });
}
function saleFillFrom(j,p){
  if(!j.cust.name&&p.name&&p.name!=='Walk-in') j.cust.name=p.name;
  ['gstin','address','email','altPhone','pin'].forEach(function(k){ if(!j.cust[k]&&p[k]) j.cust[k]=p[k]; });
}
function saleFillBike(j,b){
  j.reg=j.reg||regKey(b.reg);
  if(!j.make&&b.make){ j.make=b.make; j.makeOther=allMakes().indexOf(b.make)<0; }
  if(!j.model&&b.model){ j.model=b.model; j.modelOther=!j.makeOther&&!modelsFor(j.make).some(function(m){ return m.n===b.model; }); }
  if(!j.cc&&b.cc) j.cc=b.cc;
}
/* what the counter learns goes back on the customer's record */
function saleSyncParty(j){
  var p=partyById(j.partyId); if(!p) return;
  if(j.cust.name&&(!p.name||p.name==='Walk-in')) p.name=j.cust.name;
  ['address','email','altPhone','pin'].forEach(function(k){ if(j.cust[k]&&!p[k]) p[k]=j.cust[k]; });
  if(j.cust.gstin&&!p.gstin){ var g=gstinCheck(j.cust.gstin); if(g.ok){ p.gstin=g.raw; p.state=g.state; p.stateCode=g.stateCode; p.pan=g.pan; } }
}
function saleKeepBike(j){
  var b=S.core.bikes[j.reg]||{reg:j.reg};
  if(j.make) b.make=j.make; if(j.model) b.model=j.model; if(j.cc) b.cc=j.cc;
  if(j.cust.name) b.name=j.cust.name; if(j.cust.phone) b.phone=j.cust.phone;
  if(j.cust.gstin) b.gstin=j.cust.gstin; if(j.cust.address) b.address=j.cust.address;
  if(j.odo&&(!b.lastOdo||+j.odo>+b.lastOdo)) b.lastOdo=j.odo;
  S.core.bikes[j.reg]=b; saveCore();
}

    ['why it came in',      '#jobtypes',                    !types.length],
    ['a valid GST number (or leave it empty)','[name="cgstin"]', gi&&!gi.ok],
    ['technician',          '[name="mechanicId"]',          !g('mechanicId')],
    ['walk-round \u2014 '+med.join(', '),'#mediaslots',      med.length>0]
  ];
  document.querySelectorAll('.field.bad,#mediaslots.bad').forEach(function(el){ el.classList.remove('bad'); });
  var miss=need.filter(function(n){ return n[2]; });
  if(miss.length){
    miss.forEach(function(n){
      var el=document.querySelector(n[1]);
      if(el){ var f=el.closest('.field'); (f||el).classList.add('bad'); }
    });
    var first=document.querySelector(miss[0][1]);
    if(first){
      var box=first.closest('.field')||first;
      if(box.scrollIntoView) box.scrollIntoView({block:'center',behavior:'smooth'});
      if(first.focus&&first.tagName!=='DIV'){ try{ first.focus({preventScroll:true}); }catch(e){} }
    }
    toast('Still needed: '+miss.map(function(n){ return n[0]; }).join(', '),'bad');
    return;
  }

  var j=blankJob();
  try{
    j.no=await allocNumber('job');
  }catch(err){
    toast(err.message||'Could not create the job card. Try again.','bad');
    return;
  }
  j.reg=reg; j.make=String(make).trim(); j.model=String(model).trim(); j.cc=g('cc'); j.odo=g('odo');
  var fsel=document.querySelector('#fuelseg [aria-pressed="true"]');
  j.fuel=fsel?fsel.dataset.v:'1/2';
  j.plateType=ptype; if(ptype==='foreign') j.plateCountry=g('platecountry');
  if(meterBad){ j.meterBad=true; j.odo=''; }
  if(meterRep) j.meterReplaced=true;
  j.cust={name:titleCase(g('cname')),phone:ph.e164,gstin:gi&&gi.ok?gi.raw:'',
    address:titleCase(g('caddr'))};
  var party=findOrMakeCustomer(j.cust.name, j.cust.phone, {gstin:j.cust.gstin, address:j.cust.address});
  j.partyId=party.id;
  await savePartyData();
  j.complaint=sentenceCase(g('complaint')); j.jobTypes=types; j.jobType=types.join(' + ');
  j.required=[];
  document.querySelectorAll('#jobreq [aria-pressed="true"]').forEach(function(c){ j.required.push(c.dataset.v); });
  j.items={other:titleCase(g('itemsother'))};
  document.querySelectorAll('#itemchips .chip').forEach(function(c){ j.items[c.dataset.k]=c.getAttribute('aria-pressed')==='true'; });
  var dl=[]; document.querySelectorAll('#dmgchips .chip').forEach(function(c){ if(c.getAttribute('aria-pressed')==='true') dl.push(c.dataset.v); });
  j.damage=sentenceCase((dl.join('; ')+(g('damage')?(dl.length?'; ':'')+g('damage'):'')).trim());
  j.mechanicId=(can('tech.assign')&&g('mechanicId')!=='TBA')?g('mechanicId'):''; j.expected=g('expected');
  var adv=toPaise(g('advance'));
  if(adv>0){ j.advance={paise:adv, mode:g('advmode')||'cash', at:Date.now(), by:S.user.id};
    j.advances=[{paise:adv, mode:j.advance.mode, at:j.advance.at, by:S.user.id, byName:S.user.name}]; }
  logIt(j,'Job card created','Bike taken in at '+j.odo+' km, fuel '+j.fuel);
  await saveVoice(j);
  if(!await commitIntakeMedia(j)){ return; }
  if(adv>0) logIt(j,'Advance received',money(adv)+' by '+(g('advmode')||'cash').toUpperCase());
  if(j.required.length) logIt(j,'Work required ticked',j.required.join('; '));

  var prevBike=S.core.bikes[reg]||{};
  if(g('newowner')==='1'&&prevBike.phone) logIt(j,'Bike has a new owner','Was '+(prevBike.name||'')+' \u00B7 '+fmtPhone(prevBike.phone));
  S.core.bikes[reg]=Object.assign(prevBike,{reg:reg,make:j.make,model:j.model,cc:j.cc,name:j.cust.name,phone:j.cust.phone,
    gstin:j.cust.gstin,address:j.cust.address,lastOdo:(j.meterBad?prevBike.lastOdo:j.odo)||'',lastVisit:Date.now(),plateType:ptype,
    plateCountry:ptype==='foreign'?g('platecountry'):(prevBike.plateCountry||'')});
  await saveCore();
  var saved=await saveJob(j);
  if(!saved) return;          /* keep the draft: the answers are still needed */
  if(j.mechanicId) notify([j.mechanicId],j,'assigned','gave you this job: '+titleCase(j.jobType)+(j.complaint?' \u2014 '+j.complaint.slice(0,90):''));
  clearDraft(); MEDIA_DRAFT={};
  S.job=j; S.draft={}; S.view={name:'job',id:j.id};
  toast('Job card '+j.no+' created','good');
  render();
}

async function saveJobEdit(){
  var j=S.job, g=function(n){ var e=document.querySelector('.sheet [name="'+n+'"]'); return e?e.value.trim():''; };
  var changes=[];
  function set(label,cur,nv,apply){
    if(nv===cur||nv==='') return;
    changes.push(label+': '+(cur||'\u2014')+' \u2192 '+nv);
    apply(nv);
  }
  var newReg=regKey(g('ejreg'));
  if(newReg&&newReg!==j.reg){
    var clash=S.index.filter(function(e){ return e.id!==j.id&&regKey(e.reg)===newReg&&e.stage!=='closed'; })[0];
    if(clash){ toast('That number already has a live job card ('+clash.no+')','bad'); return; }
    changes.push('Registration: '+regShow(j.reg)+' \u2192 '+regShow(newReg));
    j.reg=newReg;
  }
  set('Make',j.make,g('ejmake'),function(v){ j.make=String(v).trim(); });
  set('Model',j.model,g('ejmodel'),function(v){ j.model=String(v).trim(); });
  set('Engine cc',j.cc,g('ejcc'),function(v){ j.cc=v; });
  set('Odometer',j.odo,g('ejodo'),function(v){ j.odo=v; });
  set('Customer',j.cust.name,g('ejname'),function(v){ j.cust.name=titleCase(v); });
  set('Complaint',j.complaint,g('ejcomp'),function(v){ j.complaint=sentenceCase(v); });
  set('Expected delivery',j.expected,g('ejexp'),function(v){ j.expected=v; });
  var nm=can('tech.assign')?g('ejmech'):j.mechanicId, reassignedTo='';
  if(nm&&nm!==j.mechanicId){
    reassignedTo=nm;
    changes.push('Technician: '+(j.mechanicId?coreUser(j.mechanicId).name:'\u2014')+' \u2192 '+(nm?coreUser(nm).name:'\u2014'));
    j.mechanicId=nm;
  }
  var npr=readPhone('ejphone',document.querySelector('.sheet'));
  if(!npr.empty&&!npr.ok){ toast('Phone: '+npr.why,'bad'); return; }
  var np=npr.e164;
  if(np&&np!==j.cust.phone){
    changes.push('Phone: '+j.cust.phone+' \u2192 '+np);
    j.cust.phone=np;
    var moved=findOrMakeCustomer(j.cust.name,np,{gstin:g('ejgstin'),address:j.cust.address});
    if(moved.id!==j.partyId){ changes.push('Ledger moved to '+moved.name); j.partyId=moved.id; }
    await savePartyData();
  }
  if(g('ejgstin')!==(j.cust.gstin||'')){
    var eg=g('ejgstin')?gstinCheck(g('ejgstin')):null;
    if(eg&&!eg.ok){ toast('GSTIN: '+eg.why,'bad'); return; }
    j.cust.gstin=eg?eg.raw:''; changes.push('GSTIN changed');
  }
  if(!changes.length){ closeModal(); toast('Nothing changed'); return; }
  logIt(j,'Job card corrected',changes.join(' \u00B7 '));
  logAudit('Job card','Job card corrected',changes.join(' \u00B7 '),j.no); await saveAudit();
  await saveBike(Object.assign({},S.core.bikes[j.reg]||{},{reg:j.reg,make:j.make,model:j.model,cc:j.cc,
    name:j.cust.name,phone:j.cust.phone,lastOdo:j.odo}));
  await saveJob(j);
  if(reassignedTo) notify([reassignedTo],j,'assigned','gave you this job: '+titleCase(j.jobType));
  closeModal(); rerender(); toast('Corrected \u2014 and logged','good');
}

    (l.partNo?'<span class="small muted mono">'+esc(l.partNo)+'</span>':'')+

    (l.fromList?'':'<span class="tag t-amber" style="font-size:9px;padding:2px 5px">off-list</span>')+

  h+='<td class="num">'+(priceable

      : '<b>'+qtyNum(l.qty)+'</b>')+'</td>';
  if(showMoney){
    h+='<td class="num">'+(priceable
      ? '<input class="rate" type="number" step="0.01" inputmode="decimal" placeholder="0.00" value="'+(l.unit?paiseToInput(l.unit):'')+'" data-f="rate" data-line="'+l.id+'">'+

/* ---- estimate + approvals ---- */
function sectionEstimate(j){
  if(!seeMoney()) return '';
  var lines=mainLines(j); if(!lines.length) return '';
  var total=sumLines(lines);
  var parts=sumLines(lines.filter(function(l){return l.kind==='part';}));
  var labour=sumLines(lines.filter(function(l){return l.kind==='labour';}));
  var cost=0, anyCost=false;
  lines.forEach(function(l){ if(l.cost){ anyCost=true; cost+=Math.round(qtyNum(l.qty)*l.cost); } });
  var h='<div class="card"><div class="card-h"><h2>Estimate</h2></div><div class="card-b">'+
    '<div class="totrow"><span>Parts ('+lines.filter(function(l){return l.kind==='part';}).length+')</span><span class="money">'+money(parts)+'</span></div>'+
    '<div class="totrow"><span>Labour ('+lines.filter(function(l){return l.kind==='labour';}).length+')</span><span class="money">'+money(labour)+'</span></div>'+
    '<div class="totrow grand"><span>Estimate</span><span class="money">'+money(total)+'</span></div>';
  if(!allPriced(lines)) h+='<div class="banner warn small" style="margin-top:12px">Some items still have no price. The owner must price every line before this can be approved.</div>';
  if(anyCost&&can('price.set')){
    var exSale=0; lines.forEach(function(l){ exSale+=exTax(lineAmount(l),l.gst||0); });
    var mg=cost?Math.round(((exSale-cost)/cost)*1000)/10:null;
    h+='<div class="sub" style="margin:12px -14px 0"><div class="eyebrow">What it costs you</div>'+
      '<div class="totrow"><span>Spares at cost</span><span class="money">'+money(cost)+'</span></div>'+
      '<div class="totrow"><span>Margin on this job</span><span>'+pctTag(mg,25)+'</span></div>'+
      '<div class="hint">Only you see this line.</div></div>';
  }

  var ap=j.approvals&&j.approvals.customer;
  if(ap){
    h+='<div class="sub" style="margin:12px -16px 0"><div class="eyebrow">Customer approval</div>'+
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px">'+
      '<span class="tag '+(ap.sig?'t-green':'t-grey')+'">'+(ap.sig?'signed':esc(ap.mode))+'</span>'+
      '<span class="small muted">'+esc(ap.customer)+' \u00B7 '+dts(ap.at)+'</span>'+
      '<button class="btn sm" style="margin-left:auto" data-act="showApproval">See what they agreed to</button>'+
      '</div></div>';
  }
  var ov=mainLines(j).filter(function(l){ return l.overridden; });
  if(ov.length&&can('see.money')){
    h+='<div class="sub" style="margin:12px -14px 0;background:var(--amber-bg)">'+
      '<div class="eyebrow" style="color:var(--amber)">Charged off the price list</div>'+
      ov.map(function(l){ return '<div class="small" style="margin-top:4px"><b>'+esc(l.desc)+'</b> \u00B7 list '+
        money(l.overridden.from)+' \u2192 charged '+money(l.overridden.to)+
        ' <span class="muted">by '+esc(l.overridden.byName)+'</span></div>'; }).join('')+'</div>';
  }
  if((j.estimates||[]).length){
    h+='<div class="sub" style="margin:12px -14px 0"><div class="eyebrow">Estimates sent</div>';
    j.estimates.forEach(function(e){
      h+='<div class="kv"><div class="k">v'+e.v+' \u00B7 '+dts(e.at)+'<br><span class="small">'+
        (e.mode==='wa'?'WhatsApp':(e.mode==='sms'?'SMS':'at the counter'))+' \u00B7 '+esc(e.byName)+'</span></div>'+
        '<div class="v money">'+money(e.total)+'</div></div>';
    });
    if(estimateChanged(j)) h+='<div class="banner warn small" style="margin-top:8px">'+
      'It has changed since it was last sent \u2014 now '+money(estimateTotal(j))+'. Send it again.</div>';
    h+='</div>';
  }
  h+='<div class="sub" style="margin:14px -14px -14px">';
  if(!(j.estimates||[]).length){
    h+='<div class="banner warn small"><b>Not sent to the customer yet.</b> Work must not start before they agree.</div>';
  }
  if(j.approvals.customer){
    var c=j.approvals.customer;
    h+='<div class="banner ok small"><b>Customer approved</b> — '+esc(c.customer)+' ('+esc(c.mode)+'), '+dts(c.at)+
       '<br>Taken by '+esc(c.byName)+'. Amount agreed: <b class="money">'+money(c.amount)+'</b></div>';
  } else if((j.estimates||[]).length){
    h+='<div class="banner info small"><b>Waiting for the customer to say yes.</b></div>';
  }
  h+='</div></div></div>';
  return h;
}

/* ---- extra work found mid-job ---- */
function sectionAdditions(j){
  if(!j.additions.length) return '';
  var allFin=j.additions.every(function(a){ return a.fin; });
  var h='<div class="card"><div class="card-h"><h2>'+(allFin?'Asked At The End':'Extra Work Found')+'</h2></div>';
  j.additions.forEach(function(a){
    var ls=addLines(j,a.id), tot=sumLines(ls);
    var sent=a.sent||a.owner;                 /* a.owner is how older cards recorded it */
    var priceable=(can('price.set')||can('price.override'))&&!a.customer&&!a.rejected;
    var changed=sent&&a.sentTotal!==undefined&&a.sentTotal!==tot;
    h+='<div class="card-b" style="border-top:1px solid var(--line)">'+
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
      (a.rejected?'<span class="tag t-red">Customer Said No</span>':
        a.customer?'<span class="tag t-green">'+(a.fin?'Approved':'Approved \u2014 Work Can Continue')+'</span>':
        sent?'<span class="tag t-amber">'+(a.fin?'Waiting For Wash Approval':'Waiting For Customer')+'</span>':
             '<span class="tag t-red">Not Sent Yet</span>')+
      '<span class="small muted" style="margin-left:auto">Found '+dts(a.at)+' by '+esc(coreUser(a.by).name)+'</span></div>'+
      '<div style="margin:10px 0;font-weight:600;border-left:5px solid '+(a.fin?'var(--brand)':'var(--red)')+';padding-left:12px">'+esc(a.reason)+'</div>';
    if(ls.length){
      h+='<table class="lines"><tbody>';
      ls.forEach(function(l){ h+=lineRow(j,l,can('work.add')&&!a.customer,priceable,seeMoney()); });
      h+='</tbody></table>';
      if(seeMoney()) h+='<div class="totrow grand" style="font-size:19px"><span>Extra</span><span class="money">'+money(tot)+'</span></div>';
    }
    if(sent&&!a.customer&&!a.rejected){
      h+='<div class="banner info small"><b>Sent '+dts(sent.at||a.at)+'</b>'+
        (sent.byName?' by '+esc(sent.byName):'')+
        (a.sentTotal!==undefined?' \u00B7 '+money(a.sentTotal):'')+
        (sent.mode?' \u00B7 '+(sent.mode==='wa'?'WhatsApp':(sent.mode==='sms'?'SMS':'at the counter')):'')+'</div>';
    }
    if(changed) h+='<div class="banner warn small"><b>It has changed since it went out</b> \u2014 now '+money(tot)+'. Send it again.</div>';
    if(a.customer) h+='<div class="banner ok small"><b>Customer Approved</b> '+esc(a.customer.customer)+' ('+esc(a.customer.mode)+') \u00B7 '+dts(a.customer.at)+'<br>Taken by '+esc(a.customer.byName)+'</div>';
    if(a.rejected) h+='<div class="banner small" style="background:var(--red-bg);border-color:var(--red);color:var(--red)"><b>Customer Said No</b> \u00B7 '+dts(a.rejected.at)+' \u00B7 recorded by '+esc(a.rejected.byName)+'</div>';

    var btns=[];
    if(!a.customer&&!a.rejected&&can('work.add'))
      btns.push('<button class="btn sm" data-act="addLine" data-kind="labour" data-batch="'+a.id+'">+ Labour</button>'+
                '<button class="btn sm" data-act="addLine" data-kind="part" data-batch="'+a.id+'">+ Part</button>');
    if(!a.customer&&!a.rejected&&can('estimate.send')){
      if(!ls.length) btns.push('<button class="btn sm" disabled>Add The Work First</button>');
      else if(!allPriced(ls)) btns.push('<button class="btn sm" disabled>Every Line Needs A Price</button>');
      else btns.push('<button class="btn sm primary" data-act="sendAdd" data-id="'+a.id+'">'+
        (sent?(changed?'Send Revised':'Send Again'):'Send For Approval \u00B7 '+money(tot))+'</button>');
    }
    if(sent&&!a.customer&&!a.rejected&&can('approve.customer'))
      btns.push('<button class="btn sm go" data-act="custOkAdd" data-id="'+a.id+'">Customer Approved</button>'+
                '<button class="btn sm danger" data-act="custNoAdd" data-id="'+a.id+'">Customer Said No</button>');
    if(!ls.length&&!a.customer&&!a.rejected&&can('addition.raise'))
      btns.push('<button class="btn sm danger" data-act="dropAdd" data-id="'+a.id+'">Cancel This</button>');
    if(btns.length) h+='<div class="btn-row" style="margin-top:12px">'+btns.join('')+'</div>';
    h+='</div>';
  });
  return h+'</div>';
}
/* Extra work reaches the customer the same way the first estimate did. */
function addText(job,a){
  var W=S.core.workshop, ls=addLines(job,a.id), t=sumLines(ls);
  var out=W.name+'\n'+regShow(job.reg)+' \u00B7 '+job.make+' '+job.model+'\nJob card '+job.no+'\n\n'+
    (a.fin?'BEFORE WE HAND IT OVER\n':'EXTRA WORK FOUND\n')+a.reason+'\n\n';
  ls.forEach(function(l,i){ out+=(i+1)+'. '+l.desc+'  x'+qtyNum(l.qty)+'  '+money(lineAmount(l))+'\n'; });
  out+='\n'+(a.fin?'Total ':'Extra ')+money(t)+'\n\n'+(a.fin
    ?'Reply YES and we will do it before you collect the bike, or NO to collect it as it is.'
    :'The bike is on hold until you agree. Please reply YES to go ahead.');
  return out;
}

async function sendAddDo(addId,how){
  var j=S.job, a=findAdd(j,addId); if(!a) return;
  var g=function(n){ var e=document.querySelector('.sheet [name="'+n+'"]'); return e?e.value.trim():''; };
  var phone=g('addphone'), text=g('addtext');
  var t=sumLines(addLines(j,addId));
  a.sent={at:Date.now(), by:S.user.id, byName:S.user.name, mode:how, to:phone};
  a.sentTotal=t;
  a.versions=(a.versions||0)+1;
  logIt(j,'Extra work sent to the customer',
    money(t)+' \u00B7 '+(how==='wa'?'WhatsApp':(how==='sms'?'SMS':'shown at the counter'))+
    (a.versions>1?' \u00B7 version '+a.versions:''));
  await saveJob(j);
  if(how==='wa'||how==='sms'){
    try{ window.open(how==='wa'?waLink(phone,text):smsLink(phone,text),'_blank'); }catch(e){}
  }
  closeModal(); rerender(); toast('Sent to the customer','good');
}
async function dropAdd(addId){
  var j=S.job, a=findAdd(j,addId); if(!a) return;
  if(addLines(j,addId).length){ toast('Take the items off it first','bad'); return; }
  j.additions=j.additions.filter(function(x){ return x.id!==addId; });
  logIt(j,'Extra work cancelled',a.reason);
  await saveJob(j); rerender(); toast('Cancelled \u2014 work can carry on','good');
}

  if(!j.bills.length){

        (pv.plain.length?'<div class="totrow"><span>Plain bill \u00B7 '+pv.plain.length+' item'+(pv.plain.length>1?'s':'')+'</span><span class="money">'+money(sumLines(pv.plain))+'</span></div>':'')+
        '<p class="hint">Made automatically '+(j.direct?'when you make the bill':'when the bike is marked ready for delivery')+'.</p>'

      var c=billCalc(j,b);
      h+='<div class="kv"><div class="k"><b style="color:var(--ink);font-size:15px">'+(b.type==='gst'?'Tax invoice (GST)':'Bill (no GST)')+'</b>'+
        '<br><span class="mono">'+esc(b.number||'not numbered yet')+'</span></div><div class="v">'+
        '<span class="money" style="font-size:18px">'+money(c.grand)+'</span><br>'+
        (b.status==='final'?(c.balance>0?'<span class="tag t-red">'+money(c.balance)+' due</span>':'<span class="tag t-green">Paid</span>')
          :b.status==='cancelled'?'<span class="tag t-red">Cancelled</span>':'<span class="tag t-amber">Draft</span>')+
        '</div></div>';
    });
    var ub=unbilledApproved(j);
    if(ub.length) h+='<div class="banner warn small" style="margin-top:10px"><b>'+ub.length+' approved item'+(ub.length>1?'s are':' is')+' not on any bill yet.</b></div>';
    var ng=ub.filter(function(l){ return l.noGst; }).length;

  }

function jobActionBar(j){
  var b=[], st=j.stage, hold=jobOnHold(j), mls=mainLines(j);
  var pty=j.partyId?partyById(j.partyId):null;
  if(pty&&overLimit(pty)&&seeMoney()&&st!=='closed'){
    b.push('<button class="btn lg" style="background:var(--red-bg);border-color:var(--red);color:var(--red)" '+
      'data-act="openParty" data-id="'+pty.id+'">Over credit limit \u00B7 '+money(creditUsed(pty.id))+'</button>');
  }
  function P(t,a){ return '<button class="btn primary lg" data-act="'+a+'">'+t+'</button>'; }
  function G(t,a){ return '<button class="btn go lg" data-act="'+a+'">'+t+'</button>'; }
  function N(t,a){ return '<button class="btn lg" data-act="'+a+'">'+t+'</button>'; }
  if(st==='intake'&&can('work.add')) b.push(mls.length?P('Estimate is ready','sendPricing'):'<button class="btn lg" disabled>Add the spares and labour first</button>');
  if((st==='work_listed'||st==='priced')&&can('estimate.send'))
    b.push(allPriced(mls)?P('Send the estimate \u00B7 '+money(sumLines(mls)),'sendEstimate'):'<button class="btn lg" disabled>Every line needs a price</button>');
  if((st==='work_listed'||st==='priced')&&!can('estimate.send'))
    b.push('<button class="btn lg" disabled>Waiting for the estimate to go out</button>');
  if(st==='owner_ok'&&can('approve.customer')){
    b.push(G('Customer approved \u00B7 '+money(sumLines(mls)),'custOk'));
    b.push(N(estimateChanged(j)?'Send the revised estimate':'Send it again','sendEstimate'));
  }
  if(st==='owner_ok'&&!can('approve.customer')) b.push('<button class="btn lg" disabled>Waiting for the customer to agree</button>');
  if(st==='customer_ok'&&!j.mechanicId){
    b.push(can('tech.assign')?P('Allocate a technician','techModal'):'<button class="btn lg" disabled>Waiting for a technician</button>');
  } else if(st==='customer_ok'&&can('work.tick')) b.push(P('Start work','startWork'));
  if(st!=='closed'&&can('estimate.send')&&!j.direct){
    var nc=updChanges(j);
    b.push('<button class="btn lg'+(nc?' warn':'')+'" data-act="updModal">'+(nc?'Send update \u00B7 '+nc+' new':'Send update')+'</button>');
  }
  var askFin=(st==='in_progress'||st==='work_done')&&can('job.edit')&&finCanAsk(j).length&&!finPending(j).length;
  if(st==='in_progress'){
    var waiting=pendingAdditions(j)[0];
    if(waiting&&can('estimate.send')&&addLines(j,waiting.id).length&&allPriced(addLines(j,waiting.id)))
      b.push(P((waiting.sent||waiting.owner)?'Send The Extra Again':'Send Extra For Approval','sendAddTop'));
    if(waiting&&(waiting.sent||waiting.owner)&&can('approve.customer'))
      b.push(G('Customer Approved The Extra','custOkTop'));
    if(can('addition.raise')) b.push(N('Extra work found','raiseAdd'));
    if(can('work.tick')) b.push(hold?'<button class="btn lg" disabled>Work stopped</button>':P('Work finished','workDone'));
  }
  if(askFin) b.push(N('Wash / chain treatment','finAdd'));
  if(st==='work_done'){
    var fw=finPending(j)[0];
    if(fw&&can('estimate.send')&&addLines(j,fw.id).length&&allPriced(addLines(j,fw.id)))
      b.push(N(fw.sent?'Send The Wash Again':'Send Wash For Approval','sendAddTop'));
    if(fw&&fw.sent&&can('approve.customer')) b.push(G('Customer Said Yes','custOkTop'));
    if(can('addition.raise')&&!fw) b.push(N('Extra work found','raiseAdd'));
    if(can('bill.make')){
      var rp=readyProblems(j);
      b.push(fw?'<button class="btn lg" disabled>Waiting for wash approval</button>'
        :(rp.length?'<button class="btn lg" disabled title="'+esc(rp.join('; '))+'">Not ready: '+esc(rp[0])+'</button>':P('Ready for delivery','readyModal')));
    }
  }
  if(st==='billed'){
    if(can('bill.make')) b.push(N('Bills &amp; payment','goBill'));
    if(can('bill.make')&&unbilledApproved(j).length) b.push(P('Make the remaining bill','readyModal'));
    var fo=finOpen(j);
    if(jobBalance(j)<=0&&can('bill.make'))
      b.push(fo.length?'<button class="btn lg" disabled>Waiting for '+esc(fo.map(function(t){ return t.label.toLowerCase(); }).join(' & '))+'</button>'
                      :G('Hand over the bike','closeJob'));
  }
  if(st==='closed'&&seeMoney()){
    var fb=(j.bills||[]).filter(function(x){ return x.status==='final'; });
    if(fb.length===1){
      b.push(N('View invoice','viewInvoice" data-bill="'+fb[0].id));
      b.push(P('Send invoice','sendInvoice" data-bill="'+fb[0].id));
    } else if(fb.length) b.push(P('Invoices','goBill'));
  }
  if(!b.length) return '';
  return '<div class="actionbar"><div class="actionbar-in">'+b.join('')+'</div></div>';
}

/* A GSTIN carries its own check digit. Catching a typo here costs nothing
   and saves a wrong input-credit claim later. */
var GSTC='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function gstinCheck(g){
  var s=String(g||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
  var out={raw:s, ok:false, why:'', state:'', stateCode:'', pan:''};
  if(!s){ out.why='Enter the GST number'; return out; }
  if(s.length!==15){ out.why='A GST number is 15 characters. This one has '+s.length+'.'; return out; }
  if(!/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[0-9A-Z]{1}[Z]{1}[0-9A-Z]{1}$/.test(s)){
    out.why='That is not the shape of a GST number.'; return out; }
  out.stateCode=s.slice(0,2);
  out.state=GST_STATES[out.stateCode]||'';
  if(!out.state){ out.why='No state code '+out.stateCode+' exists \u2014 check the first two digits.'; return out; }
  out.pan=s.slice(2,12);
  var sum=0;
  for(var i=0;i<14;i++){
    var cp=GSTC.indexOf(s.charAt(i));
    var pr=cp*((i%2===0)?1:2);
    sum+=Math.floor(pr/36)+(pr%36);
  }
  var want=GSTC.charAt((36-(sum%36))%36);
  if(want!==s.charAt(14)){ out.why='The check digit does not match — there is a typo somewhere.'; return out; }
  out.ok=true; return out;
}

function catTree(){
  var t=CAT_TREE.map(function(g){ return [g[0],g[1].slice()]; });
  ((S.core&&S.core.customCats)||[]).forEach(function(x){
    var g=t.filter(function(y){ return y[0]===x.g; })[0];
    if(!g){ g=[x.g,[]]; t.splice(t.length-1,0,g); }
    if(g[1].indexOf(x.c)<0) g[1].push(x.c);
  });
  return t;
}
function allCats(){ var o=[]; catTree().forEach(function(g){ o=o.concat(g[1]); }); return o; }
function catIsSet(c){ return !!c&&allCats().indexOf(c)>=0; }
function catFind(c){ var k=String(c||'').toLowerCase().trim(); if(!k) return ''; return allCats().filter(function(x){ return x.toLowerCase()===k; })[0]||''; }
/* the group a category sits in; an old broad heading is its own group */
function catGroup(c){
  if(!c) return '';

  for(var i=0;i<t.length;i++) if(t[i][1].indexOf(c)>=0) return t[i][0];
  for(var j=0;j<t.length;j++) if(t[j][0]===c) return c;
  if(c==='Bearings & Bushes') return 'Suspension & Steering';
  if(c==='Suspension') return 'Suspension & Steering';
  if(c==='Electrical') return 'Electrical';
  return '';
}

 'YSS','Zana','Bajaj','Hero','Honda','Kawasaki','KTM','Royal Enfield','Suzuki','Triumph','TVS','Yamaha'];
var BRAND_NOGUESS=['Bajaj','Hero','Honda','Kawasaki','KTM','Royal Enfield','Suzuki','Triumph','TVS','Yamaha'];
var BRAND_PAT={'DP':/\bdp\b/i,'K&N':/\bk\s*&\s*n\b/i,'Fuel X':/\bfuel\s*-?x\b/i,'PowerTronic':/power\s*-?tronic/i,
 'Liqui Moly':/liqui\s*-?moly/i,'TVS Eurogrip':/eurogrip/i,'WD-40':/wd\s*-?\s*40/i,"Meguiar's":/meguiar/i,
 'Race Dynamics':/race\s*dynamics/i,'Minda':/\b(uno\s*)?minda\b/i};
function allBrands(){
  var seen={}, out=[];
  var add=function(b){ b=String(b||'').trim(); if(!b||b===BRAND_LOCAL) return; var k=b.toLowerCase(); if(!seen[k]){ seen[k]=1; out.push(b); } };
  BRAND_SEED.forEach(add); ((S.core&&S.core.customBrands)||[]).forEach(add); PARTS.forEach(function(p){ add(p.brand); });
  return out.sort(function(a,b){ return a.toLowerCase().localeCompare(b.toLowerCase()); });
}
function brandFind(b){ var k=String(b||'').toLowerCase().trim(); if(!k) return ''; if(k===BRAND_LOCAL.toLowerCase()) return BRAND_LOCAL;
  return allBrands().filter(function(x){ return x.toLowerCase()===k; })[0]||''; }
function brandGuess(name){
  var n=String(name||''), best='', at=1e9;
  allBrands().forEach(function(b){
    if(BRAND_NOGUESS.indexOf(b)>=0) return;
    var re=BRAND_PAT[b]||new RegExp('(^|[^a-z0-9])'+b.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z0-9])','i');
    var m=n.match(re); if(m&&m.index<at){ at=m.index; best=b; }
  });
  return best;
}
function brandLabel(p){
  if(!p||isLabour(p)) return '';
  return p.brand?esc(p.brand):'<span style="color:var(--amber);font-weight:700">Brand not set</span>';
}

/* existing products: read the category and brand off the name where it is clear */
function catsMigrate(){
  var n=0;
  PARTS.forEach(function(p){
    if(isLabour(p)){ if(p.category!=='Labour'&&!catIsSet(p.category)){ p.category='Labour'; n++; } return; }
    if(!catIsSet(p.category)){
      var g=catGuess(p.name);
      if(g){ p.oldCategory=p.category; p.category=g; n++; }
    }
    if(!p.brand){ var b=brandGuess(p.name); if(b){ p.brand=b; n++; } }
  });
  return n;
}
